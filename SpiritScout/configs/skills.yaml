  path: attack-chain/SKILL.md
- skill_id: binary-diff
  domain: reverse
  description: '跨版本符号迁移与二进制差分。当你有旧版本的符号/逆向结果，需要快速迁移到新版本时使用。

    适用场景：内核缺 PDB 用旧版符号推导、程序更新后批量迁移函数名、应用更新后快速定位新偏移。

    核心方法：用 LLM 做结构化差异比对，程序化输入输出，成本极低（200 函数 ~1 元）。

    触发关键词：符号迁移、bindiff、跨版本、PDB 缺失、函数偏移迁移、symbol migration、binary diff、版本对比。'
  body: "# 跨版本符号迁移 (Binary Diff)\n\n## 适用范围\n\n当任务属于以下场景时使用本 skill：\n\n1. **内核/驱动缺 PDB** — 有旧版 ntoskrnl.exe\
    \ 的符号，新版 PDB 被微软下架，需要用旧版符号推导新版非导出函数地址\n2. **程序更新后符号迁移** — 曾经逆向过某个程序，程序更新了，不想重新逆一遍，用旧版结果批量迁移\n3. **保护机制更新**\
    \ — 旧版有完整逆向结果，新版需要快速定位同一函数的新偏移\n4. **任何\"有旧版符号 + 新版无符号\"的二进制对比场景**\n\n### 与其他 skill 的分工\n\n| 场景 |\
    \ 用什么 |\n|------|--------|\n| 从零开始逆向一个二进制 | `ida-reverse/` 或 `radare2/` |\n| 有旧版结果，迁移到新版 | **本 skill**\
    \ |\n| 两个完全不同的二进制对比 | BinDiff / Diaphora（传统工具） |\n\n### 核心优势\n\n相比传统方案：\n\n| 方案 | 200 个函数成本 | 时间 |\
    \ 准确率 |\n|------|--------------|------|--------|\n| 人工开两个 IDA 窗口对比 | 免费但耗命 | 数小时 | 高 |\n| BinDiff\
    \ 自动匹配 | 免费 | 快 | 中（结构变化大时失效） |\n| 完全交给 Agent（CC/Codex） | 50-100 元 | 慢 | 高 |\n| **本 skill（LLM 批量比对）**\
    \ | **~1 元** | **~10 秒/函数** | **高** |\n\n## 核心原理\n\n```text\n旧版函数（有符号）          新版同一函数（无符号）\n    ↓\
    \                              ↓\n导出反汇编 + 伪代码          导出反汇编 + 伪代码\n    ↓                        \
    \      ↓\n    └──────── LLM 结构化比对 ────────┘\n                    ↓\n         输出 YAML（符号映射表）\n    \
    \                ↓\n         程序化解析 → 批量应用到新版 IDB\n```\n\n关键点：\n- prompt 是固定模板，程序化填充\n- 输入输出格式确定，程序化解析\n\
    - LLM 只负责\"看两段代码，找出对应关系\"这一步\n- 时间成本和 token 成本极低\n\n## Prompt 模板\n\n### 标准比对 Prompt\n\n```text\nI\
    \ have disassembly outputs and procedure code of the same function.\n\nThis is the function for reference:\n\
    \n**Disassembly for Reference**\n```c\n{disasm_for_reference}\n```\n\n**Procedure code for Reference**\n\
    ```c\n{procedure_for_reference}\n```\n\nThis is the function you need to reverse-engineering:\n\n\
    **Disassembly to reverse-engineering**\n```c\n{disasm_code}\n```\n\n**Procedure code to reverse-engineering**\n\
    ```c\n{procedure}\n```\n\nWhat you need to do is to collect all references to \"{symbol_name_list}\"\
    \ in the function you need to reverse-engineering and output those references as YAML.\n\nExample:\n\
    ```yaml\nfound_vcall: # This is for indirect call to virtual function or virtual function pointer\
    \ fetching.\n  - insn_va: '0x180777700' # Always be the instruction with displacement offset\n   \
    \ insn_disasm: call [rax+68h] # Always be the instruction with displacement offset\n    vfunc_offset:\
    \ '0x68'\n    func_name: ILoopMode_OnLoopActivate\n  - insn_va: '0x180777778' # Always be the instruction\
    \ with displacement offset\n    insn_disasm: mov rax, [rax+80h] # Always be the instruction with displacement\
    \ offset\n    vfunc_offset: '0x80'\n    func_name: INetworkMessages_GetNetworkGroupCount\n\nfound_call:\
    \ # This is for direct call to non-virtual regular function.\n  - insn_va: '0x180888800'\n    insn_disasm:\
    \ call sub_180999900\n    func_name: CLoopMode_RegisterEventMapInternal\n  - insn_va: '0x180888880'\n\
    \    insn_disasm: call sub_180555500\n    func_name: CLoopMode_SetSystemState\n\nfound_funcptr: #\
    \ This is for non-virtual regular function pointer.\n  - insn_va: '0x180666600' # Must load/reference\
    \ the function pointer target address\n    insn_disasm: lea rdx, sub_15BC910 # Must load/reference\
    \ the function pointer target address\n    funcptr_name: CLoopMode_OnClientPollNetworking\n\nfound_gv:\
    \ # This is for reference to global variable.\n  - insn_va: '0x180444400'\n    insn_disasm: mov rcx,\
    \ cs:qword_180666600 # Must load/reference the global variable\n    gv_name: g_pNetworkMessages\n\
    \  - insn_va: '0x180333300'\n    insn_disasm: lea rax, unk_180222200 # Must load/reference the global\
    \ variable\n    gv_name: s_EventManager\n\nfound_struct_offset: # This is for reference to struct\
    \ offset. NOTE THAT virtual function pointer should not be here! virtual function pointer should ALWAYS\
    \ be in found_vcall !\n  - insn_va: '0x1801BA12A' # Always be the instruction with displacement offset\n\
    \    insn_disasm: mov rcx, [r14+58h] # Always be the instruction with displacement offset\n    offset:\
    \ '0x58'\n    size: 8\n    struct_name: CResourceService\n    member_name: m_pEntitySystem\n```\n\n\
    If nothing found, output an empty YAML. DO NOT output anything other than the desired YAML. DO NOT\
    \ collect unrelated symbols.\n```\n\n### 变量说明\n\n| 变量 | 来源 | 说明 |\n|------|------|------|\n| `{disasm_for_reference}`\
    \ | 旧版 IDA 导出 | 有符号的反汇编 |\n| `{procedure_for_reference}` | 旧版 IDA 导出 | 有符号的伪代码 |\n| `{disasm_code}`\
    \ | 新版 IDA 导出 | 无符号的反汇编 |\n| `{procedure}` | 新版 IDA 导出 | 无符号的伪代码 |\n| `{symbol_name_list}` | 从旧版提取\
    \ | 需要在新版中定位的符号列表 |\n\n## 工作流\n\n### 完整流程\n\n```text\nStep 1: 准备数据\n  - 旧版二进制加载到 IDA（有 PDB/符号）\n \
    \ - 新版二进制加载到 IDA（无符号）\n  - 找到两个版本中相同的锚点函数（导出函数、字符串引用等）\n\nStep 2: 批量导出\n  - 从旧版导出：锚点函数的反汇编 + 伪代码（含符号名）\n\
    \  - 从新版导出：同一锚点函数的反汇编 + 伪代码（无符号名）\n\nStep 3: LLM 比对\n  - 用 prompt 模板填充数据\n  - 调用 LLM API（推荐：deepseek\
    \ 量大便宜，超大函数切 gpt）\n  - 解析返回的 YAML\n\nStep 4: 应用结果\n  - 将 YAML 中的符号映射批量应用到新版 IDB\n  - 用 idapro_rename\
    \ 或 IDAPython 脚本批量重命名\n\nStep 5: 迭代\n  - 第一轮迁移的函数成为新的锚点\n  - 进入这些函数，继续对比内部调用\n  - 重复直到覆盖所有目标函数\n```\n\
    \n### 锚点选择策略\n\n| 锚点类型 | 可靠性 | 说明 |\n|---------|--------|------|\n| 导出函数 | 最高 | 名字不变，地址可能变 |\n| 字符串引用\
    \ | 高 | 字符串内容不变，引用位置可能变 |\n| 常量/魔数 | 中 | 特征值不变 |\n| 代码模式 | 中 | 函数结构相似但地址全变 |\n\n### 批量处理建议\n\n- 每次比对\
    \ 1 个函数（避免 context 爆炸）\n- 中等函数（<200 行）用 deepseek\n- 超大函数（>500 行）切 gpt-4o 或 claude\n- 并发调用提高速度（10-20\
    \ 并发）\n- 结果缓存，避免重复调用\n\n## 输出格式\n\n### YAML 输出的 5 种符号类型\n\n| 类型 | 含义 | 关键字段 |\n|------|------|---------|\n\
    | `found_vcall` | 虚函数调用（间接 call） | `vfunc_offset`, `func_name` |\n| `found_call` | 直接函数调用 | `insn_va`,\
    \ `func_name` |\n| `found_funcptr` | 函数指针引用 | `insn_va`, `funcptr_name` |\n| `found_gv` | 全局变量引用 |\
    \ `insn_va`, `gv_name` |\n| `found_struct_offset` | 结构体偏移引用 | `offset`, `struct_name`, `member_name`\
    \ |\n\n### 解析后的应用动作\n\n```text\nfound_call → idapro_rename(addr=call_target, name=func_name)\nfound_vcall\
    \ → idapro_set_comments(addr=insn_va, comment=\"vcall: {func_name} @ +{offset}\")\nfound_funcptr →\
    \ idapro_rename(addr=funcptr_target, name=funcptr_name)\nfound_gv → idapro_rename(addr=gv_addr, name=gv_name)\n\
    found_struct_offset → idapro_set_comments(addr=insn_va, comment=\"{struct_name}.{member_name}\")\n\
    ```\n\n## 典型场景示例\n\n### 场景 1：ntoskrnl.exe 缺 PDB\n\n```text\n已有：ntoskrnl.exe 10.0.26100.2000 + 完整 PDB\n\
    目标：ntoskrnl.exe 10.0.26100.2605（PDB 被下架）\n需求：定位 PspSetCreateProcessNotifyRoutine 的新地址\n\n步骤：\n1. 两个版本都加载到\
    \ IDA\n2. 找到导出函数 PsSetCreateProcessNotifyRoutine（两个版本都有）\n3. 旧版中它调用了 PspSetCreateProcessNotifyRoutine（有符号）\n\
    4. 新版中它调用了 sub_140822108（无符号）\n5. LLM 一眼看出：sub_140822108 = PspSetCreateProcessNotifyRoutine\n6. 批量应用\n\
    ```\n\n### 场景 2：应用更新后迁移\n\n```text\n已有：target.exe v1.0 的完整逆向结果（200+ 函数已命名）\n目标：target.exe v1.1（所有符号丢失）\n\
    需求：批量迁移 200 个函数名\n\n步骤：\n1. 从旧版导出所有已命名函数的反汇编+伪代码\n2. 在新版中通过导出函数/字符串找到对应锚点\n3. 批量调用 LLM 比对\n4. 解析 YAML，批量\
    \ rename\n5. 迭代深入\n```\n\n## LLM 选择建议\n\n| 模型 | 适合场景 | 成本 | 速度 |\n|------|---------|------|------|\n\
    | DeepSeek V3 | 中小函数（<200 行），批量处理 | 极低 | 快 |\n| GPT-4o | 超大函数，复杂控制流 | 中 | 快 |\n| Claude Sonnet | 中大函数，需要推理\
    \ | 中 | 快 |\n| Claude Opus | 极复杂函数，需要深度理解 | 高 | 慢 |\n\n推荐策略：默认 DeepSeek，遇到 context 超限或结果不准时自动升级。\n\
    \n## 注意事项\n\n- **不要把整个二进制丢给 LLM** — 一次只比对一个函数\n- **锚点必须可靠** — 如果锚点本身就对错了，后续全部白费\n- **结果需要人工抽检** —\
    \ LLM 不是 100% 准确，关键符号要验证\n- **缓存中间结果** — 避免重复调用浪费 token\n- **注意 context 限制** — 超大函数（>1000 行反汇编）需要拆分或用大\
    \ context 模型\n\n---\n\n## 按需自举（On-Demand Bootstrap）\n\n### 工具依赖\n\n| 工具 | 用途 | 可自动安装 |\n|------|------|-----------|\n\
    | IDA Pro | 导出反汇编/伪代码 | ✗（商业软件） |\n| Python | 脚本执行、API 调用 | ✓ |\n| PyYAML | 解析 LLM 返回的 YAML | ✓（pip\
    \ install pyyaml） |\n| LLM API | 执行比对 | 需要 API key |\n\n### 说明\n\n本 skill 的核心不依赖重型工具安装，主要依赖：\n- IDA\
    \ Pro 已有（用 `ida-reverse/` skill 管理）\n- Python + requests/httpx（调 API）\n- 一个 LLM API endpoint\n\n---\n\
    \n## 路由上下文\n\n**上游入口**: `skills/SKILL.md`（总控）、`routing.md`\n**触发条件**: 有旧版符号/逆向结果，需要迁移到新版本\n**下游出口**:\n\
    - 需要先打开二进制 → `ida-reverse/`\n- 需要快速侦察确认版本差异 → `radare2/`\n\n**同级关联模块**: `ida-reverse/`（数据导出和符号应用都通过\
    \ IDA）"
  source: binary-diff
  path: binary-diff/SKILL.md
- skill_id: browser-automation
  domain: automation
  body: "\uFEFF---\nname: browser-automation\ndescription: |\n  统一自动化入口。覆盖浏览器自动化（Playwright）和 Windows\
    \ 桌面应用自动化（OpenReverse）。\n  浏览器场景：打开网页、点击、填表、爬取、截图、自动化登录、渗透页面交互。\n  桌面场景：操作 IDA/x64dbg 等 GUI 工具、Windows\
    \ UI Automation、视觉驱动交互、桌面应用网络抓包。\n  触发关键词：浏览器自动化、桌面自动化、打开网页、填表、爬取、截图、自动化登录、Playwright、agent-browser、headless、OpenReverse、UIA、CUA、桌面操作、Windows\
    \ 自动化。\n---\n\n# 自动化操作 (Desktop & Browser Automation)\n\n## 适用范围\n\n当任务属于以下场景时使用本 skill：\n\n### 浏览器场景（Playwright\
    \ / agent-browser）\n- 打开网页并操作页面元素（点击、填表、提交）\n- 爬取页面内容或截图\n- 自动化登录流程\n- 渗透测试中与 Web 页面交互（提交 payload、触发\
    \ XSS）\n- 验证码页面的自动化处理\n- 批量表单提交\n\n### 桌面应用场景（OpenReverse）\n- 操作 Windows 桌面应用（IDA Pro、x64dbg、Wireshark\
    \ 等）\n- 需要视觉驱动交互（CUA 模式）\n- 需要结构化 UI 操作（UIA 模式）\n- 桌面应用的网络流量观察（内置 mitmproxy）\n- 自动化逆向工具的 GUI 操作\n\
    - 黑盒测试桌面软件\n\n### 与其他工具的分工\n\n| 场景 | 用什么 |\n|------|--------|\n| 操作网页（浏览器内） | **Playwright / agent-browser**\
    \ |\n| 操作桌面应用（Windows GUI） | **OpenReverse** |\n| 抓包分析、HTTP 请求捕获 | anything-analyzer 或 OpenReverse\
    \ network lane |\n| JS 断点、Hook、CDP 调试 | jshookmcp |\n| 定位签名算法、补环境复现 | js-reverse |\n\n简单判断：\n- 目标是网页\
    \ → Playwright\n- 目标是 Windows 桌面应用 → OpenReverse\n- 两者都需要 → 组合使用\n\n---\n\n## Part 1: 浏览器自动化（Playwright\
    \ / agent-browser）\n\n### 核心工作流\n\n```bash\n# 1. 打开页面\nagent-browser open <url>\n\n# 2. 获取可交互元素（返回\
    \ @e1, @e2... 引用）\nagent-browser snapshot -i\n\n# 3. 用引用操作元素\nagent-browser click @e1\nagent-browser\
    \ fill @e2 \"text\"\n\n# 4. 完成后关闭\nagent-browser close\n```\n\n### 命令参考\n\n```bash\n# 导航\nagent-browser\
    \ open <url>\nagent-browser close\n\n# 页面快照\nagent-browser snapshot        # 完整无障碍树\nagent-browser\
    \ snapshot -i     # 仅可交互元素（推荐）\n\n# 交互操作\nagent-browser click @e1\nagent-browser fill @e2 \"text\"\
    \nagent-browser type @e2 \"text\"\nagent-browser press Enter\nagent-browser scroll down 500\n\n# 获取信息\n\
    agent-browser get text @e1\nagent-browser get title\nagent-browser get url\n\n# 等待\nagent-browser\
    \ wait @e1\nagent-browser wait 2000\nagent-browser wait --load networkidle\n```\n\n### 注意事项\n- 必须执行\
    \ `agent-browser close`，否则进程泄漏\n- 操作前先 snapshot，不要猜元素引用\n- 提交表单后用 `wait --load networkidle` 等页面稳定\n\
    \n---\n\n## Part 2: 桌面应用自动化（OpenReverse）\n\n### 概述\n\n[OpenReverse](https://github.com/zhexulong/openreverse)\
    \ 是面向 AI Agent 的桌面交互与证据采集框架，支持：\n- **UIA 模式**：Windows UI Automation，结构化桌面控件操作\n- **CUA 模式**：视觉驱动交互（Computer\
    \ Use Agent），适合复杂 GUI\n- **网络观察**：内置 mitmproxy 代理 + 本地抓取\n\n### 交互模式选择\n\n| 模式 | 适合场景 | 底层 |\n|------|---------|------|\n\
    | UIA | 目标应用有标准 Windows 控件（按钮、文本框、列表） | Windows UI Automation API |\n| CUA | 目标应用 UI 复杂或非标准控件（IDA\
    \ 的反汇编视图、自定义渲染界面） | 视觉识别 + 鼠标键盘 |\n\n### 网络观察模式\n\n| 模式 | 适合场景 |\n|------|---------|\n| Proxy Lane\
    \ | 目标应用可以配置代理（推荐） |\n| Local Lane | 目标应用无法走代理，需要本地抓取 |\n\n### 安装与配置\n\n```bash\n# 1. Clone 项目\ngit\
    \ clone https://github.com/zhexulong/openreverse.git\ncd openreverse\n\n# 2. 安装依赖\nnpm install\n\n\
    # 3. 接入 Agent 宿主（Claude Code / Codex / Zed）\nnpm run init:agents -- --target=all /path/to/project\n\
    \n# 4. 安装 CUA runtime（如果需要视觉驱动模式）\nnpm run install:cua-runtime\nnpm run doctor:cua-runtime\n\n# 5.\
    \ 安装网络观察依赖（如果需要抓包）\nnpm run install:mitmproxy\nnpm run doctor:network\n```\n\n### 常见组合\n\n| 需求 | 配置\
    \ |\n|------|------|\n| 只操作桌面应用 | UIA 或 CUA，不接网络 lane |\n| 操作桌面应用 + 抓包 | UIA/CUA + proxy lane |\n\
    | 操作桌面应用 + 本地抓取 | UIA/CUA + local lane |\n\n### 逆向场景示例\n\n```text\n场景：自动化操作 IDA Pro 进行批量分析\n\n1. 用\
    \ OpenReverse CUA 模式打开 IDA Pro\n2. 自动加载目标二进制\n3. 等待分析完成\n4. 通过 UI 操作导出函数列表\n5. 同时用 network lane 观察\
    \ IDA 的网络行为（如 Lumina 请求）\n```\n\n```text\n场景：自动化操作 x64dbg 调试\n\n1. 用 OpenReverse UIA 模式启动 x64dbg\n\
    2. 加载目标程序\n3. 设置断点\n4. 运行并观察寄存器/内存变化\n5. 截图保存证据\n```\n\n---\n\n## 按需自举（On-Demand Bootstrap）\n\n###\
    \ 自动化能力边界\n\n| 工具 | 可自动安装 | 安装方式 | 说明 |\n|------|-----------|---------|------|\n| Playwright | ✓ |\
    \ npm + npx playwright install | 浏览器自动化引擎 |\n| agent-browser CLI | ✓ | npm install -g agent-browser\
    \ | 浏览器操作 CLI |\n| Node.js | ✓ | winget | 前置依赖 |\n| OpenReverse | ✗ | 手动 clone + npm install | 实验阶段，依赖较重\
    \ |\n| mitmproxy | ✗ | 手动安装 | OpenReverse 网络观察依赖 |\n\n### 自举触发\n\n- 浏览器操作缺 Playwright → 自动 bootstrap\n\
    - 桌面操作需要 OpenReverse → 引导用户手动安装（给出完整步骤）\n\n### OpenReverse 手动安装引导\n\n如果 AI 检测到需要桌面应用自动化但 OpenReverse\
    \ 未安装：\n\n```markdown\n⚠️ **需要 OpenReverse 进行桌面应用自动化**\n\n**安装步骤**：\n1. `git clone https://github.com/zhexulong/openreverse.git`\n\
    2. `cd openreverse && npm install`\n3. `npm run init:agents -- --target=all <你的项目路径>`\n4. 如需视觉模式：`npm\
    \ run install:cua-runtime`\n5. 如需网络观察：`npm run install:mitmproxy`\n\n**验证**：`npm run doctor:cua-runtime`\
    \ 和 `npm run doctor:network`\n```\n\n---\n\n## 路由上下文\n\n**上游入口**: `skills/SKILL.md`（总控）、`routing.md`\n\
    **适用场景**: 任何需要自动化操作浏览器或桌面应用的任务\n**下游出口**:\n- 抓到的请求需要分析 → `anything-analyzer` 或 `js-reverse`\n- 需要\
    \ JS 调试/Hook → `jshookmcp`\n- 需要还原签名算法 → `js-reverse`\n- 桌面应用是逆向工具 → `ida-reverse/`\n\n**同级关联模块**:\
    \ `js-reverse`（浏览器操作后可能需要分析 JS）、`ida-reverse`（OpenReverse 可以自动化操作 IDA GUI）"
  source: browser-automation
  path: browser-automation/SKILL.md
