    \n### src-hunter 漏洞挖掘知识库\n\n`src-hunter/` 目录包含完整的 SRC/Bug Bounty 漏洞挖掘方法论：\n\n- **19 类攻击 playbook**（IDOR、RCE、XSS、SQLi、SSRF、OAuth、文件上传等）\n\
