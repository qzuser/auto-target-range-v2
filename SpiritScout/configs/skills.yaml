- skill_id: malware-analysis
  domain: malware
  description: 恶意样本分析：YARA / Sigma / 沙箱 / IOC 提取 / 反反分析，静态 + 动态 + 行为三合一。
  body: "\uFEFF# Malware Analysis\n\n> YARA / Sigma / 沙箱 / IOC 提取 / 反反分析\n> 静态 + 动态 + 行为三合一\n\n## 适用场景\n\
    \n- 恶意软件样本分析（PE/ELF/Mach-O/APK/脚本）\n- YARA 规则编写与验证\n- Sigma 行为检测规则生成\n- 沙箱自动化分析编排\n- IOC 提取与威胁情报\n\
    - 反分析技术检测与绕过\n\n## 六阶段分析流程\n\n### Phase 1: 初步分诊\n\n```bash\n# 快速静态检测\nfile sample.exe            \
    \          # 文件类型\nstrings sample.exe | grep -i \"http\\|cmd\\|powershell\\|base64\"  # 快速 IOCs\n\
    rabin2 -zz sample.exe                # 字符串提取 + 交叉引用\nfloss sample.exe                     # 去混淆字符串提取（FireEye）\n\
    \n# PE 头部分析\npecheck sample.exe                   # PE 结构验证\npescan sample.exe                   \
    \ # 异常检测（节表、入口点）\ndiec sample.exe                      # Detect It Easy（壳/编译器识别）\n\n# Hash 查询\nsha256sum\
    \ sample.exe\n# → VirusTotal / MalwareBazaar / Triage 查询\n```\n\n### Phase 2: 静态分析\n\n```text\n反汇编/反编译：\n\
    □ IDA Pro / Ghidra: 深度反编译\n□ radare2: CLI 快速分析\n□ x64dbg: Windows GUI 调试器\n\n重点分析区域：\n□ 入口点（Entry\
    \ Point）→ 初始化逻辑\n□ 导入表 → API 用途推断（CreateRemoteThread=注入, CryptEncrypt=勒索）\n□ 资源段 → 嵌入 Payload（.rsrc\
    \ 节）\n□ 字符串表 → URL/C2/文件路径/Base64 blob\n□ TLS 回调 → 调试器启动前执行\n```\n\n### Phase 3: 沙箱动态分析\n\n```text\n\
    自动化沙箱：\n□ Joe Sandbox / ANY.RUN / Triage: 商业沙箱\n□ CAPE Sandbox: 开源 + YARA 集成（推荐）\n□ ASD Azul: 开源恶意软件分析平台（2026\
    \ 新发布）\n□ Cuckoo Sandbox: 经典开源（逐步被 CAPE 取代）\n\n监控重点：\n□ 进程创建: CreateProcess / ShellExecute\n□ 文件操作:\
    \ WriteFile → 勒索? DeleteFile → Wiper?\n□ 注册表: Run/RunOnce 持久化\n□ 网络: HTTP/DNS → C2 通信\n□ 内存: VirtualAllocEx\
    \ → 进程注入\n□ 服务: CreateService → 持久化\n```\n\n### Phase 4: YARA 规则编写\n\n```yara\n// 规则结构\nrule MalwareFamily_Example\
    \ {\n    meta:\n        description = \"检测 Example 恶意软件家族\"\n        author = \"分析者\"\n        date\
    \ = \"2026-05\"\n        severity = \"high\"\n        hash = \"d41d8cd98f00b204e9800998ecf8427e\"\n\
    \        mitre_id = \"T1055\"  // Process Injection\n\n    strings:\n        // 字符串匹配\n        $str1\
    \ = \"C2_SERVER_URL\" ascii wide\n        $str2 = \"payload.dat\" ascii\n\n        // 十六进制匹配\n   \
    \     $hex1 = { 8B 45 ?? 50 FF 15 [4] 85 C0 }\n        // 操作码序列: mov eax, [ebp-?]; push eax; call\
    \ [import]; test eax, eax\n\n        // 正则匹配\n        $re1 = /https?:\\/\\/[a-z0-9.-]+\\/[a-z]{3,8}\\\
    .php/ ascii\n\n    condition:\n        // 组合条件\n        uint16(0) == 0x5A4D and     // MZ 头\n    \
    \    filesize < 500KB and\n        (2 of ($str*) or $hex1)\n}\n```\n\n### Phase 5: Sigma 规则生成\n\n\
    ```yaml\n# 行为检测规则\ntitle: Suspicious Process Injection via CreateRemoteThread\nid: 5a3d2c1b-1234-5678-9abc-def012345678\n\
    status: experimental\ndescription: 检测使用 CreateRemoteThread 的进程注入行为\nauthor: 分析者\ndate: 2026/05/25\n\
    tags:\n    - attack.t1055          # Process Injection\n    - attack.t1055.001      # DLL Injection\n\
    logsource:\n    category: process_creation\n    product: windows\ndetection:\n    selection:\n   \
    \     Image|endswith: '\\powershell.exe'\n        CommandLine|contains:\n            - 'CreateRemoteThread'\n\
    \            - 'VirtualAllocEx'\n            - 'WriteProcessMemory'\n    condition: selection\nfalsepositives:\n\
    \    - 合法的调试工具\nlevel: high\n```\n\n### Phase 6: IOC 提取与情报\n\n```text\nIOC 类型分类：\n□ 网络 IOC:\n  - IP:\
    \ C2 地址（注意时效性）\n  - Domain: DGA 算法生成的域名（rsnkfda.com, xpqmje.net）\n  - URL: Payload 托管地址\n  - User-Agent:\
    \ 自定义 UA 字符串\n\n□ 主机 IOC:\n  - 文件路径: %APPDATA%\\Microsoft\\Crypto\\RSA\\*.dat\n  - 注册表: HKCU\\Software\\\
    Microsoft\\Windows\\CurrentVersion\\Run\\\n  - Mutex: Global\\{GUID} 互斥体名称\n  - 服务名: 伪装成系统服务的名称\n\n\
    □ 行为 IOC:\n  - MITRE ATT&CK 技术 ID (T1055, T1003, T1571...)\n  - Sigma 规则 → SIEM 集成\n  - YARA 规则 →\
    \ 端点检测\n\n□ 静态 IOC:\n  - 编译时间戳（可伪造）\n  - PDB 路径（含开发者信息）\n  - 节名异常（非标准 .text/.data）\n  - 导入表异常组合（如勒索软件\
    \ CryptEncrypt + DeleteShadowCopies）\n```\n\n## 反分析技术速查\n\n| 技术 | 检测方法 | YARA 特征 |\n|------|---------|----------|\n\
    | 虚拟机检测 | WMI Win32_BIOS/VideoController/Processor | `Win32_` 字符串 + 特定厂商名 |\n| 沙箱检测 | 磁盘 < 60GB, RAM\
    \ < 2GB, 单核 CPU | GlobalMemoryStatusEx 调用模式 |\n| 调试器检测 | IsDebuggerPresent, CheckRemoteDebuggerPresent\
    \ | PEB.BeingDebugged 偏移访问 |\n| 定时逃逸 | Sleep(300000) 后执行恶意行为 | NtDelayExecution 长参数 |\n| 地理位置检测 |\
    \ 检查键盘布局/时区 → 排除 CIS 国家 | GetKeyboardLayoutList 调用 |\n| 父进程检测 | explorer.exe vs cmd.exe | 进程名字符串比较\
    \ |\n| API 直接 syscall | 绕过 EDR hook | syscall 指令 + SSN 解析 |\n\n## 多 Agent 自动化分析 (SentinelHive 架构)\n\
    \n```text\n┌─────────────────────────────────────────────────┐\n│                  Hive Director \
    \                   │\n│          (Claude Opus 编排 + 仲裁)                │\n└──────┬──────┬──────┬──────┬──────┬───────┘\n\
    \       │      │      │      │      │\n   ┌───┘  ┌───┘  ┌───┘  ┌───┘  ┌───┘\n   ▼      ▼      ▼  \
    \    ▼      ▼      ▼\nTriage  RE    Behav  Intel  Detect Remed\n 快速   反编译  行为   威胁   规则   修复\n 分诊\
    \   静态   动态   情报   YARA  方案\n                          Sigma\n```\n\n## 工具链\n\n| 工具 | 用途 | 获取 |\n\
    |------|------|------|\n| Ghidra / IDA Pro | 深度反编译 | ghidra-sre.org |\n| CAPE Sandbox | 开源恶意软件沙箱 |\
    \ GitHub: kevoreilly/CAPEv2 |\n| ASD Azul | 大规模自动化分析 | GitHub: ASD |\n| YARA | 模式匹配规则引擎 | `pip install\
    \ yara-python` |\n| Sigma | SIEM 行为检测规则 | GitHub: SigmaHQ/sigma |\n| FLOSS | 去混淆字符串提取 | `pip install\
    \ flare-floss` |\n| Detect It Easy | 壳/编译器检测 | GitHub: horsicq/Detect-It-Easy |\n| pe-sieve | 进程内存扫描\
    \ | GitHub: hasherezade/pe-sieve |\n| VirusTotal API | 多引擎扫描 | virustotal.com |\n| MalwareBazaar |\
    \ 恶意软件样本库 | bazaar.abuse.ch |\n\n## 参考\n\n- `references/yara-sigma-rules.md` — YARA + Sigma 编写方法论\n\
    - `references/sandbox-orchestration.md` — 沙箱编排与自动化\n- `references/anti-analysis-techniques.md` — 94\
    \ 种反分析技术检测"
  source: malware-analysis
  path: malware-analysis/SKILL.md
- skill_id: mobile-reverse
  domain: mobile
  description: 移动端统一逆向方法论：Android + iOS，Frida / Objection / OWASP MSTG / SSL Pinning Bypass。
  body: "\uFEFF# Mobile Reverse Engineering\n\n> Android + iOS 统一逆向方法论\n> Frida / Objection / OWASP MSTG\
    \ / SSL Pinning Bypass\n\n## 适用场景\n\n- Android APK 逆向与安全测试\n- iOS IPA 逆向与安全测试\n- 移动应用运行时动态插桩\n- SSL\
    \ Pinning / Root 检测 / 越狱检测绕过\n- 移动端加密算法提取（AES/RSA/HMAC 密钥）\n- 移动应用渗透测试（OWASP MASTG）\n- 非 Root/越狱环境下的应用测试\n\
    \n## 四阶段工作流\n\n### Phase 1: 信息收集\n\n```text\nAndroid：\n□ APK 获取（Google Play / APKMirror / adb pull）\n\
    □ Manifest 分析: 权限、导出组件、Intent Filter、backup 标志\n□ androguard: androguard analyze APK → 组件/权限/签名\n\
    □ APKLeaks: 硬编码 API Key / Token / Secret 扫描\n□ 加固检测: 是否加壳（360/腾讯/梆梆/爱加密）\n\niOS：\n□ IPA 获取（App Store\
    \ / ipatool / Apple Configurator）\n□ 解密 App Store 二进制: frida-ios-dump / Clutch\n□ Info.plist 分析: ATS\
    \ 配置、URL Scheme、Queries Schemes\n□ class-dump: 导出 ObjC 类结构\n□ 加固检测: 是否使用 Swift/ObjC 混淆\n```\n\n###\
    \ Phase 2: 静态分析\n\n```text\n跨平台：\n□ JADX-GUI: APK → Java 源码（Android）\n□ Ghidra / Hopper: .so / Mach-O\
    \ 反编译\n□ radare2 / Cutter: CLI 快速侦察\n\nAndroid 专项：\n□ apktool d app.apk → smali 代码 + 资源\n□ dex2jar:\
    \ DEX → JAR → JD-GUI\n□ smali/baksmali: Dalvik 字节码修改\n\niOS 专项：\n□ class-dump: 导出 ObjC 头文件\n□ Swift\
    \ 符号恢复: swift-demangle\n□ dsymutil: 调试符号提取\n□ otool -L: 查看动态库依赖\n□ jtool2: Mach-O 分析\n```\n\n### Phase\
    \ 3: 动态分析\n\n```text\nFrida — 通用动态插桩：\n□ frida-ps -U: 列出设备进程\n□ frida-trace -U -i \"open*\" com.app:\
    \ 追踪函数调用\n□ 自定义 Hook 脚本: 修改参数/返回值、调用私有方法\n\nObjection — Frida 增强层（无需写脚本）：\n□ objection -g \"com.app\"\
    \ explore\n□ android root disable / ios jailbreak disable\n□ android sslpinning disable / ios sslpinning\
    \ disable\n□ android keystore list / ios keychain dump\n□ env / ls / sqlite connect\n\nFrida Gadget（免\
    \ Root/越狱）：\n□ 注入 frida-gadget.so / FridaGadget.dylib 到 APK/IPA\n□ 重新签名 → 安装 → 无需设备权限即可 Hook\n□ objection\
    \ patchapk --source app.apk（全自动）\n```\n\n### Phase 4: 网络分析\n\n```text\n□ Burp Suite: 拦截 HTTP/HTTPS，修改请求/响应\n\
    □ mitmproxy: 脚本化代理（Python API）\n□ Wireshark: PCAP 抓包分析\n□ 证书安装: Android 用户证书 → 系统证书（Magisk + MoveCert）\n\
    □ SSL Pinning 绕过: Frida/Objection/Xposed/SSL Kill Switch 2\n□ WebSocket / gRPC 流量分析\n```\n\n## 常见绕过速查\n\
    \n### SSL Pinning\n\n```bash\n# Objection（最简）\nobjection -g \"com.app\" explore\nandroid sslpinning\
    \ disable\n\n# Frida 通用脚本\nfrida -U -l ssl_pinning_bypass.js -f com.app\n\n# Xposed（Android）\nTrustMeAlready\
    \ 模块 → 全局禁用证书校验\n```\n\n### Root / 越狱检测\n\n```bash\n# Objection\nandroid root disable\nios jailbreak\
    \ disable\n\n# Frida 自定义（多层检测）\nJava.perform(function() {\n    var RootBeer = Java.use(\"com.scottyab.rootbeer.RootBeer\"\
    );\n    RootBeer.isRooted.implementation = function() { return false; };\n    // 额外绕过: Magisk su 检测、frida-server\
    \ 检测、/proc/self/maps 检测\n});\n```\n\n### 反调试\n\n```bash\n# Android\nfrida -U -l anti_debug_bypass.js\
    \ -f com.app\n# 绕过: ptrace(TracerPid)、/proc/self/status、isDebuggerConnected()\n\n# iOS\n# 绕过: PT_DENY_ATTACH、sysctl\
    \ CTL_KERN/KERN_PROC/KERN_PROC_PID\nfrida -U -l ios_anti_debug.js -f com.app\n```\n\n## 移动端加密提取\n\n\
    ```javascript\n// Android — Hook Cipher.getInstance 获取密钥+算法\nJava.perform(function() {\n    var Cipher\
    \ = Java.use(\"javax.crypto.Cipher\");\n    Cipher.getInstance.overload('java.lang.String').implementation\
    \ = function(algo) {\n        console.log(\"[Cipher] Algorithm: \" + algo);\n        return this.getInstance(algo);\n\
    \    };\n    Cipher.init.overload('int', 'java.security.Key').implementation = function(mode, key)\
    \ {\n        console.log(\"[Cipher] Key: \" + bytesToHex(key.getEncoded()));\n        return this.init(mode,\
    \ key);\n    };\n});\n\n// iOS — Hook CCCrypt\nInterceptor.attach(Module.findExportByName(\"libcommonCrypto.dylib\"\
    , \"CCCrypt\"), {\n    onEnter: function(args) {\n        console.log(\"CCCrypt op: \" + args[0] +\
    \ \" alg: \" + args[1]);\n        console.log(\"Key: \" + hexdump(args[3], { length: args[4].toInt32()\
    \ }));\n    }\n});\n```\n\n## 工具链\n\n| 工具 | 平台 | 用途 |\n|------|:--:|------|\n| JADX-GUI | A | Java\
    \ 反编译 |\n| apktool | A | APK 解包/重建 |\n| Ghidra | A+I | 多架构反编译 |\n| Hopper | I | iOS 专用反汇编 |\n| Frida\
    \ | A+I | 动态插桩 |\n| Objection | A+I | Frida REPL 增强 |\n| MobSF | A+I | 自动化 SAST+DAST |\n| class-dump\
    \ | I | ObjC 类导出 |\n| frida-ios-dump | I | IPA 解密 |\n| jtool2 | I | Mach-O 分析 |\n| Burp Suite | A+I\
    \ | HTTP 拦截 |\n| mitmproxy | A+I | 脚本化代理 |\n\n> A=Android, I=iOS\n\n## 参考\n\n- `references/frida-objection-deep.md`\
    \ — Frida + Objection 深度用法\n- `references/ios-reverse-guide.md` — iOS 逆向专项\n- `references/anti-detection-bypass.md`\
    \ — Root/越狱/反调试/SSL Pinning 绕过"
  source: mobile-reverse
  path: mobile-reverse/SKILL.md
- skill_id: patch-diff-exploit
  domain: reverse
  description: 'N-day 补丁差分到利用。从厂商发布的补丁里反推漏洞点、写 PoC、做成可用的攻击模块。

    适用场景：已知 CVE 编号但只有补丁没有 PoC、SRC/红队需要打击未及时更新的资产、N-day 武器化、Patch Tuesday 跟进。

    核心方法：拿 before/after 二进制 → 对齐符号 → 二进制 diff → 看新增的安全检查反推 bug class → 写 PoC 触发漏洞。

    触发关键词：N-day、Nday、补丁差分、patch diff、patch tuesday、1day、binary diff 漏洞、bindiff 利用、ghidriff、Diaphora、补丁分析、CVE
    复现、漏洞还原、补丁反推、N-day 武器化。'
  body: "# N-day 补丁差分到利用 (Patch Diff Exploit)\n\n## 适用范围\n\n当任务属于以下场景时使用本 skill：\n\n1. **已知 CVE 但无公开 PoC**\
    \ — 厂商公告写了\"修复了 XX 组件的越界写\"但没放 PoC，需要从补丁反推\n2. **SRC / 红队打 N-day** — 目标资产未及时更新，需要把刚发布的补丁差成可用的 1-day\
    \ 利用\n3. **Patch Tuesday 跟进** — 每月第二个周二微软放补丁，需要快速锁定高价值漏洞（Kernel / Win32k / AFD / CLFS）\n4. **Linux\
    \ LTS 补丁分析** — 主线 fix 已合并，但旁支或某发行版 backport 不全，找未修补面\n5. **驱动 / 服务的安全补丁还原** — 显卡驱动、AV 引擎、虚拟化组件等闭源软件的补丁分析\n\
    \n### 与其他 skill 的分工\n\n| 场景 | 用什么 |\n|------|--------|\n| 有旧版符号，迁移到新版本帮助分析 | `binary-diff/` |\n| **从补丁找漏洞、写\
    \ PoC 打补丁前版本** | **本 skill** |\n| 写出完整利用链（堆喷、ROP、提权） | `pwn-chain/` |\n| 把 1-day 武器化部署到目标网络 | `pentest-tools/network-attack-defense/`\
    \ |\n| 从零逆向一个二进制 | `ida-reverse/` / `radare2/` |\n\n差别的关键：`binary-diff` 的目标是**让新版可分析**（把旧符号搬过来），本\
    \ skill 的目标是**找出补丁修了什么 bug 然后打补丁前的版本**。前者服务防御侧 / 研究侧分析，后者服务攻击侧武器化。\n\n## 核心原理\n\n```text\npatched\
    \ 二进制 (after)         unpatched 二进制 (before)\n        ↓                                  ↓\n    导入\
    \ IDA/Ghidra              导入 IDA/Ghidra\n        ↓                                  ↓\n        └────────\
    \ BinDiff / ghidriff ──────┘\n                        ↓\n        函数级 diff（matched / unmatched / changed）\n\
    \                        ↓\n        聚焦 match score 中等的函数（0.5 - 0.9）\n                        ↓\n \
    \       看新增了什么：边界检查 / 锁 / 字段清零 / 整数溢出检查\n                        ↓\n        反推 bug class：OOB / Race\
    \ / Info Leak / UAF / Integer Overflow\n                        ↓\n        在 unpatched 版本上写 PoC 触发\n\
    \                        ↓\n        验证：unpatched 崩 / patched 不崩 → 漏洞确认\n```\n\n补丁修复模式 → 漏洞类型反查：\n\n\
    | 新增内容 | 大概率的 bug class |\n|---------|------------------|\n| `if (a + b < a)` / `__builtin_add_overflow`\
    \ | 整数溢出 |\n| `KeAcquireSpinLock` / `mutex_lock` | 竞争条件 (TOCTOU / double-free) |\n| `if (idx >= MAX)`\
    \ / `if (len > buf_size)` | 越界读 / 越界写 |\n| `RtlZeroMemory` / `memset(struct, 0, ...)` | 未初始化内存信息泄漏\
    \ |\n| `InterlockedDecrement` + refcount 检查 | UAF / 引用计数错误 |\n| `ProbeForRead` / `ProbeForWrite` |\
    \ 用户态指针未校验 |\n| `SeAccessCheck` / capability 校验 | 权限校验缺失 |\n| 删除 / 收紧 `IOCTL` code | 暴露面收敛（看老接口怎么打）\
    \ |\n\n## 工作流\n\n### 5 步完整流程\n\n```text\nStep 1: 拿 before / after 二进制\n  - Windows: Microsoft Update\
    \ Catalog 下 MSU/MSP，用 expand.exe / dism 解包\n  - Linux: 从发行版 USN/RHSA 拉 .deb/.rpm，用 dpkg-deb / rpm2cpio\
    \ 解包\n  - 第三方软件: 官网取 N-1 和 N 版本安装包\n\nStep 2: 对齐符号\n  - 有 PDB 直接吃，没 PDB 时用 binary-diff skill 把 N-1\
    \ 版本的符号搬到 N 版本\n  - Linux 内核取对应版本的 vmlinux + System.map / debuginfo\n\nStep 3: 二进制 diff\n  - BinDiff:\
    \ 直接给两个 IDB，看函数级匹配结果\n  - ghidriff: pip 一键安装，CLI 输出 markdown 报告\n  - Diaphora: IDA 内插件，老牌但需要 IDA Pro\n\
    \nStep 4: 定位变更\n  - 过滤 match score 0.5-0.95 的函数（完全相同的不看，完全不同的多半是新加 / 重命名）\n  - 重点看：新增的 if / 新增的循环边界\
    \ / 删除的代码块（删了什么也是线索）\n  - 用 LLM 看 before/after 伪代码反推 bug class（见 references/root-cause-and-poc.md）\n\
    \nStep 5: 写 PoC\n  - 整数溢出：构造边界值（INT_MAX-1、0xFFFFFFFF）\n  - 竞争：多线程 hammer，open/close + ioctl 高频并发\n\
    \  - UAF：spray → free → reuse pattern\n  - OOB：精确控制 len / index 越过边界\n  - 验证 patched 版本不再崩，unpatched\
    \ 版本稳定崩 → bug 复现成功\n```\n\n### 工具调用顺序\n\n```text\n下补丁 → 解包 → 加载到 IDA/Ghidra → BinDiff/ghidriff → 看\
    \ unmatched/low-match 函数\n       → LLM 反推 bug class → 写 PoC → 在 unpatched 跑 → 崩 → 收工\n```\n\n## 典型场景示例\n\
    \n### 场景 1：Windows Patch Tuesday — Kernel CVE 复现\n\n```text\n背景：2025 年 11 月 Patch Tuesday，MSRC 公告\
    \ CVE-2025-62215\n      Windows Kernel race condition 导致 double free，CVSS 7.0，本地提权\n      微软只放了补丁，没放细节，没有公开\
    \ PoC\n\n目标：复现 PoC，验证未打补丁的 Windows 11 22H2 / 23H2 可提权\n\n步骤：\n1. Microsoft Update Catalog 搜 \"2025-11\"\
    \ + KB 号，下两个版本：\n   - 22H2 build 22621.xxxx (unpatched)\n   - 22H2 build 22621.yyyy (patched 后)\n\
    \   命令:\n     expand.exe Windows-KB5052000-x64.msu -F:* C:\\out\\patched\\\n     expand.exe C:\\out\\\
    patched\\Windows-KB5052000-x64.cab -F:* C:\\out\\patched\\\n   提取 ntoskrnl.exe / win32k.sys / win32kfull.sys\
    \ / afd.sys\n\n2. 两个版本都吃 PDB (微软符号服务器):\n     symchk /v /r ntoskrnl.exe /s SRV*C:\\sym*https://msdl.microsoft.com/download/symbols\n\
    \n3. 跑 BinDiff:\n     bindiff old.BinExport new.BinExport\n   或 ghidriff:\n     ghidriff ntoskrnl_old.exe\
    \ ntoskrnl_new.exe -o diff_out/\n\n4. 看报告，过滤 similarity 0.6-0.95 的函数。\n   假设定位到 NtXxxIoctl 类函数新增了一段:\n\
    \     KeAcquireSpinLockRaiseToDpc(&obj->Lock);\n     if (obj->RefCount == 0) { ... goto cleanup; }\n\
    \   → 新增了锁 + 引用计数检查 → race + double free，符合公告描述\n\n5. 写 PoC：用户态多线程同时调 NtClose + 触发同一对象的 IOCTL，\n \
    \  制造 close 释放与 IOCTL 还在用之间的竞争窗口\n   崩在 ntoskrnl 的 ObfDereferenceObject 后续 free 路径上\n\n6. 验证：\n  \
    \ - unpatched 22621.xxxx 上跑 PoC，~30 秒内 BSOD (BAD_POOL_HEADER 或 DOUBLE_FREE)\n   - patched 22621.yyyy\
    \ 上跑同 PoC，无任何异常\n   → 复现成功\n```\n\n### 场景 2：Linux 内核 LTS 分支补丁找未修的旁支\n\n```text\n背景：主线 6.x 已修某 net\
    \ subsystem 的 OOB 写\n      Ubuntu 22.04 (5.15 LTS) 的 USN 已发布更新\n      但某些 OEM kernel / Azure kernel\
    \ 的 backport 节奏更慢\n      想确认未更新的旁支是否仍可打\n\n目标：取 patched/unpatched 内核，差出 fix commit 对应的二进制变更，\n   \
    \   在 unpatched 旁支上重写 PoC\n\n步骤：\n1. 拉 patched 与 unpatched 包:\n     apt download linux-image-5.15.0-101-generic\
    \   # patched\n     apt download linux-image-5.15.0-100-generic   # unpatched\n     dpkg-deb -x linux-image-5.15.0-101-generic_*.deb\
    \ ./patched/\n     dpkg-deb -x linux-image-5.15.0-100-generic_*.deb ./unpatched/\n   提取 boot/vmlinuz\
    \ → 用 extract-vmlinux 还原 ELF\n\n2. 同步取 dbgsym:\n     apt download linux-image-unsigned-5.15.0-101-generic-dbgsym\n\
    \n3. 用 ghidriff (Linux 友好):\n     ghidriff vmlinux_5.15.0-100 vmlinux_5.15.0-101 \\\n            \
    \  -o /tmp/kdiff/ --max-section-funcs-analyze 8000\n\n4. 报告里搜 net/ipv4/ net/ipv6/ net/sched/ 等子系统的\
    \ changed 函数\n   找到补丁前 skb_copy_bits 调用前缺少 skb->len 上限校验\n   → OOB read，可能配合可触发的 sysctl 升级到 OOB write\n\
    \n5. 在 unpatched 旁支（例如 Azure 5.15.0-1080 backport 落后的版本）\n   交叉验证：同一函数 fix 是否已 backport\n   如果没 backport\
    \ → 旁支仍可打 → 写 PoC 重放\n\n6. 写 PoC：syzkaller harness 改造 / 直接 C PoC 触发对应 syscall\n   验证旁支 panic / KASAN\
    \ 报 OOB\n```\n\n## 注意事项\n\n- **法律边界** — 武器化 N-day 必须在授权范围内（SRC / Bug Bounty / 自有靶机 / CTF）。对生产环境直接打\
    \ 1-day 等同入侵\n- **补丁可能只是\"减小爆炸半径\"** — 看到 patch 不一定就是完整修复，有可能只是补一个利用路径，原始 bug 仍可从别的路径触发（一鱼多吃）\n- **变量名/类型不要被欺骗**\
    \ — Windows 补丁经常顺手做 cleanup / rename，看似变更很大但实际无关。要看控制流和数据流，不要看 token 级 diff\n- **微软的补丁可能加了 mitigation\
    \ 而不是 fix** — 看到 `_guard_xfg_dispatch_icall_fptr` 这种 CFG 强化不要当成 fix，那是 mitigation\n- **匿名化** — writeup\
    \ / PoC 公开时脱敏目标机器名、内网 IP、用户名（写 `{target_ip}` `{username}` 占位）\n- **patched 版本上要能跑通无害化测试** — 别只在 unpatched\
    \ 上跑，否则可能是环境因素导致的崩溃，不是漏洞\n- **二进制 diff 不万能** — 编译器升级 / 优化等级变化也会让函数 layout 大变，先用 N 版本和 N-1 版本（同一编译器）对比，不要跨大版本\n\
    \n---\n\n## 按需自举（On-Demand Bootstrap）\n\n### 工具依赖\n\n| 工具 | 用途 | 可自动安装 |\n|------|------|-----------|\n\
    | BinDiff (Google, 5.x+) | 函数级二进制 diff，IDA/Ghidra 插件 | ✓ (有官方 .deb / .msi) |\n| Diaphora | IDA 老牌\
    \ diff 插件，需要 IDA Pro | ✓ (git clone) |\n| ghidriff | Ghidra headless CLI diff，输出 markdown | ✓ (pip\
    \ install ghidriff) |\n| DeepDiff (商业) | 新一代 diff 工具，准确度更高 | ✗ (商业授权) |\n| Ghidra | ghidriff 的运行底座\
    \ | ✓ |\n| IDA Pro | BinDiff / Diaphora 的运行底座 | ✗ (商业) |\n| Microsoft Update Catalog | 下 MSU/MSP 补丁包\
    \ | 在线服务 |\n| wsuspect-proxy | 透明拦截 Windows Update 流量取补丁 | ✓ (git clone) |\n| expand.exe / dism |\
    \ 解 MSU / cab | ✓ (Windows 自带) |\n| rpm2cpio / dpkg-deb | 解 Linux 发行版包 | ✓ |\n| symchk | 从微软符号服务器拉\
    \ PDB | ✓ (Windows SDK) |\n\n### 自举命令\n\n```powershell\npowershell -NoProfile -ExecutionPolicy Bypass\
    \ -File \"&lt;SKILL_ROOT&gt;\\skills\\scripts\\bootstrap-reverse.ps1\" -Capability @('bindiff','ghidriff','ghidra','wsuspect-proxy')\
    \ -StartServices\n```\n\n详细工具对比与命令见 `references/diff-tools-comparison.md`。\n详细 Patch Tuesday 工作流见\
    \ `references/patch-tuesday-workflow.md`。\n根因反推与 PoC 模板见 `references/root-cause-and-poc.md`。\n\n---\n\
    \n## 路由上下文\n\n**上游入口**: `skills/SKILL.md`（总控）、`routing.md`\n\n**上游 skill**:\n- `reverse-engineering/`\
    \ — 在做 diff 之前可能要先理解目标二进制的整体结构\n- `binary-diff/` — 如果补丁后版本无符号、补丁前有符号，先用 binary-diff 搬符号过来\n\n**下游\
    \ skill**:\n- `pwn-chain/` — 反推出 bug class 后，需要写完整利用（堆喷、ROP、SMEP/SMAP 绕过、提权 payload）\n- `pentest-tools/network-attack-defense/`\
