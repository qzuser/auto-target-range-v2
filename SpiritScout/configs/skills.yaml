- skill_id: zzy-reverse-engineering
  domain: reverse
  description: Provides reverse engineering techniques. Use when the main job is to understand how a compiled,
    obfuscated, packed, or virtualized target works before exploiting or solving it, including binaries,
    APKs, WASM, firmware, custom VMs, bytecode, malware-like loaders, and anti-debug or anti-analysis
    logic. Do not use it when the vulnerability is already understood and the remaining task is exploitation;
    use pwn instead. Do not use it for pure web workflows, log or disk forensics, or standalone crypto
    problems unless reversing the implementation is the real blocker.
  body: '# Reverse Engineering


    Quick reference for RE challenges. For detailed techniques, see supporting files.


    ## Prerequisites


    **Python packages (all platforms):**

    ```bash

    pip install frida-tools angr qiling uncompyle6 capstone lief z3-solver

    # For Python 3.9+ bytecode: build pycdc from source

    git clone https://github.com/zrax/pycdc && cd pycdc && cmake . && make

    ```


    **Linux (apt):**

    ```bash

    apt install gdb radare2 binutils strace ltrace apktool upx

    ```


    **macOS (Homebrew):**

    ```bash

    brew install gdb radare2 binutils apktool upx ghidra

    ```


