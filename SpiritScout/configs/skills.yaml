- skill_id: asm-analysis
  domain: reverse
  description: 深度汇编代码逆向分析技能，专注 Linux 环境动态调试与静态分析协同。自动协调 GDB/LLDB/r2/Frida/angr/strace/ltrace/perf/bpftrace
    等工具完成完整分析链路。内置上下文记忆机制：每 10 轮自动生成分析快照 skill，保持长对话连续性并降低幻觉。触发词：汇编分析、逆向工程、GDB、r2、radare2、frida、动态调试、二进制分析、ELF
    分析、加密算法识别、编译器优化、混淆脱壳、struct 恢复、调试、strace、ltrace、内存分析等。
  body: "# 汇编分析优化技能 (asm-analysis)\n\n## 完整工作流\n\n```\n阶段 0   架构确认 + 白皮书加载\n   ↓\n阶段 T   工具协调（Linux 调试环境全量探测与任务分派）★\
    \ 核心强化\n   ↓\n阶段 O   混淆与加壳检测（UPX/OLLVM/VMProtect 识别与处置）\n   ↓\n阶段 1   算法特征识别（加密/哈希/压缩 宏观扫描）\n   ↓\n\
    阶段 2   文件编译信息提取（编译器/优化级别/安全标志）\n   ↓\n阶段 D   数据结构恢复（vtable/struct 布局/类型重建）\n   ↓\n阶段 3   逐块分析（指令注释\
    \ + 伪代码生成）\n   ↓\n阶段 4   持续分析协议\n   ↓\n阶段 5   综合报告\n   ↓\n阶段 M   记忆机制（每 10 轮自动生成上下文快照 skill）★ 新增\n\
    ```\n\n**跳过规则**：\n- 仅代码片段 → 跳过 T.1 环境探测，直接 T.3 生成命令\n- 无可执行文件 → 跳过阶段 O（脱壳需运行）\n- 无 OOP 特征 → 跳过阶段 D\
    \ vtable 分析\n\n---\n\n## 阶段 0：启动协议\n\n### 架构确认\n```\n请问要分析的代码属于哪种架构？\n  [A] x86 / x86-64    [B] ARM64\
    \ / AArch64    [C] 其他\n```\n上下文有明显架构特征时可直接确认并等待认可。\n\n### 白皮书加载（URL 索引见 references/whitepaper-urls.md）\n\
    \n- **x86**：Intel SDM Vol.2 → https://www.intel.com/content/www/us/en/developer/articles/technical/intel-sdm.html\n\
    - **ARM64**：ARM DDI 0487 → https://developer.arm.com/documentation/ddi0487/latest\n\n**拒绝加载时必须输出（不可跳过）：**\n\
    > ⚠️ 未加载权威指令手册：SIMD 指令语义误判风险高，内存序语义（rep movs/stlr/ldar）可能歧义，伪代码可能与实际行为偏差。继续，保留此风险提示。\n\n---\n\n##\
    \ 阶段 T：Linux 动态调试协调（Tool Orchestration）★\n\n> 详细命令手册见 `references/tool-commands.md`\n> Linux 专项调试流程见\
    \ `references/linux-debug-workflows.md`\n> Frida 脚本库见 `references/frida-scripts.md`\n> angr 工作流见 `references/angr-workflows.md`\n\
    \n### T.1 — Linux 调试环境全量探测\n\n```bash\n# ── 调试器 ──\nfor t in gdb lldb; do\n  which $t 2>/dev/null\
    \ && $t --version 2>&1 | head -1 || echo \"$t: not found\"\ndone\n\n# GDB 插件检测\npython3 -c \"\nimport\
    \ subprocess, os\nfor plugin in ['pwndbg','gef','peda']:\n    r = subprocess.run(['gdb','-batch','-ex',f'python\
    \ import {plugin}'],\n        capture_output=True, text=True)\n    print(plugin, 'ok' if r.returncode==0\
    \ else 'not found')\n\" 2>/dev/null\n\n# ── 静态分析 ──\nfor t in r2 objdump readelf nm strings file rabin2;\
    \ do\n  which $t 2>/dev/null && echo \"$t: ok\" || echo \"$t: not found\"\ndone\nr2 -q -c 'pdg 1 @\
    \ 0' /dev/null 2>/dev/null | grep -q ghidra && echo \"r2ghidra: ok\" || echo \"r2ghidra: not found\"\
    \n\n# ── Linux 动态追踪工具 ──\nfor t in strace ltrace perf valgrind bpftrace systemtap addr2line eu-stack;\
    \ do\n  which $t 2>/dev/null && $t --version 2>&1 | head -1 || echo \"$t: not found\"\ndone\n\n# ──\
    \ 符号执行 / 动态插桩 ──\npython3 -c \"import frida; print('frida:', frida.__version__)\" 2>/dev/null || echo\
    \ \"frida: not found\"\npython3 -c \"import angr;  print('angr:',  angr.__version__)\"  2>/dev/null\
    \ || echo \"angr: not found\"\n\n# ── 系统环境 ──\nuname -a\ncat /proc/sys/kernel/yama/ptrace_scope 2>/dev/null\
    \ && echo \"(ptrace_scope)\" || true\ncat /proc/sys/kernel/randomize_va_space 2>/dev/null && echo\
    \ \"(ASLR)\" || true\ncat /proc/sys/kernel/perf_event_paranoid 2>/dev/null && echo \"(perf_paranoid)\"\
    \ || true\n\n# ── core dump 配置 ──\nulimit -c\ncat /proc/sys/kernel/core_pattern 2>/dev/null || true\n\
    ```\n\n输出格式：\n```\n\U0001F527 Linux 调试环境\n  调试器  : GDB 13.2 [pwndbg] / LLDB 15.0\n  静态    : r2 5.8.8\
    \ [r2ghidra] / objdump / readelf / rabin2\n  追踪    : strace 6.1 / ltrace 0.7.3 / perf 6.1 / bpftrace\
    \ 0.18\n  插桩    : Frida 16.2.1 / angr 9.2.90\n  Valgrind: 3.21.0\n  内核    : 6.1.0-amd64 | ASLR=2 |\
    \ ptrace_scope=1 | perf_paranoid=2\n  core    : ulimit=-1 | pattern=/tmp/core.%e.%p\n```\n\n### T.2\
    \ — 工具选择策略（Linux 优先级）\n\n| 分析目标 | 首选 | 辅助 |\n|---------|------|------|\n| 通用动态调试 | GDB + pwndbg |\
    \ r2（静态补充） |\n| 系统调用追踪 | strace | ltrace（库函数） |\n| 内存错误检测 | Valgrind (memcheck) | GDB watchpoint |\n\
    | 函数调用追踪 | ltrace / Frida | GDB breakpoints |\n| 性能热点 | perf record + report | GDB profiling |\n|\
    \ 内核态追踪 | bpftrace / perf | systemtap |\n| 符号执行 | angr | GDB + Python |\n| 纯静态 stripped | r2 aaa |\
    \ angr CFGFast |\n| 多线程调试 | GDB thread cmds | Helgrind (Valgrind) |\n| core dump 分析 | GDB + core |\
    \ eu-stack |\n| 动态库 Hook | LD_PRELOAD / Frida | GDB catch load |\n\n**ptrace_scope 限制处理：**\n```bash\n\
    # scope=1（默认）：只能调试子进程，无法附加任意进程\n# 临时降低（需 root）：\necho 0 | sudo tee /proc/sys/kernel/yama/ptrace_scope\n\
    \n# 永久（不推荐）：\n# echo 'kernel.yama.ptrace_scope = 0' >> /etc/sysctl.d/10-ptrace.conf\n\n# 非 root 替代方案：用\
    \ gdb -f ./target 直接启动\n```\n\n**ASLR 控制：**\n```bash\n# 关闭 ASLR（当前 shell 子进程）\nsetarch $(uname -m)\
    \ -R gdb ./target\n\n# 或 GDB 内\n(gdb) set disable-randomization on   # GDB 默认已开启此项\n```\n\n### T.3\
    \ — 任务驱动命令生成\n\n每次生成命令前说明意图，命令后说明预期输出。\n\n#### 全工具命令速查表\n\n| 任务 | GDB | r2 | strace/ltrace | Frida\
    \ |\n|------|-----|----|----------------|-------|\n| 加载并分析 | `gdb -q ./bin` | `r2 -A ./bin` | `strace\
    \ ./bin` | `frida -f ./bin -l s.js` |\n| 函数列表 | `info functions` | `afl` | `ltrace ./bin 2>&1 \\|\
    \ grep -o \"^[a-z_]*\"` | `Module.enumerateExports()` |\n| 反汇编函数 | `disas <fn>` | `pdf @ <fn>` | —\
    \ | — |\n| 断点（地址） | `b *0x<addr>` | `db 0x<addr>` | — | `Interceptor.attach(ptr(...))` |\n| 内存查看 |\
    \ `x/16xb 0x<a>` | `px 16 @ 0x<a>` | — | `hexdump(ptr('0x<a>').readByteArray(16))` |\n| 系统调用追踪 | `catch\
    \ syscall <name>` | — | `strace -e trace=<name>` | `Stalker` |\n| 库函数追踪 | `b <func>` | `axt @ <func>`\
    \ | `ltrace -e <func>` | `Interceptor.attach` |\n| 内存 dump | `dump binary memory out.bin s e` | `wtf\
    \ out.bin sz @ addr` | — | `Memory.readByteArray` |\n| 搜索字节 | `find s,+len,bytes` | `/x <hex>` | —\
    \ | `Memory.scan` |\n| 动态库断点 | `b dlopen` | — | `ltrace -e dlopen` | `Module.load` event |\n| 进程内存图\
    \ | pwndbg `vmmap` | `dm` | `/proc/<pid>/maps` | `Process.enumerateRanges` |\n| 线程列表 | `info threads`\
    \ | — | `strace -f` | `Process.enumerateThreads` |\n| 调用栈 | `bt full` | `dbt` | — | `Thread.backtrace`\
    \ |\n\n#### pwndbg 优先命令（有插件时必用）\n\n```gdb\nvmmap                      # 内存映射全览（彩色，清晰）\ntelescope $rsp\
    \ 20          # 栈递归指针解引用（20 层）\ntelescope $rdi 8           # 查看参数指向的数据链\nhexdump $rdi 64         \
    \   # 彩色 hex dump\ncontext                    # 完整上下文（寄存器+栈+反汇编一屏显示）\nnearpc 20                  #\
    \ 当前 PC 前后 20 条指令\ngot                        # GOT 表当前内容\nplt                        # PLT 表\nchecksec\
    \                   # 安全标志汇总\nrop --grep \"pop rdi; ret\"  # ROP gadget 搜索\nheap                 \
    \      # 堆 chunk 状态\nbins                       # tcache/fastbin/unsorted 状态\nvis_heap_chunks    \
    \        # 可视化堆布局\nthreads                    # 线程列表 + 当前状态\n```\n\n#### strace 专项命令模板\n\n```bash\n\
    # 基础系统调用追踪（含时间戳）\nstrace -tt -T ./target 2>&1 | tee /tmp/strace.log\n\n# 只追踪文件相关系统调用\nstrace -e trace=file\
    \ ./target\n\n# 只追踪网络相关\nstrace -e trace=network ./target\n\n# 追踪内存操作（mmap/mprotect/brk）\nstrace -e\
    \ trace=memory ./target\n\n# 追踪信号\nstrace -e trace=signal ./target\n\n# 跟踪子进程（-f）+ 附加到 pid\nstrace\
    \ -f -p <pid>\n\n# 统计系统调用次数和耗时\nstrace -c ./target\n\n# 输出到文件（每个进程/线程独立文件）\nstrace -ff -o /tmp/strace_out\
    \ ./target\n# 生成 /tmp/strace_out.<pid> 文件\n\n# 在特定系统调用时注入失败（fault injection）\nstrace --inject=open:error=ENOENT\
    \ ./target\n\n# 解码结构体（-v 详细，-s 字符串长度）\nstrace -v -s 256 ./target\n```\n\n#### ltrace 专项命令模板\n\n```bash\n\
    # 追踪所有库函数调用\nltrace ./target\n\n# 只追踪特定函数\nltrace -e strcmp -e memcmp -e strncmp ./target\n\n# 追踪加密相关函数\n\
    ltrace -e EVP_* -e AES_* -e RSA_* -e MD5_* ./target\n\n# 附加到运行中进程\nltrace -p <pid>\n\n# 含时间戳 + 详细输出\n\
    ltrace -tt -T -n 2 ./target\n\n# 跟踪子进程\nltrace -f ./target\n\n# 统计调用次数\nltrace -c ./target\n\n# 显示库函数的完整参数（含结构体）\n\
    ltrace -b -S ./target    # -b: 抑制信号，-S: 显示系统调用\n```\n\n#### perf 专项命令模板\n\n```bash\n# 记录函数调用图（频率采样）\n\
    perf record -g -F 999 ./target\nperf report --stdio\n\n# 追踪特定事件（cache miss / branch miss）\nperf stat\
    \ -e cache-references,cache-misses,branches,branch-misses ./target\n\n# 追踪系统调用（perf trace = strace\
    \ 加强版）\nperf trace ./target\nperf trace -e 'syscalls:sys_enter_*' ./target\n\n# 动态探针（无需修改源码，类似 kprobe）\n\
    # 在函数入口处插入探针\nperf probe -x ./target --add 'target_func'\nperf record -e probe_target:target_func\
    \ -g ./target\nperf script\n\n# 火焰图生成\nperf record -F 99 -g -- ./target\nperf script | stackcollapse-perf.pl\
    \ | flamegraph.pl > flame.svg\n\n# 内核函数追踪\nsudo perf record -e 'syscalls:sys_enter_read' -ag sleep\
    \ 5\n```\n\n#### bpftrace 专项命令（内核级追踪）\n\n```bash\n# 追踪某进程所有系统调用\nsudo bpftrace -e '\n  tracepoint:syscalls:sys_enter_*\
    \ /pid == <PID>/ {\n    printf(\"%s\\n\", probe);\n  }\n'\n\n# 追踪 malloc/free（用户空间探针）\nsudo bpftrace\
    \ -e '\n  uprobe:/lib/x86_64-linux-gnu/libc.so.6:malloc {\n    printf(\"malloc(%d) pid=%d\\n\", arg0,\
    \ pid);\n  }\n  uprobe:/lib/x86_64-linux-gnu/libc.so.6:free {\n    printf(\"free(%p) pid=%d\\n\",\
    \ arg0, pid);\n  }\n'\n\n# 追踪特定函数的参数（字符串类型）\nsudo bpftrace -e '\n  uprobe:./target:strcmp {\n    printf(\"\
    strcmp(%s, %s)\\n\", str(arg0), str(arg1));\n  }\n'\n\n# 统计系统调用频率（10 秒）\nsudo bpftrace -e '\n  tracepoint:syscalls:sys_enter_*\
    \ { @[probe] = count(); }\n  interval:s:10 { print(@); clear(@); }\n'\n\n# 追踪 mprotect（检测动态解码/脱壳）\n\
    sudo bpftrace -e '\n  tracepoint:syscalls:sys_enter_mprotect /pid == <PID>/ {\n    printf(\"mprotect\
    \ addr=%lx len=%lu prot=%d\\n\", args->addr, args->len, args->prot);\n  }\n'\n```\n\n#### Valgrind\
    \ 专项\n\n```bash\n# 内存错误检测（最常用）\nvalgrind --tool=memcheck --leak-check=full --track-origins=yes \\\n\
    \  --show-reachable=yes ./target 2>&1 | tee /tmp/valgrind.log\n\n# 只报告明确泄漏（减少噪音）\nvalgrind --leak-check=full\
    \ --show-leak-kinds=definite ./target\n\n# 调用图分析（callgrind）\nvalgrind --tool=callgrind ./target\n\
    callgrind_annotate callgrind.out.<pid>\n\n# 堆分析（massif）\nvalgrind --tool=massif --pages-as-heap=yes\
    \ ./target\nms_print massif.out.<pid>\n\n# 多线程竞态检测（helgrind）\nvalgrind --tool=helgrind ./target\n\
    ```\n\n#### /proc 文件系统集成\n\n```bash\n# 实时内存映射（比 vmmap 更原始，无需 debugger）\ncat /proc/<pid>/maps\n\n#\
    \ 直接读取进程内存（需 root 或 ptrace 权限）\ndd if=/proc/<pid>/mem bs=1 skip=$((0x401000)) count=256 2>/dev/null\
    \ | xxd\n\n# 文件描述符\nls -la /proc/<pid>/fd\n\n# 命令行参数 + 环境变量\ncat /proc/<pid>/cmdline | tr '\\0' '\
    \ '\ncat /proc/<pid>/environ | tr '\\0' '\\n'\n\n# 信号状态（哪些信号被屏蔽/挂起）\ncat /proc/<pid>/status | grep\
    \ -E \"Sig|Threads|VmRSS\"\n\n# 打开的文件 + 网络连接\ncat /proc/<pid>/net/tcp\ncat /proc/<pid>/net/tcp6\n\
    ```\n\n#### core dump 分析工作流\n\n```bash\n# 1. 开启 core dump（当前 shell）\nulimit -c unlimited\necho '/tmp/core.%e.%p'\
    \ | sudo tee /proc/sys/kernel/core_pattern\n\n# 2. 运行触发崩溃的程序（或复现已知崩溃）\n./target <crashing_input> \
    \ # 生成 /tmp/core.target.<pid>\n\n# 3. GDB 加载 core\ngdb ./target /tmp/core.target.<pid>\n(gdb) bt full\
    \              # 查看崩溃时的完整调用栈\n(gdb) info registers       # 崩溃时寄存器状态\n(gdb) x/32xb $rsp          #\
    \ 崩溃时栈内容\n(gdb) info frame           # 当前帧信息\n(gdb) x/i $rip             # 崩溃指令\n\n# 4. eu-stack（elfutils，更快的调用栈）\n\
    eu-stack -p <pid>         # 在线 backtrace\neu-stack -c core.<pid>    # 从 core 分析\n\n# 5. 自动化 core 分析脚本\n\
    gdb -batch -ex \"bt full\" -ex \"info registers\" -ex \"x/32xb \\$rsp\" \\\n    -ex quit ./target\
    \ /tmp/core.target.<pid> 2>/dev/null\n```\n\n#### LD_PRELOAD 动态库注入\n\n```bash\n# 创建 hook 库：拦截 strcmp（密码验证绕过示例）\n\
    cat > /tmp/hook_strcmp.c << 'EOF'\n#define _GNU_SOURCE\n#include <dlfcn.h>\n#include <stdio.h>\n#include\
    \ <string.h>\n\nint strcmp(const char *s1, const char *s2) {\n    typedef int (*orig_strcmp_t)(const\
    \ char*, const char*);\n    orig_strcmp_t orig = dlsym(RTLD_NEXT, \"strcmp\");\n    int ret = orig(s1,\
    \ s2);\n    fprintf(stderr, \"[strcmp] \\\"%s\\\" vs \\\"%s\\\" → %d\\n\", s1, s2, ret);\n    return\
    \ ret;\n}\nEOF\ngcc -shared -fPIC -o /tmp/hook_strcmp.so /tmp/hook_strcmp.c -ldl\n\n# 注入并运行\nLD_PRELOAD=/tmp/hook_strcmp.so\
    \ ./target <args>\n\n# 追踪 malloc/free\ncat > /tmp/hook_alloc.c << 'EOF'\n#define _GNU_SOURCE\n#include\
    \ <dlfcn.h>\n#include <stdio.h>\n#include <stdlib.h>\nvoid* malloc(size_t sz) {\n    typedef void*\
    \ (*fn_t)(size_t);\n    fn_t orig = dlsym(RTLD_NEXT, \"malloc\");\n    void* ret = orig(sz);\n   \
    \ fprintf(stderr, \"[malloc] size=%zu → %p\\n\", sz, ret);\n    return ret;\n}\nvoid free(void* p)\
    \ {\n    fprintf(stderr, \"[free] %p\\n\", p);\n    typedef void (*fn_t)(void*);\n    fn_t orig =\
    \ dlsym(RTLD_NEXT, \"free\");\n    orig(p);\n}\nEOF\ngcc -shared -fPIC -o /tmp/hook_alloc.so /tmp/hook_alloc.c\
    \ -ldl\nLD_PRELOAD=/tmp/hook_alloc.so ./target\n```\n\n#### GDB Python 自动化脚本\n\n```python\n# gdb_auto_trace.py\
    \ — source 到 GDB 中\n# 追踪所有已知函数，记录调用顺序和参数\nimport gdb, json\n\ncall_log = []\nbp_map   = {}\n\nclass\
    \ TraceBreakpoint(gdb.Breakpoint):\n    def __init__(self, name, addr=None):\n        if addr:\n \
    \           super().__init__(f\"*{hex(addr)}\", internal=True)\n        else:\n            super().__init__(name,\
    \ internal=True)\n        self.func_name = name\n        self.silent = True\n\n    def stop(self):\n\
    \        frame  = gdb.selected_frame()\n        rdi = int(gdb.parse_and_eval(\"$rdi\")) if gdb.parse_and_eval\
    \ else 0\n        rsi = int(gdb.parse_and_eval(\"$rsi\")) if gdb.parse_and_eval else 0\n        entry\
    \ = {\"fn\": self.func_name, \"rdi\": hex(rdi), \"rsi\": hex(rsi)}\n        call_log.append(entry)\n\
    \        # 每 50 次调用打印一次摘要\n        if len(call_log) % 50 == 0:\n            print(f\"[trace] {len(call_log)}\
    \ calls logged so far\")\n        return False  # 不暂停\n\ndef install_traces():\n    gdb.execute(\"\
    set pagination off\")\n    # 对所有已知符号设置追踪断点\n    raw = gdb.execute(\"info functions\", to_string=True)\n\
    \    for line in raw.split('\\n'):\n        if '0x' in line:\n            parts = line.strip().split()\n\
    \            if len(parts) >= 2:\n                try:\n                    addr = int(parts[0], 16)\n\
    \                    name = parts[-1].rstrip(';')\n                    bp = TraceBreakpoint(name,\
    \ addr)\n                    bp_map[addr] = bp\n                except:\n                    pass\n\
    \    print(f\"[trace] Installed {len(bp_map)} trace breakpoints\")\n\ndef save_log():\n    with open('/tmp/gdb_call_trace.json',\
    \ 'w') as f:\n        json.dump(call_log, f, indent=2)\n    print(f\"[trace] Saved {len(call_log)}\
    \ calls to /tmp/gdb_call_trace.json\")\n\n# 注册退出时保存\nclass ExitBreak(gdb.Breakpoint):\n    def __init__(self):\n\
    \        super().__init__(\"exit\", internal=True)\n        self.silent = True\n    def stop(self):\n\
    \        save_log()\n        return False\n\ninstall_traces()\nExitBreak()\ngdb.execute(\"run\")\n\
    ```\n\n### T.4 — 输出解析与分析路由\n\n```\n工具输出类型路由：\n strace 日志      → 提取 open/read/write/mmap 系统调用序列\n \
    \                  → 识别密钥文件读取 / 配置文件路径 / 网络连接\n ltrace 日志      → 提取库函数调用序列\n                   → 识别\
    \ strcmp/memcmp（密码验证）/ EVP/AES（加密）\n perf report      → 找出热点函数（占用 CPU >5% 的函数是分析重点）\n bpftrace 输出\
    \    → 低噪音内核级事件，定位 mprotect/mmap 异常行为\n Valgrind 报告    → 内存错误定位（无效读写/泄漏 → 标注到对应代码位置）\n core dump 分析\
    \   → 崩溃点寄存器状态 → 结合反汇编定位根因\n GDB 断点输出     → 寄存器快照 → 标注指令执行上下文\n Frida 追踪日志   → 函数参数/返回值 → 辅助算法识别\n\
    ```\n\n**动态上下文标注格式（统一）：**\n```\n[strace @ open] open(\"/etc/passwd\", O_RDONLY) = 3\n    分析     :\
    \ 程序读取 /etc/passwd，疑似权限检查或用户验证\n    关联指令 : 0x401234 call open@PLT → 返回 fd=3\n    下一步   : ltrace 追踪后续的\
    \ read/strcmp，确认验证逻辑\n\n[GDB @ 0x401260] mov rax, [rbp-0x8]\n    寄存器   : rbp=0x7ffd1230, [rbp-0x8]=0x5\
    \ (十进制)\n    类型推断 : 局部 int，值=5，疑似循环计数器\n    下一步   : ni → 观察后续 cmp 指令\n\n[ltrace] strcmp(\"admin\"\
    , \"root\") = -1\n    分析    : 硬编码字符串比较，疑似身份验证\n    建议    : LD_PRELOAD hook 此 strcmp，伪造返回 0\n```\n\n\
    ### T.5 — Linux 调试错误诊断与自动修正\n\n| 错误 | 原因 | 处理方案 |\n|------|------|---------|\n| `ptrace: Operation\
    \ not permitted` | ptrace_scope=1 | `echo 0 \\| sudo tee /proc/sys/kernel/yama/ptrace_scope` 或用 `-f`\
    \ 启动 |\n| `(no debugging symbols found)` | stripped | r2 `aaa`，GDB `b *0x<addr>`，angr CFGFast |\n\
    | `Cannot access memory at 0x<addr>` | PIE + ASLR | pwndbg `vmmap` 获取基址后重算，或 `set disable-randomization\
    \ on` |\n| strace `EPERM` | 权限不足 | `sudo strace` 或 `sudo setcap cap_sys_ptrace+ep /usr/bin/strace`\
    \ |\n| perf `Permission denied` | perf_paranoid>0 | `echo -1 \\| sudo tee /proc/sys/kernel/perf_event_paranoid`\
    \ |\n| Valgrind `command not found` | 未安装 | `sudo apt install valgrind`，ARM64 改用 `asan` |\n| `core\
    \ file may not match` | 二进制不匹配 | 确认 core 对应的二进制路径，用 `file core.<pid>` 检查 |\n| bpftrace `ERROR: No\
    \ BTF` | 内核版本旧 | 降级用 `perf trace` 替代，或升级内核 |\n| r2 分析超时 | 大文件 | `e anal.timeout=30`，改用 `aa` 或 `af\
    \ @ <addr>` 单函数 |\n| angr 路径爆炸 | 循环太多 | `LoopSeer(bound=5)` 或手动 `avoid` 地址 |\n\n**反调试自动 patch（Linux\
    \ 专项）：**\n```gdb\ncatch syscall ptrace\ncommands\n  set $rax = 0\n  continue\nend\nhandle SIGTRAP\
    \ nostop noprint pass\n\n# /proc/self/status TracerPid 绕过（patch 读取结果）\nb fgets\ncommands\n  silent\n\
    \  set $rax = 0   # 伪造读取失败\n  return 0\nend\n```\n\n### T.6 — 工具会话状态追踪\n\n```\n\U0001F527 工具会话状态\n\
