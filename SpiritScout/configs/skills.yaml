skills:
- skill_id: api-security
  domain: web
  description: API 安全测试：REST / GraphQL / WebSocket / SOAP 全协议，10 阶段方法论，从发现面梳理到 CI/CD 集成。
  body: "# API 安全测试\n\n> 覆盖 REST / GraphQL / WebSocket / SOAP 全协议\n> 10 阶段方法论，从发现到 CI/CD 集成\n\n## 适用场景\n\
    \n- REST API 安全测试（OpenAPI/Swagger 驱动或盲测）\n- GraphQL 安全审计（内省、批查询、别名过载）\n- WebSocket 安全测试\n- JWT / OAuth\
    \ 2.0 认证测试\n- BOLA/IDOR/BFLA 授权漏洞检测\n- API 限速绕过与 DoS 测试\n\n## 10 阶段测试流程\n\n### Phase 1: API 发现与侦察\n\
    \n```text\n主动发现：\n□ Vespasian: 无头浏览器爬取 → 自动生成 OpenAPI 3.0 / GraphQL SDL 规范\n□ Entropy --discover:\
    \ 从 robots.txt + JS 文件提取端点\n□ Kiterunner / ffuf: 爆破未文档化的端点路径\n□ 检查常见路径: /swagger.json, /openapi.json,\
    \ /graphql, /api-docs\n\nGraphQL 内省（三级尝试）：\n  1. 标准内省查询\n  2. 精简查询（绕过 WAF 全量封禁）\n  3. 仅查 __schema\
    \ { types { name } }（最小探测）\n```\n\n### Phase 2: 认证测试\n\n```text\nJWT 分析（jwt_tool / Burp）：\n□ alg:none\
    \ 攻击: 修改头部为 \"alg\":\"none\"，清空签名\n□ 密钥混淆: RS256 公钥 → HS256 对称密钥\n□ 弱 HMAC 密钥爆破: jwt_tool -C -d wordlist.txt\n\
    □ 过期/声明篡改: 修改 exp/iat/sub/role 声明\n□ kid 注入: ../../etc/passwd → HMAC 签名绕过\n\nOAuth 2.0：\n□ redirect_uri\
    \ 操控 → 授权码泄漏\n□ CSRF via state 参数缺失\n□ Token 在 Referer 头泄漏\n□ PKCE 缺失检测\n\nGraphQL 认证：\n□ mutation\
    \ 通过 GET 请求绕过认证（CSRF）\n□ 批查询认证绕过\n```\n\n### Phase 3: 授权测试（BOLA/IDOR/BFLA）\n\n```text\nBOLA（对象级授权绕过）：\n\
    □ 遍历数字 ID: /user/1 → /user/2 → /user/3\n□ 遍历 UUID\n□ 遍历用户名/邮箱\n□ Burp Autorize: 双会话重放对比\n\nBFLA（功能级授权绕过）：\n\
    □ 普通用户执行管理员 API\n□ HTTP 方法切换: GET → PUT → PATCH → DELETE\n□ API 版本降级: /v2/admin → /v1/admin\n□ 批量操作注入:\
    \ {\"users\": [1,2,3]} → {\"users\": [1,2,3,admin_id]}\n\n工具: Burp Autorize, AuthMatrix, Entropy (malicious_insider\
    \ persona)\n```\n\n### Phase 4: GraphQL 专项\n\n```text\n内省泄漏 → 信息暴露检测\n别名过载 → 100+ 别名 DoS\n批查询 → 10+\
    \ 同时查询 DoS\n字段重复 → __typename × 500\n指令过载 → 递归 @skip/@include\n循环查询 → 深度嵌套内省递归\n字段建议 → 错误消息信息泄漏\n\
    GraphiQL/Playground 暴露 → IDE 公开风险\nGET 突变 → CSRF 风险\n追踪/调试模式 → 元数据泄漏\n\n工具: FireTail, Escape DAST,\
    \ api.sh (Phases 1-3)\n```\n\n### Phase 5: REST 输入验证\n\n```text\n□ HTTP 方法切换: GET→POST→PUT→DELETE→OPTIONS→PATCH\n\
    □ Content-Type 篡改: JSON→XML→multipart\n□ NoSQL 注入: {\"username\": {\"$gt\": \"\"}}\n□ SSRF via URL\
    \ 参数: webhook URL/头像 URL/导入 URL\n□ XXE in XML 端点\n□ 参数污染: /api?role=user&role=admin\n□ 批量赋值: 向请求体添加\
    \ is_admin: true\n```\n\n### Phase 6: 业务逻辑与差分测试\n\n```text\n□ Entropy compare: diff v1 vs v2 API →\
    \ 状态码变化/字段删除/延迟回归\n□ 多角色工作流测试: admin/user/readonly 权限矩阵\n□ 优惠券/积分/价格操控\n□ 竞态条件: 并发请求测试 TOCTOU\n```\n\
    \n### Phase 7: WebSocket 测试\n\n```text\n□ 端点发现\n□ 消息注入（注入 payload、原型污染）\n□ 超大消息处理\n□ 类型混淆\n□ 跨站点 WebSocket\
    \ 劫持（CSWH）\n```\n\n### Phase 8: 限速与 DoS\n\n```text\n□ 限速绕过 via 头部: X-Forwarded-For, X-Real-IP\n□ 路径变体:\
    \ /api/ → /api → /Api/ → /API/\n□ Slowloris 低带宽耗尽\n□ GraphQL 批查询深度嵌套 DoS\n□ IP 轮换测试（ProxyCat 代理池）\n\
    ```\n\n### Phase 9: 数据暴露\n\n```text\n□ 响应过度暴露: 对比 API 返回 vs UI 展示\n□ 分页枚举: ?page=1&limit=10000\n□\
    \ 错误消息信息泄漏: 堆栈跟踪/内部路径/SQL 错误\n□ GraphQL 嵌套遍历访问越权数据\n□ OpenAPI 规范暴露敏感端点\n```\n\n### Phase 10: CI/CD\
    \ 集成\n\n```text\n□ Entropy --ci --watch: spec 变更时自动重跑\n□ Escape DAST: 按严重度阈值自动阻断构建\n□ 发现持久化为回归测试\n\
    □ StackHawk（开发者优先、ZAP 内核）\n```\n\n## 工具链\n\n| 工具 | 用途 | 获取 |\n|------|------|------|\n| Vespasian\
    \ | 流量 → OpenAPI/GraphQL 规范 | GitHub: praetorian-inc/vespasian |\n| Entropy | LLM 生成攻击场景，5 personas\
    \ | GitHub: arjinexe/entropy-chaos |\n| Escape DAST | 业务逻辑安全测试 | escape.tech |\n| api.sh | 8 阶段全协议攻击管道\
    \ | GitHub: Sharon-Needles/api |\n| FireTail | GraphQL 12 专项测试 | firetail.ai |\n| jwt_tool | JWT 全面测试\
    \ | GitHub: ticarpi/jwt_tool |\n| Burp Autorize | 双会话授权对比 | Burp BApp Store |\n\n## 参考\n\n- `references/rest-graphql-testing.md`\
    \ — REST + GraphQL 深度测试\n- `references/jwt-oauth-testing.md` — JWT + OAuth 安全测试"
  source: api-security
  path: api-security/SKILL.md
- skill_id: apk-reverse
  domain: mobile
  description: 在 CLI 环境下做 Android APK 逆向时使用。适用于 APK 解包、Java 反编译、smali 修改、重打包、Frida 动态 Hook，以及按需切换到 so/native
    分析。优先使用本机已安装的 jadx、apktool、frida、adb、ida-reverse、radare2。
  body: "# APK 逆向 CLI 作业规范\n\n## 适用范围\n\n当任务属于以下场景时优先使用本 skill：\n\n- 分析 APK 的 Java 业务逻辑\n- 定位登录、签名、风控、证书校验、root\
    \ 检测\n- 查看与修改 `AndroidManifest.xml`\n- 查看与修改 smali\n- 重打包 APK\n- 用 Frida 做 Java/native 动态 Hook\n-\
    \ APK 内含 `.so` 时切到 native 分析\n\n## 当前机器已验证可用的 CLI 工具\n\n- `jadx` `1.5.5`\n- `apktool` `3.0.2`\n- `frida-ps`\
    \ `17.9.6`\n- `adb`\n- `java`\n\n## 优先使用脚本的场景\n\n以下流程高频且参数容易出错，优先用 skill 自带脚本：\n\n- 一次性完成 `jadx +\
    \ apktool` 落盘并产出摘要：`scripts/decode.ps1`\n- Frida 设备检查、进程列举、spawn/attach 注入：`scripts/frida-run.ps1`\n\
    - 重建、对齐、签名、安装 APK：`scripts/rebuild-sign-install.ps1`\n- 快速抽取 Manifest 关键组件与权限：`scripts/manifest-summary.ps1`\n\
    \n以下一行命令保持直接调用，不单独封装：\n\n- `adb devices`\n- `adb logcat`\n- `frida-ps -U`\n- `jadx --version`\n- `apktool\
    \ --version`\n\n## 自带脚本\n\n### `scripts/decode.ps1`\n\n用途：\n\n- 统一跑 `jadx` 和 `apktool`\n- 默认在原 APK\
    \ 同目录创建任务输出目录\n- 输出 `package`、`java_files`、`smali_dirs`、`so_files` 等摘要\n- 兼容 `jadx` 部分反编译错误但仍然有可用产物的情况\n\
    \n示例：\n\n```powershell\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\decode.ps1\" -ApkPath \"\
    D:\\DOWNLOAD\\app.apk\" -Clean\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\decode.ps1\" -ApkPath\
    \ \"D:\\DOWNLOAD\\app.apk\" -Name demo -SkipJadx\n```\n\n### `scripts/frida-run.ps1`\n\n用途：\n\n- 统一\
    \ Frida 的设备、进程、spawn/attach 入口\n- 避免手写参数时混淆 `-f`、`-n`、`-U`\n\n示例：\n\n```powershell\npwsh -File \"\
    <skill-root>\\apk-reverse\\scripts\\frida-run.ps1\" -ListDevices\npwsh -File \"<skill-root>\\apk-reverse\\\
    scripts\\frida-run.ps1\" -Usb -ListProcesses\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\frida-run.ps1\"\
    \ -Usb -Spawn -Package com.example.app -ScriptPath \"D:\\hooks\\test.js\"\n```\n\n### `scripts/rebuild-sign-install.ps1`\n\
    \n用途：\n\n- `apktool b` 重建 APK\n- `zipalign` 对齐\n- `apksigner` 签名与验签\n- 可选直接 `adb install`\n\n示例：\n\
    \n```powershell\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\rebuild-sign-install.ps1\" -ProjectDir\
    \ \"C:\\work\\apktool_out\" -Clean\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\rebuild-sign-install.ps1\"\
    \ -ProjectDir \"C:\\work\\apktool_out\" -Install -Reinstall -DeviceSerial \"127.0.0.1:7555\"\n```\n\
    \n说明：\n\n- 默认生成并复用调试 keystore\n- 默认输出到 `ProjectDir` 同目录，便于和原始包、解包目录放在一起\n\n### `scripts/manifest-summary.ps1`\n\
    \n用途：\n\n- 抽取包名\n- 列权限\n- 列 activity/service/receiver/provider\n- 标出主启动 activity\n\n示例：\n\n```powershell\n\
    pwsh -File \"<skill-root>\\apk-reverse\\scripts\\manifest-summary.ps1\" -ManifestPath \"C:\\work\\\
    apktool_out\\AndroidManifest.xml\"\n```\n\n如果要分析 `.so`、`lib/arm64-v8a/*.so`、`lib/armeabi-v7a/*.so`，再结合：\n\
    \n- `ida-reverse`\n- `radare2`\n\n## 工具分工\n\n### `jadx`\n\n用于：\n\n- Java 反编译阅读\n- 包名、类名、方法名搜索\n- 先从高层逻辑理解\
    \ APK\n\n常用命令：\n\n```bash\njadx -d jadx_out app.apk\njadx --single-class com.example.LoginActivity\
    \ -d jadx_out app.apk\njadx --deobf -d jadx_out app.apk\n```\n\n### `apktool`\n\n用于：\n\n- 解包 APK\n\
    - 查看和修改 `AndroidManifest.xml`\n- 查看和修改 smali\n- 重建 APK\n\n常用命令：\n\n```bash\napktool d app.apk -o apktool_out\n\
    apktool b apktool_out -o rebuilt.apk\n```\n\n### `frida`\n\n用于：\n\n- 动态观察 Java 方法调用\n- Hook native\
    \ 导出函数\n- 绕过 root 检测、证书校验、调试检测\n\n常用命令：\n\n```bash\nfrida-ps -U\nfrida -U -f com.example.app -l hook.js\n\
    frida-trace -U -f com.example.app -j '*!*certificate*'\n```\n\n### `adb`\n\n用于：\n\n- 设备连接\n- 安装 APK\n\
    - 查看日志\n- 拉取文件\n\n常用命令：\n\n```bash\nadb devices\nadb install -r app.apk\nadb shell pm list packages\n\
    adb logcat\nadb pull /data/local/tmp/file .\n```\n\n## 推荐工作流\n\n### 1. Triage\n\n先确定 APK 大致构成，不急着改包或\
    \ Hook。\n\n建议动作：\n\n1. 用 `jadx -d jadx_out app.apk` 导出 Java 代码\n2. 用 `apktool d app.apk -o apktool_out`\
    \ 导出 smali 和资源\n3. 先看：\n   - `AndroidManifest.xml`\n   - 主 `package`\n   - `application`、`activity`、`service`、`receiver`\n\
    \   - `lib/` 目录里是否有 `.so`\n\n### 2. Java 逻辑观察\n\n优先从 `jadx_out` 读：\n\n- `MainActivity`\n- `Application`\n\
    - 登录、网络、加密、风控相关类\n- 第三方 SDK 初始化类\n\n常见关键词：\n\n- `login`\n- `sign`\n- `encrypt`\n- `cipher`\n- `token`\n\
    - `root`\n- `certificate`\n- `trust`\n- `okhttp`\n- `retrofit`\n- `webview`\n\n如果 Java 代码可读，先在这里定位业务逻辑。\n\
    \n### 3. Smali 与资源层确认\n\n当 `jadx` 结果不完整、混淆重、或需要实际 patch 时，切到 `apktool_out`：\n\n- 看 `smali*/`\n- 看\
    \ `res/values/strings.xml`\n- 看 `AndroidManifest.xml`\n\n优先 patch：\n\n- `android:exported`\n- 调试标记\n\
    - root 检测返回值\n- 登录验证逻辑\n- 证书校验分支\n\n### 4. 重建与安装\n\n修改后：\n\n```bash\napktool b apktool_out -o rebuilt.apk\n\
    ```\n\n或者直接用脚本闭环：\n\n```powershell\npwsh -File \"<skill-root>\\apk-reverse\\scripts\\rebuild-sign-install.ps1\"\
    \ -ProjectDir \"apktool_out\" -Install -Reinstall -DeviceSerial \"127.0.0.1:7555\"\n```\n\n说明：\n\n\
    - 本 skill 只保证 `apktool` 重建链路\n- 若后续需要正式安装到设备，通常还需要签名流程\n- 如果任务进入签名/对齐，补充 `apksigner` / `zipalign`\n\
    \n### 5. 动态 Hook\n\n静态分析不足时，用 Frida：\n\n- Hook 登录函数\n- Hook `OkHttp` / `Retrofit` / `WebView` 关键点\n\
    - Hook `javax.crypto`、`MessageDigest`\n- Hook root 检测函数\n- Hook SSL pinning 逻辑\n\n原则：\n\n- 先 Hook\
    \ Java 层，再看是否需要 native Hook\n- 先打印参数与返回值，再决定是否主动修改返回值\n\n建议：\n\n- 简单一次性命令直接用 `frida-*`\n- 需要稳定复用的注入流程优先走\
    \ `scripts/frida-run.ps1`\n\n### 6. Native `.so` 分流\n\n如果 APK 中包含关键 `.so`：\n\n- 用 `apktool` 或 `jadx`\
    \ 找到 `lib/**/*.so`\n- 若只是导出符号、字符串、快速 triage，可用 `radare2`\n- 若要长期深入分析、反编译、改名、类型恢复，用 `ida-reverse`\n\
    \n遇到这些信号要尽快切 native：\n\n- Java 层只是 JNI 包装\n- 核心签名逻辑不在 Java\n- `System.loadLibrary()` 后关键逻辑消失\n- 证书校验/风控在\
    \ `.so` 中\n\n## 输出要求\n\n最终至少说明：\n\n- 入口组件与关键类\n- 关键逻辑在 Java、smali 还是 `.so`\n- 已确认的敏感点：登录、签名、root、SSL、WebView、JNI\n\
    - 如果做了 patch，说明改了什么\n- 如果做了 Hook，说明 Hook 了哪个类/方法/导出函数\n\n## 禁止事项\n\n- 不要一开始就盲目改 smali\n- 不要在没看 manifest\
    \ 和主入口前就写 Hook\n- 不要把 Java 反编译不完整直接等同于“逻辑不可分析”\n- 不要在 `.so` 明显承载核心逻辑时继续死磕 Java 层\n\n## 快速命令备忘\n\n\
    ```bash\n# 反编译 Java\njadx -d jadx_out app.apk\n\n# 解包 APK\napktool d app.apk -o apktool_out\n\n# 重建\
    \ APK\napktool b apktool_out -o rebuilt.apk\n\n# 设备与进程\nadb devices\nfrida-ps -U\n\n# 启动并注入\nfrida\
    \ -U -f com.example.app -l hook.js\n```\n\n---\n\n## 路由上下文\n\n**上游入口**: `skills/SKILL.md`（总控）、`routing.md`\n\
    **下游出口**:\n- 核心逻辑在 `.so` → `ida-reverse/` 或 `radare2/`\n- 需动态 Hook/验证 → `reverse-engineering/tools-dynamic.md`（Frida\
    \ 章节）\n- 通用逆向方法论 → `reverse-engineering/SKILL.md`\n\n**同级关联模块**: `reverse-engineering/`（.so 分析和 Frida\
    \ 进阶用法）\n\n---\n\n## 按需自举（On-Demand Bootstrap）\n\n本 skill 的入口脚本已接入统一自举系统。缺少工具时不会直接报错，而是自动尝试安装。\n\n\
    ### 自动化能力边界\n\n| 工具 | 可自动安装 | 安装方式 | 说明 |\n|------|-----------|---------|------|\n| jadx | ✓ | GitHub\
    \ Release ZIP | 自动下载解压到 `%USERPROFILE%\\Tools\\jadx\\` |\n| apktool | ✓ | GitHub Release JAR + wrapper\
    \ | 自动下载 jar 并生成 bat 到 `%USERPROFILE%\\Tools\\apktool\\` |\n| frida / frida-ps | ✓ | pip install frida-tools\
    \ | 需要 Python 已安装 |\n| adb | ✓ | winget / fallback path | 自动安装 Android Platform-Tools |\n| zipalign\
    \ | ✗ | 需手动安装 Android Build-Tools | `sdkmanager \"build-tools;35.0.0\"` |\n| apksigner | ✗ | 需手动安装\
    \ Android Build-Tools | 同上 |\n\n### 自举触发点\n\n- `scripts/decode.ps1`：缺 jadx 或 apktool 时自动调用 `bootstrap-reverse.ps1`\n\
    - `scripts/rebuild-sign-install.ps1`：缺 adb 或 apktool 时自动调用 bootstrap\n- `scripts/frida-run.ps1`：当前仍为手动检查（frida\
    \ 通常已通过 pip 安装）\n\n### 自举失败时\n\n如果自动安装失败，脚本会抛出明确错误并附带手动安装链接。常见原因：\n- 网络不通（GitHub API / PyPI 不可达）\n\
    - winget 不可用（Windows 版本过低）\n- Java 未安装（apktool 依赖 JDK）"
  source: apk-reverse
  path: apk-reverse/SKILL.md
- skill_id: ash12-elf-complete-flow
  domain: reverse
  description: Use when elf-local-auth-patcher encounters Ash-12-like Android AArch64 ELF scripts disguised
    as .sh, appended encrypted payload/trailer loaders, AEDEVPK1 containers, RC4 payload recovery, outer
    local-auth gate patching, memfd execution chains, or cases where static patch verification must be
    separated from fresh real-device evidence.
  body: "# Ash-12 类 ELF 完整处理分支\n\n本子 skill 是 `elf-local-auth-patcher` 的按需参考分支。仅在遇到 Ash-12 类样本时加载；它不替代主\
    \ skill 的硬约束，只补充“脚本名像 `.sh`、实际是 Android ELF loader、尾部附加加密 payload”的完整处理路线。\n\n## 适用信号\n\n同时出现以下多项时使用本分支：\n\
    \n- 文件扩展名像 `.sh`，但 `file/readelf/elf-info` 显示为 Android AArch64 ELF64 ET_DYN/PIE。\n- 外层 ELF 通过 `/proc/self/exe`\
    \ 自读，尾部存在固定 magic、payload offset、payload size、重复 offset、reserved 字段。\n- 外层包含远程卡密/授权字段，例如 `kami`、`markcode`、`sign`、`code`、`time`、`vip`，以及成功/失败提示。\n\
    - 成功路径会写入 `/data/local/tmp/card`，再解密 payload，并通过 `memfd_create`、`/proc/self/fd/%d` 或落地临时文件执行 payload。\n\
    - 内层 payload 字符串出现 `/proc/%d/mem`、`libUE4.so`、`.ko`、`/dev/*`、`ioctl`、`/dev/uinput` 等后续功能链线索。\n\n##\
    \ 证据边界\n\n只把当前轮实际读到的文件、反汇编、hash、stdout/logcat 作为事实。不要把过往真机连接调试后的记忆当作结论复用；动态验证必须重新采集 stdout、stderr、return\
    \ code、logcat、设备文件状态。若没有新鲜动态证据，只能给出“静态 VERIFY_OK，动态待验证”。\n\n## 阶段流程\n\n### 1. 基线盘点\n\n产物：`*_elf_info.json`、原始\
    \ SHA256、文件大小、entry、program headers、section 概况。\n\n通过条件：\n\n- `Get-FileHash` 或等价 hash 已记录。\n- `file/readelf/xg_elf_tool.py\
    \ elf-info` 确认架构与 entry。\n- 原文件只读分析，不覆盖。\n\n### 2. trailer 与 payload 范围恢复\n\n产物：`*_payload_extract_report.json`。\n\
    \n处理要点：\n\n- 从文件尾部解析容器 trailer；Ash-12 样本的已验证结构为 0x28 字节：`magic`、`payload_offset`、`payload_size`、`duplicate_offset`、`reserved`。\n\
    - 验证 `magic`、重复 offset、reserved、payload_end、container_end。\n- payload 区间与 trailer 是不可破坏区域；patch 默认只允许发生在外层\
    \ loader 代码段。\n\n通过条件：\n\n- `payload_offset + payload_size == trailer_offset`。\n- `payload_range_inside_container\
    \ == true`。\n- 后续 patch 前后 payload+trailer 字节完全一致。\n\n### 3. 外层字符串与 payload 解密复现\n\n产物：`*_decoded_strings.json`、`*_payload_decrypted.elf`、解密脚本。\n\
    \n处理要点：\n\n- 优先定位外层字符串解密函数、索引表、record 表、cipher blob。\n- 复现 payload key 派生和 RC4 KSA/PRGA，而不是只从运行态 dump。\n\
    - 解密后立即验证 ELF magic、架构、大小与 SHA256。\n\n通过条件：\n\n- 解密 payload 头部为 `7f454c46`。\n- 解密 payload 大小等于 trailer\
    \ 中的 `payload_size`。\n- patch 后重新提取 payload，SHA256 必须与 patch 前解密 payload 一致。\n\n### 4. 外层授权链定位\n\n\
    产物：授权函数与 main/dispatch 反汇编片段、xref 记录。\n\n处理要点：\n\n- 从成功/失败提示、`/data/local/tmp/card`、`/proc/self/exe`、`memfd`\
    \ 字符串反向找 main/dispatch。\n- 从 `kami/markcode/sign/code/time/vip`、HTTP host/path、MAC 地址读取路径定位远程授权函数。\n\
    - patch 点优先选择“远程授权返回后、失败分支之前”的最小门控点，保留 argv/card 写入与 payload 执行链。\n\n通过条件：\n\n- patch 点有上游授权调用、下游\
    \ success init/payload loader 证据。\n- 不以“跳到程序退出/return”为成功路径。\n\n### 5. 等长 patch\n\n产物：patch 脚本、patch\
    \ report、patch 后 ELF。\n\nAsh-12 已验证锚点（只作模式参考，复用前必须重新校验 expected bytes）：\n\n```text\nVA 0x2e10 / FileOff\
    \ 0x1e10: fe060094 -> 1f2003d5  ; bl auth -> nop\nVA 0x2e14 / FileOff 0x1e14: e0200035 -> 1f2003d5\
    \  ; cbnz fail -> nop\nVA 0x2e24 / FileOff 0x1e24: 21220054 -> 1f2003d5  ; b.ne fail -> nop\n```\n\
    \nAsh-12 已验证文件锚点：\n\n```text\noriginal SHA256: 3c57fbef8c2a8ac81efc398097370272f516003e87c5201e61785b42e2a75e69\n\
    patched  SHA256: 4dac8f79e1ac3e69a72dbccabcea6581ec886ca4a6a21e6bbf601c6a6426ec65\npayload  SHA256:\
    \ 290a82ee1df22c1d06e6e2d9df4404df8a878df137af814a3b449019075e7f86\ntrailer magic: AEDEVPK1\npayload_offset:\
    \ 0x63b8\npayload_size: 0xb34240\n```\n\n通过条件：\n\n- expected bytes 完全匹配。\n- patch 长度等长。\n- 新文件输出，绝不覆盖原文件。\n\
    - ELF header、program headers、entry、file size、payload、trailer 全部 unchanged。\n- patch 点反汇编显示为预期指令，例如\
    \ `nop`。\n\n### 6. patch 后重提取验证\n\n产物：`*_patched_payload_extract_report.json`、patch 后反汇编片段。\n\n通过条件：\n\
    \n- patch 后 trailer 仍通过 magic/range/size 检查。\n- patch 后解密 payload SHA256 与 patch 前一致。\n- patch 后 auth\
    \ gate 片段与预期一致。\n\n### 7. 真机动态验证（只使用新鲜证据）\n\n产物：独立 `device_verify_<target>_<timestamp>/` 目录，至少包含设备基线、push\
    \ hash、运行脚本、stdout、stderr、RC、logcat、pre/post state。\n\n处理要点：\n\n- PowerShell/adb 复杂命令优先写成 `.sh` 推送到设备执行，避免\
    \ inline 引号误解析。\n- 运行前记录设备型号、ABI、Android 版本、root context、SELinux、包路径、appops。\n- push 后比较本地/远端 SHA256，再\
    \ `chmod 700`。\n- 执行时显式传入测试 card 参数，捕获 stdout/stderr/RC。\n- 若看到“验证成功”并进入 payload 初始化，只能说明外层授权 patch\
    \ 与 loader 链已经走通；后续 target PID、UE4、driver、proc-mem、uinput 失败必须单独归类，不得反向否定外层授权 patch。\n\n通过条件：\n\n\
    - stdout/stderr/RC/logcat/post-state 文件实际存在。\n- 结论逐条绑定到具体输出文件或设备状态。\n- 没有真机证据时保持 `[DYNAMIC_UNVERIFIED]`。\n\
    \n## 回滚条件\n\n立即停止并回滚到对应阶段：\n\n- expected bytes 不匹配。\n- VA 无法映射到 PT_LOAD。\n- patch 导致 header/phdr/entry/file\
    \ size 变化。\n- payload/trailer 任一字节变化。\n- patch 后无法重提取相同 payload。\n- 动态运行 SIGSEGV 且无法证明发生在后续功能链。\n\
    - 只有 UI/前端成功，没有 ELF stdout/logcat/payload 证据。\n\n## 交付格式补充\n\n在主 skill 的交付格式基础上，Ash-12 类样本额外列出：\n\n\
    ```text\nContainer:\n  magic / payload_offset / payload_size / trailer_offset / checks\n\nPayload:\n\
    \  encrypted SHA256 / decrypted SHA256 / decrypted ELF info\n\nOuter auth gate:\n  auth function /\
    \ main dispatch / patch VA+FileOff+old+new / disasm\n\nBoundary:\n  STATIC_VERIFY_OK or STATIC_VERIFY_FAIL\n\
    \  DYNAMIC_VERIFY_OK / DYNAMIC_VERIFY_FAIL / DYNAMIC_UNVERIFIED\n  downstream chain status: target-pid\
    \ / libUE4 / driver / proc-mem / input\n```"
