    \ `CryptoJS.AES`, `aes-encrypt` | 参数加密/响应解密 | → references/web-re.md |\n| sm-crypto | `sm2`, `sm4`,\
    \ `gmCrypt` | 国密算法 | → references/web-re.md |\n| forge | `forge.cipher`, `forge.pki` | RSA/AES/证书\
    \ | → references/web-re.md |\n| Web Crypto | `SubtleCrypto`, `crypto.subtle` | 浏览器原生加密 | → references/web-re.md\
    \ |\n| WASM 加密 | `wasm`, `Module._malloc` | 高强度混淆 | → references/web-re.md |\n\n**签名机制 4 种模式：**\n\
    ```\n模式 1: sign = MD5(key1=val1&key2=val2&secret=xxx)     # 参数排序 + 密钥\n模式 2: sign = HMAC-SHA256(secret,\
    \ timestamp+nonce+body) # HMAC\n模式 3: sign = SHA256(ts + nonce + sorted_params + secret) # 时间戳+随机数\n\
    模式 4: sign = Base64(HMAC-SHA256(secret, method+path+body_hash)) # 请求体哈希\n```\n\n> **详细加密逆向**（JS Hook\
    \ 代码、WASM 分析、JS 反混淆、密钥提取技巧）→ **references/web-re.md**\n\n### 1.6 数据流文档化\n\n**端点文档模板：**\n```markdown\n\
    ### POST /api/v1/login\n- 用途：用户登录\n- 参数：{ username: string, password: string }\n- 认证：无\n- 响应：{ code:\
    \ 0, data: { token: string, expires_in: int } }\n- 注意：密码经 RSA 加密（见 login.js 中的 encrypt 函数）\n```\n\n\
    **Python 复现模板：**\n```python\nimport requests\n\nclass SiteClient:\n    def __init__(self, base_url):\n\
    \        self.base_url = base_url\n        self.session = requests.Session()\n        self.session.headers.update({\n\
    \            'User-Agent': 'Mozilla/5.0 (Windows NT 10.0; Win64; x64) ...',\n            'Accept':\
    \ 'application/json',\n        })\n\n    def login(self, username, password):\n        resp = self.session.post(f'{self.base_url}/api/login',\
    \ json={\n            'username': username, 'password': password,\n        })\n        data = resp.json()\n\
    \        if data.get('code') == 0:\n            self.session.headers['Authorization'] = f\"Bearer\
    \ {data['data']['token']}\"\n        return data\n\n    def get_users(self, page=1, size=20):\n  \
    \      return self.session.get(f'{self.base_url}/api/users',\n            params={'page': page, 'size':\
    \ size}).json()\n```\n\n> **详细安全测试**（认证测试、越权检测、漏洞报告模板）→ **references/web-re.md**\n## 第二部分：二进制逆向\n\n\
