- skill_id: reverse-skills-index
  domain: reverse
  description: 逆向 / 渗透技能总目录：汇总本目录下各独立模块（汇编分析、IDA、radare2、ELF 补丁、脱壳、外挂逆向、渗透工具链），按任务路由到对应子 skill。
  body: "# 影安脱修\n\nUse an evidence-driven recovery pipeline. Treat runtime DEX images, manifest resolution,\
    \ and device logs as facts; do not generalize a class name, DEX offset, or native branch from one\
    \ sample.\n\n## Scope And Outputs\n\nRecover the normal APK class path, preserve resources and product\
    \ behavior, and emit:\n\n```text\nreports/scan.json\nreports/dex-validation.json\nreports/graph.json\n\
    reports/recovery-plan.json\ndist/<name>-rehydrated.apk\nreports/build.json\nreports/verify/verification.json\n\
    ```\n\nKeep login, entitlement, licensing, network, and backend behavior unchanged. Configure a product-wide\
    \ no-card or free release in source code and the service, rather than changing those paths in a recovered\
    \ APK.\n\n## Required Tools\n\n- Python 3.10+\n- Android platform-tools: `adb`\n- Android build-tools:\
    \ `zipalign`, `apksigner`, optionally `aapt2` and `dexdump`\n- JDK `keytool` for a release keystore\n\
    - Frida host/device versions that match for runtime capture: `pip install frida frida-tools`\n- Root\
    \ only for the optional `/proc/<pid>/mem` capture fallback\n- apktool plus smali/baksmali for a proved\
    \ lifecycle wrapper repair\n\n## Recovery Workflow\n\n### 1. Freeze The Baseline\n\nHash the original\
    \ APK. Capture its package, version, launcher behavior, hidden routes, relevant UI states, and original-process\
    \ logcat before changing anything. Keep every build in a separate directory.\n\n### 2. Classify The\
    \ Shell\n\nRun the static inventory first:\n\n```powershell\npython <skill-dir>\\scripts\\scan_yingan_apk.py\
    \ `\n  --apk target.apk --out reports\\scan --extract-dir work\\embedded\n```\n\nTreat `v.m.p`, `abcd655xx`,\
    \ `abcdstr`, a tiny `classes.dex`, `libabcd.so`, `lib*_shellservice_dex.so`, `assets/lib*Protect*`,\
    \ and `abcd/` as evidence, not as a hard-coded patch recipe. Read [family-signatures.md](references/family-signatures.md)\
    \ when the score is inconclusive.\n\nFor the proven RikkaHub-style recovery lessons that motivated\
    \ this pipeline, read [rikkahub-recovery-lessons.md](references/rikkahub-recovery-lessons.md). Do\
    \ not reuse its class names or binary layout as a rule.\n\n### 3. Recover Runtime DEX Images\n\nUse\
    \ the unmodified APK and preserve the discovery metadata. Prefer Frida:\n\n```powershell\npython <skill-dir>\\\
    scripts\\capture_runtime_dex.py `\n  --package com.example.app --spawn --seconds 25 --output work\\\
    capture-frida\n```\n\nUse the rooted fallback only when Frida cannot attach:\n\n```powershell\npython\
    \ <skill-dir>\\scripts\\capture_proc_mem.py `\n  --serial <device-id> --pid <pid> --output work\\\
    capture-proc\n```\n\nCapture again after each route that lazily opens a hidden inner app. Do not assume\
    \ a static DEX inside a native ZIP is the complete runtime set.\n\n### 4. Validate Before Reassembly\n\
    \nKeep the chosen DEX ordering explicit. Validate header size, file size, SHA-1, Adler-32, map bounds,\
    \ class definitions, and duplicate classes:\n\n```powershell\npython <skill-dir>\\scripts\\validate_dex_set.py\
    \ `\n  --capture-json work\\capture-frida\\capture.json --out reports\\dex-validation\n```\n\nResolve\
    \ unequal duplicate class definitions before planning. Exact duplicate images are reporting noise;\
    \ distinct definitions require a loader-order decision supported by runtime evidence.\n\n### 5. Recover\
    \ The Component Graph\n\nMap manifest Application/components against the recovered DEX set:\n\n```powershell\n\
    python <skill-dir>\\scripts\\inspect_runtime_graph.py `\n  --apk target.apk --validation reports\\\
    dex-validation\\dex-validation.json `\n  --out reports\\graph\n```\n\nUse `application_candidates`,\
    \ unresolved manifest components, and wrapper/core pairs as leads. Confirm the real Application and\
    \ the expected route with the original process; do not select an Application merely because its name\
    \ looks plausible.\n\n### 6. Make A Declarative Plan\n\nCreate the plan that is the only input allowed\
    \ to modify the APK:\n\n```powershell\npython <skill-dir>\\scripts\\make_rehydration_plan.py `\n \
    \ --scan reports\\scan\\scan.json `\n  --validation reports\\dex-validation\\dex-validation.json `\n\
    \  --graph reports\\graph\\graph.json `\n  --root-dex work\\root-managed.dex `\n  --application com.example.RealApplication\
    \ `\n  --launch-activity com.example.app/.MainActivity `\n  --out reports\\recovery-plan.json\n```\n\
    \nUse no `--root-dex` only when the first recovered runtime DEX is a valid primary DEX. Keep `remove_entries`\
    \ empty for the first compatibility build. Read [rehydration-plan-schema.md](references/rehydration-plan-schema.md)\
    \ before editing a plan by hand.\n\n### 7. Repair A Lifecycle Wrapper Only With Proof\n\nRepair a\
    \ wrapper only when all of these are true:\n\n- the manifest/runtime route calls the wrapper;\n- the\
    \ wrapper declares a code-less native Android lifecycle method;\n- its direct superclass is the recovered\
    \ concrete `*Core` class;\n- that superclass defines the same void lifecycle method;\n- a baseline\
    \ log shows the missing native registration or lifecycle failure.\n\nDecode the target DEX with apktool/baksmali,\
    \ generate a separate patched Smali file, rebuild that DEX, validate it, then update the plan hash:\n\
    \n```powershell\npython <skill-dir>\\scripts\\repair_lifecycle_bridge.py `\n  --smali-root work\\\
    decoded `\n  --wrapper com.example.MainActivity `\n  --core com.example.MainActivityCore `\n  --method\
    \ onCreate --proto '(Landroid/os/Bundle;)V' `\n  --out work\\patched\\MainActivity.smali\n```\n\n\
    Read [lifecycle-bridge-rules.md](references/lifecycle-bridge-rules.md). Do not use raw DEX offsets,\
    \ arbitrary method no-ops, or branch patches as a universal technique.\n\n### 8. Build Compatibility\
    \ First\n\nThe builder replaces only `classes*.dex`, approved manifest names, and explicit plan deletions.\
    \ It preserves unknown native libraries, assets, resources, and ZIP entries by default:\n\n```powershell\n\
    python <skill-dir>\\scripts\\rebuild_rehydrated_apk.py `\n  --apk target.apk --plan reports\\recovery-plan.json\
    \ `\n  --out dist\\target-rehydrated.apk `\n  --zipalign <path-to-zipalign> `\n  --apksigner <path-to-apksigner>\
    \ `\n  --keystore dist\\release.keystore --alias release `\n  --ks-pass <password>\n```\n\nOnly create\
    \ a separate cleanup plan after the compatibility build passes the entire device matrix. Every removed\
    \ shell artifact needs its own regression evidence.\n\n### 9. Verify The Artifact\n\nRun static checks\
    \ and device smoke tests without submitting credentials:\n\n```powershell\npython <skill-dir>\\scripts\\\
    verify_rehydration.py `\n  --apk dist\\target-rehydrated.apk --apksigner <path-to-apksigner> `\n \
    \ --zipalign <path-to-zipalign> `\n  --package com.example.app --launch-activity com.example.app/.MainActivity\
    \ `\n  --serial <device-id> --out reports\\verify\n```\n\nRequire v2/v3 verification, valid DEX headers,\
    \ a clean ZIP, three cold launches, a surviving PID, expected resumed route, screenshot/UI dump, and\
    \ no fatal log patterns. Use [verification-matrix.md](references/verification-matrix.md) for gates\
    \ and diagnosis.\n\n## Route Selection\n\n| Evidence | Recovery route |\n|---|---|\n| Static inner\
    \ DEX contains all resolved components | Start with static DEX plus compatibility build. |\n| Original\
    \ app materializes more DEX images | Use captured runtime DEX in evidence-backed order. |\n| Manifest\
    \ Application is unresolved | Select the confirmed real Application in the plan. |\n| Hidden activity\
    \ is the real product route | Preserve the existing route first; repoint only with explicit component\
    \ evidence. |\n| Native lifecycle wrapper fails | Use the restricted Smali bridge only after the proof\
    \ checklist passes. |\n| `JNI_ERR` after a modified build | Stop native branch experimentation; return\
    \ to managed multidex rehydration and preserve shell assets. |\n\n## Completion Standard\n\nDo not\
    \ claim completion from a successful install. Completion requires the build manifest, hash-matched\
    \ plan inputs, signing evidence, static checks, device logs, UI evidence, and at least one normal\
    \ user route through the recovered app."
  source: reverse-skills-index
  path: reverse-skills-index/SKILL.md
- skill_id: solve-challenge
  domain: ctf
  description: Solves CTF challenges by performing first-pass triage, identifying the dominant category,
    and routing execution to the right specialized ctf-* skill. Use when the user gives you a challenge
    bundle, a remote service, a suspicious file, or only a vague challenge description and you must determine
    where to start. Do not use it when the category is already clear and a specialized skill can be invoked
    directly; this is the dispatcher and recon entrypoint, not the deepest reference for category-specific
    techniques.
  body: '# CTF Challenge Solver


    You''re a skilled CTF player. Your goal is to solve the challenge and find the flag.


    ## Environment Setup


    Two setup strategies depending on your workflow:


    ### Pre-install (recommended before competitions)


    Use the central installer entrypoint:


    ```bash

    bash scripts/install_ctf_tools.sh all

    ```


    Run a narrower mode when you only want one tool group:


    ```bash

    bash scripts/install_ctf_tools.sh python

    bash scripts/install_ctf_tools.sh apt

    bash scripts/install_ctf_tools.sh brew

    bash scripts/install_ctf_tools.sh gems

    bash scripts/install_ctf_tools.sh go

    bash scripts/install_ctf_tools.sh manual

    ```


    The full package lists now live in [scripts/install_ctf_tools.sh](../scripts/install_ctf_tools.sh).


    ### On-demand (during challenges)


    Each category skill''s `SKILL.md` has a **Prerequisites** section listing only the tools needed for
    that category. Install as you go.


    ## Workflow


    ### Step 0: CTFd Platform Detection


    If the CTF platform URL is known, check if it runs CTFd and switch to API-driven navigation:


    ```bash

    # Detect CTFd (look for /api/v1/ and /themes/core/)

    curl -s "$CTF_URL/api/v1/" | head -5

    curl -s "$CTF_URL" | grep -oE ''/themes/core/''

    ```


    If CTFd is detected, **ask the user for their API token** (generated from CTFd Settings > Access Tokens).
    The token is not provided by default — the user must create one in the CTFd web UI first. Once provided,
    set the environment variables and proceed via API:


    ```bash

    export CTF_URL="https://ctf.example.com"

    export CTF_TOKEN="ctfd_..."  # Ask user for this

    ```


    Invoke `/ctf-misc` and load its `ctfd-navigation.md` for the full API reference and Python client
    class.


    ### Step 1: Recon


    1. **Explore files** -- List the challenge directory, run `file *` on everything

    2. **Triage binaries** -- `strings`, `xxd | head`, `binwalk`, `checksec` on binaries

    3. **Fetch links** -- If the challenge mentions URLs, fetch them FIRST for context

    4. **Connect** -- Try remote services (`nc`) to understand what they expect

    5. **Read hints** -- Challenge descriptions, filenames, and comments often contain clues


    ### Step 2: Categorize


    Determine the primary category, then invoke the matching skill.


    **By file type:**

    - `.pcap`, `.pcapng`, `.evtx`, `.raw`, `.dd`, `.E01` -> forensics

    - `.elf`, `.exe`, `.so`, `.dll`, binary with no extension -> reverse or pwn (check if remote service
    provided -- if yes, likely pwn)

    - `.py`, `.sage`, `.txt` with numbers -> crypto

    - `.apk`, `.wasm`, `.pyc` -> reverse

    - `.safetensors`, `.pt`, `.pth`, `.bin`, `.onnx` -> ai-ml

    - Web URL or source code with HTML/JS/PHP/templates -> web

    - Images, audio, PDFs with no obvious content -> forensics (steganography)


    **By challenge description keywords:**

    - "buffer overflow", "ROP", "shellcode", "libc", "heap" -> pwn

    - "RSA", "AES", "cipher", "encrypt", "prime", "modulus", "lattice", "LWE", "GCM" -> crypto

    - "XSS", "SQL", "injection", "cookie", "JWT", "SSRF" -> web

    - "disk image", "memory dump", "packet capture", "registry", "power trace", "side-channel", "spectrogram",
    "audio tracks", "MKV" -> forensics

    - "find", "locate", "identify", "who", "where" -> osint

    - "obfuscated", "packed", "C2", "malware", "beacon" -> malware

    - "prompt injection", "LoRA", "adversarial", "model weights", "embedding" -> ai-ml

    - "jail", "sandbox", "escape", "encoding", "signal", "game", "Nim", "commitment", "Gray code" -> misc


    **By service behavior:**

    - Port with interactive prompt, crash on long input -> pwn

    - HTTP service -> web

    - netcat with math/crypto puzzles -> crypto

    - netcat with restricted shell or eval -> misc (jail)


    ### Step 3: Invoke the Category Skill


    Once you identify the category, **invoke the matching skill** to get specialized techniques:


    | Category | Invoke | When to Use |

    |----------|--------|-------------|

    | Web | `/ctf-web` | XSS, SQLi, SSTI, SSRF, JWT, file uploads, prototype pollution |

    | Pwn | `/ctf-pwn` | Buffer overflow, format string, heap, ROP, sandbox escape |

    | Crypto | `/ctf-crypto` | RSA, AES, ECC, PRNG, ZKP, classical ciphers |

    | Reverse | `/ctf-reverse` | Binary analysis, game clients, VMs, obfuscated code |

    | Forensics | `/ctf-forensics` | Disk images, memory dumps, event logs, stego, network captures |

    | OSINT | `/ctf-osint` | Social media, geolocation, DNS, public records |

    | Malware | `/ctf-malware` | Obfuscated scripts, C2 traffic, PE/.NET analysis |

    | AI/ML | `/ctf-ai-ml` | Model weights (`.safetensors`, `.pt`, `.pth`, `.bin`, `.onnx`), prompt injection,
    LoRA adapters, adversarial examples |

    | Misc | `/ctf-misc` | Jails, encodings, RF/SDR, esoteric languages, constraint solving |


    You can also invoke `/ctf-<category>` to load the full skill instructions with detailed techniques.


    ### Step 4: Pivot When Stuck


    If your first approach doesn''t work:


    1. **Re-examine assumptions** -- Is this really the category you think? A "web" challenge might need
    crypto for JWT forgery. A "forensics" PCAP might contain a pwn exploit to replay.

    2. **Try a different category skill** -- Many challenges span multiple categories. Invoke a second
    skill for the cross-cutting technique.

    3. **Look for what you missed** -- Hidden files, alternate ports, response headers, comments in source,
    metadata in images.

    4. **Simplify** -- If an exploit is too complex, check if there''s a simpler path (default creds,
    known CVE, logic bug).

    5. **Check edge cases** -- Off-by-one, race conditions, integer overflow, encoding mismatches.


    **Common multi-category patterns:**

    - Forensics + Crypto: encrypted data in PCAP/disk image, need crypto to decrypt

    - Web + Reverse: WASM or obfuscated JS in web challenge

    - Web + Crypto: JWT forgery, custom MAC/signature schemes

    - Reverse + Pwn: reverse the binary first, then exploit the vulnerability

    - Forensics + OSINT: recover data from dump, then trace it via public sources

    - Misc + Crypto: jail escape requires building crypto primitives under constraints

    - OSINT + Stego: social media posts with unicode homoglyph steganography (Cyrillic lookalikes encode
    bits)

    - Web + Forensics: paywall bypass (curl reveals content hidden by CSS overlays)

    - Misc + Crypto + Game Theory: multi-phase interactive challenges with AES decryption → HMAC commitment
    → combinatorial game solving (GF(256) Nim)

    - Crypto + Geometry + Lattice: multi-layer challenges progressing from spatial reconstruction → subspace
    recovery → LWE solving → AES-GCM decryption

    - Forensics + Signal Processing: power traces / side-channel analysis requiring statistical analysis
    of measurement data

    - Forensics + Network + Encoding: timing-based encoding in PCAP (inter-packet intervals encode binary
    data)


    ### Step 5: Generate Write-up


    After solving the challenge, invoke `/ctf-writeup` to generate a standardized submission-style writeup
    — concise, reproducible, and ready for competition organizers or teammates to validate.


    ## Flag Formats


    Flags vary by CTF. Common formats:

    - `flag{...}`, `FLAG{...}`, `CTF{...}`, `TEAM{...}`

    - Custom prefixes: check the challenge description or CTF rules for the format (e.g., `ENO{...}`,
    `HTB{...}`, `picoCTF{...}`)

    - Sometimes just a plaintext string with no wrapper


    **Validation rule (important):**

    - If you find multiple flag-like strings, treat them as candidates and validate before finalizing.

    - Prefer the token tied to the intended artifact/workflow (not random metadata noise or obvious decoys).

    - Do a corpus-wide uniqueness check and include the source file/path when reporting.


    ```bash

    # Search for common flag patterns in files

    grep -rniE ''(flag|ctf|eno|htb|pico)\{'' .

    # Search in binary/memory output

    strings output.bin | grep -iE ''\{.*\}''

    ```


    ## Quick Reference


    ```bash

    # Recon

    file *                                    # Identify file types

    strings binary | grep -i flag             # Quick string search

    xxd binary | head -20                     # Hex dump header

    binwalk -e firmware.bin                   # Extract embedded files

    checksec --file=binary                    # Check binary protections


    # Connect

    nc host port                              # Connect to challenge

    echo -e "answer1\nanswer2" | nc host port # Scripted input

    curl -v http://host:port/                 # HTTP recon


    # Python exploit template

    python3 -c "

    from pwn import *

    r = remote(''host'', port)

    r.interactive()

    "

    ```


    ## Challenge


    $ARGUMENTS'
  source: solve-challenge
  path: solve-challenge/SKILL.md
- skill_id: supply-chain-security
  domain: supply-chain
  description: 供应链安全测试：SBOM / SCA / CI-CD 管道 / 依赖溯源，含 SBOM 法规与溯源取证路径。
  body: "\uFEFF# Supply Chain Security Testing\n\n> SBOM / SCA / CI/CD 管道 / 依赖溯源\n> 法规驱动：美国行政令 SBOM、中国国标、EU\
    \ CRA\n\n## 适用场景\n\n- 软件供应链安全评估\n- 开源依赖漏洞扫描与验证\n- CI/CD 管道安全审计\n- 容器镜像安全分析\n- 第三方组件合规审查\n- 构建产物溯源与完整性验证\n\
    \n## 六层供应链治理框架\n\n```text\nLayer 1: 源码信任评估 → 上游仓库/维护者/发布历史审查\nLayer 2: 构建管道集成 → CI/CD 安全门禁、签名验证\n\
    Layer 3: 制品分发完整性 → 签名、校验和、SBOM 附加\nLayer 4: 运行时保护 → 容器扫描、准入控制\nLayer 5: 持续监控 → CVE 实时追踪、漏洞可达性分析\n\
    Layer 6: 事件响应 → 供应链攻击应急、回滚策略\n```\n\n## 工作流\n\n### 1. SBOM 生成与审计\n\n```text\n生成 SBOM：\n□ CycloneDX\
    \ 格式: cdxgen → bom.json\n□ SPDX 格式: sbom-tool generate\n□ Syft: syft <image|dir> -o spdx-json\n\n\
    审计要点：\n□ 是否存在未知/未授权的依赖\n□ 是否存在已废弃/停止维护的包\n□ 许可证冲突检测\n□ 直接依赖 vs 传递依赖清单\n□ 每个组件的发布时间线和维护者状态\n```\n\n\
    ### 2. 软件组成分析（SCA）\n\n```bash\n# OSV-Scanner（免费、Google 维护）\nosv-scanner scan -r . --format json\n\n\
    # OWASP Dependency-Track（企业级持续监控）\ndocker run -p 8080:8080 dependencytrack/apiserver\n# → 上传 SBOM\
    \ → 自动匹配 NVD/OSV/GitHub Advisory\n\n# Snyk（商业）\nsnyk test --all-projects\nsnyk monitor  # 持续监控\n\n\
    # Trivy（容器 + 依赖 + IaC）\ntrivy fs .          # 文件系统扫描\ntrivy image nginx   # 容器镜像\ntrivy config . \
    \     # IaC 配置\n```\n\n### 3. 漏洞可达性验证\n\n```text\nSCA 告警 ≠ 实际风险！大多数 SCA 工具只有 ~15% 的告警是实际可达的。\n\n验证步骤：\n\
    1. 用 Dependency-Track 或 Trivy 获取 CVE 列表\n2. 筛选 CVSS ≥ 7.0 的漏洞\n3. 对有 PoC 的 CVE 做可达性分析\n   - Code Property\
    \ Graph 切片: 追踪用户输入到漏洞函数的路径\n   - DEPTEX 方法: EPD (Execution Path Dominance) + LLM 语义验证\n4. 在隔离环境中验证\
    \ PoC\n5. 对可达的漏洞按实际影响排序修复优先级\n```\n\n工具参考：\n- CodeQL: GitHub 代码查询 → 数据流分析\n- Snyk Code: 可达性标记\n- DEPTEX:\
    \ LLM 辅助上下文感知风险评估\n\n### 4. CI/CD 管道安全\n\n```text\n安全检查点：\n□ 代码提交 → pre-commit hook: gitleaks (密钥扫描)\n\
    □ PR 阶段 → SCA 扫描 (Trivy/OSV-Scanner)\n□ 构建阶段 → 制品签名 (cosign)\n□ 推送阶段 → SBOM 附加 (syft + attest)\n□\
    \ 部署阶段 → 准入控制 (OPA/Kyverno + 镜像扫描)\n□ 运行时 → 持续漏洞监控 (Dependency-Track)\n\n管道自身安全：\n□ Pipeline as Code\
    \ 审计（GitHub Actions / GitLab CI 配置注入）\n□ Runner 隔离（防止恶意构建突破容器）\n□ 密钥管理（Actions Secrets / Vault，禁止硬编码）\n\
    □ 第三方 Action 审查（锁定 commit SHA，非 tag）\n```\n\n### 5. 容器镜像安全\n\n```bash\n# Dockerfile 审计\nhadolint Dockerfile\n\
    \n# 镜像扫描（多层：OS + 应用依赖 + 配置）\ntrivy image --severity HIGH,CRITICAL nginx:latest\n\n# 最小基础镜像\n# 优先:\
    \ distroless → alpine → slim → 避免 latest\ndocker scout quickview nginx:latest\n\n# 镜像签名\ncosign sign\
    \ --key cosign.key myimage:tag\ncosign verify --key cosign.pub myimage:tag\n```\n\n### 6. 第三方依赖审查\n\
    \n```text\n新增依赖 Checklist：\n□ 维护状态：最近 6 个月有提交？维护者活跃度？\n□ 安全历史：过去有无被植入恶意代码？\n□ 依赖树：引入后新增多少传递依赖？\n□\
    \ 许可证：与项目许可证兼容？\n□ 替代方案：有无更安全的替代（Snyk Advisor / Socket.dev 评分）？\n\n风险评估矩阵：\n  高维护 × 低依赖数 × 兼容许可证 →\
    \ 低风险\n  低维护 × 高依赖数 × 许可证冲突 → 高风险\n```\n\n## 工具链\n\n| 工具 | 用途 | 获取 |\n|------|------|------|\n| OWASP\
    \ Dependency-Track | 企业级持续 SCA | `docker pull dependencytrack/apiserver` |\n| OSV-Scanner | 免费 SCA（OSV.dev\
    \ 生态） | `go install github.com/google/osv-scanner` |\n| Trivy | 镜像 + 依赖 + IaC 扫描 | `apt install trivy`\
    \ |\n| Syft | SBOM 生成 | `curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh`\
    \ |\n| cdxgen | CycloneDX SBOM 生成 | `npm install -g @cyclonedx/cdxgen` |\n| Cosign | 容器签名 | `go install\
    \ github.com/sigstore/cosign/v2/cmd/cosign` |\n| Gitleaks | 密钥/凭证扫描 | `go install github.com/gitleaks/gitleaks/v8`\
    \ |\n| Snyk | 商业 SCA + 可达性 | `npm install -g snyk` |\n| CodeQL | 代码查询 + 数据流 | GitHub Actions 内置 |\n\
    \n## 参考\n\n- `references/sbom-sca-methodology.md` — SBOM + SCA 方法论\n- `references/cicd-pipeline-security.md`\
    \ — CI/CD 管道安全审计"
