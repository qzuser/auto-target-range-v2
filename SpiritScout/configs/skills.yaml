  body: '# CTF Cryptography


    Quick reference for crypto CTF challenges. Each technique has a one-liner here; see supporting files
    for full details with code.


    ## Prerequisites


    **Python packages (all platforms):**

    ```bash

    pip install pycryptodome z3-solver sympy gmpy2 hashpumpy fpylll py_ecc

    # Coppersmith (optional): pip install coppersmith

    # Alternative Coppersmith lib: git clone https://github.com/jvdsn/crypto-attacks ~/.ctf-tools/crypto-attacks
    && pip install -r ~/.ctf-tools/crypto-attacks/requirements.txt

    ```


    **Linux (apt):**

    ```bash

    apt install hashcat

    ```


    **macOS (Homebrew):**

    ```bash

    brew install hashcat

    ```


    **Manual install:**

    - SageMath (optional — only for legacy Sage fallback snippets (collapsed sections)) — Linux: `apt
    install sagemath`, macOS: `brew install --cask sage`

    - RsaCtfTool — `git clone https://github.com/RsaCtfTool/RsaCtfTool` (automated RSA attacks)

    - crypto-attacks (Coppersmith) — `git clone https://github.com/jvdsn/crypto-attacks ~/.ctf-tools/crypto-attacks`
    + `pip install -r ~/.ctf-tools/crypto-attacks/requirements.txt` (alternative to `pip install coppersmith`)


    > **Note:** `gmpy2` requires libgmp — Linux: `apt install libgmp-dev`, macOS: `brew install gmp`.


