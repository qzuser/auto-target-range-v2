  body: "# CTF Forensics & Blockchain\n\nQuick reference for forensics CTF challenges. Each technique\
    \ has a one-liner here; see supporting files for full details.\n\n## Prerequisites\n\n**Python packages\
    \ (all platforms):**\n```bash\npip install volatility3 Pillow numpy matplotlib\n```\n\n**Linux (apt):**\n\
    ```bash\napt install binwalk foremost libimage-exiftool-perl tshark sleuthkit \\\n  ffmpeg steghide\
    \ testdisk john pcapfix\n```\n\n**macOS (Homebrew):**\n```bash\nbrew install binwalk exiftool wireshark\
    \ sleuthkit ffmpeg \\\n  testdisk john-jumbo\n```\n\n**Ruby gems (all platforms):**\n```bash\ngem\
    \ install zsteg\n```\n\n## Additional Resources\n\n- [3d-printing.md](3d-printing.md) - 3D printing\
    \ forensics (PrusaSlicer binary G-code, QOIF, heatshrink)\n- [windows.md](windows.md) - Windows forensics\
    \ (registry, SAM, event logs, recycle bin, NTFS alternate data streams, USN journal, PowerShell history,\
    \ Defender MPLog, WMI persistence, Amcache)\n- [network.md](network.md) - Network forensics basics\
    \ (tcpdump, TLS/SSL keylog decryption, TLS master key extraction from coredump, Wireshark, PCAP, port\
    \ scanning, SMB3 decryption, 5G/NR protocols, WordPress recon, credentials, USB HID steno, BCD encoding,\
    \ HTTP file upload exfiltration, split archive reassembly via timestamp ordering)\n- [network-advanced.md](network-advanced.md)\
    \ - Advanced network forensics (packet interval timing encoding, NTLMv2 hash cracking, TCP flag covert\
    \ channel, DNS last-byte steganography, DNS trailing byte binary encoding, multi-layer PCAP with XOR\
    \ + ZIP and mDNS key, Brotli decompression bomb seam analysis, SMB RID recycling via LSARPC, Timeroasting\
    \ MS-SNTP hash extraction, dnscat2 reassembly, RADIUS shared secret cracking, RC4 stream identification,\
    \ ICMP payload byte rotation, ICMP ping time-delay covert channel)\n- [peripheral-capture.md](peripheral-capture.md)\
    \ - USB/HID/Bluetooth peripheral traffic reconstruction (USB HID mouse/pen drawing recovery, USB HID\
    \ keyboard capture decoding, USB keyboard LED Morse code exfiltration, USB HID keyboard arrow key\
    \ navigation tracking, Bluetooth RFCOMM packet reassembly)\n- [disk-and-memory.md](disk-and-memory.md)\
    \ - Core disk/memory forensics (Volatility, disk mounting/carving, VM/OVA/VMDK, VMware snapshots,\
    \ GIMP raw memory dump visual inspection, coredumps, Windows KAPE triage, PowerShell ransomware, Android\
    \ forensics, Docker container forensics, cloud storage forensics, BSON reconstruction, TrueCrypt/VeraCrypt\
    \ mounting)\n- [disk-advanced.md](disk-advanced.md) - Advanced disk and memory techniques (deleted\
    \ partitions, ZFS forensics, GPT GUID encoding, VMDK sparse parsing, memory dump string carving, ransomware\
    \ key recovery, WordPerfect macro XOR, minidump ISO 9660 recovery, APFS snapshot recovery, RAID 5\
    \ XOR recovery, HFS+ resource fork recovery, Kyoto Cabinet hash DB forensics, SQLite edit history\
    \ reconstruction)\n- [disk-recovery.md](disk-recovery.md) - Disk recovery and extraction patterns\
    \ (LUKS master key recovery, PRNG timestamp seed brute-force, VBA macro binary recovery, FemtoZip\
    \ decompression, XFS filesystem reconstruction, tar duplicate entry extraction, nested matryoshka\
    \ filesystem extraction, anti-carving via null byte interleaving, BTRFS subvolume/snapshot recovery,\
    \ FAT16 free space data recovery, FAT16 deleted file recovery via Sleuth Kit fls/icat, ext2 orphaned\
    \ inode recovery via fsck, corrupted ZIP header repair)\n- [steganography.md](steganography.md) -\
    \ General steganography (binary border stego, PDF multi-layer stego, SVG keyframes, PNG reorder, file\
    \ overlays, GIF frame diff Morse code, GZSteg + spammimic, spreadsheet frequency recovery, Kitty terminal\
    \ graphics protocol decoding, ANSI escape sequence steganography, autostereogram solving, two-layer\
    \ byte+line interleaving, multi-stream video container stego, progressive PNG layered XOR decryption,\
    \ QR code reconstruction from curved reflection)\n- [stego-image.md](stego-image.md) - Image-specific\
    \ steganography (JPEG unused DQT table LSB, BMP bitplane QR extraction, image puzzle reassembly, F5\
    \ JPEG DCT ratio detection, PNG unused palette entry stego, QR code tile reconstruction, seed-based\
    \ pixel permutation + multi-bitplane QR, JPEG thumbnail pixel-to-text mapping, conditional LSB with\
    \ pixel filtering, JPEG slack space, nearest-neighbor interpolation stego, RGB parity steganography)\n\
    - [stego-advanced.md](stego-advanced.md) - Advanced steganography part 1: audio and signal techniques\
    \ (FFT frequency domain, DTMF audio, SSTV+LSB, DotCode barcode, custom frequency dual-tone keypad,\
    \ multi-track audio differential subtraction, cross-channel multi-bit LSB, audio FFT musical notes,\
    \ audio metadata octal encoding, nested tar whitespace encoding, DeepSound audio stego with password\
    \ cracking, audio waveform binary encoding, audio spectrogram hidden QR)\n- [stego-advanced-2.md](stego-advanced-2.md)\
    \ - Advanced steganography part 2: video, image transform, and format-specific techniques (video frame\
    \ accumulation, reversed audio, video frame averaging, JPEG XL TOC permutation steganography, Arnold's\
    \ Cat Map descrambling, high-resolution SSTV custom FM demodulation, MJPEG FFD9 trailing byte stego,\
    \ EXIF zlib + Stegano pixel patterns, PDF xref covert channel, ANSI escape code stego, pixel-wise\
    \ ECB deduplication)\n- [linux-forensics.md](linux-forensics.md) - Linux/app forensics (log analysis,\
    \ Docker image forensics, attack chains, browser credentials, Firefox history, TFTP, TLS weak RSA,\
    \ USB audio, Git directory recovery, KeePass v4 cracking, Git reflog/fsck squash recovery, browser\
    \ artifact analysis (Chrome/Chromium/Firefox history, cookies, downloads, local storage, session restore),\
    \ corrupted git blob repair via byte brute-force, VBA macro Excel cell data to ELF binary extraction,\
    \ Python in-memory source recovery via pyrasite)\n- [signals-and-hardware.md](signals-and-hardware.md)\
    \ - Hardware signal decoding with decode code (VGA frame parsing, HDMI TMDS symbol decode, DisplayPort\
    \ 8b/10b + LFSR descrambler), Voyager Golden Record audio, Saleae Logic 2 UART decode, Flipper Zero\
    \ .sub files, side-channel power analysis (DPA), keyboard acoustic side-channel, CD audio disc image\
    \ steganography (CIRC de-interleaving + spiral rendering), caps-lock LED Morse code from video, Linux\
    \ input_event keylogger dump parsing, serial UART from WAV audio, USB MIDI Launchpad grid reconstruction\n\
    \n---\n\n## When to Pivot\n\n- If you recover an encrypted blob and the hard part becomes RSA, AES,\
    \ or lattice work, switch to `/ctf-crypto`.\n- If the evidence really points to malware staging, beacon\
    \ config extraction, or packed samples, switch to `/ctf-malware`.\n- If the artifact is a web app\
    \ backup or API dump and the remaining problem is application logic, switch to `/ctf-web`.\n- If the\
    \ forensic evidence is really an encoding puzzle, steganography trick, or esoteric format rather than\
    \ true forensics, switch to `/ctf-misc`.\n- If you need to trace infrastructure, attribute actors,\
    \ or investigate public records from forensic findings, switch to `/ctf-osint`.\n- If the recovered\
    \ artifact is a compiled binary or firmware that needs disassembly and analysis, switch to `/ctf-reverse`.\n\
    \n## Quick Start Commands\n\n```bash\n# File analysis\nfile suspicious_file\nexiftool suspicious_file\
    \     # Metadata\nbinwalk suspicious_file      # Embedded files\nstrings -n 8 suspicious_file\nhexdump\
    \ -C suspicious_file | head  # Check magic bytes\n\n# Disk forensics\nsudo mount -o loop,ro image.dd\
    \ /mnt/evidence\nfls -r image.dd              # List files\nphotorec image.dd            # Carve deleted\
    \ files\n\n# Memory forensics (Volatility 3)\nvol -f memory.dmp windows.info\nvol -f memory.dmp windows.pslist\n\
    vol -f memory.dmp windows.filescan\n```\n\nSee [disk-and-memory.md](disk-and-memory.md) for full Volatility\
    \ plugin reference, VM forensics, and coredump analysis.\n\n## Log Analysis\n\n```bash\ngrep -iE \"\
    (flag|part|piece|fragment)\" server.log     # Flag fragments\ngrep \"FLAGPART\" server.log | sed 's/.*FLAGPART:\
    \ //' | uniq | tr -d '\\n'  # Reconstruct\nsort logfile.log | uniq -c | sort -rn | head         #\
    \ Find anomalies\n```\n\nSee [linux-forensics.md](linux-forensics.md) for Linux attack chain analysis\
    \ and Docker image forensics.\n\n## Windows Event Logs (.evtx)\n\n**Key Event IDs:**\n- 1001 - Bugcheck/reboot\n\
    - 1102 - Audit log cleared\n- 4720 - User account created\n- 4781 - Account renamed\n\n**RDP Session\
    \ IDs (TerminalServices-LocalSessionManager):**\n- 21 - Session logon succeeded\n- 24 - Session disconnected\n\
    - 1149 - RDP auth succeeded (RemoteConnectionManager, has source IP)\n\n```python\nimport Evtx.Evtx\
    \ as evtx\nwith evtx.Evtx(\"Security.evtx\") as log:\n    for record in log.records():\n        print(record.xml())\n\
    ```\n\nSee [windows.md](windows.md) for full event ID tables, registry analysis, SAM parsing, USN\
    \ journal, and anti-forensics detection.\n\n- **NTFS Alternate Data Streams (ADS):** Hidden data attached\
    \ to files via named NTFS streams. Invisible to `dir`/Explorer. Detect with `fls -r image.dd | grep\
    \ \":\"`, extract with `icat`. See [windows.md](windows.md#ntfs-alternate-data-streams).\n\n## When\
    \ Logs Are Cleared\n\nIf attacker cleared event logs, use these alternative sources:\n1. **USN Journal\
    \ ($J)** - File operations timeline (MFT ref, timestamps, reasons)\n2. **SAM registry** - Account\
    \ creation from key last_modified timestamps\n3. **PowerShell history** - ConsoleHost_history.txt\
    \ (USN DATA_EXTEND = command timing)\n4. **Defender MPLog** - Separate log with threat detections\
    \ and ASR events\n5. **Prefetch** - Program execution evidence\n6. **User profile creation** - First\
    \ login time (profile dir in USN journal)\n\nSee [windows.md](windows.md) for detailed parsing code\
    \ and anti-forensics detection checklist.\n\n## Steganography\n\n```bash\nsteghide extract -sf image.jpg\
    \ -p \"\"\nzsteg image.png              # PNG/BMP analysis\nstegsolve                    # Visual\
    \ analysis\n```\n\n- **Binary border stego:** Black/white pixels in 1px image border encode bits clockwise\n\
    - **FFT frequency domain:** Image data hidden in 2D FFT magnitude spectrum; try `np.fft.fft2` visualization\n\
    - **DTMF audio:** Phone tones encoding data; decode with `multimon-ng -a DTMF`\n- **Multi-layer PDF:**\
    \ Check hidden comments, post-EOF data, XOR with keywords, ROT18 final layer\n- **SSTV + LSB:** SSTV\
    \ signal may be red herring; check 2-bit LSB of audio samples with `stegolsb`\n- **SVG keyframes:**\
    \ Animation `keyTimes`/`values` attributes encode binary/Morse via fill color alternation\n- **PNG\
    \ chunk reorder:** Fix chunk order: IHDR → ancillary → IDAT (in order) → IEND\n- **File overlays:**\
    \ Check after IEND for appended archives with overwritten magic bytes\n- **APNG frame extraction:**\
    \ Animated PNG has multiple frames; extract with `apngdis` or parse `fdAT`/`fcTL` chunks. See [steganography.md](steganography.md#apng-animated-png-frame-extraction-icectf-2016).\n\
    - **PNG height/CRC manipulation:** Modify IHDR height field, brute-force until CRC matches to reveal\
    \ hidden rows. See [steganography.md](steganography.md#png-heightcrc-manipulation-for-hidden-content-h4ckit-ctf-2016).\n\
    - **Pixel coordinate chain stego:** Linked-list traversal where R=data byte, G/B=next pixel coordinates.\
    \ See [stego-image.md](stego-image.md#pixel-coordinate-chain-steganography-h4ckit-ctf-2016).\n- **AVI\
    \ frame differential:** XOR consecutive video frames to reveal hidden data in pixel differences. See\
    \ [stego-image.md](stego-image.md#avi-frame-differential-pixel-steganography-h4ckit-ctf-2016).\n\n\
    - **Custom freq DTMF:** Non-standard dual-tone frequencies; generate spectrogram first (`ffmpeg -i\
    \ audio -lavfi showspectrumpic`), map custom grid to keypad digits, decode variable-length ASCII\n\
    - **JPEG DQT LSB:** Unused quantization tables (ID 2, 3) carry LSB-encoded data; access via `Image.open().quantization`\
    \ and extract bit 0 from each of 64 values\n- **Multi-track audio subtraction:** Two nearly-identical\
    \ audio tracks in MKV/video; `sox -m a0.wav \"|sox a1.wav -p vol -1\" diff.wav` cancels shared content,\
    \ flag appears in spectrogram of difference signal (5-12 kHz band)\n- **Packet interval timing:**\
    \ Identical packets with two distinct interval values (e.g., 10ms/100ms) encode binary; filter by\
    \ interface, compute inter-packet deltas, threshold to bits\n\nSee [steganography.md](steganography.md),\
    \ [stego-advanced.md](stego-advanced.md), and [stego-advanced-2.md](stego-advanced-2.md) for full\
    \ code examples and decoding workflows.\n\n## PDF Analysis\n\n```bash\nexiftool document.pdf     \
    \   # Metadata (often hides flags!)\npdftotext document.pdf -     # Extract text\nstrings document.pdf\
    \ | grep -i flag\nbinwalk document.pdf         # Embedded files\n```\n\n**Advanced PDF stego (Nullcon\
    \ 2026 rdctd):** Six techniques -- invisible text separators, URI annotations with escaped braces,\
    \ Wiener deconvolution on blurred images, vector rectangle QR codes, compressed object streams (`mutool\
    \ clean -d`), document metadata fields.\n\nSee [steganography.md](steganography.md) for full PDF steganography\
    \ techniques and code.\n\n## Disk / VM / Memory Forensics\n\n```bash\n# Disk images\nsudo mount -o\
    \ loop,ro image.dd /mnt/evidence\nfls -r image.dd && photorec image.dd\n\n# VM images (OVA/VMDK)\n\
    tar -xvf machine.ova\n7z x disk.vmdk -oextracted \"Windows/System32/config/SAM\" -r\n\n# Memory (Volatility\
    \ 3)\nvol -f memory.dmp windows.pslist\nvol -f memory.dmp windows.cmdline\nvol -f memory.dmp windows.netscan\n\
    vol -f memory.dmp windows.dumpfiles --physaddr <addr>\n\n# String carving\nstrings -a -n 6 memdump.bin\
    \ | grep -E \"FLAG|SSH_CLIENT|SESSION_KEY\"\n\n# Coredump\ngdb -c core.dump  # info registers, x/100x\
    \ $rsp, find \"flag\"\n```\n\nSee [disk-and-memory.md](disk-and-memory.md) for full Volatility plugin\
    \ reference, VM forensics, and VMware snapshots. See [disk-advanced.md](disk-advanced.md) for deleted\
    \ partition recovery, ZFS forensics, and ransomware analysis.\n\n## Windows Password Hashes\n\n```bash\n\
    # Extract with impacket, crack with hashcat -m 1000\npython -c \"from impacket.examples.secretsdump\
    \ import *; SAMHashes('SAM', LocalOperations('SYSTEM').getBootKey()).dump()\"\n```\n\nSee [windows.md](windows.md)\
    \ for SAM details and [network-advanced.md](network-advanced.md) for NTLMv2 cracking from PCAP.\n\n\
    ## Bitcoin Tracing\n\n- Use mempool.space API: `https://mempool.space/api/tx/<TXID>`\n- **Peel chain:**\
    \ ALWAYS follow LARGER output; round amounts indicate peels\n\n## Uncommon File Magic Bytes\n\n| Magic\
    \ | Format | Extension | Notes |\n|-------|--------|-----------|-------|\n| `OggS` | Ogg container\
    \ | `.ogg` | Audio/video |\n| `RIFF` | RIFF container | `.wav`,`.avi` | Check subformat |\n| `%PDF`\
    \ | PDF | `.pdf` | Check metadata & embedded objects |\n| `GCDE` | PrusaSlicer binary G-code | `.g`,\
    \ `.bgcode` | See 3d-printing.md |\n\n## Common Flag Locations\n\n- PDF metadata fields (Author, Title,\
    \ Keywords)\n- Image EXIF data\n- Deleted files (Recycle Bin `$R` files)\n- Registry values\n- Browser\
    \ history\n- Log file fragments\n- Memory strings\n\n## WMI Persistence Analysis\n\n**Pattern (Backchimney):**\
    \ Malware uses WMI event subscriptions for persistence (MITRE T1546.003).\n\n```bash\npython PyWMIPersistenceFinder.py\
    \ OBJECTS.DATA\n```\n\n- Look for FilterToConsumerBindings with CommandLineEventConsumer\n- Base64-encoded\
    \ PowerShell in consumer commands\n- Event filters triggered on system events (logon, timer)\n\nSee\
    \ [windows.md](windows.md) for WMI repository analysis details.\n\n## Network Forensics Quick Reference\n\
    \n- **TFTP netascii:** Binary transfers corrupted; fix with `data.replace(b'\\r\\n', b'\\n').replace(b'\\\
    r\\x00', b'\\r')`\n- **TLS keylog decryption:** Import SSLKEYLOGFILE or RSA private key into Wireshark\
    \ (Edit → Preferences → Protocols → TLS)\n- **TLS weak RSA:** Extract cert, factor modulus, generate\
    \ private key with `rsatool`, add to Wireshark\n- **USB audio:** Extract isochronous data with `tshark\
    \ -e usb.iso.data`, import as raw PCM in Audacity\n- **NTLMv2 from PCAP:** Extract server challenge\
    \ + NTProofStr + blob from NTLMSSP_AUTH, brute-force\n- **WPA/WEP WiFi decryption:** `aircrack-ng\
    \ -w wordlist capture.pcap` cracks WPA handshake; WEP cracked with enough IVs. See [network.md](network.md#wpawep-wifi-decryption-from-pcap-defcamp-ctf-2016).\n\
    - **PCAP repair:** `pcapfix -d corrupted.pcap` repairs broken PCAP headers/checksums for Wireshark\
    \ loading. See [network.md](network.md#corrupted-pcap-repair-with-pcapfix-csaw-ctf-2016).\n- **USB\
    \ HID keyboard decoding:** Extract 8-byte HID reports from USB captures; byte 2 = keycode, byte 0\
    \ = modifiers (Shift). See [peripheral-capture.md](peripheral-capture.md#usb-hid-keyboard-capture-decoding-ekoparty-ctf-2016).\n\
    - **dnscat2 reassembly:** Decode hex/base32 subdomain labels, strip 9-byte dnscat2 header, deduplicate\
    \ retransmissions, reassemble payload. See [network-advanced.md](network-advanced.md#dnscat2-traffic-reassembly-from-dns-pcap-bsidessf-2017).\n\
    - **USB keyboard LED exfiltration:** Host-to-device HID SET_REPORT packets toggle Caps Lock LED. Timing\
    \ encodes Morse code. See [peripheral-capture.md](peripheral-capture.md#usb-keyboard-led-morse-code-exfiltration-bitsctf-2017).\n\
    \nSee [network.md](network.md) for SMB3 decryption, credential extraction, and [linux-forensics.md](linux-forensics.md)\
    \ for full TLS/TFTP/USB workflows.\n\n## Browser Forensics\n\n- **Chrome/Edge:** Decrypt `Login Data`\
    \ SQLite with AES-GCM using DPAPI master key\n- **Firefox:** Query `places.sqlite` -- `SELECT url\
    \ FROM moz_places WHERE url LIKE '%flag%'`\n\nSee [linux-forensics.md](linux-forensics.md) for full\
    \ browser credential decryption code.\n\n## Additional Technique Quick References\n\n- **Docker image\
    \ forensics:** Config JSON preserves ALL `RUN` commands even after cleanup. `tar xf app.tar` then\
    \ inspect config blob. See [linux-forensics.md](linux-forensics.md).\n- **Linux attack chains:** Check\
    \ `auth.log`, `.bash_history`, recent binaries, PCAP. See [linux-forensics.md](linux-forensics.md).\n\
    - **RAID 5 XOR recovery:** Two disks of a 3-disk RAID 5 → XOR byte-by-byte to recover the third: `bytes(a\
    \ ^ b for a, b in zip(disk1, disk3))`. See [disk-advanced.md](disk-advanced.md#raid-5-disk-recovery-via-xor-crypto-cat).\n\
    - **GIMP raw memory dump visual inspection:** When Volatility fails, open `.dmp` in GIMP as raw RGB\
    \ data at monitor width (~1920); scroll to find framebuffer screenshots of user's desktop. See [disk-and-memory.md](disk-and-memory.md#gimp-raw-memory-dump-visual-inspection-inshack-2018).\n\
    - **Kyoto Cabinet hash DB forensics:** Recover key ordering from KC hash database with zeroed keys\
    \ by inserting sequential probe keys and binary-diffing to find which hash slot each overwrites. See\
    \ [disk-advanced.md](disk-advanced.md#kyoto-cabinet-hash-database-forensics-via-incremental-key-insertion-asis-ctf-2018).\n\
    - **PowerShell ransomware:** Extract scripts from minidump, find AES key, decrypt SMTP attachment.\
    \ See [disk-and-memory.md](disk-and-memory.md).\n- **Linux ransomware + memory dump:** If Volatility\
    \ is unreliable, recover AES key via raw-memory candidate scanning and magic-byte validation; re-extract\
    \ zip cleanly to avoid missing files/false negatives. See [disk-advanced.md](disk-advanced.md).\n\
    - **Deleted partitions:** `testdisk` or `kpartx -av`. See [disk-advanced.md](disk-advanced.md).\n\
    - **ZFS forensics:** Reconstruct labels, Fletcher4 checksums, PBKDF2 cracking. See [disk-advanced.md](disk-advanced.md).\n\
    - **BSON reconstruction:** Reassemble BSON (Binary JSON) documents from raw bytes; parse with `bson`\
    \ Python library. See [disk-and-memory.md](disk-and-memory.md#bson-binary-json-format-reconstruction-icectf-2016).\n\
    - **TrueCrypt mounting:** Mount TrueCrypt/VeraCrypt volumes with known password using `veracrypt --mount`\
    \ or `cryptsetup open --type tcrypt`. See [disk-and-memory.md](disk-and-memory.md#truecrypt--veracrypt-volume-mounting-grehack-ctf-2016).\n\
    - **Hardware signals:** VGA/HDMI TMDS/DisplayPort, Voyager audio, Saleae UART decode, Flipper Zero.\
    \ See [signals-and-hardware.md](signals-and-hardware.md).\n- **Caps-lock LED Morse from video:** Track\
    \ caps-lock LED pixel across security camera frames with OpenCV; on/off durations encode Morse code\
    \ (short=dot, long=dash). See [signals-and-hardware.md](signals-and-hardware.md#caps-lock-led-morse-code-extraction-from-video-stem-ctf-2018).\n\
    - **I2C protocol decoding:** Decode I2C bus captures (SDA/SCL lines) to extract data from EEPROM or\
    \ sensor communications. See [signals-and-hardware.md](signals-and-hardware.md#i2c-bus-protocol-decoding-ekoparty-ctf-2016).\n\
    - **Punched card OCR:** Decode IBM-29 punch card images by mapping hole positions to characters using\
    \ standard encoding grid. See [signals-and-hardware.md](signals-and-hardware.md#ibm-29-punched-card-ocr-ekoparty-ctf-2016).\n\
    - **USB HID mouse drawing:** Render relative HID movements per draw mode as bitmap; separate modes,\
    \ skip pen lifts, scale 5-8x. See [peripheral-capture.md](peripheral-capture.md#usb-hid-mousepen-drawing-recovery-ehax-2026).\n\
    - **Side-channel power analysis:** Multi-dimensional power traces (positions × guesses × traces ×\
    \ samples). Average across traces, find sample with max variance, select guess with max power at leak\
    \ point. See [signals-and-hardware.md](signals-and-hardware.md).\n- **Packet interval timing:** Binary\
    \ data encoded as inter-packet delays in PCAP. Two interval values = two bit values. See [network-advanced.md](network-advanced.md).\n\
    - **BMP bitplane QR:** Extract bitplanes 0-2 per RGB channel with NumPy; hidden QR often in bit 1\
    \ (not bit 0). See [stego-image.md](stego-image.md#bmp-bitplane-qr-code-extraction--steghide-bypass-ctf-2025).\n\
    - **Image puzzle reassembly:** Edge-match pixel differences between piece borders, greedy placement\
    \ in grid. See [stego-image.md](stego-image.md#image-jigsaw-puzzle-reassembly-via-edge-matching-bypass-ctf-2025).\n\
    - **DeepSound audio stego with password cracking:** Extract hash with `deepsound2john.py`, crack with\
    \ John, retrieve hidden files from WAV; always check both spectrogram and DeepSound. See [stego-advanced.md](stego-advanced.md#deepsound-audio-steganography-with-password-cracking-inshack-2018).\n\
    - **QR code reconstruction from curved reflection:** Manually reconstruct QR from glass sphere reflection\
    \ in video; flip, de-warp, use known plaintext prefix to fix early bytes, high ECC corrects the rest.\
    \ See [steganography.md](steganography.md#qr-code-reconstruction-from-curved-glass-reflection-in-video-plaidctf-2018).\n\
    - **Audio FFT notes:** Dominant frequencies → musical note names (A-G) spell words. See [stego-advanced.md](stego-advanced.md).\n\
    - **Audio metadata octal:** Exiftool comment with underscore-separated octal numbers → decode to ASCII/base64.\
    \ See [stego-advanced.md](stego-advanced.md).\n- **G-code visualization:** Side projections (XZ/YZ)\
    \ reveal text. See [3d-printing.md](3d-printing.md).\n- **Git directory recovery:** `gitdumper.sh`\
    \ for exposed `.git` dirs. See [linux-forensics.md](linux-forensics.md).\n- **KeePass v4 cracking:**\
    \ Standard `keepass2john` lacks v4/Argon2 support; use `ivanmrsulja/keepass2john` fork or `keepass4brute`.\
    \ Generate wordlists with `cewl`. See [linux-forensics.md](linux-forensics.md).\n- **Cross-channel\
    \ multi-bit LSB:** Different bit positions per RGB channel (R[0], G[1], B[2]) encode hidden data.\
    \ See [stego-advanced.md](stego-advanced.md).\n- **F5 JPEG DCT detection:** Ratio of ±1 to ±2 AC coefficients\
    \ drops from ~3:1 to ~1:1 with F5; sparse images need secondary ±2/±3 metric. See [stego-image.md](stego-image.md#f5-jpeg-dct-coefficient-ratio-detection-apoorvctf-2026).\n\
    - **PNG unused palette stego:** Unused PLTE entries (not referenced by pixels) carry hidden data in\
    \ red channel values. See [stego-image.md](stego-image.md#png-unused-palette-entry-steganography-apoorvctf-2026).\n\
    - **Keyboard acoustic side-channel:** MFCC features from keystroke audio + KNN classification against\
    \ labeled reference. 10ms window captures impact transient. See [signals-and-hardware.md](signals-and-hardware.md).\n\
    - **TCP flag covert channel:** 6 TCP flag bits (FIN/SYN/RST/PSH/ACK/URG) = values 0-63, encoding base64\
    \ characters. Nonsensical flag combos on a consistent dest port = covert data. See [network-advanced.md](network-advanced.md).\n\
    - **Brotli decompression bomb seam:** Compressed bomb has repeating blocks; flag breaks the pattern\
    \ at a seam. Compare adjacent blocks to find discontinuity, decompress only that region. See [network-advanced.md](network-advanced.md).\n\
    - **Git reflog/fsck squash recovery:** `git rebase --squash` leaves orphaned objects recoverable via\
    \ `git fsck --unreachable --no-reflogs`. See [linux-forensics.md](linux-forensics.md).\n- **DNS trailing\
    \ byte binary:** Extra bytes (`0x30`/`0x31`) appended after DNS question structure encode binary bits;\
    \ 8-bit MSB-first chunks → ASCII. See [network-advanced.md](network-advanced.md).\n- **Fake TLS +\
    \ mDNS key + printability merge:** TCP stream disguised as TLS hides ZIP; XOR key from mDNS TXT record;\
    \ merge two decrypted arrays by selecting printable characters. See [network-advanced.md](network-advanced.md).\n\
    - **Seed-based pixel permutation stego:** Deterministic pixel shuffle (Fisher-Yates with known seed)\
    \ + multi-bitplane interleaved LSB extraction from Y channel → hidden QR code. See [stego-image.md](stego-image.md#seed-based-pixel-permutation--multi-bitplane-qr-l3m0nctf-2025).\n\
    - **BTRFS snapshot recovery:** Deleted files persist in BTRFS snapshots/alternate subvolumes. `mount\
    \ -o subvol=@backup` accesses historical copies. See [disk-recovery.md](disk-recovery.md#btrfs-subvolumesnapshot-recovery-bsidessf-2026).\n\
    - **JPEG XL TOC permutation:** JXL's progressive TOC permutation controls tile convergence order during\
    \ partial decode. Truncate at increasing offsets, measure which tiles converge first → convergence\
    \ order encodes flag. See [stego-advanced-2.md](stego-advanced-2.md#jpeg-xl-toc-permutation-steganography-bsidessf-2026).\n\
    - **Kitty terminal graphics:** `ESC_G` protocol embeds zlib-compressed RGB image data in base64 chunks.\
    \ Strip escape sequences, concatenate, decompress, reconstruct. See [steganography.md](steganography.md#kitty-terminal-graphics-protocol-decoding-bsidessf-2026).\n\
    - **ANSI escape sequence stego:** Flag text interleaved between ANSI color codes and braille characters.\
    \ Invisible when rendered; extract by stripping escape sequences and non-ASCII. See [steganography.md](steganography.md#ansi-escape-sequence-steganography-in-terminal-art-bsidessf-2026).\n\
    - **Autostereogram solving:** Duplicate layer, difference blend, shift horizontally ~100px to reveal\
    \ hidden 3D text. See [steganography.md](steganography.md#autostereogram--magic-eye-solving-bsidessf-2026).\n\
    - **Two-layer byte+line interleaving:** Two files byte-interleaved, then scanlines interleaved. Deinterleave\
    \ even/odd bytes first (valid images), then even/odd lines. See [steganography.md](steganography.md#two-layer-byteline-interleaving-bsidessf-2026).\n\
    - **SMB RID recycling:** Guest auth + LSARPC `LsaLookupSids` with incrementing RIDs enumerates AD\
    \ accounts from PCAP. See [network-advanced.md](network-advanced.md#smb-rid-recycling-via-lsarpc-midnight-2026).\n\
    - **Timeroasting (MS-SNTP):** NTP requests with machine RIDs extract HMAC-MD5 hashes from DC; crack\
    \ with hashcat -m 31300. See [network-advanced.md](network-advanced.md#timeroasting--ms-sntp-hash-extraction-midnight-2026).\n\
    - **Android forensics:** Extract APK with `adb pull`, analyze with `apktool`, check `shared_prefs/`\
    \ and SQLite databases in `/data/data/<package>/`. See [disk-and-memory.md](disk-and-memory.md#android-forensics).\n\
    - **Docker container forensics:** `docker save` exports layered tars; deleted files persist in earlier\
    \ layers. `docker history --no-trunc` reveals build secrets. See [disk-and-memory.md](disk-and-memory.md#container-forensics-docker).\n\
    - **Cloud storage forensics:** S3/GCP/Azure versioning preserves deleted objects. `list-object-versions`\
    \ recovers deleted flags. See [disk-and-memory.md](disk-and-memory.md#cloud-storage-forensics-aws-s3--gcp--azure).\n\
    - **APFS snapshot recovery:** Copy-on-write filesystem preserves historical file states in snapshots;\
    \ use `icat` with different XID block offsets to read inodes across transaction IDs. See [disk-advanced.md](disk-advanced.md#apfs-snapshot-historical-file-recovery-srdnlenctf-2026).\n\
    - **Windows KAPE triage:** Pre-collected artifact ZIPs; start with PowerShell history → Amcache →\
    \ MFT → registry hives. See [disk-and-memory.md](disk-and-memory.md#windows-kape-triage-analysis-utctf-2026).\n\
    - **WordPerfect macro XOR:** `.wcm` files contain macros with embedded encrypted data; XOR formula\
    \ `(a+b)-2*(a&b)` = bitwise XOR. See [disk-advanced.md](disk-advanced.md#wordperfect-macro-xor-extraction-srdnlenctf-2026).\n\
    - **TLS master key from coredump:** Search coredump for session ID (from Wireshark handshake); read\
    \ 48 bytes before it as master key. Create Wireshark pre-master-secret log file. See [network.md](network.md#tls-master-key-extraction-from-coredump-plaidctf-2014).\n\
    - **Corrupted git blob repair:** Single-byte corruption changes SHA-1; brute-force each byte position\
    \ (256 × file_size) verifying with `git hash-object`. See [linux-forensics.md](linux-forensics.md#corrupted-git-blob-repair-via-byte-brute-force-csaw-ctf-2015).\n\
    - **Split archive reassembly from PCAP:** Same-sized HTTP-transferred files with MD5-hash names are\
    \ archive fragments; order by Apache directory listing timestamps, concatenate, extract password from\
    \ TCP chat stream. See [network.md](network.md#split-archive-reassembly-from-http-transfers-asis-ctf-finals-2013).\n\
    - **Video frame accumulation:** Video with flashing images at various positions; composite all frames\
    \ (per-pixel maximum) reveals hidden QR code or image. See [stego-advanced-2.md](stego-advanced-2.md#video-frame-accumulation-for-hidden-image-asis-ctf-finals-2013).\n\
    - **Reversed audio:** Garbled audio that sounds like speech played backwards; `sox audio.wav reversed.wav\
    \ reverse` or Audacity Effect → Reverse reveals hidden message. See [stego-advanced-2.md](stego-advanced-2.md#reversed-audio-hidden-message-asis-ctf-finals-2013).\n\
    - **Multi-stream video container stego:** MP4/MKV with multiple video streams; default stream is a\
    \ red herring, flag in secondary stream. `ffprobe -hide_banner file.mp4` to enumerate, `ffmpeg -i\
    \ file.mp4 -map 0:1 -frames:v 1 flag.jpg` to extract. See [steganography.md](steganography.md#multi-stream-video-container-steganography-bsidessf-2026).\n\
    - **FAT16 free space recovery:** Flag hidden in unallocated clusters of FAT16 filesystem. Parse FAT\
    \ table, enumerate free clusters (entry = 0x0000), read data region. See [disk-recovery.md](disk-recovery.md#fat16-free-space-data-recovery-bsidessf-2026).\n\
    - **FAT16 deleted file recovery (fls/icat):** FAT deletion replaces first byte of directory entry\
    \ with `0xE5` but data remains. `fls -r -d image.img` lists deleted entries, `icat image.img <inode>`\
    \ recovers by inode. See [disk-recovery.md](disk-recovery.md#fat16-deleted-file-recovery-via-sleuth-kit-metactf-flash-2026).\n\
    - **Ext2 orphaned inode recovery:** Deleted file leaves orphaned inode; `e2fsck -y disk.img` reconnects\
    \ to `/lost+found`. Also use `debugfs` `lsdel` or `icat`. See [disk-recovery.md](disk-recovery.md#ext2-orphaned-inode-recovery-via-fsck-bsidessf-2026).\n\
    - **Linux input_event keylogger parsing:** 24-byte `struct input_event` binary dump; filter `type==1`\
    \ (EV_KEY), `value==1` (press), map keycodes via `input-event-codes.h`. See [signals-and-hardware.md](signals-and-hardware.md#linux-input_event-keylogger-dump-parsing-pwn2win-2016).\n\
    - **VBA macro cell data to binary:** Excel cells with numeric values; VBA `CByte((val-78)/3)` transforms\
    \ to ELF bytes. Reimplement in Python, never run the macro. See [linux-forensics.md](linux-forensics.md#vba-macro-forensics---excel-cell-data-to-elf-binary-sharif-ctf-2016).\n\
    - **RGB parity steganography:** Sum R+G+B per pixel; even=white, odd=black renders hidden binary bitmap.\
    \ See [stego-image.md](stego-image.md#rgb-parity-steganography-break-in-2016).\n- **Hidden PDF objects:**\
    \ Unreferenced content stream objects not in `/Kids` array. Add to `/Kids`, increment `/Count`, re-render.\
    \ See [network-advanced.md](network-advanced.md#unreferenced-pdf-objects-with-hidden-pages-sharifctf-7-2016).\n\
    - **Arnold's Cat Map descrambling:** Periodic chaotic transform on square images; iterate forward\
    \ map until original reappears. Period divides `3*N`. See [stego-advanced-2.md](stego-advanced-2.md#arnolds-cat-map-image-descrambling-nuit-du-hack-2017).\n\
    - **Python in-memory source recovery:** Attach `pyrasite-shell` to running Python process, decompile\
    \ `func_code` objects with `uncompyle6` (Python <=3.8) or `pycdc` (Python 3.9+), dump `globals()`\
    \ for secrets. See [linux-forensics.md](linux-forensics.md#python-in-memory-source-recovery-via-pyrasite-insomnihack-2017).\n\
    - **HFS+ resource fork recovery:** Hidden data in HFS+ Resource Forks invisible to `binwalk`/`foremost`;\
    \ use HFSExplorer + 010 Editor HFS template to extract extent records. See [disk-advanced.md](disk-advanced.md#hfs-resource-fork-hidden-binary-recovery-confidence-ctf-2017).\n\
    - **Serial UART from WAV audio:** Square wave in audio encodes UART serial data; determine baud rate,\
    \ parse start/stop bits, decode LSB-first byte frames. See [signals-and-hardware.md](signals-and-hardware.md#serial-uart-data-decoding-from-wav-audio-easyctf-2017).\n\
    - **High-resolution SSTV demodulation:** Standard SSTV decoders fail on high-sample-rate recordings;\
    \ use manual FM demodulation via `arccos` + differentiation. See [stego-advanced-2.md](stego-advanced-2.md#high-resolution-sstv-custom-fm-demodulation-plaidctf-2017).\n\
    - **Corrupted ZIP header repair:** Fix filename length fields in both Local File Header (offset 26)\
    \ and Central Directory (offset 28); fallback: brute-force raw deflate at candidate offsets. See [disk-recovery.md](disk-recovery.md#corrupted-zip-repair-via-header-field-manipulation-plaidctf-2017).\n\
    - **SQLite edit history reconstruction:** Replay insert/remove diffs from SQLite diff table to reconstruct\
    \ document at every intermediate state; flag may have been typed then deleted. See [disk-advanced.md](disk-advanced.md#sqlite-edit-history-reconstruction-from-diff-table-google-ctf-2017).\n\
    - **MJPEG FFD9 trailing byte stego:** Extra bytes after JPEG EOI marker (FFD9) in MJPEG frames create\
    \ invisible covert channel; split on FFD8, extract post-FFD9 data. See [stego-advanced-2.md](stego-advanced-2.md#mjpeg-extra-bytes-after-ffd9-steganography-polictf-2017).\n\
    - **USB MIDI Launchpad grid reconstruction:** MIDI Note On/Off in USB PCAP maps to 8x8 Launchpad grid\
    \ (`key = row*16 + col`); reconstruct visual patterns from button press sequences. See [signals-and-hardware.md](signals-and-hardware.md#usb-midi-launchpad-traffic-reconstruction-sthack-2017).\n\
    \n## SMB RID Recycling via LSARPC (Midnight 2026)\n\nEnumerate AD accounts from PCAP by analyzing\
    \ LSARPC `LsaLookupSids` calls with sequential RIDs after Guest auth. Filter: `dcerpc.cn_bind_to_str\
    \ contains lsarpc`.\n\nSee [network-advanced.md](network-advanced.md#smb-rid-recycling-via-lsarpc-midnight-2026)\
    \ for full RPC call sequence and Wireshark filters.\n\n## Timeroasting / MS-SNTP Hash Extraction (Midnight\
    \ 2026)\n\nExtract crackable HMAC-MD5 hashes from MS-SNTP responses by sending NTP requests with machine\
    \ account RIDs. Crack with `hashcat -m 31300`.\n\n```bash\n# Extract NTP payloads, convert to hashcat\
    \ format, crack\ntshark -r capture.pcapng -Y \"ntp && ip.src == <DC_IP>\" -T fields -e udp.payload\n\
    hashcat -m 31300 -a 0 -O hashes.txt rockyou.txt --username\n```\n\nSee [network-advanced.md](network-advanced.md#timeroasting--ms-sntp-hash-extraction-midnight-2026)\
    \ for payload parsing script and full attack chain.\n\n## HTTP Exfiltration in PCAP\n\n**Quick path:**\
    \ `tshark --export-objects http,/tmp/objects` extracts uploaded files instantly. Check for multipart\
    \ POST uploads, unusual User-Agent strings, and exfiltrated files (images with flag text). See [network.md](network.md#http-file-upload-exfiltration-in-pcap-metactf-2026).\n\
    \n## Common Encodings\n\n```bash\necho \"base64string\" | base64 -d\necho \"hexstring\" | xxd -r -p\n\
    # ROT13: tr 'A-Za-z' 'N-ZA-Mn-za-m'\n```\n\n**ROT18:** ROT13 on letters + ROT5 on digits. Common final\
    \ layer in multi-stage forensics. See [linux-forensics.md](linux-forensics.md) for implementation."
