    \ },\n    onLeave(retval) { console.log(\"[*] ret=\" + retval.readUtf8String()); }\n});\n```\n\n**CLI\
    \ 命令：**\n```bash\nfrida -U -f com.app -l script.js --no-pause   # spawn 模式\nfrida -U com.app -l script.js\
    \                   # 附加模式\nfrida-trace -U -f com.app -j \"*!*encrypt*\"      # Java 方法追踪\nfrida-trace\
    \ -U -f com.app -i \"encrypt\"           # Native 函数追踪\nfrida-discover -U -f com.app             \
    \        # 自动发现未知函数\nfrida-ps -Ua                                     # 列出已安装应用\n```\n\n**Stalker（指令级跟踪）：**\
    \ 对目标函数做逐指令跟踪，适用于分析混淆后的加密逻辑。\n\n**Objection 快速操作：**\n```bash\nobjection -g com.app explore\nandroid\
    \ root disable       # 绕过 root 检测\nandroid sslpinning disable # 绕过 SSL 锁定\nandroid hooking list classes\n\
    android hooking watch class com.example.App\n```\n\n### 3.4 Xposed 框架\n\n```java\n// Xposed 模块核心\n\
    public class HookMain implements IXposedHookLoadPackage {\n    public void handleLoadPackage(XC_LoadPackage.LoadPackageParam\
    \ lpparam) {\n        if (!lpparam.packageName.equals(\"com.target\")) return;\n        XposedHelpers.findAndHookMethod(\"\
    com.target.App\", lpparam.classLoader,\n            \"isRooted\", new XC_MethodHook() {\n        \
    \        protected void afterHookedMethod(MethodHookParam param) {\n                    param.setResult(false);\
    \  // 修改返回值\n                }\n            });\n    }\n}\n```\n\n**Frida vs Xposed：** Frida 适合动态快速分析，Xposed\
    \ 适合长期持久使用。\n\n### 3.5 游戏引擎逆向\n\n| 引擎 | 特征 | 逆向方法 |\n|------|------|---------|\n| Unity Mono | Assembly-CSharp.dll\
    \ | dnSpy 直接反编译 |\n| Unity IL2CPP | libil2cpp.so + global-metadata.dat | Il2CppDumper → dump.cs +\
    \ dummyDll |\n| Unreal Engine | libUE4.so | GNames/GObjects dump → SDK 生成 |\n| Cocos2d-x | libcocos2dcpp.so\
    \ | Lua 提取 + Frida hook lua engine |\n\n**IL2CPP 工作流：**\n```\nIl2CppDumper libil2cpp.so global-metadata.dat\
    \ output/\n→ dump.cs (类/方法定义) + script.json (地址映射)\n→ Frida hook: Module.findBaseAddress(\"libil2cpp.so\"\
    ).add(RVA)\n```\n\n### 3.6 反检测绕过\n\n**检测分类体系（通用）：**\n\n| 检测类型 | 方法 | 绕过思路 |\n|---------|------|---------|\n\
    | **签名校名** | 扫描已知工具特征码 | 改名/加壳/混淆 |\n| **内存完整性** | 校验代码段/数据段 CRC | Hook 校验函数 |\n| **进程检测** | 扫描可疑进程/模块\
    \ | 隐藏进程/改名 |\n| **驱动检测** | 检测未签名/可疑驱动 | 使用签名驱动 |\n| **调试器检测** | IsDebuggerPresent/ptrace/时间检测 | Patch/绕过\
    \ |\n| **Hook 检测** | 检测函数入口被修改 | 使用无痕 Hook |\n| **代码完整性** | 校验代码段 Hash | Hook 校验返回值 |\n| **行为分析**\
    \ | 分析操作模式（云端） | 模拟人类行为 |\n\n**Android 反检测方案：**\n\n| 检测类型 | 方案 |\n|---------|------|\n| Root 检测 |\
    \ Magisk DenyList / Shamiko / KernelSU / Frida 脚本 |\n| SSL 锁定 | Frida 脚本 / JustTrustMe / ReFlutter\
    \ (Flutter) |\n| 签名校验 | CorePatch / 手动 patch smali |\n| 模拟器检测 | 修改 `ro.product.model` 等 prop |\n|\
    \ Play Integrity | Play Integrity Fix 模块 |\n| Frida 检测 | Gadget / 改名 frida-server / 反检测脚本 |\n| 调试检测\
    \ | Frida hook `ptrace` / Xposed 绕过 |\n\n> **反外挂系统分析（BattlEye/EAC/Vanguard/VAC 详情）** → game-hacking\
    \ skill `references/anti-cheat.md`\n\n### 3.7 Android 脱壳\n\n加固壳会将原始 DEX 加密，运行时才解密加载到内存。需要在运行时 dump。\n\
    \n| 工具 | 原理 | Root 要求 | 适用加固 |\n|------|------|----------|---------|\n| **FART** | ART 虚拟机 dump（修改\
    \ ROM） | 需要 Root | 通杀大多数壳 |\n| **BlackDex** | 免 Root 脱壳（利用虚拟化） | 无需 Root | 常见加固 |\n| **Frida dump**\
    \ | Hook ClassLoader dump DEX | 需要 Root | 通用 |\n| **Youpk** | 基于 ART 的 DEX dump | 需要刷入 | 强壳 |\n\n\
    **Frida dump DEX：**\n```javascript\nJava.perform(function() {\n    var PathClassLoader = Java.use(\"\
    dalvik.system.PathClassLoader\");\n    PathClassLoader.loadClass.overload('java.lang.String').implementation\
    \ = function(name) {\n        var cls = this.loadClass(name);\n        if (name.indexOf(\"com.target\"\
    ) !== -1) {\n            // 触发 dump：遍历 DEX 文件并写出\n            console.log(\"[*] Loaded class: \" +\
    \ name);\n        }\n        return cls;\n    };\n});\n```\n\n### 3.8 网络抓包（免代理方案）\n\n传统代理抓包在 SSL Pinning\
    \ 场景下无效。以下是免代理方案：\n\n| 工具 | 原理 | Root | 特点 |\n|------|------|------|------|\n| **R0capture** | Frida\
    \ 绕 SSL 直接抓明文 | 需要 | 免代理，抓 SSL 明文 |\n| **PCAPdroid** | VPN 模式抓包 | 不需要 | Android 端 App |\n| **HttpCanary**\
    \ | VPN 模式 HTTP 抓包 | 不需要 | 图形化 |\n| **tcpdump** | 底层抓包 | 需要 | `adb shell tcpdump -i any -w /sdcard/cap.pcap`\
    \ |\n\n**R0capture 使用：**\n```bash\nfrida -U -f com.target.app -l r0capture.js --no-pause\n# 输出 pcap\
    \ 文件，用 Wireshark 打开\n```\n\n### 3.9 ADB 高级用法\n\n```bash\n# App 信息\nadb shell dumpsys package com.target.app\
    \       # 完整包信息\nadb shell dumpsys activity com.target.app       # Activity 信息\nadb shell dumpsys\
    \ meminfo com.target.app        # 内存使用\n\n# 启动组件\nadb shell am start -n com.target.app/.LoginActivity\n\
    adb shell am start -a android.intent.action.VIEW -d \"https://example.com\"\n\n# Package Manager\n\
    adb shell pm list packages -3                   # 第三方应用\nadb shell pm path com.target.app        \
    \        # APK 路径\nadb shell pm dump com.target.app | grep -A5 \"permissions\"\n\n# Content Provider\
    \ 查询\nadb shell content query --uri content://com.target.app/provider\n\n# 数据备份（需应用允许）\nadb backup\
    \ -f backup.ab com.target.app\n# 解包: java -jar abe.jar unpack backup.ab backup.tar\n```\n\n### 3.10\
    \ drozer 安全测试\n\n```bash\n# 连接设备\nadb forward tcp:31415 tcp:31415\ndrozer console connect\n\n# 信息收集\n\
    run app.package.info -a com.target.app          # 包详情\nrun app.package.attacksurface com.target.app\
    \    # 攻击面\nrun app.package.debuggable com.target.app       # 可调试应用列表\n\n# Content Provider 测试\nrun\
    \ scanner.provider.finduris -a com.target.app # 发现可访问 URI\nrun app.provider.query content://com.target.app/users\
    \  # 查询数据\n\n# Activity / Service / Receiver\nrun app.activity.info -a com.target.app\nrun app.activity.start\
    \ --component com.target.app com.target.app.DebugActivity\nrun app.service.info -a com.target.app\n\
    run app.broadcast.info -a com.target.app\n```\n\n### 3.11 Root 方案对比\n\n| 方案 | 原理 | Android 版本 | 特点\
    \ |\n|------|------|-------------|------|\n| **Magisk** | Systemless 修改 boot | 6.0-15 | 主流，Zygisk\
    \ 模块，Hide 功能 |\n| **KernelSU** | 内核级 Root | 11+ | 更隐蔽，内核模块 |\n| **APatch** | 内核补丁 | 11+ | 类似 KernelSU，不同实现\
    \ |\n\n**Magisk 隐藏链路：** Magisk → Zygisk 启用 → DenyList 勾选目标 App → 安装 Shamiko 模块\n\n**Play Integrity\
    \ Fix：** Magisk 模块，通过注入 Google Play 服务伪造设备完整性认证，通过 Play Integrity API 检测。\n\n### 3.12 APK 分析工具补充\n\
    \n| 工具 | 用途 | 命令/入口 |\n|------|------|----------|\n| **APKiD** | 识别壳/混淆器/编译器 | `apkid target.apk`\
    \ |\n| **MobSF** | 自动化安全分析平台 | `docker run -p 8000:8000 opensecurity/mobsf` |\n| **Quark-Engine**\
    \ | Android 恶意行为分析 | Python 库，量化恶意评分 |\n| **APK Analyzer** | Android Studio 内置 | Build → Analyze APK\
    \ |\n\n```bash\n# APKiD 识别\npip install apkid\napkid target.apk\n# 输出: packer/compiler/obfuscator\
    \ 信息\n\n# MobSF 自动化分析\n# 上传 APK → 自动生成安全报告（权限、API调用、硬编码密钥等）\n```\n\n### 3.13 SO 文件分析\n\nNative SO\
    \ 是 Android 逆向的重要目标（加密、签名校验常在 SO 中）。\n\n```bash\n# 基本信息\nfile libtarget.so                       \
    \    # 架构识别\nreadelf -h libtarget.so                     # ELF 头\nreadelf -s libtarget.so | grep -i\
    \ encrypt   # 符号表搜索\nreadelf -d libtarget.so                     # 动态依赖\n\n# 导出函数（JNI 注册）\nreadelf\
    \ -s libtarget.so | grep Java_        # JNI 函数\nreadelf -s libtarget.so | grep -E \"(encrypt|decrypt|sign|verify|key)\"\
    \n```\n\n**IDA 分析 Android SO：**\n```\n1. 打开 SO → 选择 ARM/ARM64 架构\n2. 搜索字符串: \"encrypt\", \"key\",\
    \ \"secret\", \"JNI\"\n3. 搜索 JNI_OnLoad → 通常有动态注册和反调试\n4. 关注 RegisterNatives 调用 → 动态注册的 native 方法\n\
    5. F5 伪代码 → 分析加密逻辑\n```\n\n**JNI 函数识别：**\n```\n静态注册: Java_com_example_App_encrypt → 直接搜索函数名\n动态注册:\
    \ JNI_OnLoad 中 RegisterNatives → 搜索 RegisterNatives 调用\n```\n\n### 3.14 SSL Pinning 绕过（完整方案）\n\n|\
    \ App 类型 | 绕过方案 |\n|---------|---------|\n| 标准 Java/OkHttp | Frida SSL 脚本 / LSPosed JustTrustMe |\n\
    | Network Security Config | APK 重打包修改 res/xml/network_security_config.xml |\n| Flutter | ReFlutter\
    \ 修改 libflutter.so |\n| 自定义 SSL | 逆向 SO 中的 SSL 验证函数并 Hook |\n\n> **完整 Frida 脚本、Xposed 模板、IL2CppDumper\
    \ 流程、脱壳脚本** → **references/mobile-re.md**\n\n## 第四部分：协议与接口逆向\n\n### 4.1 流量捕获\n\n| 协议 | 工具 | 方法 |\n\
    |------|------|------|\n| HTTP/HTTPS | mitmproxy / Burp Suite | 代理拦截 + SSL 绕过 |\n| WebSocket | DevTools\
    \ / mitmproxy | WS 面板 / addon 脚本 |\n| TCP/UDP | Wireshark / tcpdump | 抓包过滤器 |\n| BLE | nRF Sniffer\
    \ + Wireshark | GATT 服务分析 |\n| USB | USBPcap + Wireshark | 设备通信分析 |\n\n**mitmproxy 脚本：**\n```python\n\
    from mitmproxy import http, ctx\nclass LogAddon:\n    def request(self, flow: http.HTTPFlow):\n  \
    \      ctx.log.info(f\"[REQ] {flow.request.method} {flow.request.url}\")\n    def response(self, flow:\
    \ http.HTTPFlow):\n        ctx.log.info(f\"[RSP] {flow.response.status_code}\")\n```\n\n### 4.2 协议结构分析\n\
    \n**识别模式：**\n```\n┌──────────┬──────────┬──────────────────────┐\n│  Header  │  Length  │     Payload\
    \          │\n│ (固定)    │ (变长)    │  (Length 指定)        │\n└──────────┴──────────┴──────────────────────┘\n\
    \n长度字段: 固定长度 / TLV / 分隔符 / 长度前缀\n字节序: 大端(网络标准) / 小端(x86)\n```\n\n**Python struct 解析：**\n```python\n\
    import struct\nmsg_type, msg_len = struct.unpack('>HH', data[:4])  # 大端 2x16位\npayload = data[4:4+msg_len]\n\
    ```\n\n### 4.3 序列化格式逆向\n\n| 格式 | 识别特征 | 解码工具 |\n|------|---------|---------|\n| Protobuf | `0x0a`\
    \ 开头，varint 编码 | `protoc --decode_raw` / blackboxprotobuf |\n| MessagePack | `0xc0-0xdf` 前缀 | msgpack\
    \ Python 库 |\n| Thrift | `0x80` 开头 | Thrift IDL |\n| CBOR | major type 前 3 bit | cbor2 Python 库 |\n\
    \n**Protobuf 逆向（无需 .proto）：**\n```python\nimport blackboxprotobuf\ndata = open('sample.bin', 'rb').read()\n\
    message, typedef = blackboxprotobuf.decode_message(data)\n```\n\n**gRPC 反射：**\n```bash\ngrpcurl -plaintext\
    \ localhost:50051 list              # 列出服务\ngrpcurl -plaintext localhost:50051 describe pkg.Svc  #\
    \ 描述服务\n```\n\n### 4.4 协议重放\n\n```python\nfrom scapy.all import *\npkt = IP(dst=\"10.0.0.1\") / TCP(dport=8080)\
    \ / Raw(load=b\"\\x01\\x00\\x05hello\")\nresp = sr1(pkt)\n```\n\n### 4.5 协议文档化\n\n**字段表模板：**\n```markdown\n\
    | 偏移 | 长度 | 类型 | 字段名 | 说明 |\n|------|------|------|--------|------|\n| 0x00 | 2 | uint16 BE | msg_type\
    \ | 消息类型 |\n| 0x02 | 2 | uint16 BE | msg_len | 数据长度 |\n```\n\n> **Wireshark 过滤器、Scapy 示例、Protobuf\
    \ 详解、Lua dissector 模板** → **references/protocol-re.md**\n## 统一工具速查表\n\n### 静态分析\n\n| 工具 | 用途 | 适用领域\
    \ |\n|------|------|---------|\n| **IDA Pro** | 反汇编、伪代码、脚本 | 二进制 |\n| **Ghidra** | 免费反编译器（NSA 出品）\
