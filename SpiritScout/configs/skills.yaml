- skill_id: ctf-malware
  domain: ctf
  description: Provides malware analysis and network traffic techniques for CTF challenges. Use when analyzing
    obfuscated scripts, malicious packages, custom crypto protocols, C2 traffic, PE/.NET binaries, RC4/AES
    encrypted communications, YARA rules, shellcode analysis, memory forensics for malware (Volatility
    malfind, process injection detection), anti-analysis techniques (VM/sandbox detection, timing evasion,
    API hashing, process injection, environment checks), or extracting malware configurations and indicators
    of compromise.
  body: "# CTF Malware & Network Analysis\n\nQuick reference for malware analysis CTF challenges. Each\
    \ technique has a one-liner here; see supporting files for full details with code.\n\n## Prerequisites\n\
    \n**Python packages (all platforms):**\n```bash\npip install yara-python pefile capstone oletools\
    \ unicorn pycryptodome \\\n  volatility3 dissect.cobaltstrike\n```\n\n**Linux (apt):**\n```bash\n\
    apt install strace ltrace tshark binwalk binutils\n```\n\n**macOS (Homebrew):**\n```bash\nbrew install\
    \ wireshark binwalk binutils ghidra\n```\n\n**Manual install:**\n- dnSpy — [GitHub](https://github.com/dnSpy/dnSpy),\
    \ .NET decompiler (Windows)\n\n## Additional Resources\n\n- [scripts-and-obfuscation.md](scripts-and-obfuscation.md)\
    \ - JavaScript deobfuscation, PowerShell analysis, eval/base64 decoding, junk code detection, hex\
    \ payloads, Debian package analysis, dynamic analysis techniques (strace/ltrace, network monitoring,\
    \ memory string extraction, automated sandbox execution), YARA rules for malware detection, shellcode\
    \ analysis (Unicorn Engine, Capstone), memory forensics for malware (Volatility 3 malfind, process\
    \ injection detection), anti-analysis techniques (VM detection, timing evasion, API hashing, process\
    \ injection), trojanized plugin analysis with custom alphabet C2 decoding\n- [c2-and-protocols.md](c2-and-protocols.md)\
    \ - C2 traffic patterns, custom crypto protocols, RC4 WebSocket, DNS-based C2, network indicators,\
    \ PCAP analysis, AES-CBC, encryption ID, Telegram bot recovery, Poison Ivy RAT Camellia decryption\n\
    - [pe-and-dotnet.md](pe-and-dotnet.md) - PE analysis (peframe, pe-sieve, pestudio), .NET analysis\
    \ (dnSpy, AsmResolver), LimeRAT extraction, sandbox evasion, malware config extraction, PyInstaller+PyArmor\n\
    \n---\n\n## When to Pivot\n\n- If the sample is really just a normal crackme, packed challenge binary,\
    \ or custom VM with no malware behavior, switch to `/ctf-reverse`.\n- If the main job is network reconstruction,\
    \ disk carving, or host artifact recovery, switch to `/ctf-forensics`.\n- If the challenge turns into\
    \ public attribution or infrastructure tracing, switch to `/ctf-osint`.\n\n## Quick Start Commands\n\
    \n```bash\n# Static analysis\nfile suspicious_file\nstrings -n 8 suspicious_file | head -50\nxxd suspicious_file\
    \ | head -20\n\n# PE analysis\npython3 -c \"import pefile; pe=pefile.PE('mal.exe'); print(pe.dump_info())\"\
    \ | head\npeframe mal.exe\n\n# Dynamic analysis (sandboxed!)\nstrace -f -s 200 ./suspicious 2>&1 |\
    \ head -100\nltrace ./suspicious 2>&1 | head -50\n\n# Network indicators\nstrings suspicious_file\
    \ | grep -E '[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}'\nstrings suspicious_file | grep -iE\
    \ 'http|ftp|ws://'\n\n# YARA scan\nyara -r rules.yar suspicious_file\n```\n\n## Obfuscated Scripts\n\
    \n- Replace `eval`/`bash` with `echo` to print underlying code; extract base64/hex blobs and analyze\
    \ with `file`. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md).\n\n## JavaScript & PowerShell\
    \ Deobfuscation\n\n- JS: Replace `eval` with `console.log`, decode `unescape()`, `atob()`, `String.fromCharCode()`.\n\
    - PowerShell: Decode `-enc` base64, replace `IEX` with output. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md).\n\
    \n## Junk Code Detection\n\n- NOP sleds, push/pop pairs, dead writes, unconditional jumps to next\
    \ instruction. Filter to extract real `call` targets. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md).\n\
    \n## PCAP & Network Analysis\n\n```bash\ntshark -r file.pcap -Y \"tcp.stream eq X\" -T fields -e tcp.payload\n\
    ```\n\nLook for C2 on unusual ports. Extract IPs/domains with `strings | grep`. See [c2-and-protocols.md](c2-and-protocols.md).\n\
    \n## Custom Crypto Protocols\n\n- Stream ciphers share keystream state for both directions; concatenate\
    \ ALL payloads chronologically.\n- ChaCha20 keystream extraction: send nullbytes (0 XOR anything =\
    \ anything). See [c2-and-protocols.md](c2-and-protocols.md).\n\n## C2 Traffic Patterns\n\n- Beaconing,\
    \ DGA, DNS tunneling, HTTP(S) with custom headers, encoded payloads. See [c2-and-protocols.md](c2-and-protocols.md).\n\
    \n## RC4-Encrypted WebSocket C2\n\n- Remap port with `tcprewrite`, add RSA key for TLS decryption,\
    \ find RC4 key in binary. See [c2-and-protocols.md](c2-and-protocols.md).\n\n## Identifying Encryption\
    \ Algorithms\n\n- AES: `0x637c777b` S-box; ChaCha20: `expand 32-byte k`; TEA/XTEA: `0x9E3779B9`; RC4:\
    \ sequential S-box init. See [c2-and-protocols.md](c2-and-protocols.md).\n\n## AES-CBC in Malware\n\
    \n- Key = MD5/SHA256 of hardcoded string; IV = first 16 bytes of ciphertext. See [c2-and-protocols.md](c2-and-protocols.md).\n\
    \n## PE Analysis\n\n```bash\npeframe malware.exe      # Quick triage\npe-sieve                 # Runtime\
    \ analysis\npestudio                 # Static analysis (Windows)\n```\n\nSee [pe-and-dotnet.md](pe-and-dotnet.md).\n\
    \n## .NET Malware Analysis\n\n- Use dnSpy/ILSpy for decompilation; AsmResolver for programmatic analysis.\
    \ LimeRAT C2: AES-256-ECB with MD5-derived key. See [pe-and-dotnet.md](pe-and-dotnet.md).\n\n## Malware\
    \ Configuration Extraction\n\n- Check .data section, PE/.NET resources, registry keys, encrypted config\
    \ files. See [pe-and-dotnet.md](pe-and-dotnet.md).\n\n## Sandbox Evasion Checks\n\n- VM detection,\
    \ debugger detection, timing checks, environment checks, analysis tool detection. See [pe-and-dotnet.md](pe-and-dotnet.md).\n\
    \n## Anti-Analysis Techniques\n\nVM detection (CPUID, MAC prefix, registry, disk size), timing evasion\
    \ (sleep/RDTSC sandbox detection), API hashing (ROR13/DJB2/CRC32 + hashdb lookup), process injection\
    \ (hollowing, APC, CreateRemoteThread), environment checks. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md#anti-analysis-techniques).\n\
    \n## Trojanized Plugin Analysis\n\nDiff malicious plugin against official release to find injected\
    \ code in try/except blocks. Custom alphabet rotation (`C[(C.index(ch) - offset) % len(C)]`) decodes\
    \ C2 domain, XOR decodes endpoint path. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md#trojanized-plugin-analysis-with-custom-alphabet-c2-decoding-inshack-2018).\n\
    \n## PyInstaller + PyArmor Unpacking\n\n- `pyinstxtractor.py` to extract, PyArmor-Unpacker for protected\
    \ code. See [pe-and-dotnet.md](pe-and-dotnet.md).\n\n## Telegram Bot Evidence Recovery\n\n- Use bot\
    \ token from malware source to call `getUpdates` and `getFile` APIs. See [c2-and-protocols.md](c2-and-protocols.md).\n\
    \n## Debian Package Analysis\n\n```bash\nar -x package.deb && tar -xf control.tar.xz  # Check postinst\
    \ scripts\n```\n\nSee [scripts-and-obfuscation.md](scripts-and-obfuscation.md).\n\n## YARA Rules for\
    \ Malware Detection\n\nWrite YARA rules to match byte patterns, strings, and regex against files or\
    \ memory dumps. Detect XOR loops (`{31 ?? 80 ?? ?? 4? 75}`), base64 blobs, encoded PowerShell. Use\
    \ `yarac` to compile for faster scanning. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md#yara-rules-for-malware-detection).\n\
    \n## Shellcode Analysis\n\nDisassemble with `objdump -b binary -m i386:x86-64`, emulate with Unicorn\
    \ Engine (hook syscalls safely), or use Capstone for programmatic disassembly. Look for XOR decoder\
    \ stubs. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md#shellcode-analysis).\n\n## Memory\
    \ Forensics for Malware\n\n`vol windows.malfind` detects injected code (PAGE_EXECUTE_READWRITE without\
    \ mapped file). `windows.pstree` reveals suspicious parent-child relationships. YARA scan memory with\
    \ `windows.vadyarascan.VadYaraScan`. See [scripts-and-obfuscation.md](scripts-and-obfuscation.md#memory-forensics-for-malware).\n\
    \n## Network Indicators Quick Reference\n\n```bash\nstrings malware | grep -E '[0-9]{1,3}\\.[0-9]{1,3}\\\
    .[0-9]{1,3}\\.[0-9]{1,3}'\ntshark -r capture.pcap -Y \"dns.qry.name\" -T fields -e dns.qry.name |\
    \ sort -u\n```"
  source: ctf-malware
  path: ctf-malware/SKILL.md
- skill_id: ctf-misc
  domain: ctf
  description: Provides miscellaneous CTF challenge techniques for problems that do not cleanly fit the
    main categories. Use for encoding puzzles, pyjails, bash jails, RF/SDR, DNS oddities, unicode tricks,
    esoteric languages, QR or audio puzzles, constraint solving, game theory, unusual sandbox escapes,
    and hybrid logic puzzles. Prefer a more specific skill first when the challenge is mainly web, pwn,
    reverse, forensics, malware, OSINT, or crypto. Treat this as the fallback skill for genuine cross-category
    or edge-case challenges, not the default starting point.
  body: "# CTF Miscellaneous\n\nQuick reference for miscellaneous CTF challenges. Each technique has a\
    \ one-liner here; see supporting files for full details.\n\n## Prerequisites\n\n**Python packages\
    \ (all platforms):**\n```bash\npip install \"pwntools==4.15.0\" \"segno==1.6.2\" z3-solver Pillow\
    \ numpy requests dnslib\n```\n\n**Linux (apt):**\n```bash\napt install libzbar0 qrencode ffmpeg\n\
    ```\n\n**macOS (Homebrew):**\n```bash\nbrew install ffmpeg qrencode\n```\n\n**Manual install:**\n\
    - SageMath — Linux: `apt install sagemath`, macOS: `brew install --cask sage`\n\n## Additional Resources\n\
    \n- [pyjails.md](pyjails.md) - Python jail/sandbox escape techniques, quine context detection, restricted\
    \ character repunit decomposition, func_globals module chain traversal, restricted charset number\
    \ generation, class attribute persistence, f-string config injection via stored eval\n- [bashjails.md](bashjails.md)\
    \ - Bash jail/restricted shell escape techniques, HISTFILE file read trick, bash -v verbose mode,\
    \ ctypes.sh direct C library calls\n- [encodings.md](encodings.md) - Encodings, QR codes, esolangs,\
    \ UTF-16 tricks, BCD encoding, multi-layer auto-decoding, indexed directory QR reassembly, multi-stage\
    \ URL encoding chains\n- [encodings-advanced.md](encodings-advanced.md) - Verilog/HDL, Gray code cyclic\
    \ encoding, RTF custom tag extraction, SMS PDU decoding, multi-encoding sequential solvers, UTF-9,\
    \ pixel binary encoding, hexadecimal Sudoku + QR assembly, TOPKEK, MaxiCode\n- [rf-sdr.md](rf-sdr.md)\
    \ - RF/SDR/IQ signal processing (QAM-16, carrier recovery, timing sync)\n- [dns.md](dns.md) - DNS\
    \ exploitation (ECS spoofing, NSEC walking, IXFR, rebinding, tunneling)\n- [games-and-vms.md](games-and-vms.md)\
    \ - WASM patching, Roblox place file reversing, PyInstaller, marshal analysis, Python env RCE, Z3\
    \ (including boolean logic gate network SAT solving), K8s RBAC, floating-point precision exploitation,\
    \ custom assembly language sandbox escape via Python MRO chain\n- [games-and-vms-2.md](games-and-vms-2.md)\
    \ - Cookie checkpoint game brute-forcing, Flask cookie game state leakage, WebSocket game manipulation,\
    \ server time-only validation bypass, De Bruijn sequence, Brainfuck instrumentation, WASM linear memory\
    \ manipulation\n- [games-and-vms-3.md](games-and-vms-3.md) - memfd_create packed binaries, multi-phase\
    \ crypto games with HMAC commitment-reveal and GF(256) Nim, emulator ROM-switching state preservation,\
    \ Python marshal code injection, Benford's Law bypass, parallel connection oracle relay, nonogram\
    \ solver pipelines, 100 prisoners problem, C code jail escape via emoji identifiers, BuildKit daemon\
    \ build secret exploitation, Docker container escape, Levenshtein distance oracle attack, taint analysis\
    \ bypass via type coercion, shredded document pixel-edge reassembly\n- [games-and-vms-4.md](games-and-vms-4.md)\
    \ - Part 4 (2018-era): XSLT as Turing-complete VM, JavaScript MAX_SAFE_INTEGER successor equality,\
    \ binary search oracle in comparison-only DSL, blind SQLi via script-engine timeout error, OEIS sequence\
    \ lookup automation, QR code reassembly from format-string constraints, matrix exponentiation for\
    \ Fibonacci recurrence, Tribonacci for frog-jump counting, Selenium + Tesseract dynamic CAPTCHA, Brainfuck→Piet\
    \ multi-layer polyglot, bytebeat synth code recognition\n- [linux-privesc.md](linux-privesc.md) -\
    \ Sudo wildcard parameter injection (fnmatch), crafted pcap for sudoers.d, monit confcheck process\
    \ injection, Apache -d override, backup cronjob SUID, PostgreSQL COPY TO PROGRAM RCE, PostgreSQL backup\
    \ credential extraction, NFS share exploitation, SSH Unix socket tunneling, PaperCut Print Deploy\
    \ privesc, Squid proxy pivoting, Zabbix admin password reset via MySQL, WinSSHTerm credential decryption\n\
    - [ctfd-navigation.md](ctfd-navigation.md) - CTFd platform API navigation without browser: detection,\
    \ token auth, challenge listing, file download, flag submission, scoreboard, hints, notifications,\
    \ Python client class\n\n---\n\n## When to Pivot\n\n- If the puzzle is actually centered on cryptography\
    \ or number theory, switch to `/ctf-crypto`.\n- If the challenge is a real binary exploit instead\
    \ of a jail, toy VM, or encoding problem, switch to `/ctf-pwn` or `/ctf-reverse`.\n- If the input\
    \ is mostly files, images, audio, or packet captures that need recovery work first, switch to `/ctf-forensics`.\n\
    - For ML/AI techniques (model attacks, adversarial examples, LLM jailbreaking), see `/ctf-ai-ml`.\n\
    - If the NodeJS sandbox uses **vm2** (`npm ls vm2`), check for **CVE-2023-37466** via `Promise[@@species]`\
    \ with `nesting:true` — the exception handler escapes the context; see `ctf-web/js-sandbox` for the\
    \ full exploit chain. In misc challenges with bundled JS, always run `npm ls vm2` to detect vulnerable\
    \ vm2 before trying other escapes.\n\n## Quick Start Commands\n\n```bash\n# File identification\n\
    file mystery_file\nxxd mystery_file | head -5\npython3 -c \"import magic; print(magic.from_file('mystery_file'))\"\
    \n\n# Encoding detection\npython3 -c \"import base64; print(base64.b64decode('<data>'))\"\necho '<data>'\
    \ | base64 -d\necho '<hex>' | xxd -r -p\n\n# QR code\nzbarimg qr.png\npython3 -c \"from pyzbar.pyzbar\
    \ import decode; from PIL import Image; print(decode(Image.open('qr.png')))\"\n\n# Z3 constraint solving\n\
    python3 -c \"from z3 import *; x=BitVec('x',32); s=Solver(); s.add(x^0xdead==0xbeef); s.check(); print(s.model())\"\
    \n\n# Python jail test\npython3 -c \"__import__('os').system('id')\"\n```\n\n## General Tips\n\n-\
    \ Read all provided files carefully\n- Check file metadata, hidden content, encoding\n- Power Automate\
    \ scripts may hide API calls\n- Use binary search when guessing multiple answers\n\n## Common Encodings\n\
    \n```bash\n# Base64\necho \"encoded\" | base64 -d\n\n# Base32 (A-Z2-7=)\necho \"OBUWG32D...\" | base32\
    \ -d\n\n# Hex\necho \"68656c6c6f\" | xxd -r -p\n\n# ROT13\necho \"uryyb\" | tr 'a-zA-Z' 'n-za-mN-ZA-M'\n\
    ```\n\n**Identify by charset:**\n- Base64: `A-Za-z0-9+/=`\n- Base32: `A-Z2-7=` (no lowercase)\n- Hex:\
    \ `0-9a-fA-F`\n\nSee [encodings.md](encodings.md) for Caesar brute force, URL encoding, and full details.\n\
    \n## IEEE-754 Float Encoding (Data Hiding)\n\n**Pattern (Floating):** Numbers are float32 values hiding\
    \ raw bytes.\n\n**Key insight:** A 32-bit float is just 4 bytes interpreted as a number. Reinterpret\
    \ as raw bytes -> ASCII.\n\n```python\nimport struct\nfloats = [1.234e5, -3.456e-7, ...]  # Whatever\
    \ the challenge gives\nflag = b''\nfor f in floats:\n    flag += struct.pack('>f', f)\nprint(flag.decode())\n\
    ```\n\n**Variations:** Double `'>d'`, little-endian `'<f'`, mixed. See [encodings.md](encodings.md)\
    \ for CyberChef recipe.\n\n## USB Mouse PCAP Reconstruction\n\n**Pattern (Hunt and Peck):** USB HID\
    \ mouse traffic captures on-screen keyboard typing. Use USB-Mouse-Pcap-Visualizer, extract click coordinates\
    \ (falling edges), cumsum relative deltas for absolute positions, overlay on OSK image.\n\n## File\
    \ Type Detection\n\n```bash\nfile unknown_file\nxxd unknown_file | head\nbinwalk unknown_file\n```\n\
    \n## Archive Extraction\n\n```bash\n7z x archive.7z           # Universal\ntar -xzf archive.tar.gz\
    \   # Gzip\ntar -xjf archive.tar.bz2  # Bzip2\ntar -xJf archive.tar.xz   # XZ\n```\n\n### Nested Archive\
    \ Script\n```bash\nwhile f=$(ls *.tar* *.gz *.bz2 *.xz *.zip *.7z 2>/dev/null|head -1) && [ -n \"\
    $f\" ]; do\n    7z x -y \"$f\" && rm \"$f\"\ndone\n```\n\n## QR Codes\n\n```bash\nzbarimg qrcode.png\
    \       # Decode\nqrencode -o out.png \"data\"\n```\n\n**MaxiCode barcode:** Hexagonal 2D barcode\
    \ with bullseye center; decode with `zxing` (Java) since standard QR decoders fail. See [encodings-advanced.md](encodings-advanced.md#maxicode-2d-barcode-decoding-csaw-ctf-2016).\n\
    \n**TOPKEK encoding:** CTF-specific binary encoding where `KEK=0`, `TOP=1`, `!` suffix = repeat count.\
    \ See [encodings-advanced.md](encodings-advanced.md#topkek-binary-encoding-hack-the-vote-2016).\n\n\
    See [encodings.md](encodings.md) for QR structure, repair techniques, chunk reassembly (structural\
    \ and indexed-directory variants), and multi-stage URL encoding chains.\n\n## Audio Challenges\n\n\
    ```bash\nsox audio.wav -n spectrogram  # Visual data\nqsstv                          # SSTV decoder\n\
    ```\n\n## RF / SDR / IQ Signal Processing\n\nSee [rf-sdr.md](rf-sdr.md) for full details (IQ formats,\
    \ QAM-16 demod, carrier/timing recovery).\n\n**Quick reference:**\n- **cf32**: `np.fromfile(path,\
    \ dtype=np.complex64)` | **cs16**: int16 reshape(-1,2) | **cu8**: RTL-SDR raw\n- Circles in constellation\
    \ = constant frequency offset; Spirals = drifting frequency + gain instability\n- 4-fold ambiguity\
    \ in DD carrier recovery - try 0/90/180/270 rotation\n\n## pwntools Interaction\n\n```python\nfrom\
    \ pwn import *\n\nr = remote('host', port)\nr.recvuntil(b'prompt: ')\nr.sendline(b'answer')\nr.interactive()\n\
    ```\n\n## Python Jail Quick Reference\n\n- **Oracle pattern:** `L()` = length, `Q(i,x)` = compare,\
    \ `S(guess)` = submit. Linear or binary search.\n- **Walrus bypass:** `(abcdef := \"new_chars\")`\
    \ reassigns constraint vars\n- **Decorator bypass:** `@__import__` + `@func.__class__.__dict__[__name__.__name__].__get__`\
    \ for no-call, no-quotes escape\n- **String join:** `open(''.join(['fl','ag.txt'])).read()` when `+`\
    \ is blocked\n\nSee [pyjails.md](pyjails.md) for full techniques.\n\n## Z3 / Constraint Solving\n\n\
    ```python\nfrom z3 import *\nflag = [BitVec(f'f{i}', 8) for i in range(FLAG_LEN)]\ns = Solver()\n\
    # Add constraints, check sat, extract model\n```\n\nSee [games-and-vms.md](games-and-vms.md) for YARA\
    \ rules, type systems as constraints, boolean logic gate network SAT solving.\n\n## Hash Identification\n\
    \nMD5: `0x67452301` | SHA-256: `0x6a09e667` | MurmurHash64A: `0xC6A4A7935BD1E995`\n\n## SHA-256 Length\
    \ Extension Attack\n\nMAC = `SHA-256(SECRET || msg)` with known msg/hash -> forge valid MAC via `hlextend`.\
    \ Vulnerable: SHA-256, MD5, SHA-1. NOT: HMAC, SHA-3.\n\n```python\nimport hlextend\nsha = hlextend.new('sha256')\n\
    new_data = sha.extend(b'extension', b'original_message', len_secret, known_hash_hex)\n```\n\n## Technique\
    \ Quick References\n\n- **PyInstaller:** `pyinstxtractor.py packed.exe`. See [games-and-vms.md](games-and-vms.md)\
    \ for opcode remapping.\n- **Marshal:** `marshal.load(f)` then `dis.dis(code)`. See [games-and-vms.md](games-and-vms.md).\n\
    - **Python env RCE:** `PYTHONWARNINGS=ignore::antigravity.Foo::0` + `BROWSER=\"cmd\"`. See [games-and-vms.md](games-and-vms.md).\n\
    - **WASM patching:** `wasm2wat` -> flip minimax -> `wat2wasm`. See [games-and-vms.md](games-and-vms.md).\n\
    - **Float precision:** Large multipliers amplify FP errors into exploitable fractions. See [games-and-vms.md](games-and-vms.md).\n\
    - **K8s RBAC bypass:** SA token -> impersonate -> hostPath mount -> read secrets. See [games-and-vms.md](games-and-vms.md).\n\
    - **Cookie checkpoint:** Save session cookies before guesses, restore on failure to brute-force without\
    \ reset. See [games-and-vms-2.md](games-and-vms-2.md).\n- **Flask cookie game state:** `flask-unsign\
    \ -d -c '<cookie>'` decodes unsigned Flask sessions, leaking game answers. See [games-and-vms-2.md](games-and-vms-2.md).\n\
    - **WebSocket teleport:** Modify `player.x`/`player.y` in console, call verification function. See\
    \ [games-and-vms-2.md](games-and-vms-2.md).\n- **Time-only validation:** Start session, `time.sleep(required_seconds)`,\
    \ submit win. See [games-and-vms-2.md](games-and-vms-2.md).\n- **Quine context detection:** Dual-purpose\
    \ quine that prints itself (passes validation) and runs payload only in server process via globals\
    \ gate. See [pyjails.md](pyjails.md).\n- **Repunit decomposition:** Decompose target integer into\
    \ sum of repunits (1, 11, 111, ...) using only 2 characters (`1` and `+`) for restricted eval. See\
    \ [pyjails.md](pyjails.md).\n- **De Bruijn sequence:** B(k, n) contains all k^n possible n-length\
    \ strings as substrings; linearize by appending first n-1 chars. See [games-and-vms-2.md](games-and-vms-2.md).\n\
    - **Brainfuck instrumentation:** Instrument BF interpreter to track tape cells, brute-force flag character-by-character\
    \ via validation cell. See [games-and-vms-2.md](games-and-vms-2.md).\n- **WASM memory manipulation:**\
    \ Patch WASM linear memory at runtime to set game state variables directly, bypassing game logic.\
    \ See [games-and-vms-2.md](games-and-vms-2.md).\n- **Lua sandbox escape:** Bypass `load()`/`os.execute()`\
    \ filters via `os[\"execute\"]` table indexing or `loadstring` alias. See [games-and-vms.md](games-and-vms.md#lua-sandbox-escape-via-function-name-injection-csaw-ctf-2016).\n\
    - **C code jail via emoji + gadget embedding:** When only emoji and punctuation are allowed in C,\
    \ use `(\U0001F603==\U0001F603)` as constant 1, build integers, embed gadgets in `add eax, imm32`\
    \ constants, jump to offset+1 for shellcode primitives. See [games-and-vms-3.md](games-and-vms-3.md#c-code-jail-escape-via-emoji-identifiers-and-gadget-embedding-midnight-flag-2026).\n\
    - **Emulator ROM-switching:** `/load` replaces ROM but preserves CPU state (registers, RAM, PC). Switch\
    \ ROMs at specific PCs to combine INIT from one ROM with display instructions from another → read\
    \ protected memory. See [games-and-vms-3.md](games-and-vms-3.md#emulator-rom-switching-state-preservation-bsidessf-2026).\n\
    - **BuildKit daemon exploitation:** Exposed BuildKit gRPC allows nested `buildctl build` with `--mount=type=secret`\
    \ to read build secrets. Two-stage Dockerfile: install buildctl → submit nested build mounting flag\
    \ secret. See [games-and-vms-3.md](games-and-vms-3.md#buildkit-daemon-exploitation-for-build-secrets-bsidessf-2026).\n\
    - **Docker container escape:** Privileged breakout via host device mount, docker.sock socket escape,\
    \ CAP_SYS_ADMIN cgroup release_agent, container info leakage via /proc and overlayfs. See [games-and-vms-3.md](games-and-vms-3.md#docker-container-escape-techniques).\n\
    - **Taint analysis bypass via type coercion:** In custom ML-like languages with secrecy/taint systems,\
    \ if-expression secrecy depends on return type not condition — coerce side-effecting functions to\
    \ private type to leak private data through public mutable refs. See [games-and-vms-3.md](games-and-vms-3.md#taint-analysis-bypass-in-custom-language-via-type-coercion-plaidctf-2018).\n\
    - **Shredded document pixel-edge reassembly:** Encode each strip's left/right edge as binary bitmask\
    \ (dark=1), use XOR + popcount Hamming distance to greedily place strips by minimum edge distance\
    \ for sub-second reassembly. See [games-and-vms-3.md](games-and-vms-3.md#shredded-document-pixel-edge-reassembly-under-time-pressure-nuit-du-hack-ctf-2018).\n\
    - **f-string config injection via stored eval:** Store payload as config value, create key named `eval(stored_key)`\
    \ — f-string rendering evaluates the key name expression, triggering RCE. See [pyjails.md](pyjails.md#python-f-string-config-injection-via-stored-eval-inshack-2018).\n\
    - **Hexadecimal Sudoku + QR assembly:** 4 QR codes encode 16x16 hex Sudoku quadrants; solve grid,\
    \ read diagonal as hex pairs → ASCII flag. See [encodings-advanced.md](encodings-advanced.md#hexadecimal-sudoku--qr-assembly-bsidessf-2026).\n\
    - **Z3 boolean gate network SAT solving:** Product key validation as 250 boolean gates (AND/OR/XOR/NOT)\
    \ over 125 input bits. Model each gate as Z3 constraint, require all outputs True, solve in milliseconds.\
    \ See [games-and-vms.md](games-and-vms.md#z3-sat-solving-for-boolean-logic-gate-networks-bsidessf-2026).\n\
    \n## 3D Printer Video Nozzle Tracking (LACTF 2026)\n\n**Pattern (flag-irl):** Video of 3D printer\
    \ fabricating nameplate. Flag is the printed text.\n\n**Technique:** Track nozzle X/Y positions from\
    \ video frames, filter for print moves (top/text layer only), plot 2D histogram to reveal letter shapes:\n\
    ```python\n# 1. Identify text layer frames (e.g., frames 26100-28350)\n# 2. Track print head X position\
    \ (physical X-axis)\n# 3. Track bed X position (physical Y-axis from camera angle)\n# 4. Filter for\
    \ moves with extrusion (head moving while printing)\n# 5. Plot as 2D scatter/histogram -> letters\
    \ appear\n```\n\n## Discord API Enumeration (0xFun 2026)\n\nFlags hidden in Discord metadata (roles,\
    \ animated emoji, embeds). Invoke `/ctf-osint` for Discord API enumeration technique and code (see\
    \ social-media.md in ctf-osint).\n\n---\n\n## SUID Binary Exploitation (0xFun 2026)\n\n```bash\n#\
    \ Find SUID binaries\nfind / -perm -4000 2>/dev/null\n\n# Cross-reference with GTFObins\n# xxd with\
    \ SUID: xxd flag.txt | xxd -r\n# vim with SUID: vim -c ':!cat /flag.txt'\n```\n\n**Reference:** https://gtfobins.github.io/\n\
    \n---\n\n## Linux Privilege Escalation Quick Checks\n\n```bash\n# GECOS field passwords\ncat /etc/passwd\
    \  # Check 5th colon-separated field\n\n# ACL permissions\ngetfacl /path/to/restricted/file\n\n# Sudo\
    \ permissions\nsudo -l\n\n# Docker group membership (instant root)\nid | grep -q docker && docker\
    \ run -v /:/mnt --rm -it alpine chroot /mnt /bin/sh\n```\n\n## Docker Group Privilege Escalation (H7CTF\
    \ 2025)\n\nUser in the `docker` group can mount the host filesystem into a container and chroot into\
    \ it for root access.\n\n```bash\n# Check group membership\nid  # Look for \"docker\" in groups\n\n\
    # Mount host root filesystem and chroot\ndocker run -v /:/mnt --rm -it alpine chroot /mnt /bin/sh\n\
    \n# Now running as root on the host filesystem\ncat /root/flag.txt\n```\n\n**Key insight:** Docker\
    \ group membership is equivalent to root access. The `docker` CLI socket (`/var/run/docker.sock`)\
    \ allows creating privileged containers that mount the entire host filesystem.\n\n**Reference:** https://gtfobins.github.io/gtfobins/docker/\n\
    \n## Sudo Wildcard Parameter Injection (Dump HTB)\n\nSudo's `fnmatch()` matches `*` across argument\
    \ boundaries. Inject extra flags (`-Z root`, `-r`, second `-w`) into locked-down commands. Craft pcap\
    \ with embedded valid sudoers entries — sudo's parser recovers from binary junk, unlike cron's strict\
    \ parser. See [linux-privesc.md](linux-privesc.md#sudo-wildcard-parameter-injection-via-fnmatch-dump-htb).\n\
    \n## Monit Process Command-Line Injection (Zero HTB)\n\nRoot monit script uses `pgrep -lfa` to extract\
    \ process command lines, then executes a modified version. Create fake process via `perl -e '$0 =\
    \ \"...\"'` with injected flags. Apache `-d` last-wins overrides ServerRoot; `-E` captures error output.\
    \ `Include /root/flag` causes a parse error that reveals the file content. See [linux-privesc.md](linux-privesc.md#monit-confcheck-process-command-line-injection-zero-htb).\n\
    \n## PostgreSQL RCE and File Read (Slonik HTB)\n\n`COPY (SELECT '') TO PROGRAM 'cmd'` executes OS\
    \ commands as postgres. `pg_read_file('/path')` reads files. Extract credentials from `pg_basebackup`\
    \ archives (`global/1260` = `pg_authid`). SSH tunnel to Unix sockets: `ssh -fNL 25432:/var/run/postgresql/.s.PGSQL.5432`.\
    \ See [linux-privesc.md](linux-privesc.md#postgresql-copy-to-program-rce-slonik-htb).\n\n## Backup\
    \ Cronjob SUID Abuse (Slonik HTB)\n\nRoot cronjob copying directories preserves SUID bit but changes\
    \ ownership to root. Place SUID bash in source directory → backup copies it as root-owned SUID. Execute\
    \ with `bash -p`. See [linux-privesc.md](linux-privesc.md#backup-cronjob-suid-abuse-slonik-htb).\n\
    \n## PaperCut Print Deploy Privesc (Bamboo HTB)\n\nRoot process runs scripts from user-owned directory.\
    \ Modify `server-command`, trigger via Mobility Print API refresh. See [linux-privesc.md](linux-privesc.md#papercut-print-deploy-privilege-escalation-bamboo-htb).\n\
    \n---\n\n## CTFd Platform Navigation (No Browser)\n\nDetect CTFd (`curl -s \"$CTF_URL/api/v1/\" |\
    \ head -5`) and interact via API. **Ask the user for their API token** (CTFd Settings > Access Tokens)\
    \ — it is not provided by default. Then use `Authorization: Token $CTF_TOKEN` header for all requests.\n\
    \n```bash\nexport CTF_URL=\"https://ctf.example.com\" CTF_TOKEN=\"ctfd_your_token_here\"\ncurl -s\
    \ -H \"Authorization: Token $CTF_TOKEN\" \"$CTF_URL/api/v1/challenges\" | jq -r '.data[] | \"\\(.id)\\\
    t\\(.value)pts\\t\\(.category)\\t\\(.name)\"'\ncurl -s -X POST -H \"Authorization: Token $CTF_TOKEN\"\
    \ -H \"Content-Type: application/json\" \"$CTF_URL/api/v1/challenges/attempt\" -d \"{\\\"challenge_id\\\
    \": $CID, \\\"submission\\\": \\\"flag{...}\\\"}\"\n```\n\nSee [ctfd-navigation.md](ctfd-navigation.md)\
    \ for full workflow, Python client class, session login, hints, notifications, file download, and\
    \ troubleshooting.\n\n---\n\n## Useful One-Liners\n\n```bash\ngrep -rn \"flag{\" .\nstrings file |\
    \ grep -i flag\npython3 -c \"print(int('deadbeef', 16))\"\n```\n\n## Keyboard Shift Cipher\n\n**Pattern\
    \ (Frenzy):** Characters shifted left/right on QWERTY keyboard layout.\n\n**Identification:** dCode\
    \ Cipher Identifier suggests \"Keyboard Shift Cipher\"\n\n**Decoding:** Use [dCode Keyboard Shift\
    \ Cipher](https://www.dcode.fr/keyboard-shift-cipher) with automatic mode.\n\n## Pigpen / Masonic\
    \ Cipher\n\n**Pattern (Working For Peanuts):** Geometric symbols representing letters based on grid\
    \ positions.\n\n**Identification:** Angular/geometric symbols, challenge references \"Peanuts\" comic\
    \ (Charlie Brown), \"dusty looking crypto\"\n\n**Decoding:** Map symbols to Pigpen grid positions,\
    \ or use online decoder.\n\n## ASCII in Numeric Data Columns\n\n**Pattern (Cooked Books):** CSV/spreadsheet\
    \ numeric values (48-126) are ASCII character codes.\n\n```python\nimport csv\nwith open('data.csv')\
    \ as f:\n    reader = csv.DictReader(f)\n    flag = ''.join(chr(int(row['Times Borrowed'])) for row\
    \ in reader)\nprint(flag)\n```\n\n**CyberChef:** \"From Decimal\" recipe with line feed delimiter.\n\
    \n## Backdoor Detection in Source Code\n\n**Pattern (Rear Hatch):** Hidden command prefix triggers\
    \ `system()` call.\n\n**Common patterns:**\n- `strncmp(input, \"exec:\", 5)` -> runs `system(input\
    \ + 5)`\n- Hex-encoded comparison strings: `\\x65\\x78\\x65\\x63\\x3a` = \"exec:\"\n- Hidden conditions\
    \ in maintenance/admin functions\n\n## DNS Exploitation Techniques\n\nSee [dns.md](dns.md) for full\
    \ details (ECS spoofing, NSEC walking, IXFR, rebinding, tunneling).\n\n**Quick reference:**\n- **ECS\
    \ spoofing**: `dig @server flag.example.com TXT +subnet=10.13.37.1/24` - try leet-speak IPs (1337)\n\
    - **NSEC walking**: Follow NSEC chain to enumerate DNSSEC zones\n- **IXFR**: `dig @server domain IXFR=0`\
    \ when AXFR is blocked\n- **DNS rebinding**: Low-TTL alternating resolution to bypass same-origin\n\
    - **DNS tunneling**: Data exfiltrated via subdomain queries or TXT responses\n\n## Unicode Steganography\n\
    \n### Variation Selectors Supplement (U+E0100-U+E01EF)\n**Patterns (Seen & emoji, Nullcon 2026):**\
    \ Invisible Variation Selector Supplement characters encode ASCII via codepoint offset.\n\n```python\n\
    # Extract hidden data from variation selectors after visible character\ndata = open('README.md', 'r').read().strip()\n\
    hidden = data[1:]  # Skip visible emoji character\nflag = ''.join(chr((ord(c) - 0xE0100) + 16) for\
    \ c in hidden)\n```\n\n**Detection:** Characters appear invisible but have non-zero length. Check\
    \ with `[hex(ord(c)) for c in text]` -- look for codepoints in `0xE0100-0xE01EF` or `0xFE00-0xFE0F`\
    \ range.\n\n### Unicode Tags Block (U+E0000-U+E007F) (UTCTF 2026)\n\n**Pattern (Hidden in Plain Sight):**\
    \ Invisible Unicode Tag characters embedded in URLs, filenames, or text. Each tag codepoint maps directly\
    \ to an ASCII character by subtracting `0xE0000`. URL-encoded as 4-byte UTF-8 sequences (`%F3%A0%81%...`).\n\
    \n```python\nimport urllib.parse\n\nurl = \"https://example.com/page#Title%20%F3%A0%81%B5%F3%A0%81%B4...Visible%20Text\"\
    \ndecoded = urllib.parse.unquote(urllib.parse.urlparse(url).fragment)\n\nflag = ''.join(\n    chr(ord(ch)\
    \ - 0xE0000)\n    for ch in decoded\n    if 0xE0000 <= ord(ch) <= 0xE007F\n)\nprint(flag)\n```\n\n\
    **Key insight:** Unicode Tags (U+E0001-U+E007F) mirror ASCII 1:1 — subtract `0xE0000` to recover the\
    \ original character. They render as zero-width invisible glyphs in most fonts. Unlike Variation Selectors\
    \ (U+E0100+), these have a simpler offset calculation and appear in URL fragments, challenge titles,\
    \ or filenames where the text looks normal but has suspiciously long byte length.\n\n**Detection:**\
    \ Text or URL is longer than expected in bytes. Percent-encoded sequences starting with `%F3%A0%80`\
    \ or `%F3%A0%81`. Python: `any(0xE0000 <= ord(c) <= 0xE007F for c in text)`.\n\n## UTF-16 Endianness\
    \ Reversal\n\n**Pattern (endians):** Text \"turned to Japanese\" -- mojibake from UTF-16 endianness\
    \ mismatch.\n\n```python\n# If encoded as UTF-16-LE but decoded as UTF-16-BE:\nfixed = mojibake.encode('utf-16-be').decode('utf-16-le')\n\
    ```\n\n**Identification:** CJK characters, challenge mentions \"translation\" or \"endian\". See [encodings.md](encodings.md)\
    \ for details.\n\n## Cipher Identification Workflow\n\n1. **ROT13** - Challenge mentions \"ROT\",\
    \ text looks like garbled English\n2. **Base64** - `A-Za-z0-9+/=`, title hints \"64\"\n3. **Base32**\
    \ - `A-Z2-7=` uppercase only\n4. **Atbash** - Title hints (Abash/Atbash), preserves spaces, 1:1 substitution\n\
    5. **Pigpen** - Geometric symbols on grid\n6. **Keyboard Shift** - Text looks like adjacent keys pressed\n\
    7. **Substitution** - Frequency analysis applicable\n\n**Auto-identify:** [dCode Cipher Identifier](https://www.dcode.fr/cipher-identifier)\n\
    \n## HISTFILE Trick for Restricted Shell File Reads (BCTF 2016)\n\nRead files without cat/less/head:\
    \ `HISTFILE=/flag /bin/bash && history`, or `bash -v flag.txt` (verbose mode prints lines), or `ctypes.sh`\
    \ `dlcall` for direct C library calls. See [bashjails.md](bashjails.md#histfile-trick-for-restricted-shell-file-reads-bctf-2016).\n\
    \n## Levenshtein Distance Oracle Attack (SunshineCTF 2016)\n\nOracle returns edit distance between\
    \ guess and secret. Determine length from empty string, identify present chars from single-char repeats,\
    \ binary search for positions. O(n log n) queries. See [games-and-vms-3.md](games-and-vms-3.md#levenshtein-distance-oracle-attack-sunshinectf-2016).\n\
    \n## SECCOMP High-Bit File Descriptor Bypass (33C3 CTF 2016)\n\n`close(0x8000000000000002)` passes\
    \ 64-bit SECCOMP check (≠ 2) but kernel truncates to 32-bit (== 2), closing fd 2. Next `open()` returns\
    \ fd 2 for arbitrary file. Type-width mismatch between BPF filter and kernel. See [games-and-vms-3.md](games-and-vms-3.md#seccomp-bypass-via-high-bit-file-descriptor-trick-33c3-ctf-2016).\n\
    \n## rvim Jail Escape via Python3 (BKP 2017)\n\n`rvim` blocks `:!` but `:python3 import os; os.system(\"\
    cmd\")` executes arbitrary commands. Check `:version` for `+python3`/`+lua`/`+ruby`. See [games-and-vms-3.md](games-and-vms-3.md#rvim-jail-escape-via-custom-vimrc-with-python3-execution-bkp-2017)."
