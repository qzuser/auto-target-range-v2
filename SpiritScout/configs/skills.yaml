- skill_id: xigong-funk-hikari
  domain: reverse
  description: Evidence-driven Hikari-LLVM/OLLVM deobfuscation and plaintext recovery for ELF/SO, especially
    Android/Linux AArch64 PIE executables that use MBA, BCF/opaque predicates, relocation-backed BR/BLR
    dispatch, function wrappers/FCO, runtime string decoding, high-entropy containers, flat anonymous
    RX/RO/RW inner images without a primary ELF magic, embedded auxiliary ELFs, and custom mmap/mprotect
    loaders. Use when the user asks for Hikari identification, complete deobfuscation, lossless plaintext
    restoration, searchable strings, runtime payload dumping/rebuilding, an IDA-ready inner ELF, a directly
    runnable plaintext-bearing single file, or a loader-free rebuild. Produces hash-bound layer artifacts,
    reversible register-preserving patch manifests, runtime materialization evidence, and structure/semantic/runtime/equivalence
    verification.
  body: "# 西宫-FUNK-Hikari\n\n## 目标优先级\n\n默认把“明文”理解为最终目标，不在外层控制流改写后停止。先确定交付等级：\n\n| 等级 | 产物 | 可搜索明文 | 可直接运行\
    \ | loader-free |\n|---|---|---:|---:|---:|\n| L1 | 外层静态反混淆 ELF | 不保证 | 是 | 否 |\n| L2 | 内层原始内存镜像 +\
    \ 分析 ELF + 字符串池 | 是 | 否 | 否 |\n| L3 | 明文承载型单文件 ELF carrier | 是 | 是 | 否 |\n| L4 | 重建 imports/relocations/TLS/entry\
    \ 后的单层 ELF | 是 | 是 | 是 |\n\n用户说“明文，最好直接运行”时默认完成 L3；用户明确要求“去掉外层/单层/不再经过 loader”时才以 L4 为完成条件。L3 必须明确执行仍由原\
    \ loader 驱动，不能称为单层重建。\n\n## 不变量\n\n1. 原样本只读；每个外层、dump、归一化镜像、分析 ELF、carrier 和 patch 产物分别记录 SHA-256。\n\
    2. 地址写成 `artifact_sha256 + address_space + VA/file_offset`。运行时地址另带 PID、采集时机、mapping 和 load bias；`post_load_tail`\
    \ 与 true overlay 分开记录。\n3. 外层 materialization 与内层 Hikari semantics 分账。分析时分层，交付时可以合并为一个 carrier。\n\
    4. family marker 只证明 provenance；每个 MBA/BCF/CFF/indirect/string/wrapper pass 仍须独立闭合 `input -> transform\
    \ -> output -> consumer` 合同。\n5. 只改写已证明的静态 target。依赖运行寄存器、索引、线程状态或输入的 `BR/BLR` 保留并映射，禁止为追求数量硬编码。\n\
    6. `inner.raw.mem` 保持捕获字节不变；指针归一化只进入 `inner.analysis.elf`，二者不得混称无损原像。\n7. analysis ELF 不等于 executable。缺少可信\
    \ entry/dynamic/import/relocation/TLS/constructor 时，禁止称其可运行。\n8. 所有修改都有 expected bytes、allowlist diff、rollback\
    \ 和行为回归。宿主控制台乱码不能替代原始 stdout/stderr 字节判断。\n\n## 工作流\n\n### 0. 建档与基线\n\n创建独立 case，记录原样本 hash、ELF 头、PHDR、sections、`post_load_tail`、true\
    \ overlay、`.comment`、imports、relocations 和入口。以 `represented_end=max(EHDR/PHDR/非 NOBITS section/SHDR\
    \ file ranges)` 计算 overlay；合法 section/SHDR 尾部不修复、不截断。对至少两类输入保存原始 stdout、stderr、退出码与超时状态：正常/失败输入和 EOF；交互程序保持\
    \ stdin writer 打开，避免把 EOF 自动退回误判为真实路径。\n\n### 1. 识别与排他\n\n运行静态 triage：\n\n```powershell\npython <skill-root>\\\
    scripts\\hikari_static_rewrite.py SAMPLE --inspect --report-dir CASE\\reports\\triage\n```\n\n同时检查\
    \ `.comment` 中 Hikari/LLVM provenance、AArch64 relocation-backed code pointers、`BR/BLR` 密度、二项 selector、wrapper\
    \ cluster、MBA 指令密度、opaque predicate、runtime decoder 和匿名执行信号。不得用高熵、复杂 CFG、单个 marker 或 `memfd` 单独证明\
    \ Hikari/CFF/VM。详细判定读 `references/identification-and-routing.md`。\n\n按证据组合复用现有能力：AProtect/MSFT profile\
    \ 优先交给 `$a-protector-elf-repair`；fake PT_LOAD/entry translation 交给 `$linker-fake-load-unwrapper`；Android\
    \ 匿名 RX/memfd dump 与短窗口捕获可结合 `$android-elf-runtime-dump`；函数边界、xref 和 microcode 交给 `$ida-reverse`；超出本工具闭合形态的\
    \ CFF/BCF/VM 回到 `$xigong-auto-reverse`、其内置 OLLVM provider 或 `$vm-and-bytecode-reverse`。这些 provider\
    \ 的输出都要重新绑定当前 artifact hash，不能搬用旧地址。\n\n### 2. 外层语义保持改写\n\n先用 IDA 批量导出函数边界；可选叠加 perf/runtime offset。对\
    \ ELF64 LE AArch64 的 relocation-backed dispatcher 使用：\n\n```powershell\npython <skill-root>\\scripts\\\
    hikari_static_rewrite.py SAMPLE `\n  --ida-functions CASE\\reports\\ida_functions.csv `\n  --perf-samples\
    \ CASE\\reports\\perf_offsets.txt `\n  --out CASE\\artifacts\\outer.deobf.elf `\n  --report-dir CASE\\\
    reports\\outer_deobf\n```\n\n工具只把闭合 target 的 `LDR pointer + BR/BLR` 和已证明二项 selector 改成直接边，保留动态边并生成\
    \ `unresolved_indirect.json`。若 patch 后崩溃，把新增 patch 按组做二分 ablation；每轮只改变一个 patch 集，接受条件是基线字节级等价。详细算法读\
    \ `references/outer-static-deobfuscation.md`。\n\n### 3. 明文充分性门禁\n\n外层改写后立即执行以下判据：\n\n```text\n已知运行时提示/业务词在文件中不可搜索\n\
    OR 运行 pc/lr/关键字符串 consumer 落在匿名 RX、memfd 或新映射\nOR 磁盘 ELF 的函数/字符串规模明显小于运行时业务规模\n=> materialization\
    \ = RUNTIME_REQUIRED；禁止声称“彻底明文化”\n```\n\n这一步用于纠正最常见误判：控制流反混淆成功不代表明文 payload 已经物化。\n\n### 4. 定位并捕获\
    \ active inner\n\n在正确 PID 和业务阶段保存 `/proc/PID/maps`。通过 loader handoff、关键 PC/LR、输出 backtrace 或字符串地址确定\
    \ inner cluster；不要按“最大匿名段”猜测。捕获 cluster 内全部可读映射并保留权限与空洞：\n\n```powershell\npython <skill-root>\\scripts\\\
    hikari_runtime_image.py capture `\n  --serial SERIAL --pid PID --range 0xSTART:0xEND `\n  --out-dir\
    \ CASE\\runtime\\inner_capture\n```\n\n同一阶段至少捕获两次；比较 mapping layout、hash 和字符串命中，确认不是临时 allocator 噪声。短生命周期程序在\
    \ prompt/loader handoff 后冻结或用 FIFO 保持输入窗口。详细流程读 `references/runtime-materialization.md`。\n\n用 `hikari_runtime_image.py\
    \ compare-captures CAPTURE_A CAPTURE_B --out REPORT.json` 做逐 mapping 完整性比较。Flat inner 可以没有 offset-0\
    \ ELF magic；其内部命中的 ELF 只列为 auxiliary candidate，不能替代 handoff/active-PC 证明。Custom mapper/high-entropy\
    \ container 的完整判定读 `references/flat-inner-custom-loader.md`。\n\n### 5. 重建 raw image 与分析 ELF\n\n```powershell\n\
    python <skill-root>\\scripts\\hikari_runtime_image.py rebuild `\n  CASE\\runtime\\inner_capture --base\
    \ 0xSTART --end 0xEND `\n  --out-prefix CASE\\artifacts\\inner.plain --normalize-pointers\n\npython\
    \ <skill-root>\\scripts\\hikari_runtime_image.py strings `\n  CASE\\artifacts\\inner.plain.mem --base\
    \ 0 `\n  --out-prefix CASE\\reports\\inner_plain_strings\n```\n\n保留三份语义不同的对象：capture segments、相对布局\
    \ raw memory、指针归一化 analysis ELF。`rebuild` 输出 `embedded_elf_candidates`，但主 inner 身份仍由 handoff/PC-LR\
    \ 证明。默认字符串提取只接受完整 UTF-8 NUL token 以压低噪声；目标确有 UTF-16LE 时显式添加 `--encodings utf-8,utf-16le --mode scan`\
    \ 并用 consumer/xref 过滤。用 readelf/IDA 检查 PT_LOAD 权限、地址间隔、函数和 xrefs；不要因为 synthetic ELF 可解析就给它伪造 entry。\n\
    \n### 6. 打磨可运行明文交付\n\nL3 保留已验证可运行的 outer prefix，把 raw inner image和带 hash 的 trailer 追加为 overlay：\n\n\
    ```powershell\npython <skill-root>\\scripts\\hikari_runtime_image.py carrier `\n  CASE\\artifacts\\\
    outer.deobf.elf CASE\\artifacts\\inner.plain.mem `\n  --runtime-base 0xSTART --runtime-end 0xEND `\n\
    \  --output CASE\\artifacts\\plain.runnable.elf `\n  --manifest CASE\\reports\\plain_runnable_manifest.json\n\
    \npython <skill-root>\\scripts\\hikari_runtime_image.py verify-carrier `\n  CASE\\artifacts\\plain.runnable.elf\
    \ `\n  --manifest CASE\\reports\\plain_runnable_manifest.json `\n  --needle \"请输入\" --needle \"版本\"\
    \n```\n\nCarrier 必须满足：outer 前缀逐字节不变、payload hash 一致、目标明文直接可搜索、ELF parser 仍通过、Android/Linux 直接执行等价。L4\
    \ 的 dynamic/import/entry/TLS/constructor 重建和 handoff 替换读 `references/runnable-delivery.md`；没有这些证据时保持\
    \ L3，不伪装为 loader-free。\n\n### 7. 五轴回归\n\n对 root、outer deobf、carrier 分别运行：\n\n```powershell\npython\
    \ <skill-root>\\scripts\\hikari_equivalence.py adb `\n  --serial SERIAL --root SAMPLE --candidate\
    \ CASE\\artifacts\\plain.runnable.elf `\n  --case dummy=TEST-KEY --eof --out CASE\\reports\\equivalence.json\n\
    ```\n\n必须报告：\n\n- structure：ELF/PHDR/sections、patch 指令反汇编、overlay 不破坏 loader；\n- semantics：每类 pass\
    \ 的 closed contract、未解析动态边、inner provenance；\n- runtime：每个输入 stdout/stderr/rc/timeout；\n- packaging：权限、ABI、签名/加载方式、单文件结构；\n\
    - equivalence：非目标路径、EOF、writer-open、异常输入和 rollback。\n\n最终回归矩阵和 failure fingerprint 读 `references/validation-and-corrections.md`。\n\
    \n## 产物布局\n\n```text\nCASE/\n  case.json\n  artifacts/\n    outer.deobf.elf\n    inner.plain.mem\n\
    \    inner.plain.analysis.elf\n    plain.runnable.elf\n  runtime/inner_capture/{maps.txt,capture.json,*.bin}\n\
    \  reports/\n    triage.json\n    patch_manifest.json\n    unresolved_indirect.json\n    inner_plain_strings.{json,tsv,txt}\n\
    \    plain_runnable_manifest.json\n    equivalence.json\n    FINAL_REPORT.md\n```\n\n报告模板位于 `assets/final-report-template.md`。只把已证明结论写成完成项；L1/L2/L3/L4\
    \ 必须明确标注。\n\n## 按需读取\n\n- 识别、false-positive gate、pass 路由：`references/identification-and-routing.md`\n\
    - AArch64 relocation dispatcher、patch transaction、ablation：`references/outer-static-deobfuscation.md`\n\
    - Android 匿名 inner 定位、dump、镜像重建：`references/runtime-materialization.md`\n- 高熵容器、custom mapper、flat\
    \ inner、嵌入 ELF 与寄存器 patch：`references/flat-inner-custom-loader.md`\n- L3 carrier 与 L4 loader-free\
    \ 重建边界：`references/runnable-delivery.md`\n- 本次错误纠正、回归矩阵和 failure fingerprints：`references/validation-and-corrections.md`\n\
    \n依赖：Python 3.10+；静态改写需 `capstone`，动态设备通道需 `adb` 和可读取 `/proc/PID/mem` 的权限；IDA exporter 在 IDAPython\
    \ 中运行。"
  source: xigong-funk-hikari
  path: xigong-funk-hikari/SKILL.md
- skill_id: yingan-tuoxiu-legacy
  domain: reverse
  description: Owner-authorized YingAn/YingPo Android APK shell rehydration and stable rebuild workflow.
    Use for APKs with tiny or abnormal root DEX files, v.m.p or abcd655xx shell callbacks, libabcd/lib*shellservice_dex
    native loaders, protected assets, runtime-loaded DEX images, hidden real Application or Activity routes,
    and native lifecycle wrappers that must be recovered into a normally installable, signed multidex
    APK without changing product authentication or business authorization behavior.
  body: "# 影安脱修\n\nUse an evidence-driven recovery pipeline. Treat runtime DEX images, manifest resolution,\
    \ and device logs as facts; do not generalize a class name, DEX offset, or native branch from one\
    \ sample.\n\n## Scope And Outputs\n\nRecover the normal APK class path, preserve resources and product\
    \ behavior, and emit:\n\n```text\nreports/scan.json\nreports/dex-validation.json\nreports/graph.json\n\
    reports/recovery-plan.json\ndist/<name>-rehydrated.apk\nreports/build.json\nreports/verify/verification.json\n\
    ```\n\nKeep login, entitlement, licensing, network, and backend behavior unchanged. Configure a product-wide\
    \ no-card or free release in source code and the service, rather than changing those paths in a recovered\
    \ APK.\n\n## Required Tools\n\n- Python 3.10+\n- Android platform-tools: `adb`\n- Android build-tools:\
    \ `zipalign`, `apksigner`, optionally `aapt2` and `dexdump`\n- JDK `keytool` for a release keystore\n\
    - Frida host/device versions that match for runtime capture: `pip install frida frida-tools`\n- Root\
    \ only for the optional `/proc/<pid>/mem` capture fallback\n- apktool plus smali/baksmali for a proved\
    \ lifecycle wrapper repair\n\n## Recovery Workflow\n\n### 1. Freeze The Baseline\n\nHash the original\
    \ APK. Capture its package, version, launcher behavior, hidden routes, relevant UI states, and original-process\
    \ logcat before changing anything. Keep every build in a separate directory.\n\n### 2. Classify The\
    \ Shell\n\nRun the static inventory first:\n\n```powershell\npython <skill-dir>\\scripts\\scan_yingan_apk.py\
    \ `\n  --apk target.apk --out reports\\scan --extract-dir work\\embedded\n```\n\nTreat `v.m.p`, `abcd655xx`,\
    \ `abcdstr`, a tiny `classes.dex`, `libabcd.so`, `lib*_shellservice_dex.so`, `assets/lib*Protect*`,\
    \ and `abcd/` as evidence, not as a hard-coded patch recipe. Read [family-signatures.md](references/family-signatures.md)\
    \ when the score is inconclusive.\n\nFor the proven RikkaHub-style recovery lessons that motivated\
    \ this pipeline, read [rikkahub-recovery-lessons.md](references/rikkahub-recovery-lessons.md). Do\
    \ not reuse its class names or binary layout as a rule.\n\n### 3. Recover Runtime DEX Images\n\nUse\
    \ the unmodified APK and preserve the discovery metadata. Prefer Frida:\n\n```powershell\npython <skill-dir>\\\
    scripts\\capture_runtime_dex.py `\n  --package com.example.app --spawn --seconds 25 --output work\\\
    capture-frida\n```\n\nUse the rooted fallback only when Frida cannot attach:\n\n```powershell\npython\
    \ <skill-dir>\\scripts\\capture_proc_mem.py `\n  --serial <device-id> --pid <pid> --output work\\\
    capture-proc\n```\n\nCapture again after each route that lazily opens a hidden inner app. Do not assume\
    \ a static DEX inside a native ZIP is the complete runtime set.\n\n### 4. Validate Before Reassembly\n\
    \nKeep the chosen DEX ordering explicit. Validate header size, file size, SHA-1, Adler-32, map bounds,\
    \ class definitions, and duplicate classes:\n\n```powershell\npython <skill-dir>\\scripts\\validate_dex_set.py\
    \ `\n  --capture-json work\\capture-frida\\capture.json --out reports\\dex-validation\n```\n\nResolve\
    \ unequal duplicate class definitions before planning. Exact duplicate images are reporting noise;\
    \ distinct definitions require a loader-order decision supported by runtime evidence.\n\n### 5. Recover\
    \ The Component Graph\n\nMap manifest Application/components against the recovered DEX set:\n\n```powershell\n\
    python <skill-dir>\\scripts\\inspect_runtime_graph.py `\n  --apk target.apk --validation reports\\\
    dex-validation\\dex-validation.json `\n  --out reports\\graph\n```\n\nUse `application_candidates`,\
    \ unresolved manifest components, and wrapper/core pairs as leads. Confirm the real Application and\
    \ the expected route with the original process; do not select an Application merely because its name\
    \ looks plausible.\n\n### 6. Make A Declarative Plan\n\nCreate the plan that is the only input allowed\
    \ to modify the APK:\n\n```powershell\npython <skill-dir>\\scripts\\make_rehydration_plan.py `\n \
    \ --scan reports\\scan\\scan.json `\n  --validation reports\\dex-validation\\dex-validation.json `\n\
    \  --graph reports\\graph\\graph.json `\n  --root-dex work\\root-managed.dex `\n  --application com.example.RealApplication\
    \ `\n  --launch-activity com.example.app/.MainActivity `\n  --out reports\\recovery-plan.json\n```\n\
    \nUse no `--root-dex` only when the first recovered runtime DEX is a valid primary DEX. Keep `remove_entries`\
    \ empty for the first compatibility build. Read [rehydration-plan-schema.md](references/rehydration-plan-schema.md)\
    \ before editing a plan by hand.\n\n### 7. Repair A Lifecycle Wrapper Only With Proof\n\nRepair a\
    \ wrapper only when all of these are true:\n\n- the manifest/runtime route calls the wrapper;\n- the\
    \ wrapper declares a code-less native Android lifecycle method;\n- its direct superclass is the recovered\
    \ concrete `*Core` class;\n- that superclass defines the same void lifecycle method;\n- a baseline\
    \ log shows the missing native registration or lifecycle failure.\n\nDecode the target DEX with apktool/baksmali,\
    \ generate a separate patched Smali file, rebuild that DEX, validate it, then update the plan hash:\n\
    \n```powershell\npython <skill-dir>\\scripts\\repair_lifecycle_bridge.py `\n  --smali-root work\\\
    decoded `\n  --wrapper com.example.MainActivity `\n  --core com.example.MainActivityCore `\n  --method\
    \ onCreate --proto '(Landroid/os/Bundle;)V' `\n  --out work\\patched\\MainActivity.smali\n```\n\n\
    Read [lifecycle-bridge-rules.md](references/lifecycle-bridge-rules.md). Do not use raw DEX offsets,\
    \ arbitrary method no-ops, or branch patches as a universal technique.\n\n### 8. Build Compatibility\
    \ First\n\nThe builder replaces only `classes*.dex`, approved manifest names, and explicit plan deletions.\
    \ It preserves unknown native libraries, assets, resources, and ZIP entries by default:\n\n```powershell\n\
    python <skill-dir>\\scripts\\rebuild_rehydrated_apk.py `\n  --apk target.apk --plan reports\\recovery-plan.json\
    \ `\n  --out dist\\target-rehydrated.apk `\n  --zipalign <path-to-zipalign> `\n  --apksigner <path-to-apksigner>\
    \ `\n  --keystore dist\\release.keystore --alias release `\n  --ks-pass <password>\n```\n\nOnly create\
    \ a separate cleanup plan after the compatibility build passes the entire device matrix. Every removed\
    \ shell artifact needs its own regression evidence.\n\n### 9. Verify The Artifact\n\nRun static checks\
    \ and device smoke tests without submitting credentials:\n\n```powershell\npython <skill-dir>\\scripts\\\
    verify_rehydration.py `\n  --apk dist\\target-rehydrated.apk --apksigner <path-to-apksigner> `\n \
    \ --zipalign <path-to-zipalign> `\n  --package com.example.app --launch-activity com.example.app/.MainActivity\
    \ `\n  --serial <device-id> --out reports\\verify\n```\n\nRequire v2/v3 verification, valid DEX headers,\
    \ a clean ZIP, three cold launches, a surviving PID, expected resumed route, screenshot/UI dump, and\
    \ no fatal log patterns. Use [verification-matrix.md](references/verification-matrix.md) for gates\
    \ and diagnosis.\n\n## Route Selection\n\n| Evidence | Recovery route |\n|---|---|\n| Static inner\
    \ DEX contains all resolved components | Start with static DEX plus compatibility build. |\n| Original\
    \ app materializes more DEX images | Use captured runtime DEX in evidence-backed order. |\n| Manifest\
    \ Application is unresolved | Select the confirmed real Application in the plan. |\n| Hidden activity\
    \ is the real product route | Preserve the existing route first; repoint only with explicit component\
    \ evidence. |\n| Native lifecycle wrapper fails | Use the restricted Smali bridge only after the proof\
    \ checklist passes. |\n| `JNI_ERR` after a modified build | Stop native branch experimentation; return\
    \ to managed multidex rehydration and preserve shell assets. |\n\n## Completion Standard\n\nDo not\
    \ claim completion from a successful install. Completion requires the build manifest, hash-matched\
    \ plan inputs, signing evidence, static checks, device logs, UI evidence, and at least one normal\
    \ user route through the recovered app."
  source: yingan-tuoxiu-legacy
