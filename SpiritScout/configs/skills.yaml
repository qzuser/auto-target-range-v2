    \n**IDA Pro 核心操作：**\n```\nF5 → 伪代码    X → 交叉引用    N → 重命名    G → 跳转地址\n; → 注释       Y → 修改类型    Space\
    \ → 图形/文本切换\n```\n\n**IDA Python 常用：**\n```python\n# 搜索关键字符串\nfor s in idautils.Strings():\n    if\
    \ \"encrypt\" in str(s).lower():\n        print(f\"0x{s.ea:x}: {s}\")\n\n# 枚举感兴趣函数\nfor ea in idautils.Functions():\n\
    \    name = idc.get_func_name(ea)\n    if \"crypt\" in name.lower() or \"key\" in name.lower():\n\
    \        print(f\"0x{ea:x}: {name}\")\n```\n\n**Ghidra 工作流：**\n1. Import → Auto-Analysis → Search\
    \ Strings → Decompile\n2. 右键函数 → Decompile 查看伪代码\n3. Window → Defined Strings 定位密钥/URL\n\n**常见模式识别：**\n\
    ```asm\n; 函数序言 (x86)\npush ebp; mov ebp, esp; sub esp, 0x40\n; 虚函数调用 (C++)\nmov ecx, [this]; mov eax,\
    \ [ecx]; call [eax+0x10]\n; switch 跳转表\ncmp eax, 5; ja default; jmp [table + eax*4]\n```\n\n### 2.3\
    \ 动态分析\n\n**x64dbg 核心操作：**\n\n| 快捷键 | 功能 | 快捷键 | 功能 |\n|--------|------|--------|------|\n| F2 | 断点\
    \ | F7 | 步入 |\n| F8 | 步过 | F9 | 运行 |\n| Ctrl+F9 | 运行到返回 | Ctrl+G | 跳转地址 |\n| Space | 修改汇编指令 | | |\n\
    \n**GDB 常用命令：**\n```bash\ngdb ./target\nb main              # 设断点\nr                   # 运行\nni /\
    \ si             # 步过/步入\nx/20x $rsp          # 查看栈\ninfo registers      # 寄存器\ndisassemble main \
    \   # 反汇编\nset $eax = 0        # 修改寄存器\n```\n\n**脱壳通用方法：**\n```\nESP 定律: F8 到 OEP 附近 → ESP 变化后设硬件断点\
    \ → F9 到 OEP\n单步跟踪: F7/F8 逐步跟踪，遇向上跳转用 F4 跳过循环\n内存断点: .text 段设执行断点，脱壳完成后触发到 OEP\n```\n\n**常见壳：**\n\
    | 壳 | 特征 | 脱壳方法 |\n|----|------|---------|\n| UPX | `UPX0`/`UPX1` 段 | `upx -d` 或手动 |\n| VMProtect\
    \ | 虚拟化保护 | 单步跟踪 + devirtualization |\n| Themida | 强壳 + 虚拟机 | 内存断点 + 长期跟踪 |\n\n### 2.4 DLL 注入与 Hook\n\
    \n**注入方式：**\n\n| 方式 | 原理 | 适用场景 |\n|------|------|---------|\n| CreateRemoteThread | 远程线程调 LoadLibrary\
    \ | 最通用 |\n| SetWindowsHookEx | 消息钩子 | GUI 程序 |\n| AppInit_DLLs | 注册表自动加载 | 系统级 |\n| Process Hollowing\
    \ | 替换进程内存 | 高级隐藏 |\n\n**Hook 类型对比：**\n\n| 类型 | 原理 | 难度 | 适用场景 |\n|------|------|------|---------|\n\
    | **Inline Hook** | 修改函数入口指令（5字节 JMP） | 中 | 任意函数 |\n| **IAT Hook** | 修改导入表函数指针 | 低 | 导入的 API |\n|\
    \ **EAT Hook** | 修改导出表函数指针 | 低 | 导出的函数 |\n| **VMT Hook** | 修改虚函数表指针 | 低 | C++ 虚函数 |\n| **异常 Hook**\
    \ | 利用异常处理机制 | 高 | 无修改检测场景 |\n\n**Inline Hook 原理：**\n```\n原函数入口:                    Hook 后:\npush\
    \ ebp                      jmp hook_handler    ← 替换前 5 字节\nmov ebp, esp                  ... (原指令)\n\
    sub esp, 0x40                 jmp original + 5    ← 跳回\n...\n```\n\n**VMT Hook 原理（C++ 虚函数）：**\n```\n\
    对象内存: [vtable_ptr] → [vtable] → [func0, func1, func2...]\n替换 vtable 中的函数指针 → 指向 Hook 函数\n适用于: COM\
    \ 接口、C++ 多态类、游戏引擎对象\n```\n\n> **完整 DLL 注入 C 代码、MinHook、VMT/EAT/异常 Hook 代码** → **references/binary-re.md**\n\
    \n### 2.5 内存分析\n\n**Cheat Engine 标准流程：**\n```\n1. 精确值扫描: 知道值(如血量=100) → 首次扫描 → 值变化 → 再次扫描 → 缩小范围\n\
    2. 模糊扫描: 不知道值 → 记录当前值 → 值变化 → \"增加了/减少了\" → 逐步缩小\n3. AOB 特征码: 跨版本兼容 → 搜索字节模式 → 通配符 ?? 匹配变化字节\n```\n\
    \n**指针链与基址定位：**\n```\n动态地址 → [指针1] → [指针2] → [基址+偏移] = 静态地址\n基址 = 模块加载地址（不变）, 偏移 = 相对位移\n多级指针: 基址\
    \ + offset1 → + offset2 → + offset3 = 目标地址\n```\n\n**AOB 特征码扫描（跨版本兼容）：**\n```python\n# 特征码: 55 8B\
    \ EC 83 E4 F8 ?? ?? ?? 53 56 8B F1\n# ?? = 通配符，匹配任意字节\n# 找到特征码地址 + 偏移 = 目标函数/数据地址\n```\n\n> **完整 CE\
