    \ — 手动触发快照\n\n用户可随时说\"生成快照\"/\"保存进度\"/\"snapshot\" 手动触发 M.2。\n\n### M.5 — 快照压缩策略（防止快照本身过长）\n\n- 伪代码不写入快照（太长）；只记录函数地址\
    \ + 一句话摘要\n- 原始汇编不写入快照；只记录关键地址和发现\n- 快照目标大小：< 100 行 YAML\n- 超过 100 行时，优先保留 `pending_tasks` 和 `unresolved`，截断\
    \ `completed` 的详细 notes\n\n---\n\n## 参考文件索引\n\n| 文件 | 内容 | 触发阶段 |\n|------|------|---------|\n| `references/linux-debug-workflows.md`\
