- skill_id: ctf-web
  domain: ctf
  description: Provides web exploitation techniques for CTF challenges. Use when the target is primarily
    an HTTP application, API, browser client, template engine, identity flow, or smart-contract frontend/backend
    surface, including XSS, SQLi, SSTI, SSRF, XXE, JWT, auth bypass, file upload, request smuggling, OAuth/OIDC,
    SAML, prototype pollution, and similar web bugs. Do not use it for native binary memory corruption,
    reverse engineering of standalone executables, disk or memory forensics, or pure cryptanalysis unless
    the web flaw is still the main path to the flag.
  body: "# CTF Web Exploitation\n\nUse this skill as a routing and execution guide for web-heavy challenges.\
    \ Keep the first pass short: map the app, confirm the trust boundary, and only then dive into the\
    \ detailed technique notes.\n\n## Prerequisites\n\n**Python packages (all platforms):**\n```bash\n\
    pip install sqlmap flask-unsign requests httpx\n```\n\n**Linux (apt):**\n```bash\napt install hashcat\
    \ jq curl\n```\n\n**macOS (Homebrew):**\n```bash\nbrew install hashcat jq curl\n```\n\n**Go tools\
    \ (all platforms, requires Go):**\n```bash\ngo install github.com/ffuf/ffuf/v2@latest\n```\n\n**Manual\
    \ install:**\n- ysoserial — [GitHub](https://github.com/frohoff/ysoserial), requires Java (Java deserialization\
    \ payloads)\n- PayloadsAllTheThings — git clone to ctf-web/payloads/PayloadsAllTheThings (auto via\
    \ install script or lazy clone)\n  ```bash\n  bash scripts/install_ctf_tools.sh pat   # PAT only\n\
    \  bash scripts/install_ctf_tools.sh all   # all tools including PAT\n  # manual fallback:\n  git\
    \ clone --depth 1 https://github.com/swisskyrepo/PayloadsAllTheThings.git ctf-web/payloads/PayloadsAllTheThings\n\
    \  ```\n  > PAT is optional and on-demand — not required at load time. The skill works without it\
    \ (graceful degrade): `pat-reference.md` provides an offline index with exemplar payloads; bulk wordlists\
    \ require the clone above.\n\n## Additional Resources\n\n- [sql-injection.md](sql-injection.md) -\
    \ SQL injection techniques: auth bypass, UNION extraction, filter bypasses, second-order SQLi, truncation,\
    \ race-assisted leaks, INSERT ON DUPLICATE KEY UPDATE password overwrite, innodb_table_stats WAF bypass\n\
    - [server-side.md](server-side.md) - PHP type juggling, php://filter LFI, Python str.format traversal,\
    \ SSTI (Jinja2, Twig, ERB, Mako, EJS, Vue.js, Smarty), SSRF (Host header, DNS rebinding, curl redirect,\
    \ unescaped-dot regex, SNI FTP smuggling, mod_vhost_alias), PHP hash_hmac NULL\n- [server-side-2.md](server-side-2.md)\
    \ - XXE (basic, OOB, DOCX upload), XML injection via X-Forwarded-For, PHP variable variables, PHP\
    \ uniqid predictable filename, sequential regex replacement bypass, command injection (newline, blocklist,\
    \ sendmail CGI, multi-barcode, git CLI), GraphQL injection (introspection, batching, interpolation)\n\
    - [server-side-exec.md](server-side-exec.md) - Direct code execution paths, upload-to-RCE, deserialization-adjacent\
    \ execution, LaTeX injection, header and API abuses\n- [server-side-exec-2.md](server-side-exec-2.md)\
    \ - More execution chains: SQLi fragmentation, path parser tricks, polyglot uploads, wrapper abuse,\
    \ filename injection, BMP pixel webshell with filename truncation\n- [server-side-deser.md](server-side-deser.md)\
    \ - Java/Python/PHP deserialization and race-condition playbooks, PHP SoapClient CRLF SSRF via deserialization\n\
    - [server-side-advanced.md](server-side-advanced.md) - Advanced SSRF, traversal, archive, parser,\
    \ framework, and modern app-server issues, Nginx alias traversal\n- [server-side-advanced-2.md](server-side-advanced-2.md)\
    \ - Docker API SSRF, Castor/XML, Apache expression reads, parser discrepancies, Windows path tricks,\
    \ rogue MySQL server file read\n- [server-side-advanced-3.md](server-side-advanced-3.md) - Part 3\
    \ (CSAW/35C3/ASIS/PlaidCTF 2018): WAV polyglot upload, multi-slash URL `path.startswith` bypass, Xalan\
    \ XSLT `math:random()` seed guess, SoapClient `_user_agent` CRLF method smuggling, `gopher:///` no-host\
    \ URL scheme bypass, SSRF credential leak via attacker-specified outbound URL\n- [server-side-advanced-4.md](server-side-advanced-4.md)\
    \ - Part 4: WeasyPrint SSRF/file read (CVE-2024-28184), MongoDB regex/$where blind oracle, Pongo2\
    \ Go template injection, ZIP PHP webshell, basename() bypass, wget CRLF SSRF→SMTP, Gopher SSRF to\
    \ MySQL blind SQLi, React Server Components Flight RCE (CVE-2025-55182), AMQP/TLS interception via\
    \ sslsplit+arpspoof, CairoSVG XXE, Bazaar repo reconstruction\n- [client-side.md](client-side.md)\
    \ - XSS, CSRF, cache poisoning, DOM tricks, admin bot abuse, request smuggling, paywall bypass\n-\
    \ [client-side-advanced.md](client-side-advanced.md) - CSP bypasses, Unicode tricks, XSSI, CSS exfiltration,\
    \ browser normalization quirks, postMessage null origin bypass\n- [auth-and-access.md](auth-and-access.md)\
    \ - Auth/authz bypasses, hidden endpoints, IDOR, redirect chains, subdomain takeover, AI chatbot jailbreaks\n\
    - [auth-and-access-2.md](auth-and-access-2.md) - Part 2 (2018-era): `std::unordered_set` bucket collision\
    \ auth bypass, `nodeprep.prepare` Unicode homograph username collision, SRP A=0/A=N auth bypass, ArangoDB\
    \ AQL MERGE privilege escalation\n- [auth-jwt.md](auth-jwt.md) - JWT/JWE manipulation, weak secrets,\
    \ header injection, key confusion, replay\n- [auth-infra.md](auth-infra.md) - OAuth/OIDC, SAML, CORS,\
    \ CI/CD secrets, IdP abuse, login poisoning\n- [node-and-prototype.md](node-and-prototype.md) - Prototype\
    \ pollution, JS sandbox escape, Node.js attack chains\n- [web3.md](web3.md) - Solidity and Web3 challenge\
    \ notes\n- [cves.md](cves.md) - CVE-driven techniques you can match against challenge banners, headers,\
    \ dependency leaks, or version strings\n- [field-notes.md](field-notes.md) - Long-form exploit notes:\
    \ quick references for SQLi, XSS, LFI, JWT, SSTI, SSRF, command injection, XXE, deserialization, race\
    \ conditions, auth bypass, and multi-stage chains\n- [python-requests.md](python-requests.md) - Python\
    \ requests toolkit: session scaffold, Burp-Intruder-like fuzzer (sync + ThreadPoolExecutor + httpx\
    \ async), payload deploy from pat-reference.md wordlists, header/param spray, cookie/JWT, proxy\n\
    - [pat-reference.md](pat-reference.md) — PayloadsAllTheThings index: bulk payloads for XSS/SQLi/SSRF/SSTI/LFI/Command\
    \ Injection/Upload (requires PAT clone, see Prerequisites)\n\n## When to Pivot\n\n- If the target\
    \ is a native binary, custom VM, or firmware image, switch to `/ctf-reverse` first.\n- If the HTTP\
    \ bug only gives you code execution and the hard part becomes memory corruption or seccomp escape,\
    \ switch to `/ctf-pwn`.\n- If the \"web\" challenge really turns on JWT math, custom MACs, or crypto\
    \ primitives, switch to `/ctf-crypto`.\n- If the web challenge involves analyzing logs, PCAPs, or\
    \ recovering artifacts from a web server, switch to `/ctf-forensics`.\n- If the challenge requires\
    \ gathering intelligence from public web sources, DNS records, or social media before exploitation,\
    \ switch to `/ctf-osint`.\n\n## First-Pass Workflow\n\n1. Identify the real boundary: browser only,\
    \ backend only, mixed app, or auth flow.\n2. Capture one normal request/response pair for every major\
    \ feature before fuzzing.\n3. Enumerate hidden functionality from JS bundles, response headers, routes,\
    \ and alternate methods.\n4. Classify the likely bug family: injection, authz, parser mismatch, upload,\
    \ trust proxy, state machine, or client-side execution.\n5. Build the smallest proof first: leak,\
    \ bypass, or primitive. Save full exploit chaining for later.\n\n### Bulk payloads (PayloadsAllTheThings\
    \ — on-demand)\n\nThis skill works without PAT at load time (graceful degrade): `pat-reference.md`\
    \ and inline exemplars are available offline; bulk payloads require a PAT clone. After mapping the\
    \ trust boundary (First-Pass Workflow), check [pat-reference.md](pat-reference.md) for the PAT directory\
    \ that matches your bug class, then search bulk payloads:\n\n```bash\n# PAT payload search (requires\
    \ PAT clone — see Prerequisites; gracefully skipped if missing)\nls ctf-web/payloads/PayloadsAllTheThings\
    \ 2>/dev/null | head\ngrep -R \"onerror\" \"ctf-web/payloads/PayloadsAllTheThings/XSS Injection\"\
    \ 2>/dev/null | head\n```\n\nOr via agent tools (no clone required for the index itself):\n\n```\n\
    Glob ctf-web/payloads/PayloadsAllTheThings/**/*.md\nGrep \"union select\" ctf-web/payloads/PayloadsAllTheThings\n\
    ```\n\nIf `ctf-web/payloads/PayloadsAllTheThings/.git` is missing, the agent lazy-clones on demand:\n\
    \n```bash\n[ -d \"ctf-web/payloads/PayloadsAllTheThings/.git\" ] || git clone --depth 1 https://github.com/swisskyrepo/PayloadsAllTheThings.git\
    \ ctf-web/payloads/PayloadsAllTheThings\n```\n\n## Quick Start Commands\n\n```bash\n# Recon\ncurl\
    \ -sI https://target.com\nffuf -u https://target.com/FUZZ -w wordlist.txt\ncurl -s https://target.com/robots.txt\n\
    \n# SQLi quick test\nsqlmap -u \"https://target.com/page?id=1\" --batch --dbs\n\n# JWT decode (no\
    \ verification)\necho '<token>' | cut -d. -f2 | base64 -d 2>/dev/null | jq .\n\n# Cookie decode (Flask)\n\
    flask-unsign --decode --cookie '<cookie>'\nflask-unsign --unsign --cookie '<cookie>' --wordlist rockyou.txt\n\
    \n# SSTI probes\ncurl \"https://target.com/page?name={{7*7}}\"\ncurl \"https://target.com/page?name={{config}}\"\
    \n\n# Request inspection\ncurl -v -X POST https://target.com/api -H \"Content-Type: application/json\"\
    \ -d '{}'\n```\n\n## First Questions to Answer\n\n- Is the flag likely in the browser, an API response,\
    \ a local file, a database row, or an internal service?\n- Does the app trust user-controlled data\
    \ in templates, redirects, file paths, headers, serialized objects, or background jobs?\n- Are there\
    \ multiple parsers disagreeing with each other: proxy vs app, URL parser vs fetcher, sanitizer vs\
    \ browser, serializer vs filter?\n- Can you turn the bug into a smaller primitive first: read one\
    \ file, forge one token, call one internal endpoint, trigger one bot visit?\n\n## High-Value Recon\
    \ Checks\n\n- Read the HTML, inline scripts, and bundled JS before guessing the API surface.\n- Compare\
    \ what the UI submits with what the backend accepts; optional JSON fields often unlock hidden paths.\n\
    - Check obvious metadata and helper paths early: `/robots.txt`, `/sitemap.xml`, `/.well-known/`, `/admin`,\
    \ `/debug`, `/.git/`, `/.env`.\n- Try alternate verbs and content types on interesting routes: `GET`,\
    \ `POST`, `PUT`, `PATCH`, `TRACE`, JSON, form, multipart, XML.\n- Treat file upload, PDF/export, webhook,\
    \ OAuth callback, and admin bot features as likely exploit multipliers.\n\n## Fast Pattern Map\n\n\
    - SQL errors, odd filtering, or state-dependent DB behavior: start with [sql-injection.md](sql-injection.md).\n\
    - Templating, file reads, SSRF, command execution, XML, or parser bugs: start with [server-side.md](server-side.md)\
    \ and [server-side-exec.md](server-side-exec.md).\n- XSS, CSP bypass, admin bot, client routing, DOM\
    \ issues, or scriptless exfiltration: start with [client-side.md](client-side.md).\n- Session forgery,\
    \ hidden admin routes, JWT, OAuth, SAML, or weak trust boundaries: start with [auth-and-access.md](auth-and-access.md),\
    \ [auth-jwt.md](auth-jwt.md), and [auth-infra.md](auth-infra.md).\n- Node.js apps, prototype pollution,\
    \ VM sandboxes, or SSRF into internal services: add [node-and-prototype.md](node-and-prototype.md).\n\
    - Smart contract frontends or blockchain-integrated apps: add [web3.md](web3.md).\n\n## Common Chain\
    \ Shapes\n\n- Recon -> hidden route -> auth bypass -> internal file read -> token or flag\n- XSS or\
    \ HTML injection -> admin bot -> privileged action -> secret leak\n- Traversal or upload -> config/source\
    \ leak -> secret recovery -> session forgery\n- SSRF -> metadata or internal API -> credential leak\
    \ -> code execution\n- SQLi or NoSQL injection -> credential bypass -> second-stage template or upload\
    \ abuse\n\n## Deep-Dive Notes\n\nUse [field-notes.md](field-notes.md) once you have confirmed the\
    \ challenge is truly web-heavy and you need the long exploit catalog.\n\n- Recon, SQLi, XSS, traversal,\
    \ JWT, SSTI, SSRF, XXE, and command injection quick notes\n- Deserialization, race conditions, file\
    \ upload to RCE, and multi-stage chain examples\n- Node, OAuth/SAML, CI/CD, Web3, bot abuse, CSP bypasses,\
    \ and modern browser tricks\n- CVE-shaped playbooks and older challenge patterns that still show up\
    \ in modern CTFs\n\n## Common Flag Locations\n\n- Files: `/flag.txt`, `/flag`, `/app/flag.txt`, `/home/*/flag*`\n\
    - Environment: `/proc/self/environ`, process command line, debug config dumps\n- Database: tables\
    \ named `flag`, `flags`, `secret`, or seeded challenge content\n- HTTP: custom headers, archived responses,\
    \ hidden routes, admin exports\n- Browser: hidden DOM nodes, `data-*` attributes, inline state objects,\
    \ source maps"
  source: ctf-web
  path: ctf-web/SKILL.md
- skill_id: ctf-writeup
  domain: ctf
  description: Generates a single standardized submission-style CTF writeup for competition handoff and
    organizer review. Use after solving a CTF challenge to document the solution steps, tools used, and
    lessons learned in a structured format.
  body: '# CTF Write-up Generator


    Generate a standardized submission-style CTF writeup for a solved challenge.


    Default behavior:


    - During an active competition, optimize for speed, clarity, and reproducibility

    - Keep writeups short enough that a teammate or organizer can validate the solve quickly

    - Always produce a `submission`-style writeup

    - Prefer one complete solve script from challenge data to final flag


    ## Workflow


    ### Step 1: Gather Information


    Collect the following from the current session, challenge files, and user input:


    1. **Challenge metadata** — name, CTF event, category, difficulty, points, flag format

    2. **Solution artifacts** — exploit scripts, payloads, screenshots, command output

    3. **Timeline** — key steps taken, dead ends, pivots


    ```bash

    # Scan for exploit scripts and artifacts

    find . -name ''*.py'' -o -name ''*.sh'' -o -name ''exploit*'' -o -name ''solve*'' | head -20

    # Check for flags in output files

    grep -rniE ''(flag|ctf|eno|htb|pico)\{'' . 2>/dev/null

    ```


    ### Step 2: Generate Write-up


    Write the writeup file as `writeup.md` (or `writeup-<challenge-name>.md`) using the submission template
    below.


    ---


    ## Templates


    ### Submission Format


    ```markdown

    ---

    title: "<Challenge Name>"

    ctf: "<CTF Event Name>"

    date: YYYY-MM-DD

    category: web|pwn|crypto|reverse|forensics|osint|malware|misc|ai-ml

    difficulty: easy|medium|hard

    points: <number>

    flag_format: "flag{...}"

    author: "<your name or team>"

    ---


    # <Challenge Name>


    ## Summary


    <1-2 sentences: what the challenge was and the core technique. Keep it direct.>


    ## Solution


    ### Step 1: <Action>


    <Explain the key observation in 3-8 short lines. Keep it direct.>


    \`\`\`python

    <one complete solving script from provided challenge data to printing the final flag>

    \`\`\`


    ### Step 2: <Action> (optional)


    <Only add this when a second short step genuinely helps readability, such as separating the core observation
    from final verification.>


    ### Step 3: <Action> (optional)


    <Use only if the challenge really needs it. Keep the total number of steps small.>


    ## Flag


    \`\`\`

    flag{example_flag_here}

    \`\`\`

    ```


    Guidance:


    - Prefer 1-3 short steps total

    - Keep code to the smallest complete solving script

    - Do not split "recover secret", "derive key", and "decrypt flag" into separate partial snippets

    - The script should start from the challenge data and end by printing the flag

    - Avoid long background sections

    - Avoid dead ends unless they explain a key pivot

    - Avoid multiple alternative solves; pick one clean path

    - Redact the flag only if the user explicitly asks for redaction


    ---


    ## Best Practices Checklist


    Before finalizing the writeup, verify:


    - [ ] **Metadata complete** — title, CTF, date, category, difficulty, points, author all filled

    - [ ] **Flag handling matches request** — keep the real flag unless the user asked for redaction

    - [ ] **Reproducible steps** — a reader can follow your writeup and reproduce the solution

    - [ ] **Code is runnable** — exploit scripts include all imports, correct variable names, and comments

    - [ ] **No sensitive data** — no real credentials, API keys, or private infrastructure details

    - [ ] **Length stays concise** — the writeup is short enough for fast review

    - [ ] **Tools and versions noted** — mention specific tool versions if behavior depends on them

    - [ ] **Proper attribution** — credit teammates, referenced writeups, or tools that were essential

    - [ ] **Grammar and formatting** — consistent heading levels, code blocks have language tags


    ## Quality Guidelines


    **DO:**

    - Explain just enough for fast verification

    - Include one complete solving path, not multiple alternative routes

    - Include one complete script that goes all the way to the final flag

    - Show actual output (truncated if very long) to prove the approach worked

    - Tag code blocks with language (`python`, `bash`, `sql`, etc.)

    - Keep the main path front-loaded so a reader can validate it quickly


    **DON''T:**

    - Copy-paste raw terminal dumps without explanation

    - Paste several partial snippets that force the reader to reconstruct the final solve

    - Leave placeholder text in the final writeup

    - Include irrelevant tangents that don''t contribute to the solution

    - Assume the reader knows the specific challenge setup


    ## Challenge


    $ARGUMENTS'
  source: ctf-writeup
  path: ctf-writeup/SKILL.md
- skill_id: diagram-generator
  domain: utility
  description: generate, refine, validate, and render diagrams from natural language, notes, code snippets,
    schemas, tables, or existing diagram source. use for flowcharts, swimlanes, sequence diagrams, state
    diagrams, er diagrams, class diagrams, architecture/c4-style diagrams, dependency graphs, gantt charts,
    mind maps, user journeys, sankey-style flows, org charts, network graphs, and other visual models.
    supports mermaid by default, graphviz dot for complex graph layout, plantuml for uml-heavy engineering
    diagrams, and svg output when direct markup is more reliable.
  body: '# Diagram Generator


    ## Purpose


    Create clear, editable diagrams from messy or structured inputs. Prefer text-based diagram source
    first so the result can be reviewed, versioned, and refined. Render to files only when the user asks
    for an image/PDF or when a downloadable artifact would materially help.


    ## Default workflow


    1. Identify the user''s intent, audience, and source material.

    2. Choose the diagram family and language using the decision table below.

    3. Normalize entities, relationships, labels, states, branches, and time/order information before
    writing diagram code.

    4. Generate concise, readable diagram source.

    5. Validate the syntax mentally and, when creating files, run `scripts/render_diagram.py`.

    6. Return the diagram source plus a short note about assumptions. When files are generated, include
    links to the output files.


    Do not over-ask for clarification. If the request is underspecified, make reasonable assumptions and
    label them briefly.


    ## Diagram language decision table


    Use Mermaid unless another language is clearly better.


    | User wants | Prefer | Why |

    |---|---|---|

    | process flow, decision tree, simple swimlane | Mermaid flowchart | readable and easy to paste into
    Markdown |

    | sequence of system/user interactions | Mermaid sequenceDiagram or PlantUML sequence | Mermaid for
    docs; PlantUML for UML formality |

    | lifecycle, state machine, transitions | Mermaid stateDiagram-v2 or PlantUML state | compact transition
    syntax |

    | database schema, entities, relationships | Mermaid erDiagram | portable ER notation |

    | class/interface/object model | Mermaid classDiagram or PlantUML class | Mermaid for docs; PlantUML
    for detailed UML |

    | project schedule | Mermaid gantt | concise timeline syntax |

    | hierarchy, ideas, notes | Mermaid mindmap | good default for idea maps |

    | customer/product journey | Mermaid journey | built-in journey notation |

    | git history | Mermaid gitGraph | built-in git notation |

    | dependency graph, package graph, large network | Graphviz DOT | better layout engines for dense
    graphs |

    | architecture with layers, clusters, boundaries | Mermaid flowchart with subgraphs, Graphviz clusters,
    or PlantUML C4-style | choose based on requested fidelity |

    | weighted flow/sankey-like relationship | Mermaid sankey-beta when supported, otherwise SVG or Graphviz
    | Mermaid support may vary by renderer |

    | custom visual where source languages fit poorly | SVG | precise control over layout and styling
    |


    ## Output policy


    - Always provide editable source unless the user explicitly asks only for an image.

    - Default to a single best diagram. Offer alternatives only when genuinely useful.

    - Prefer stable, simple syntax over fancy features that may not render in older Mermaid/PlantUML versions.

    - Use short labels. Split long text into notes outside the diagram when needed.

    - Avoid ambiguous node IDs. Use ASCII IDs and human-readable labels.

    - Preserve user terminology, but standardize capitalization within a diagram.

    - For technical diagrams, include boundaries such as client, service, database, queue, external API,
    and operator/user when they are implied.

    - For business-process diagrams, distinguish happy path, decision points, failures, retries, and manual
    steps when present.

    - For diagrams created from uncertain text, include an `Assumptions` section after the code.


    ## Mermaid generation rules


    Consult `references/diagram-patterns.md` for compact templates.


    General Mermaid rules:

    - Start with the correct diagram directive, for example `flowchart TD`, `sequenceDiagram`, `erDiagram`,
    `gantt`, `mindmap`, or `journey`.

    - For flowcharts, use `flowchart TD` unless the user asks for left-to-right; use `flowchart LR` for
    architecture and pipelines.

    - Use subgraphs for swimlanes or architecture layers. Name subgraphs with readable labels.

    - Keep node IDs stable and ASCII-only, for example `ingest_service[Ingest Service]`.

    - Quote labels that contain punctuation likely to confuse the parser.

    - Use decision diamonds for branching: `decision{Condition?}`.

    - Use consistent edge labels: `-- yes -->`, `-- no -->`, `-. async .->`, or `== critical ==>` only
    when meaningful.

    - In sequence diagrams, declare participants before messages. Use `actor` for humans and `participant`
    for systems.

    - Use `alt/else/end`, `opt/end`, `loop/end`, and `par/and/end` blocks for conditional, optional, repeated,
    and parallel flows.


    ## Graphviz DOT generation rules


    Use Graphviz for large, dense, or layout-sensitive relationship diagrams.


    - Prefer `digraph G` for directed relationships and `graph G` for undirected networks.

    - Set layout-friendly graph attributes at the top: `rankdir=LR`, `nodesep`, `ranksep`, and `splines=true`
    when helpful.

    - Use `subgraph cluster_name` for boundaries and subsystems.

    - Use plain labels and restrained styling.

    - Use edge labels only when they add meaning.

    - For many nodes, group by domain with clusters and avoid crossing-heavy all-to-all edges.


    ## PlantUML generation rules


    Use PlantUML when the user asks for UML or needs formal UML notation.


    - Wrap diagrams with `@startuml` and `@enduml`.

    - Use `actor`, `participant`, `database`, `queue`, `collections`, or `component` stereotypes when
    useful.

    - Use `package`, `rectangle`, or `node` for architecture boundaries.

    - For class diagrams, include only important fields/methods unless the user asks for exhaustive detail.

    - For activity diagrams, use clear start/end markers and explicit branch labels.


    ## SVG generation rules


    Use SVG only when text diagram languages cannot express the requested visual reliably.


    - Keep SVG simple, accessible, and editable.

    - Include `<title>` and meaningful text labels.

    - Prefer rectangles, lines, arrows, and groups over complex paths.

    - Do not embed external fonts or remote images.


    ## Rendering files


    When the user asks for PNG/SVG/PDF, create a source file and run:


    ```bash

    python "<SKILL_ROOT>/diagram-generator/scripts/render_diagram.py" input.mmd --format svg --out output.svg

    python "<SKILL_ROOT>/diagram-generator/scripts/render_diagram.py" input.dot --format png --out output.png

    python "<SKILL_ROOT>/diagram-generator/scripts/render_diagram.py" input.puml --format svg --out output.svg

    ```


    > `<SKILL_ROOT>` 是本包 `skills/` 目录的实际路径，AI 应自动检测。


    The renderer is intentionally dependency-tolerant. It tries common local tools and reports actionable
    installation hints if a renderer is unavailable. Do not claim an image was rendered unless the script
    completed successfully and the output file exists.


    ## Validation checklist


    Before finalizing:


    - The diagram type matches the user''s task.

    - The source is syntactically plausible for the chosen language.

    - Labels are short enough to fit.

    - Edges and message order reflect the input accurately.

    - Assumptions are called out when the input was incomplete.

    - For generated files, the output exists and opens or has nonzero size.


    ## Common response template


    Use this structure for most diagram answers:


    ```markdown

    下面是可编辑的 [language] 版本：


    ```[language]

    [source]

    ```


    Assumptions:

    - [only if needed]


    Rendered file: [link] [only if generated]

    ```


    For English user requests, respond in English. For Chinese user requests, respond in Chinese unless
    they ask otherwise.


    ---


    ## 按需自举（On-Demand Bootstrap）


    ### 自动化能力边界


    | 工具 | 可自动安装 | 安装方式 | 说明 |

    |------|-----------|---------|------|

    | Mermaid CLI (mmdc) | ✓ | npm install -g @mermaid-js/mermaid-cli | 渲染 Mermaid 为 PNG/SVG |

    | Graphviz (dot) | ✗ | 手动安装 | https://graphviz.org/download/ |

    | PlantUML | ✗ | 需要 Java + plantuml.jar | https://plantuml.com/download |

    | Python (render script) | ✓ | 已在 bootstrap 中 | `scripts/render_diagram.py` 依赖 |


    ### 说明


    本 skill 主要输出文本格式的图表源码（Mermaid/DOT/PlantUML），不一定需要本地渲染工具。只有当用户明确要求生成 PNG/SVG/PDF 文件时才需要对应的渲染器。


    如果渲染器不可用，`scripts/render_diagram.py` 会输出安装提示而不是报错。


    ---


    ## 路由上下文


    **上游入口**: `skills/SKILL.md`（总控）、`routing.md`

    **触发条件**: 用户说"画图"、"流程图"、"架构图"、"攻击路径图"、"时序图"、"Mermaid"、"Graphviz"、"PlantUML"

    **下游出口**:

    - 生成的图表可嵌入 `docs-generator/` 的报告中

    - 攻击路径图可配合 `pentest-tools/` 的渗透报告


    **同级关联模块**: `docs-generator/`（报告中嵌入图表）'
  source: diagram-generator
  path: diagram-generator/SKILL.md
- skill_id: docs-generator
  domain: utility
  body: "\uFEFF---\nname: docs-generator\ndescription: |\n  Creates task-oriented technical documentation\
    \ with progressive disclosure. Use when writing READMEs, API docs, architecture docs, or markdown\
    \ documentation.\n  Also use this skill at the END of any completed reverse engineering, penetration\
    \ testing, CTF, or security analysis task to generate a formal report in the user's project directory.\n\
    \  Trigger keywords: 写报告, 写文档, 出报告, writeup, 技术文档, report, documentation.\n---\n\n# Technical Documentation\n\
    \nFor writing style, tone, and voice guidance, use `Skill(ce:writer)` with **The Engineer** persona.\n\
    \n## 安全/逆向任务文档输出\n\n当逆向/渗透/CTF/安全分析任务完成后，本 skill 负责在**用户项目目录**生成正式技术文档。\n\n### 触发时机\n\n1. 逆向任务完成，已产出核心结论（算法还原、签名破解、绕过方案等）\n\
    2. 渗透测试完成，已发现并验证漏洞\n3. CTF 题目解出，已拿到 flag\n4. 用户明确要求\"写一份报告/文档/writeup\"\n\n### 模板选择\n\n| 任务类型 | 使用模板\
