    \ | 二进制 |\n| **Process Monitor** | 系统调用监控 | 二进制 |\n\n### 网络分析\n\n| 工具 | 用途 | 适用领域 |\n|------|------|---------|\n\
    | **Wireshark** | 全协议抓包分析 | 协议 |\n| **mitmproxy** | HTTP(S) 代理 + 脚本 | Web / 协议 |\n| **Burp Suite**\
