    5. 追踪后续请求如何携带凭证（Cookie / Authorization Header）\n```\n\n**JWT 解码：**\n```bash\necho \"eyJhbGciOiJIUzI1NiJ9.eyJzdWIiOiIxMjM0NTY3ODkwIn0.xxx\"\
