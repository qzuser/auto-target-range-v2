    \ / sessionStorage\nObject.keys(localStorage).forEach(k =>\n  console.log(k, '=', localStorage[k].substring(0,\
    \ 50))\n);\n```\n\n### 1.5 加密速查表\n\n| 加密库 | 特征关键词 | 典型用途 | 详细参考 |\n|--------|-----------|---------|---------|\n\
