    \n### vtable 识别\n```bash\nr2 -A -q -c 'avj' ./target 2>/dev/null  # JSON 输出所有 vtable\n```\n```asm\n\
    ; 构造函数特征\nlea  rax, [rip + vtable_offset]  ; 加载 vtable\nmov  [rdi], rax                   ; this->vptr\
    \ = vtable\n; 虚函数调用\nmov  rax, [rdi]                   ; rax = vptr\ncall [rax + N*8]            \
    \      ; 第 N 个虚函数\n```\n\n### 结构体字段恢复规则\n- `[base + N]` 反复访问 → 字段 N\n- 访问大小推断类型：b=uint8 / w=uint16\
    \ / d=uint32/float / q=uint64/ptr\n- `malloc(M)` 后多字段初始化 → 结构体大小 M\n- 相邻偏移间隙 → padding\n\n输出格式（每个结构体）：\n\
    ```c\nstruct obj_X {\n    /* 0x00 */ void*    vptr;\n    /* 0x08 */ int32_t  state;\n    /* 0x0c */\
    \ uint32_t flags;\n    /* 0x10 */ void*    handler;  // 函数指针\n};  // sizeof = 0x18\n```\n\n---\n\n\
