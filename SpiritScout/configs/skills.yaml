- skill_id: src-hunter
  domain: src
  description: 实战 SRC / 众测 / Bug bounty 漏洞挖掘工作流 skill。包含：5 阶段方法论（intake → recon → enum → hunt → report）、19
    个攻击类 playbook（SQLi/XSS/RCE/SSRF/IDOR/CSRF/Path Traversal/File Upload/SSTI/XXE/Race/HTTP Smuggling/OAuth/JWT/SAML/GraphQL/Mobile/LLM/DoS）、305
    个结构化 payload、263 个 WAF/EDR 绕过变体、2887 份 HackerOne 真实 High/Critical 已披露案例、77,000+ WooYun 案例统计、国产 OA
    / 中间件指纹库、银行 / 电信行业垂直 playbook。当用户提到 "src 挖洞 / src 漏洞挖掘 / bug bounty / 众测 / hackerone / 漏洞赏金 / SRC
    / 任意 X 漏洞 / 渗透测试" 或问"如何挖某个目标 / 怎么测某个 API / 如何绕过 WAF" 时触发。
  body: "# SRC Hunter — 实战漏洞挖掘工作流\n\n实战 Security Response Center / 众测 / Bug bounty 挖洞 skill。把白盒方法论翻译为黑盒探测，叠加真实案例统计与\
    \ payload 库。\n\n---\n\n## 何时使用本 skill\n\n**关键词命中**：\n- \"src 挖洞\" / \"src 漏洞\" / \"src 测试\" / \"Security\
    \ Response Center\"\n- \"bug bounty\" / \"漏洞赏金\" / \"众测\"\n- \"hackerone\" / \"h1\" / \"bugcrowd\"\
    \ / \"intigriti\" / \"yeswehack\"\n- \"如何挖 / 怎么测 / 怎么打 + 某目标 / 某接口 / 某参数\"\n- \"WAF 绕过\" / \"绕过 WAF\"\
    \ / \"WAF bypass\"\n- \"任意账号 / 任意修改 / 任意删除 / 任意操作\" 类越权\n- \"密码重置\" / \"找回密码\" 类逻辑\n- \"未授权访问\" /\
    \ \"默认凭据\" / \"Actuator\" / \"Spring 暴露\" / \"Redis 未授权\"\n- 用户给一个 URL 或 API endpoint 让你测\n\n**不应使用本\
    \ skill**：\n- 纯白盒源码审计（用 `code-audit` skill）\n- 已知漏洞的修复 / 防御问答（用通用对话）\n- 单独的 CTF 题目（这是真实环境工作流）\n\n\
    ---\n\n## 工作流 — 5 阶段\n\n### Phase 1 · Intake（接单）\n\n输入：程序名 / SRC 入口 URL / 子域。\n\n要做的事：\n- 抓 Scope（in-scope\
    \ domains / IPs / mobile apps / API endpoints）\n- 抓 Out-of-scope（禁测内容、第三方服务、cloud assets exclusions）\n\
    - 抓规则（payout tiers、disclosure window、retest policy、safe-harbor）\n- 抓测试账号 / 测试 header（如 `X-Bug-Bounty:\
    \ <handle>`）\n\n**优先级判断**（基于命中类型预估命中率，参考 `references/methodology/05-srctimebox-priority.md`）：\n- 6\
    \ 小时窗口 → 跑高命中率类型（密码重置 88% / 任意账号 86.4% / 提现 83.1%）\n- 单日窗口 → 加上信息泄露 + 资产暴露 + Actuator\n- HVV / 重点期\
    \ → 全谱\n\n→ 详见 [`references/methodology/00-index.md`](references/methodology/00-index.md)\n\n### Phase\
    \ 2 · Recon（被动侦察）\n\n不发包给目标的情报收集：\n\n- **CT 日志**：crt.sh / Censys（找子域）\n- **历史快照**：Wayback / CommonCrawl\n\
    - **GitHub 搜索**：`org:target` + 关键词（password / api_key / SECRET）\n- **搜索引擎 dorks**：`site:target.com\
    \ inurl:/admin`、`filetype:env`、`intitle:Index of`\n- **ASN / IP 段**：bgp.he.net 找 IP 块\n- **Favicon\
    \ hash**：FOFA / Shodan 找同 favicon 资产\n- **DNS 历史**：SecurityTrails / Whoisxmlapi\n\n### Phase 3 · Enum（主动探测）\n\
    \n**资产枚举**：\n- 子域：amass / subfinder / puredns / dnsx\n- 存活：httpx / naabu\n- 截图：gowitness / aquatone\n\
    - 内容发现：ffuf / feroxbuster / dirsearch\n- 技术指纹：wappalyzer / webanalyze（同时查 `references/dictionaries/chinese-srcfingerprints.md`\
    \ 命中国产组件）\n- JS 提取：linkfinder / subjs / gau / katana\n- 子域接管指纹：subjack / subzy\n\n### Phase 4 · Hunt（漏洞探测）\n\
    \n按攻击类型走对应 playbook，**每个 playbook 都包含**：方法论 + 参数频率表 + 真实 H1 案例 + 结构化 payload + WAF 绕过变体。\n\n**优先级路径**（按命中率\
    \ + 价值排序）：\n\n| Playbook | 入口提示 | 文件 |\n|---|---|---|\n| **未授权访问** | Actuator/Swagger/默认端口/弱密码 | `references/playbooks/unauth-access.md`\
    \ |\n| **信息泄露** | .git/.svn/.env/heapdump/路径列举 | `references/playbooks/info-disclosure.md` |\n| **任意\
    \ X 越权** | 用户态 ID 可遍历/可修改 | `references/playbooks/arbitrary-x-authz.md` |\n| **业务逻辑** | 密码重置/支付/订单/验证码\
    \ | `references/playbooks/logic-flaws.md` |\n| **OAuth/SAML/JWT** | 认证流/redirect_uri/token | `references/playbooks/oauth-saml-jwt.md`\
    \ |\n| **API REST** | BOLA/Mass Assignment/速率 | `references/playbooks/api-rest.md` |\n| **SQLi** |\
    \ 任何用户输入进 DB | `references/playbooks/sqli.md` |\n| **RCE** | 反序列化/SSTI/XXE/原型链/框架 | `references/playbooks/rce.md`\
    \ |\n| **SSRF** | URL 入参/缓存/Host 注入 | `references/playbooks/ssrf-cache-host.md` |\n| **路径遍历** | 文件路径入参/LFI/RFI\
    \ | `references/playbooks/path-traversal.md` |\n| **文件上传** | 上传点 + 解析漏洞 | `references/playbooks/file-upload.md`\
    \ |\n| **XSS** | 任何用户输入进 HTML/JS | `references/playbooks/xss.md` |\n| **HTTP 走私** | 反代 + Content-Length\
    \ | `references/playbooks/http-smuggling.md` |\n| **GraphQL** | introspection/嵌套 | `references/playbooks/graphql.md`\
    \ |\n| **竞态** | 并发请求 / TOCTOU | `references/playbooks/race-conditions.md` |\n| **DoS** | ReDoS / 资源不限速\
    \ / 算法爆炸 | `references/playbooks/dos.md` |\n| **移动端** | Android / iOS APK | `references/playbooks/mobile.md`\
    \ |\n| **LLM Agent** | Prompt 注入 / 工具调用 | `references/playbooks/llm-prompt-injection.md` |\n| **内网后渗透**\
    \ | 凭据 / 横向 / 域 | `references/playbooks/intranet-postexp.md` |\n\n**通用方法论**（不分攻击类型）：\n\n| 文档 | 关键内容\
    \ |\n|---|---|\n| [`methodology/01-attack-priority.md`](references/methodology/01-attack-priority.md)\
    \ | RCE>文件写>认证绕过>注入>信息泄露 价值排序 |\n| [`methodology/02-bypass-toolkit.md`](references/methodology/02-bypass-toolkit.md)\
    \ | 通用绕过决策树 + 编码 / 混淆 / WAF |\n| [`methodology/03-evidence-discipline.md`](references/methodology/03-evidence-discipline.md)\
    \ | 黑盒证据规则 + 反幻觉 + 合规 |\n| [`methodology/04-control-gap-hunting.md`](references/methodology/04-control-gap-hunting.md)\
    \ | 9 类敏感操作 → 应有控制 → 探测缺失 |\n| [`methodology/05-srctimebox-priority.md`](references/methodology/05-srctimebox-priority.md)\
    \ | 6h / 单日 / HVV / 月度 时间盒模板 |\n\n**行业垂直 playbook**（资产相关时优先看）：\n\n| 行业 | 文档 | 何时用 |\n|---|---|---|\n\
    | 银行 / 支付 / 金融 | [`industry/banking-finance.md`](references/industry/banking-finance.md) | 目标含支付 /\
    \ 网银 / 第三方支付聚合 |\n| 电信 / ISP | [`industry/telecom-isp.md`](references/industry/telecom-isp.md) | 目标是运营商\
    \ / BOSS / 网管 / 物联网卡 |\n\n**字典 / 凭据**：\n\n| 文档 | 用途 |\n|---|---|\n| [`dictionaries/default-credentials-cn.md`](references/dictionaries/default-credentials-cn.md)\
    \ | 致远 / 通达 / 万户 / 泛微 / 用友 / 金蝶 / 华为 / 中兴 / 海康等国产凭据 |\n| [`dictionaries/chinese-srcfingerprints.md`](references/dictionaries/chinese-srcfingerprints.md)\
    \ | 国产 OA / 中间件指纹 + 高频参数 + 一键检测命令 |\n\n### Phase 5 · Report（提交）\n\n→ 用模板 [`templates/report-submission.md`](references/templates/report-submission.md)\n\
    \n**三段式骨架**：\n1. **标题**：精确到 endpoint + 漏洞类型，不超过 80 字\n2. **重现步骤**：每步可执行 / 截图 / HAR\n3. **影响 + 修复建议**：CVSS\
    \ 4.0 vector + 业务影响段\n\n---\n\n## MCP 工具集成\n\n本 skill 支持调用本地 MCP 服务器作为工具层。**主选 jshookmcp**(134 工具精选\
    \ / 386 全集 / 36 域,内置 Burp Suite bridge / Frida / WASM / 反调试 / Android adb / sourcemap 重构)。完整索引与场景映射:\n\
    \n→ [`references/tools/mcp-jshook.md`](references/tools/mcp-jshook.md)\n\n默认推荐 `search` profile(上下文成本\
    \ ~3K token),通过 `mcp__jshook__search_tools` + `mcp__jshook__activate_tools` 按需激活,避免 `full` profile\
    \ 一次性加载 40K+ token。\n\n---\n\n## 数据资产规模\n\n| 类别 | 量级 |\n|---|---|\n| 攻击类 playbook | 19 个 |\n| 通用方法论文档\
    \ | 6 个 |\n| 行业垂直 playbook | 2 个（银行 / 电信） |\n| 字典 / 凭据 | 3 个 |\n| 报告模板 | 1 个 |\n| 结构化 payload | **305\
    \ 条**（177 web + 128 内网） |\n| WAF / EDR 绕过变体 | **263 个步骤**，覆盖 23 类 Web 攻击 |\n| 工具命令速查 | 114 条（Nmap/SQLMap/Burp/MSF/...）\
    \ |\n| HackerOne 真实案例（已披露 High/Critical） | **2887 份**，按 weakness 分到 141 个分类 MD |\n| WooYun 历史案例统计（不可再生）\
    \ | 88,636 条 |\n\nH1 真实案例已**直接嵌入对应 playbook 末尾**（每个 playbook 末尾有\"H1 真实案例\" Top 12 表 + 摘要）。\n\n---\n\
    \n## 合规与合法红线\n\n每个 playbook 末段都有\"不要做的事\"。通用红线（任何 SRC 都遵守）：\n\n- ❌ 出 scope 的资产 / 域名 → 立即停手并报备\n- ❌\
    \ 实际取走他人 PII → 仅证明可访问，立即销毁\n- ❌ 持续负载 / DoS / 大流量 → 仅 1–3 个 PoC 包，立即停止\n- ❌ 修改他人数据（即使有写权限）→ 仅在自己控制的对象上验证\n\
    - ❌ 在生产做钓鱼或社工 → 不做\n- ❌ 提交未复现的猜测 → 必须有 HTTP 包 / 截图 / 视频证据\n- ✅ 测试 header 标记自己（如 `X-Bug-Bounty: <handle>`）\n\
    - ✅ 用自己的两个账号自演越权场景\n- ✅ 用 OOB 域名做 SSRF 探测，不要用别人的 DNSLog\n- ✅ 提交前用 `references/templates/report-submission.md`\
    \ 自查\n\n---\n\n## CLI 助记前缀\n\n`srchunter`（如：`srchunter scope set <program>`、`srchunter recon run`、`srchunter\
    \ findings new <type>`）。当前未实现 CLI，仅作命名约定。\n\n---\n\n## 引用 / 跨链结构\n\n```\nsrc-hunter/\n├── SKILL.md\
    \                    # 本文件 — skill 入口\n├── README.md                   # 项目说明\n└── references/\n \
    \   ├── methodology/   6 docs   # 通用打法\n    ├── playbooks/    19 docs   # 攻击类 playbook（每个含 H1 案例 +\
    \ Payload 库）\n    ├── industry/      3 docs   # 行业垂直\n    ├── dictionaries/  3 docs   # 字典 / 凭据\n\
    \    ├── templates/     1 doc    # 报告模板\n    ├── h1-reports/             # 2887 份 H1 报告原始数据 + 141\
    \ 类 MD\n    │   ├── raw/                # 原始 JSON（resume / 二次分析用）\n    │   └── by-weakness/      \
    \  # 按 CWE 分类的 Markdown\n    └── payloader/              # 305 条结构化 payload 数据\n        ├── raw/ \
    \               # JSON（机读）\n        ├── by-category/        # 按分类的 MD\n        ├── tools/        \
    \      # 工具命令\n        └── waf-bypass.md       # 263 步骤 WAF 绕过集\n```"
