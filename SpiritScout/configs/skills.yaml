    ## CRITICAL: 路由执行契约（必须立即执行）


    读完本文件后，不允许只回复“已读/已理解”。必须按顺序执行：


    1. `NOW`：读取 `routing.md`，按“目标类型 + 用户意图 + 工具链”三轴完成路由判定。

