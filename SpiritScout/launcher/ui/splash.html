<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵枢 · 正在启动</title>
<style>
  /* 令牌跟 web 控制台一模一样（base.css + polish.css），窗口壳和控制台看起来才是一个东西：
     浅灰底 #f6f8fa、白卡片、1px #d8dee4 边框、8px 圆角、蓝色主色 #0969da、6px 控件圆角。 */
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --ink: #1f2328;
    --ink-2: #59636e;
    --ink-3: #818b98;
    --line: #d8dee4;
    --line-strong: #bcc4cd;
    --accent: #0969da;
    --accent-strong: #0757ba;
    --accent-soft: rgba(9, 105, 218, .09);
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 1px 0 rgba(31, 35, 40, .04);
    --shadow-card: 0 1px 3px rgba(31, 35, 40, .08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .card {
    width: min(380px, calc(100vw - 56px));
    padding: 30px 32px 26px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    text-align: center;
  }
  .mark { display: block; width: 52px; height: 52px; margin: 0 auto 16px; }
  h1 { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .01em; }
  .sub { margin: 5px 0 0; font-size: 12px; color: var(--ink-3); }
  .status {
    margin: 22px 0 0;
    min-height: 20px;
    font-size: 13px;
    color: var(--ink-2);
  }
  .track {
    position: relative;
    height: 4px;
    margin: 12px 0 0;
    border-radius: 999px;
    background: var(--surface-2);
    overflow: hidden;
  }
  .track > i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 34%;
    border-radius: 999px;
    background: var(--accent);
    animation: slide 1.5s cubic-bezier(.5, 0, .5, 1) infinite;
  }
  @keyframes slide {
    0%   { left: -34%; width: 34%; }
    55%  { left: 62%;  width: 38%; }
    100% { left: 104%; width: 30%; }
  }
  .hint {
    margin: 20px 0 0;
    padding-top: 16px;
    border-top: 1px solid var(--line);
    font-size: 12px;
    line-height: 1.75;
    color: var(--ink-3);
  }
  @media (prefers-reduced-motion: reduce) { .track > i { animation: none; width: 100%; } }
</style>
</head>
<body>
  <main class="card">
    <!-- 标志就是窗口图标那一枚（同 favicon 的几何），大号显示 -->
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="灵枢">
      <rect width="32" height="32" rx="7.5" fill="#a4681e"></rect>
      <g stroke="#faf9f6" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M16 12.9V8.2"></path>
        <path d="M19.2 17.9l4.1 2.4"></path>
        <path d="M12.8 17.9l-4.1 2.4"></path>
      </g>
      <g fill="#faf9f6">
        <circle cx="16" cy="16" r="3.2"></circle>
        <circle cx="16" cy="7" r="2.4"></circle>
        <circle cx="24.5" cy="21.5" r="2.4"></circle>
        <circle cx="7.5" cy="21.5" r="2.4"></circle>
      </g>
    </svg>
    <h1>灵枢</h1>
    <p class="sub">SpiritScout · 多智能体安全测试系统</p>
    <p class="status" id="ss-status">{{STATUS}}</p>
    <div class="track"><i></i></div>
    <p class="hint">第一次打开要解出运行时（约 20 秒），之后就秒开。<br>这个窗口会自己启动服务，不用点任何按钮。</p>
  </main>
  <script>
    window.ssSet = function (text) {
      var node = document.getElementById('ss-status');
      if (node) { node.textContent = String(text); }
    };
  </script>
</body>
</html>
