<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵枢 · 正在启动</title>
<!-- 样式由构建脚本拼好塞进来：base.css + polish.css + shell-pages.css，
     跟 web 控制台是同一份表，不在这里另抄一套颜色。 -->
<style>{{SHELL_CSS}}</style>
</head>
<body class="shell">
  <main class="card shell-card splash">
    <!-- 标志跟控制台侧栏同一枚（源自 static/favicon.svg 的几何），颜色取 --accent -->
    <div class="shell-brand">
      <svg class="brand-mark" width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 9.4V4.8M14.3 13.2l3.8 2.2M9.7 13.2l-3.8 2.2"></path>
        </g>
        <circle cx="12" cy="12" r="2.7" fill="currentColor"></circle>
        <g fill="currentColor">
          <circle cx="12" cy="3.7" r="1.8"></circle>
          <circle cx="18.5" cy="17.4" r="1.8"></circle>
          <circle cx="5.5" cy="17.4" r="1.8"></circle>
        </g>
      </svg>
      <div>
        <h1>灵枢<em>·</em>SpiritScout</h1>
        <small>多智能体安全测试系统</small>
      </div>
    </div>
    <p class="status" id="ss-status">{{STATUS}}</p>
    <div class="track"><i></i></div>
    <p class="hint">第一次打开要解出运行时（约 20 秒），之后就秒开。<br>这个窗口会自己启动服务，不用点任何按钮。</p>
  </main>
  <script>
    window.ssSet = function (text) {
      var node = document.getElementById('ss-status');
      if (node) { node.textContent = String(text); }
    };
  </script>
</body>
</html>
