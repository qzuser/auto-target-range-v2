<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵枢 · 正在启动</title>
<style>
  :root {
    --ink: #1f2328;
    --ink-soft: #57606a;
    --line: #d8dee4;
    --card: #ffffff;
    --bg: #f6f7f9;
    --brand: #a4681e;
    --brand-soft: #fdf6ec;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    background:
      radial-gradient(1100px 620px at 50% -12%, #ffffff 0%, rgba(255, 255, 255, 0) 62%),
      var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }
  .card {
    width: min(420px, calc(100vw - 64px));
    padding: 40px 40px 34px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(31, 35, 40, .04), 0 12px 32px rgba(31, 35, 40, .08);
    text-align: center;
  }
  .mark {
    width: 64px;
    height: 64px;
    margin: 0 auto 18px;
    border-radius: 15px;
    box-shadow: 0 6px 16px rgba(164, 104, 30, .22);
    display: block;
  }
  h1 {
    margin: 0;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: .2px;
  }
  .sub {
    margin: 6px 0 0;
    font-size: 12.5px;
    color: var(--ink-soft);
    letter-spacing: .3px;
  }
  .status {
    margin: 26px 0 0;
    min-height: 20px;
    font-size: 13px;
    color: var(--ink-soft);
  }
  .track {
    position: relative;
    height: 4px;
    margin: 14px 0 0;
    border-radius: 999px;
    background: #eceff3;
    overflow: hidden;
  }
  .track > i {
    position: absolute;
    inset: 0 auto 0 0;
    width: 34%;
    border-radius: 999px;
    background: linear-gradient(90deg, #d9a15a, var(--brand));
    animation: slide 1.5s cubic-bezier(.5, 0, .5, 1) infinite;
  }
  @keyframes slide {
    0%   { left: -34%; width: 34%; }
    55%  { left: 62%;  width: 38%; }
    100% { left: 104%; width: 30%; }
  }
  .hint {
    margin: 22px 0 0;
    padding-top: 18px;
    border-top: 1px solid #eef1f4;
    font-size: 12px;
    line-height: 1.75;
    color: #8b949e;
  }
  .hint b { color: var(--brand); font-weight: 600; }
  @media (prefers-reduced-motion: reduce) { .track > i { animation: none; width: 100%; } }
</style>
</head>
<body>
  <main class="card">
    <svg class="mark" viewBox="0 0 32 32" role="img" aria-label="灵枢">
      <rect width="32" height="32" rx="7.5" fill="#a4681e"></rect>
      <g stroke="#faf9f6" stroke-width="2.2" stroke-linecap="round" fill="none">
        <path d="M16 12.9V8.2"></path>
        <path d="M19.2 17.9l4.1 2.4"></path>
        <path d="M12.8 17.9l-4.1 2.4"></path>
      </g>
      <g fill="#faf9f6">
        <circle cx="16" cy="16" r="3.2"></circle>
        <circle cx="16" cy="7" r="2.4"></circle>
        <circle cx="24.5" cy="21.5" r="2.4"></circle>
        <circle cx="7.5" cy="21.5" r="2.4"></circle>
      </g>
    </svg>
    <h1>灵枢</h1>
    <p class="sub">SpiritScout · 多智能体安全测试系统</p>
    <p class="status" id="ss-status">{{STATUS}}</p>
    <div class="track"><i></i></div>
    <p class="hint">第一次打开要解出运行时（约 20 秒），之后就秒开。<br>这个窗口会自己启动服务，不用点任何按钮。</p>
  </main>
  <script>
    window.ssSet = function (text) {
      var node = document.getElementById('ss-status');
      if (node) { node.textContent = String(text); }
    };
  </script>
</body>
</html>
