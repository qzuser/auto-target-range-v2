<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵枢 · 启动遇到问题</title>
<style>{{SHELL_CSS}}</style>
</head>
<body class="shell">
  <main class="card shell-card wide">
    <div class="shell-head">
      <div class="badge">!</div>
      <div>
        <h1 id="ss-title">{{TITLE}}</h1>
        <p class="lead" id="ss-lead">{{LEAD}}</p>
      </div>
    </div>
    <pre class="detail" id="ss-detail">{{DETAIL}}</pre>
    <div class="shell-actions">
      <button class="btn primary" type="button" onclick="ssSend('retry')">重试</button>
      <button class="btn" type="button" onclick="ssSend('log')">打开日志目录</button>
      <button class="btn" type="button" onclick="ssSend('browser')">用浏览器打开</button>
      <button class="btn" type="button" onclick="ssSend('quit')">退出</button>
    </div>
    <p class="shell-foot">日志里有完整的过程（<code>Ctrl+Alt+L</code>），报错时可以把它发给维护的人。</p>
  </main>
  <script>
    function ssSend(action) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(action);
      }
    }
    window.ssFill = function (title, lead, detail) {
      document.getElementById('ss-title').textContent = title;
      document.getElementById('ss-lead').textContent = lead;
      document.getElementById('ss-detail').textContent = detail;
    };
  </script>
</body>
</html>
