<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵枢 · 环境没准备好</title>
<style>
  /* 跟 web 控制台同一套令牌：白卡片、1px #d8dee4 边框、8px 圆角、蓝色主按钮 #0969da。
     弹窗里的按钮就是控制台里的 .btn：32px 高、6px 圆角、13px/500。 */
  :root {
    --bg: #f6f8fa;
    --surface: #ffffff;
    --surface-2: #f2f4f7;
    --ink: #1f2328;
    --ink-2: #59636e;
    --ink-3: #818b98;
    --line: #d8dee4;
    --line-strong: #bcc4cd;
    --accent: #0969da;
    --accent-strong: #0757ba;
    --accent-soft: rgba(9, 105, 218, .09);
    --bad: #cf222e;
    --bad-soft: rgba(207, 34, 46, .1);
    --radius: 8px;
    --radius-sm: 6px;
    --shadow: 0 1px 0 rgba(31, 35, 40, .04);
    --shadow-card: 0 1px 3px rgba(31, 35, 40, .08);
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 28px;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(580px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 26px 28px 22px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
  }
  .head { display: flex; gap: 12px; align-items: flex-start; }
  .badge {
    flex: none;
    width: 32px;
    height: 32px;
    border-radius: var(--radius-sm);
    background: var(--bad-soft);
    border: 1px solid rgba(207, 34, 46, .25);
    color: var(--bad);
    font-size: 15px;
    font-weight: 700;
    display: grid;
    place-items: center;
  }
  h1 { margin: 0; font-size: 16px; font-weight: 600; line-height: 1.5; }
  .lead { margin: 4px 0 0; font-size: 13px; color: var(--ink-2); line-height: 1.7; }
  .detail {
    margin: 16px 0 0;
    padding: 10px 12px;
    max-height: 190px;
    overflow: auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--radius-sm);
    font-family: ui-monospace, Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-2);
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; margin: 18px 0 0; }

  /* 这一段就是控制台的 .btn —— 值照抄 polish.css，别在这里另立一套 */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    min-height: 32px;
    padding: 5px 12px;
    border: 1px solid var(--line-strong);
    border-radius: var(--radius-sm);
    background: var(--surface);
    color: var(--ink);
    font: inherit;
    font-size: 13px;
    font-weight: 500;
    line-height: 1.4;
    white-space: nowrap;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: background .15s ease, border-color .15s ease, color .15s ease;
  }
  .btn:hover { background: var(--surface-2); border-color: var(--ink-3); }
  .btn:active { background: var(--surface-2); }
  .btn:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--shadow), 0 0 0 3px var(--accent-soft); }
  .btn.primary { border-color: var(--accent-strong); background: var(--accent); color: #fff; }
  .btn.primary:hover { background: var(--accent-strong); border-color: var(--accent-strong); }

  .foot { margin: 14px 0 0; font-size: 12px; color: var(--ink-3); line-height: 1.7; }
  code { font-family: ui-monospace, Consolas, monospace; background: var(--surface-2);
         padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="badge">!</div>
      <div>
        <h1 id="ss-title">{{TITLE}}</h1>
        <p class="lead" id="ss-lead">{{LEAD}}</p>
      </div>
    </div>
    <pre class="detail" id="ss-detail">{{DETAIL}}</pre>
    <div class="actions">
      <button class="btn primary" type="button" onclick="ssSend('retry')">重试</button>
      <button class="btn" type="button" onclick="ssSend('log')">打开日志目录</button>
      <button class="btn" type="button" onclick="ssSend('browser')">用浏览器打开</button>
      <button class="btn" type="button" onclick="ssSend('quit')">退出</button>
    </div>
    <p class="foot">日志里有完整的过程（<code>Ctrl+Alt+L</code>），报错时可以把它发给维护的人。</p>
  </main>
  <script>
    function ssSend(action) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(action);
      }
    }
    window.ssFill = function (title, lead, detail) {
      document.getElementById('ss-title').textContent = title;
      document.getElementById('ss-lead').textContent = lead;
      document.getElementById('ss-detail').textContent = detail;
    };
  </script>
</body>
</html>
