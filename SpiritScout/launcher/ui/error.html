<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>灵枢 · 环境没准备好</title>
<style>
  :root {
    --ink: #1f2328;
    --ink-soft: #57606a;
    --line: #d8dee4;
    --bg: #f6f7f9;
    --warn: #b4510b;
    --warn-soft: #fff7ed;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    background:
      radial-gradient(1100px 620px at 50% -12%, #ffffff 0%, rgba(255, 255, 255, 0) 62%),
      var(--bg);
    color: var(--ink);
    font-family: "Microsoft YaHei UI", "Microsoft YaHei", "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: min(560px, 100%);
    max-height: 100%;
    overflow: auto;
    padding: 34px 34px 26px;
    background: #fff;
    border: 1px solid var(--line);
    border-radius: 16px;
    box-shadow: 0 1px 2px rgba(31, 35, 40, .04), 0 12px 32px rgba(31, 35, 40, .08);
  }
  .head { display: flex; gap: 14px; align-items: flex-start; }
  .badge {
    flex: 0 0 auto;
    width: 38px; height: 38px;
    border-radius: 10px;
    background: var(--warn-soft);
    border: 1px solid #f2d3b3;
    color: var(--warn);
    font-size: 20px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  h1 { margin: 0; font-size: 17px; font-weight: 600; line-height: 1.5; }
  .lead { margin: 6px 0 0; font-size: 12.5px; color: var(--ink-soft); line-height: 1.7; }
  .detail {
    margin: 18px 0 0;
    padding: 12px 14px;
    max-height: 180px;
    overflow: auto;
    background: #f6f8fa;
    border: 1px solid #eaeef2;
    border-radius: 10px;
    font-family: Consolas, "Cascadia Mono", monospace;
    font-size: 12px;
    line-height: 1.7;
    color: #424a53;
    white-space: pre-wrap;
    word-break: break-word;
    user-select: text;
  }
  .actions { display: flex; flex-wrap: wrap; gap: 10px; margin: 22px 0 0; }
  button {
    font: inherit;
    font-size: 13px;
    padding: 8px 16px;
    border-radius: 8px;
    border: 1px solid var(--line);
    background: #fff;
    color: var(--ink);
    cursor: pointer;
    transition: background .12s ease, border-color .12s ease;
  }
  button:hover { background: #f3f4f6; }
  button.primary {
    background: #1f883d;
    border-color: #1a7f37;
    color: #fff;
  }
  button.primary:hover { background: #1a7f37; }
  .foot { margin: 18px 0 0; font-size: 12px; color: #8b949e; line-height: 1.7; }
  code { background: #f6f8fa; padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
</style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="badge">!</div>
      <div>
        <h1 id="ss-title">{{TITLE}}</h1>
        <p class="lead" id="ss-lead">{{LEAD}}</p>
      </div>
    </div>
    <pre class="detail" id="ss-detail">{{DETAIL}}</pre>
    <div class="actions">
      <button class="primary" onclick="ssSend('retry')">重试</button>
      <button onclick="ssSend('log')">打开日志目录</button>
      <button onclick="ssSend('browser')">用浏览器打开</button>
      <button onclick="ssSend('quit')">退出</button>
    </div>
    <p class="foot">日志里有完整的过程，报错时可以把它发给维护的人。</p>
  </main>
  <script>
    function ssSend(action) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(action);
      }
    }
    window.ssFill = function (title, lead, detail) {
      document.getElementById('ss-title').textContent = title;
      document.getElementById('ss-lead').textContent = lead;
      document.getElementById('ss-detail').textContent = detail;
    };
  </script>
</body>
</html>
