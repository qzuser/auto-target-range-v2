<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>灵枢 · 设置管理员密码</title>
<style>{{SHELL_CSS}}</style>
</head>
<body class="shell">
  <main class="card shell-card">
    <div class="shell-brand">
      <svg class="brand-mark" width="26" height="26" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
          <path d="M12 9.4V4.8M14.3 13.2l3.8 2.2M9.7 13.2l-3.8 2.2"></path>
        </g>
        <circle cx="12" cy="12" r="2.7" fill="currentColor"></circle>
        <g fill="currentColor">
          <circle cx="12" cy="3.7" r="1.8"></circle>
          <circle cx="18.5" cy="17.4" r="1.8"></circle>
          <circle cx="5.5" cy="17.4" r="1.8"></circle>
        </g>
      </svg>
      <div>
        <h1>设置管理员密码</h1>
        <small>灵枢 · 控制台登录</small>
      </div>
    </div>

    <p class="muted" style="margin:0;font-size:12.5px;line-height:1.75">
      只保存 scrypt 哈希，密码长度不限；设完立即生效，不用重启服务。<br>
      用户名要和已有的那个一致（之前用过别的就改成那个），不然会多出一个账号。
    </p>

    <div class="shell-form">
      <div class="row">
        <label for="ss-user">管理员用户名</label>
        <input id="ss-user" type="text" autocomplete="username" spellcheck="false" value="spiritscout">
      </div>
      <div class="row">
        <label for="ss-pass">密码</label>
        <input id="ss-pass" type="password" autocomplete="new-password" placeholder="输入新密码">
      </div>
      <div class="row">
        <label for="ss-pass2">再输一次</label>
        <input id="ss-pass2" type="password" autocomplete="new-password" placeholder="重复上面的密码">
        <p class="hint">留空就表示不设密码（等于不开启控制台登录）。</p>
      </div>
    </div>

    <p class="msg" id="ss-msg"></p>

    <div class="shell-actions">
      <button class="btn" type="button" onclick="ssSend({ action: 'console' })">返回控制台</button>
      <button class="btn primary" id="ss-save" type="button" onclick="ssSave()">保存并生效</button>
    </div>
  </main>
  <script>
    function ssSend(payload) {
      if (window.chrome && window.chrome.webview) {
        window.chrome.webview.postMessage(payload);
      }
    }
    function show(kind, text) {
      var box = document.getElementById('ss-msg');
      box.className = 'msg show ' + kind;
      box.textContent = text;
    }
    function ssSave() {
      var user = document.getElementById('ss-user').value.trim();
      var pass = document.getElementById('ss-pass').value;
      var pass2 = document.getElementById('ss-pass2').value;
      if (pass !== pass2) { show('bad', '两次输入不一致，没保存。'); return; }
      var save = document.getElementById('ss-save');
      save.disabled = true;
      save.textContent = '正在保存…';
      show('ok', '正在写入管理库…');
      ssSend({ action: 'setpw', username: user, password: pass });
    }
    /* 主程序写完之后回调这里：成功就把按钮恢复成「已保存」，失败把原因写在框里 */
    window.ssResult = function (ok, message) {
      var save = document.getElementById('ss-save');
      save.disabled = false;
      save.textContent = ok ? '已保存' : '保存并生效';
      show(ok ? 'ok' : 'bad', message);
      if (ok) {
        document.getElementById('ss-pass').value = '';
        document.getElementById('ss-pass2').value = '';
      }
    };
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); ssSave(); }
      if (e.key === 'Escape') { ssSend({ action: 'console' }); }
    });
  </script>
</body>
</html>
