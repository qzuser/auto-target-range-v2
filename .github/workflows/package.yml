name: 打包并发布

# 打 tag 就自动出包：wheel + sdist + 整仓 zip + 原生桌面包 + SHA256SUMS，附到同名 Release 上。
# 三种源码包都带做题经验：wheel/sdist 里是 knowledge/data/experience.json(+md)，
# 包根另有 docs/workspace/EXPERIENCE.md 摘要；zip 是整仓。
# 原生桌面包必须在 Windows 上编（JDK 21 jpackage + Gradle），所以拆成
# package（Linux）→ native-desktop（Windows）→ release（汇总分发）三段。
# 也可以在 Actions 页面手动触发（填一个已存在的 tag，或留空按代码版本号推导）。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "要附件的 tag（例如 v0.47.4）；留空则按 ref / 代码版本号推导"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: package-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    name: 构建源码包
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 手动投 tag 时要能解析到该 tag 的提交
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 生成经验摘要
        shell: bash
        run: |
          set -euo pipefail
          # 摘要要进 wheel / sdist / zip，所以先生成：仓库根一份、包目录各一份。
          # 直接按文件路径跑：打包环境还没装本项目依赖，走 `-m` 会连带拉起 yaml/litellm。
          python src/spiritscout/knowledge/digest.py \
            --repo . --package . --limit 60
          head -20 docs/workspace/EXPERIENCE.md

      - name: 构建 wheel 与 sdist
        run: |
          set -euo pipefail
          python -m pip install --upgrade build
          python -m build --outdir dist/python .
          ls -lh dist/python

      - name: 打整仓 zip（附经验摘要）
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/spiritscout/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          prefix="SpiritScout-$version/"
          mkdir -p dist/source
          zip="dist/source/SpiritScout-$version-source.zip"
          git archive --format=zip --prefix="$prefix" -o "$zip" HEAD
          python - "$zip" "$prefix" <<'PY'
          import sys, zipfile
          archive, prefix = sys.argv[1], sys.argv[2]
          with zipfile.ZipFile(archive, "a", zipfile.ZIP_DEFLATED) as zf:
              zf.write("docs/workspace/EXPERIENCE.md", prefix + "docs/workspace/EXPERIENCE.md")
          with zipfile.ZipFile(archive) as zf:
              names = zf.namelist()
          assert prefix + "docs/workspace/EXPERIENCE.md" in names, "zip 里没塞进经验摘要"
          assert any(n.startswith(prefix + "tools/experience-export/") for n in names), "zip 里没有经验清单"
          print(f"zip 条目 {len(names)} 个，经验已就位")
          PY
          ls -lh "$zip"

      - name: 校验装得上（wheel 里经验与前端都在）
        shell: bash
        run: |
          set -euo pipefail
          python -m venv smoke
          ./smoke/bin/python -m pip install --quiet --no-deps dist/python/*.whl
          ./smoke/bin/python - <<'PY'
          import pathlib, spiritscout
          root = pathlib.Path(spiritscout.__file__).parent
          print("版本", spiritscout.__version__)
          # count.js 在单根化重构里并进了 core.js；这里校验核心前端与经验摘要都在 wheel 里。
          for rel in ("web/static/js/core.js",
                      "web/static/app/session.js",
                      "knowledge/data/experience.json",
                      "knowledge/data/experience.md"):
              assert (root / rel).is_file(), f"wheel 里缺 {rel}"
              print("在包里:", rel)
          PY

      - name: 交出源码包
        uses: actions/upload-artifact@v4
        with:
          name: python-source
          path: |
            dist/python/*
            dist/source/*
          if-no-files-found: error

  native-desktop:
    name: 构建原生桌面包
    needs: package
    runs-on: windows-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 安装 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: microsoft
          java-version: "21"

      - name: 取 wheel
        uses: actions/download-artifact@v4
        with:
          name: python-source
          path: downloaded

      - name: 编译原生桌面包
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist\python | Out-Null
          $wheel = Get-ChildItem downloaded -Recurse -Filter 'spiritscout-*.whl' | Select-Object -First 1
          if (-not $wheel) { throw '没有找到 wheel 产物' }
          Copy-Item $wheel.FullName dist\python -Force
          ./packaging/windows/build-desktop.ps1 -OutputDir dist\windows\desktop

      - name: 核对产物
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist\windows\desktop -Filter 'SpiritScout-*-windows-x64.zip' | Select-Object -First 1
          if (-not $zip) { throw '没有生成原生桌面包' }
          if ($zip.Length -lt 50MB) { throw "原生桌面包只有 $([math]::Round($zip.Length/1MB)) MB，像是编残了" }
          Write-Host "产物：$($zip.FullName)（$([math]::Round($zip.Length/1MB)) MB）"

      - name: 交出原生桌面包
        uses: actions/upload-artifact@v4
        with:
          name: windows-desktop
          path: dist/windows/desktop/*.zip
          if-no-files-found: error

  release:
    name: 汇总并发布
    needs: [package, native-desktop]
    runs-on: ubuntu-latest
    steps:
      - name: 取代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: 核对 tag 与代码版本
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          version=$(python - <<'PY'
          import pathlib, re
          text = pathlib.Path("src/spiritscout/__init__.py").read_text(encoding="utf-8")
          print(re.search(r'__version__\s*=\s*"([^"]+)"', text).group(1))
          PY
          )
          echo "version=$version" >> "$GITHUB_OUTPUT"

          tag="${{ github.event.inputs.tag }}"
          if [ -z "$tag" ]; then
            if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
              tag="${GITHUB_REF_NAME}"
            else
              tag="v$version"          # 手动在分支上触发：按代码版本号出包
              echo "没填 tag，按代码版本出 v$version"
            fi
          fi
          if [ "$tag" != "v$version" ]; then
            echo "::error::tag $tag 与代码版本 v$version 不一致——先升版本号或改用正确的 tag"
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "版本 v$version，tag $tag，一致。"

      - name: 收下两边的产物
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: 展平并生成 SHA256
        shell: bash
        run: |
          set -euo pipefail
          # download-artifact 会按 artifact 名建子目录，这里摊平到一个 dist/ 里，
          # 让 SHA256SUMS 里的路径就是文件名本身（下载后 sha256sum -c 直接可用）。
          mkdir -p flat
          find dist -type f -exec cp -t flat {} +
          cd flat && sha256sum ./* > SHA256SUMS && cat SHA256SUMS
          echo "条目数：$(ls -1 | wc -l)"

      - name: 附到 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          files: |
            flat/*.whl
            flat/*.tar.gz
            flat/*.zip
            flat/SHA256SUMS
          fail_on_unmatched_files: true
          # Release 标题与正文由人写（CHANGELOG 摘出来的那份），这里既不覆盖也不动草稿状态。
          draft: false
          prerelease: false
