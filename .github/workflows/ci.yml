name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.14"]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: traffic-proxy/go.sum
      - run: uv lock --check
      - run: uv sync --extra test
      - run: uv run --no-sync python -m ruff check src/spiritscout tests deploy.py deploy
      - run: uv run --no-sync python -m compileall -q src/spiritscout tests
      - name: Build and test traffic proxy
        working-directory: traffic-proxy
        env:
          GOTOOLCHAIN: local
          GOPROXY: https://goproxy.cn,direct
        run: |
          mkdir -p ../.tools
          go test ./...
          go build -trimpath -buildvcs=false -o ../.tools/spiritscout-traffic-proxy .
      - run: uv run --no-sync python -m unittest discover -s tests -v
      - name: Check frontend types
        if: matrix.python == '3.11'
        working-directory: frontend
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm run test:frontend
          npm run build
      - name: Check browser scripts
        run: |
          for file in src/spiritscout/web/static/js/*.js; do node --check "$file" || exit; done
          for file in tests/test_*.js; do node "$file" || exit; done

  native-platforms:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    env:
      LITELLM_LOCAL_MODEL_COST_MAP: "True"
      PYTHON_DOTENV_DISABLED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: "utf-8"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.11"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.3"
          cache-dependency-path: traffic-proxy/go.sum
      - run: uv sync --extra test
      - name: Build and test Windows traffic proxy
        shell: pwsh
        run: |
          ./packaging/windows/build-traffic-proxy.ps1
          Push-Location traffic-proxy
          try {
            $env:GOTOOLCHAIN = 'local'
            $env:GOPROXY = 'https://goproxy.cn,direct'
            & go.exe test ./...
            if ($LASTEXITCODE -ne 0) { throw "Go traffic proxy tests failed" }
          } finally {
            Pop-Location
          }
      - run: uv run --no-sync python -m unittest tests.test_traffic_proxy -v
      - run: uv run --no-sync python -m unittest discover -s tests -p test_platform_support.py -v
      - run: uv run --no-sync python -m unittest discover -s tests -p test_deployment.py -v
      - run: uv run --no-sync python -m unittest discover -s tests -p test_chrome_mcp.py -v
      - run: uv run --no-sync python -m spiritscout --help

  docker-build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        platform: [linux/amd64]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=app-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.platform }}
      - uses: docker/build-push-action@v6
        with:
          context: deploy/browser
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=browser-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=browser-${{ matrix.platform }}
